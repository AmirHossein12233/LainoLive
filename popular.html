<script>
    /* =====================================================
       AUTH
    ===================================================== */

    const loggedIn =
        localStorage.getItem(
            "lainolive_logged_in"
        );

    const currentUsername =
        localStorage.getItem(
            "lainolive_username"
        );


    if (
        loggedIn !== "true" ||
        !currentUsername
    ) {

        window.location.replace(
            "/login.html"
        );
    }
</script>

    <header class="popular-header">

            </div>

            </div>

                </div>

<div
    id="toast"
    class="toast"
></div>


<script>

    /* =====================================================
       ELEMENTS
    ===================================================== */

    const popularList =
        document.getElementById(
            "popularList"
        );

    const liveStatus =
        document.getElementById(
            "liveStatus"
        );

    const toast =
        document.getElementById(
            "toast"
        );


    /* =====================================================
       TOAST
    ===================================================== */

    function showToast(
        text
    ) {

        toast.textContent =
            text;

        toast.classList.add(
            "show"
        );


        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );
    }


    /* =====================================================
       ESCAPE
    ===================================================== */

    function escapeHtml(
        text
    ) {

        return String(
            text ?? ""
        )
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );
    }


    /* =====================================================
       OPEN STREAM
    ===================================================== */

    function openStream(
        stream
    ) {

        if (
            !stream ||
            stream.id ===
            undefined ||
            stream.id ===
            null
        ) {
            return;
        }


        sessionStorage.setItem(
            "lainolive_view_stream",
            JSON.stringify(
                stream
            )
        );


        if (
            String(
                stream.username
            ) ===
            String(
                currentUsername
            )
        ) {

            sessionStorage.setItem(
                "lainolive_current_stream",
                JSON.stringify(
                    stream
                )
            );


            window.location.href =
                "/live.html";

            return;
        }


        window.location.href =
            "/viewer.html?id=" +
            encodeURIComponent(
                stream.id
            );
    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderPopular(
        streams
    ) {

        popularList.innerHTML =
            "";


        if (
            !streams.length
        ) {

            popularList.innerHTML = `
                <div class="empty-state">

                    <div class="empty-icon">
                        📺
                    </div>

                    <div class="empty-title">
                        هنوز لایو فعالی نیست
                    </div>

                    <div class="empty-text">
                        وقتی لایوها شروع شوند، محبوب‌ترین‌ها اینجا نمایش داده می‌شوند.
                    </div>

                </div>
            `;

            return;
        }


        streams.forEach(
            (
                stream,
                index
            ) => {

                const viewers =
                    Number(
                        stream.viewer_count ??
                        stream.viewers ??
                        0
                    );


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "popular-card";


                let rankText =
                    "#" +
                    (
                        index + 1
                    );


                if (
                    index === 0
                ) {
                    rankText = "🥇";
                } else if (
                    index === 1
                ) {
                    rankText = "🥈";
                } else if (
                    index === 2
                ) {
                    rankText = "🥉";
                }


                card.innerHTML = `

                    <div class="rank ${
                        index < 3
                            ? "top"
                            : ""
                    }">
                        ${rankText}
                    </div>


                    <div class="stream-main">

                        <div class="stream-title">
                            ${escapeHtml(
                                stream.title ||
                                "پخش زنده"
                            )}
                        </div>

                        <div class="stream-user">
                            👤
                            ${escapeHtml(
                                stream.username ||
                                "کاربر"
                            )}
                        </div>

                        <div class="stream-category">
                            ${escapeHtml(
                                stream.category ||
                                "عمومی"
                            )}
                        </div>

                    </div>


                    <div class="stream-right">

                        <div class="live-badge">
                            🔴 LIVE
                        </div>

                        <div class="viewer-count">
                            👁 ${viewers} بیننده
                        </div>

                    </div>
                `;


                card.addEventListener(
                    "click",
                    () => {

                        openStream(
                            stream
                        );
                    }
                );


                popularList.appendChild(
                    card
                );
            }
        );
    }


    /* =====================================================
       LOAD
    ===================================================== */

    async function loadPopular() {

        liveStatus.textContent =
            "در حال بروزرسانی...";


        try {

            const response =
                await fetch(
                    "/api/streams",
                    {
                        cache:
                            "no-store"
                    }
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "HTTP " +
                    response.status
                );
            }


            const data =
                await response.json();


            if (
                !data ||
                !data.success
            ) {

                throw new Error(
                    data?.message ||
                    "دریافت لایوها ناموفق بود."
                );
            }


            const streams =
                Array.isArray(
                    data.streams
                )
                    ? data.streams
                    : [];


            streams.sort(
                (
                    a,
                    b
                ) => {

                    const viewersA =
                        Number(
                            a.viewer_count ??
                            a.viewers ??
                            0
                        );

                    const viewersB =
                        Number(
                            b.viewer_count ??
                            b.viewers ??
                            0
                        );


                    return (
                        viewersB -
                        viewersA
                    );
                }
            );


            renderPopular(
                streams
            );


            liveStatus.textContent =
                streams.length +
                " لایو فعال";


        } catch (error) {

            console.error(
                "Popular:",
                error
            );


            liveStatus.textContent =
                "خطا در دریافت لایوها";


            popularList.innerHTML = `
                <div class="error-state">
                    اتصال به سرور لایوها ناموفق بود.
                    دوباره تلاش کن.
                </div>
            `;
        }
    }


    /* =====================================================
       EVENTS
    ===================================================== */

    document
        .getElementById(
            "backButton"
        )
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "/index.html";
            }
        );


    document
        .getElementById(
            "homeButton"
        )
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "/index.html";
            }
        );


    document
        .getElementById(
            "profileButton"
        )
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "/profile.html";
            }
        );


    document
        .getElementById(
            "refreshButton"
        )
        .addEventListener(
            "click",
            loadPopular
        );


    /* =====================================================
       AUTO REFRESH
    ===================================================== */

    loadPopular();


    setInterval(
        loadPopular,
        5000
    );

</script>

</body>

</html>
