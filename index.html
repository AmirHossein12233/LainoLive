<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#09090f"
    >

    <title>
        LainoLive
    </title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            min-height: 100%;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #19192b 0%,
                    #0b0b12 48%,
                    #050508 100%
                );

            color: white;
        }

        body {
            min-height: 100vh;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            min-height: 100vh;

            padding-bottom:
                calc(
                    90px +
                    env(safe-area-inset-bottom)
                );
        }

        .header {
            position: sticky;

            top: 0;

            z-index: 100;

            padding:
                calc(
                    14px +
                    env(safe-area-inset-top)
                )
                16px
                14px;

            background:
                rgba(
                    8,
                    8,
                    15,
                    .92
                );

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            border-bottom:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .07
                );
        }

        .header-row {
            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 12px;
        }

        .brand {
            min-width: 0;
        }

        .brand-title {
            font-size: 23px;

            font-weight: 900;
        }

        .brand-subtitle {
            margin-top: 4px;

            color: #92929f;

            font-size: 10px;
        }

        .header-actions {
            display: flex;

            gap: 8px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;

            border: none;

            border-radius: 13px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .07
                );

            color: white;

            font-size: 18px;
        }

        .search-box {
            margin-top: 13px;

            display: flex;

            align-items: center;

            gap: 8px;

            padding:
                11px
                13px;

            border-radius: 15px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .06
                );
        }

        .search-box input {
            width: 100%;

            border: none;

            outline: none;

            background: transparent;

            color: white;

            font-size: 12px;
        }

        .search-box input::placeholder {
            color: #777784;
        }

        .hero {
            margin: 16px;

            padding: 20px;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(
                        255,
                        39,
                        87,
                        .16
                    ),
                    rgba(
                        139,
                        53,
                        255,
                        .17
                    )
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .07
                );
        }

        .hero-title {
            font-size: 20px;

            font-weight: 900;
        }

        .hero-text {
            margin-top: 7px;

            color: #a7a7b4;

            font-size: 12px;

            line-height: 1.9;
        }

        .hero-button {
            margin-top: 13px;

            min-height: 44px;

            border: none;

            border-radius: 13px;

            padding:
                0
                16px;

            background:
                linear-gradient(
                    135deg,
                    #ff2757,
                    #8b35ff
                );

            color: white;

            font-size: 11px;

            font-weight: 900;
        }

        .section-head {
            padding:
                0
                16px
                10px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 10px;
        }

        .section-title {
            font-size: 16px;

            font-weight: 900;
        }

        .section-link {
            border: none;

            background: transparent;

            color: #bd9bff;

            font-size: 10px;

            font-weight: 800;
        }

        .status-text {
            padding:
                0
                16px
                10px;

            color: #858592;

            font-size: 10px;
        }

        .list {
            padding:
                0
                16px;

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 12px;
        }

        .card {
            overflow: hidden;

            border-radius: 18px;

            background:
                linear-gradient(
                    180deg,
                    rgba(
                        255,
                        255,
                        255,
                        .055
                    ),
                    rgba(
                        255,
                        255,
                        255,
                        .025
                    )
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .07
                );

            transition:
                transform .18s ease;
        }

        .card:active {
            transform:
                scale(.98);
        }

        .cover {
            position: relative;

            aspect-ratio:
                16 / 10;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #161622,
                    #29213d
                );
        }

        .cover img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }

        .cover-placeholder {
            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 34px;

            opacity: .48;
        }

        .live-badge {
            position: absolute;

            top: 8px;
            right: 8px;

            padding:
                5px
                8px;

            border-radius: 999px;

            background:
                #ff1d4d;

            font-size: 9px;

            font-weight: 900;
        }

        .viewer-count {
            position: absolute;

            left: 8px;
            bottom: 8px;

            padding:
                5px
                8px;

            border-radius: 999px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    .68
                );

            font-size: 10px;
        }

        .card-body {
            padding: 12px;
        }

        .card-title {
            font-size: 14px;

            font-weight: 900;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .card-user {
            margin-top: 7px;

            color: #a8a8b5;

            font-size: 11px;
        }

        .card-bottom {
            margin-top: 9px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 8px;
        }

        .category {
            max-width: 55%;

            padding:
                4px
                8px;

            border-radius: 999px;

            background:
                rgba(
                    139,
                    53,
                    255,
                    .12
                );

            color: #ceb5ff;

            font-size: 9px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .views {
            color: #ffb7c5;

            font-size: 9px;

            white-space: nowrap;
        }

        .empty {
            grid-column:
                1 / -1;

            padding:
                45px
                20px;

            text-align: center;

            border-radius: 18px;

            color: #9292a0;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .025
                );

            border:
                1px dashed
                rgba(
                    255,
                    255,
                    255,
                    .09
                );

            font-size: 13px;

            line-height: 1.9;
        }

        .start-modal {
            position: fixed;

            inset: 0;

            z-index: 500;

            display: none;

            align-items:
                flex-end;

            justify-content:
                center;

            background:
                rgba(
                    0,
                    0,
                    0,
                    .68
                );
        }

        .start-modal.show {
            display: flex;
        }

        .start-card {
            width: 100%;

            max-width: 560px;

            padding:
                20px
                18px
                calc(
                    20px +
                    env(safe-area-inset-bottom)
                );

            border-radius:
                24px
                24px
                0
                0;

            background:
                #111119;

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .08
                );
        }

        .modal-title {
            font-size: 18px;

            font-weight: 900;
        }

        .form-label {
            display: block;

            margin-top: 14px;

            margin-bottom: 6px;

            color: #9e9eaa;

            font-size: 10px;
        }

        .form-input,
        .form-select {
            width: 100%;

            min-height: 45px;

            border: none;

            outline: none;

            border-radius: 13px;

            padding:
                0
                13px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .07
                );

            color: white;

            font-size: 12px;
        }

        .form-select option {
            color: black;
        }

        .file-input {
            width: 100%;

            padding: 12px;

            border-radius: 13px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .05
                );

            color: #bdbdc7;

            font-size: 11px;
        }

        .cover-preview {
            display: none;

            margin-top: 10px;

            width: 100%;

            aspect-ratio:
                16 / 9;

            overflow: hidden;

            border-radius: 14px;
        }

        .cover-preview.show {
            display: block;
        }

        .cover-preview img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .upload-status {
            margin-top: 8px;

            color: #8c8c99;

            font-size: 10px;
        }

        .modal-buttons {
            margin-top: 16px;

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 9px;
        }

        .modal-btn {
            min-height: 46px;

            border: none;

            border-radius: 13px;

            font-weight: 900;
        }

        .modal-btn.primary {
            background:
                linear-gradient(
                    135deg,
                    #ff2757,
                    #8b35ff
                );

            color: white;
        }

        .modal-btn.secondary {
            background:
                rgba(
                    255,
                    255,
                    255,
                    .06
                );

            color: #c4c4ce;
        }

        .bottom-nav {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 300;

            padding:
                10px
                10px
                calc(
                    10px +
                    env(safe-area-inset-bottom)
                );

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 8px;

            background:
                rgba(
                    7,
                    7,
                    12,
                    .93
                );

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .07
                );

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);
        }

        .nav-btn {
            min-height: 52px;

            border: none;

            border-radius: 15px;

            color: #8f8f9d;

            background: transparent;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 4px;

            font-size: 10px;

            font-weight: 700;
        }

        .nav-btn span:first-child {
            font-size: 20px;
        }

        .nav-btn.active {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    rgba(
                        255,
                        39,
                        87,
                        .14
                    ),
                    rgba(
                        139,
                        53,
                        255,
                        .16
                    )
                );
        }

        @media (min-width: 700px) {

            .page {
                max-width: 1100px;

                margin:
                    0
                    auto;
            }

            .list {
                grid-template-columns:
                    repeat(
                        3,
                        minmax(
                            0,
                            1fr
                        )
                    );
            }

            .bottom-nav {
                left: 50%;
                right: auto;

                width:
                    min(
                        650px,
                        calc(100% - 30px)
                    );

                transform:
                    translateX(-50%);

                bottom: 14px;

                border:
                    1px solid
                    rgba(
                        255,
                        255,
                        255,
                        .07
                    );

                border-radius: 22px;

                padding: 8px;
            }
        }

        @media (max-width: 390px) {

            .list {
                grid-template-columns:
                    1fr;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header class="header">

        <div class="header-row">

            <div class="brand">

                <div class="brand-title">
                    🎥 LainoLive
                </div>

                <div class="brand-subtitle">
                    پخش زنده و تماشای لایو
                </div>

            </div>

            <div class="header-actions">

                <button
                    id="refreshButton"
                    class="icon-btn"
                    type="button"
                >
                    🔄
                </button>

                <button
                    id="profileButtonTop"
                    class="icon-btn"
                    type="button"
                >
                    👤
                </button>

            </div>

        </div>


        <div class="search-box">

            <span>
                🔎
            </span>

            <input
                id="searchInput"
                type="search"
                placeholder="جستجوی لایو..."
                autocomplete="off"
            >

        </div>

    </header>


    <section class="hero">

        <div class="hero-title">
            🔴 همین حالا لایو شو
        </div>

        <div class="hero-text">
            لایو خودت را شروع کن و تصویر و
            صدایت را برای بیننده‌ها پخش کن.
        </div>

        <button
            id="startLiveButton"
            class="hero-button"
            type="button"
        >
            شروع لایو
        </button>

    </section>


    <div class="section-head">

        <div class="section-title">
            🔴 لایوهای در حال پخش
        </div>

        <button
            id="popularButton"
            class="section-link"
            type="button"
        >
            دیدن محبوب‌ها →
        </button>

    </div>


    <div
        id="statusText"
        class="status-text"
    >
        در حال دریافت لایوها...
    </div>


    <main
        id="streamsList"
        class="list"
    >

        <div class="empty">
            در حال دریافت لایوها...
        </div>

    </main>

</div>


<nav class="bottom-nav">

    <button
        class="nav-btn active"
        type="button"
    >
        <span>🏠</span>
        <span>خانه</span>
    </button>

    <button
        id="popularNavButton"
        class="nav-btn"
        type="button"
    >
        <span>🔥</span>
        <span>محبوب</span>
    </button>

    <button
        id="profileButton"
        class="nav-btn"
        type="button"
    >
        <span>👤</span>
        <span>پروفایل</span>
    </button>

</nav>


<div
    id="startModal"
    class="start-modal"
>

    <div class="start-card">

        <div class="modal-title">
            شروع لایو
        </div>


        <label
            class="form-label"
            for="liveTitle"
        >
            عنوان لایو
        </label>

        <input
            id="liveTitle"
            class="form-input"
            type="text"
            maxlength="120"
            placeholder="مثلاً اولین لایو من"
        >


        <label
            class="form-label"
            for="liveCategory"
        >
            دسته‌بندی
        </label>

        <select
            id="liveCategory"
            class="form-select"
        >

            <option value="عمومی">
                عمومی
            </option>

            <option value="گیم">
                گیم
            </option>

            <option value="موسیقی">
                موسیقی
            </option>

            <option value="گفتگو">
                گفتگو
            </option>

            <option value="آموزشی">
                آموزشی
            </option>

            <option value="سرگرمی">
                سرگرمی
            </option>

            <option value="ورزشی">
                ورزشی
            </option>

        </select>


        <label
            class="form-label"
            for="liveCover"
        >
            تصویر کاور
        </label>

        <input
            id="liveCover"
            class="file-input"
            type="file"
            accept="
                image/jpeg,
                image/png,
                image/webp,
                image/gif
            "
            capture="environment"
        >


        <div
            id="coverPreview"
            class="cover-preview"
        >
            <img
                id="coverPreviewImage"
                alt="پیش‌نمایش کاور"
            >
        </div>


        <div
            id="uploadStatus"
            class="upload-status"
        ></div>


        <div class="modal-buttons">

            <button
                id="cancelStartButton"
                class="modal-btn secondary"
                type="button"
            >
                لغو
            </button>

            <button
                id="confirmStartButton"
                class="modal-btn primary"
                type="button"
            >
                شروع لایو
            </button>

        </div>

    </div>

</div>


<script
    src="/streams-cache.js"
></script>


<script>

const LOGIN_KEY =
    "lainolive_logged_in";

const USERNAME_KEY =
    "lainolive_username";

const VIEW_STREAM_KEY =
    "lainolive_view_stream";

const CURRENT_STREAM_KEY =
    "lainolive_current_stream";


if (
    localStorage.getItem(
        LOGIN_KEY
    ) !== "true"
) {

    window.location.href =
        "/login.html";
}


const streamsList =
    document.getElementById(
        "streamsList"
    );

const statusText =
    document.getElementById(
        "statusText"
    );

const refreshButton =
    document.getElementById(
        "refreshButton"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const startModal =
    document.getElementById(
        "startModal"
    );

const liveTitle =
    document.getElementById(
        "liveTitle"
    );

const liveCategory =
    document.getElementById(
        "liveCategory"
    );

const liveCover =
    document.getElementById(
        "liveCover"
    );

const coverPreview =
    document.getElementById(
        "coverPreview"
    );

const coverPreviewImage =
    document.getElementById(
        "coverPreviewImage"
    );

const uploadStatus =
    document.getElementById(
        "uploadStatus"
    );

const currentUsername =
    localStorage.getItem(
        USERNAME_KEY
    ) || "";


let allStreams = [];

let selectedCoverFile =
    null;


/* =========================
   HELPERS
   ========================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


function getId(stream) {

    return (
        stream?.id
        ??
        stream?.stream_id
    );
}


function getTitle(stream) {

    return (
        stream?.title
        ||
        "لایو بدون عنوان"
    );
}


function getUsername(stream) {

    return (
        stream?.username
        ||
        stream?.user
        ||
        "کاربر"
    );
}


function getCategory(stream) {

    return (
        stream?.category
        ||
        "عمومی"
    );
}


function getViewers(stream) {

    return Number(
        stream?.viewer_count
        ??
        stream?.viewers
        ??
        0
    );
}


function getCover(stream) {

    return (
        stream?.cover_url
        ||
        stream?.cover
        ||
        stream?.thumbnail
        ||
        ""
    );
}


function normalizeText(
    value
) {

    return String(
        value ?? ""
    )
        .trim()
        .toLowerCase();
}


/* =========================
   RENDER
   ========================= */

function renderStreams(
    streams
) {

    if (
        !streams.length
    ) {

        streamsList.innerHTML =
            `
                <div class="empty">
                    فعلاً هیچ لایوی
                    در حال پخش نیست. 🎥
                </div>
            `;

        return;
    }


    streamsList.innerHTML =
        streams
            .map(
                stream => {

                    const id =
                        getId(
                            stream
                        );

                    const title =
                        escapeHtml(
                            getTitle(
                                stream
                            )
                        );

                    const username =
                        escapeHtml(
                            getUsername(
                                stream
                            )
                        );

                    const category =
                        escapeHtml(
                            getCategory(
                                stream
                            )
                        );

                    const viewers =
                        getViewers(
                            stream
                        );

                    const cover =
                        getCover(
                            stream
                        );


                    return `
                        <article
                            class="card"
                            data-id="${escapeHtml(id)}"
                        >

                            <div class="cover">

                                ${
                                    cover
                                        ? `
                                            <img
                                                src="${escapeHtml(
                                                    cover
                                                )}"
                                                alt="${title}"
                                                loading="lazy"
                                                onerror="
                                                    this.style.display='none';
                                                    this.parentElement
                                                        .querySelector(
                                                            '.cover-placeholder'
                                                        )
                                                        .style.display='flex';
                                                "
                                            >

                                            <div
                                                class="cover-placeholder"
                                                style="
                                                    display:none;
                                                    position:absolute;
                                                    inset:0;
                                                "
                                            >
                                                📺
                                            </div>
                                        `
                                        : `
                                            <div class="cover-placeholder">
                                                📺
                                            </div>
                                        `
                                }

                                <div class="live-badge">
                                    ● LIVE
                                </div>

                                <div class="viewer-count">
                                    👁 ${viewers}
                                </div>

                            </div>


                            <div class="card-body">

                                <div class="card-title">
                                    ${title}
                                </div>

                                <div class="card-user">
                                    👤 ${username}
                                </div>

                                <div class="card-bottom">

                                    <div class="category">
                                        ${category}
                                    </div>

                                    <div class="views">
                                        ${viewers}
                                        بیننده
                                    </div>

                                </div>

                            </div>

                        </article>
                    `;
                }
            )
            .join("");


    streamsList
        .querySelectorAll(
            "[data-id]"
        )
        .forEach(
            card => {

                card.addEventListener(
                    "click",
                    () => {

                        const id =
                            card.dataset.id;

                        const stream =
                            allStreams.find(
                                item =>
                                    String(
                                        getId(
                                            item
                                        )
                                    )
                                    ===
                                    String(
                                        id
                                    )
                            );

                        if (
                            !stream
                        ) {
                            return;
                        }

                        sessionStorage.setItem(
                            VIEW_STREAM_KEY,
                            JSON.stringify(
                                stream
                            )
                        );


                        const owner =
                            getUsername(
                                stream
                            );


                        if (
                            String(owner)
                            ===
                            String(
                                currentUsername
                            )
                        ) {

                            sessionStorage.setItem(
                                CURRENT_STREAM_KEY,
                                JSON.stringify(
                                    stream
                                )
                            );

                            window.location.href =
                                "/live.html";

                            return;
                        }


                        window.location.href =
                            "/viewer.html?id=" +
                            encodeURIComponent(
                                id
                            );
                    }
                );
            }
        );
}


/* =========================
   FILTER
   ========================= */

function applySearch() {

    const query =
        normalizeText(
            searchInput.value
        );


    if (!query) {

        renderStreams(
            allStreams
        );

        return;
    }


    const filtered =
        allStreams.filter(
            stream => {

                const title =
                    normalizeText(
                        getTitle(
                            stream
                        )
                    );

                const username =
                    normalizeText(
                        getUsername(
                            stream
                        )
                    );

                const category =
                    normalizeText(
                        getCategory(
                            stream
                        )
                    );


                return (
                    title.includes(
                        query
                    )
                    ||
                    username.includes(
                        query
                    )
                    ||
                    category.includes(
                        query
                    )
                );
            }
        );


    renderStreams(
        filtered
    );
}


/* =========================
   LOAD STREAMS
   ========================= */

let streamsLoading = false;


async function loadStreams(
    force = false
) {

    if (
        streamsLoading
    ) {
        return;
    }


    streamsLoading = true;


    refreshButton.disabled =
        true;


    try {

        const streams =
            await LainoLiveStreams.fetch({
                force:
                    force,

                ttl:
                    1000
            });


        allStreams =
            Array.isArray(
                streams
            )
                ? streams
                : [];


        statusText.textContent =
            allStreams.length
                ? allStreams.length +
                    " لایو در حال پخش"
                : "فعلاً لایوی فعال نیست";


        applySearch();

    } catch (error) {

        console.error(
            "load streams error:",
            error
        );


        if (
            !allStreams.length
        ) {

            streamsList.innerHTML =
                `
                    <div class="empty">
                        دریافت لایوها انجام نشد.
                        <br>
                        اتصال سرور را بررسی کنید.
                    </div>
                `;
        }

        statusText.textContent =
            "خطا در دریافت لایوها";

    } finally {

        streamsLoading =
            false;

        refreshButton.disabled =
            false;
    }
}


/* =========================
   START LIVE MODAL
   ========================= */

function openStartModal() {

    uploadStatus.textContent =
        "";

    startModal.classList.add(
        "show"
    );
}


function closeStartModal() {

    startModal.classList.remove(
        "show"
    );
}


liveCover.addEventListener(
    "change",
    () => {

        const file =
            liveCover.files?.[0];


        selectedCoverFile =
            file || null;


        if (!file) {

            coverPreview.classList.remove(
                "show"
            );

            coverPreviewImage.removeAttribute(
                "src"
            );

            return;
        }


        const url =
            URL.createObjectURL(
                file
            );


        coverPreviewImage.src =
            url;

        coverPreview.classList.add(
            "show"
        );


        uploadStatus.textContent =
            "کاور انتخاب شد.";
    }
);


async function uploadCover(
    streamId
) {

    if (
        !selectedCoverFile
    ) {

        return null;
    }


    uploadStatus.textContent =
        "در حال آپلود کاور...";


    const formData =
        new FormData();


    formData.append(
        "stream_id",
        String(
            streamId
        )
    );


    formData.append(
        "username",
        currentUsername
    );


    formData.append(
        "cover",
        selectedCoverFile,
        selectedCoverFile.name
    );


    const response =
        await fetch(
            "/api/streams/cover",
            {
                method:
                    "POST",

                body:
                    formData
            }
        );


    if (
        !response.ok
    ) {

        throw new Error(
            "cover upload failed"
        );
    }


    const data =
        await response.json();


    uploadStatus.textContent =
        "کاور با موفقیت آپلود شد.";


    return data;
}


async function startLive() {

    const title =
        liveTitle.value.trim()
        ||
        "لایو بدون عنوان";


    const category =
        liveCategory.value
        ||
        "عمومی";


    const button =
        document.getElementById(
            "confirmStartButton"
        );


    button.disabled =
        true;


    button.textContent =
        "در حال شروع...";


    try {

        const response =
            await fetch(
                "/api/streams/create",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                currentUsername,

                            title:
                                title,

                            category:
                                category
                        })
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "stream create failed"
            );
        }


        const data =
            await response.json();


        const createdStream =
            data.stream
            ||
            data;


        const streamId =
            getId(
                createdStream
            );


        if (
            streamId === null
            ||
            typeof streamId === "undefined"
        ) {

            throw new Error(
                "stream id missing"
            );
        }


        if (
            selectedCoverFile
        ) {

            await uploadCover(
                streamId
            );
        }


        /*
         * کش قبلی را حذف می‌کنیم تا
         * صفحه بعدی لایو جدید را ببیند.
         */

        if (
            window.LainoLiveStreams
            &&
            typeof
                window.LainoLiveStreams.clear ===
                    "function"
        ) {

            window.LainoLiveStreams.clear();
        }


        const streamForSession =
            {
                ...createdStream,

                id:
                    streamId,

                stream_id:
                    streamId,

                username:
                    currentUsername,

                title:
                    title,

                category:
                    category
            };


        sessionStorage.setItem(
            CURRENT_STREAM_KEY,
            JSON.stringify(
                streamForSession
            )
        );


        sessionStorage.setItem(
            VIEW_STREAM_KEY,
            JSON.stringify(
                streamForSession
            )
        );


        window.location.href =
            "/live.html";

    } catch (error) {

        console.error(
            "start live error:",
            error
        );


        uploadStatus.textContent =
            "شروع لایو انجام نشد.";

        button.disabled =
            false;

        button.textContent =
            "شروع لایو";
    }
}


/* =========================
   EVENTS
   ========================= */

document
    .getElementById(
        "startLiveButton"
    )
    .addEventListener(
        "click",
        openStartModal
    );


document
    .getElementById(
        "cancelStartButton"
    )
    .addEventListener(
        "click",
        closeStartModal
    );


document
    .getElementById(
        "confirmStartButton"
    )
    .addEventListener(
        "click",
        startLive
    );


document
    .getElementById(
        "popularButton"
    )
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "/popular.html";
        }
    );


document
    .getElementById(
        "popularNavButton"
    )
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "/popular.html";
        }
    );


document
    .getElementById(
        "profileButton"
    )
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "/profile.html";
        }
    );


document
    .getElementById(
        "profileButtonTop"
    )
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "/profile.html";
        }
    );


refreshButton.addEventListener(
    "click",
    () => {

        loadStreams(
            true
        );
    }
);


searchInput.addEventListener(
    "input",
    applySearch
);


searchInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            window.location.href =
                "/search.html?q=" +
                encodeURIComponent(
                    searchInput.value
                );
        }
    }
);


startModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            startModal
        ) {

            closeStartModal();
        }
    }
);


/* =========================
   START
   ========================= */

loadStreams();


setInterval(
    () => {

        loadStreams(
            false
        );

    },
    2000
);

</script>
