<title>LainoLive</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        background:
            radial-gradient(
                circle at top,
                #202530 0%,
                #0b0d12 45%,
                #08090c 100%
            );

        color: #fff;
        font-family:
            Tahoma,
            Arial,
            sans-serif;
    }

    .container {
        width: min(1150px, 94%);
        margin: 0 auto;
        padding: 25px 0 50px;
    }

    /* =====================================================
       HEADER
    ====================================================== */

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 28px;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 27px;
        font-weight: 900;
    }

    .logo-dot {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: #ff2757;
        box-shadow:
            0 0 12px rgba(255, 39, 87, .9),
            0 0 30px rgba(255, 39, 87, .45);
    }

    .logo-live {
        color: #ff2757;
    }

    .header-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    button,
    .button-link {
        border: 0;
        border-radius: 13px;
        padding: 12px 17px;
        color: #fff;
        background: #ff2757;
        font-size: 14px;
        font-weight: bold;
        text-decoration: none;
        cursor: pointer;
        transition:
            transform .15s ease,
            opacity .15s ease;
    }

    button:hover,
    .button-link:hover {
        transform: translateY(-1px);
    }

    .secondary {
        background: #292e38;
    }

    /* =====================================================
       HERO
    ====================================================== */

    .hero {
        position: relative;
        overflow: hidden;
        border: 1px solid #292e38;
        border-radius: 24px;
        padding: 35px 30px;
        background:
            linear-gradient(
                135deg,
                rgba(255, 39, 87, .15),
                rgba(255, 39, 87, .02)
            ),
            #14171e;

        box-shadow:
            0 25px 70px rgba(0, 0, 0, .28);
    }

    .hero::after {
        content: "";
        position: absolute;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        background: rgba(255, 39, 87, .10);
        filter: blur(70px);
        left: -80px;
        bottom: -120px;
    }

    .hero-content {
        position: relative;
        z-index: 1;
        max-width: 700px;
    }

    .hero h1 {
        margin: 0 0 15px;
        font-size: clamp(30px, 6vw, 55px);
        line-height: 1.2;
    }

    .hero h1 span {
        color: #ff2757;
    }

    .hero p {
        color: #b9c0cb;
        line-height: 2;
        margin: 0 0 22px;
        font-size: 16px;
    }

    .hero-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    /* =====================================================
       SECTION
    ====================================================== */

    .section {
        margin-top: 28px;
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
    }

    .section-title {
        margin: 0;
        font-size: 22px;
    }

    .stream-count {
        color: #9ca3af;
        font-size: 13px;
    }

    /* =====================================================
       STREAM GRID
    ====================================================== */

    .streams {
        display: grid;
        grid-template-columns:
            repeat(
                auto-fit,
                minmax(260px, 1fr)
            );

        gap: 15px;
    }

    .stream-card {
        overflow: hidden;
        border: 1px solid #292e38;
        border-radius: 18px;
        background: #151820;
        transition:
            transform .18s ease,
            border-color .18s ease;
    }

    .stream-card:hover {
        transform: translateY(-3px);
        border-color: #ff2757;
    }

    .preview {
        position: relative;
        aspect-ratio: 16 / 9;
        background:
            linear-gradient(
                135deg,
                #20242d,
                #0c0f14
            );

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .live-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 6px 9px;
        border-radius: 8px;
        background: #ff2757;
        font-size: 12px;
        font-weight: bold;
    }

    .play {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(255, 39, 87, .17);
        border: 1px solid rgba(255, 39, 87, .35);
        font-size: 27px;
    }

    .stream-info {
        padding: 15px;
    }

    .stream-title {
        margin: 0 0 8px;
        font-size: 17px;
        font-weight: bold;
    }

    .stream-meta {
        color: #8f97a5;
        font-size: 13px;
        margin-bottom: 13px;
    }

    .watch-button {
        width: 100%;
    }

    /* =====================================================
       EMPTY
    ====================================================== */

    .empty {
        display: none;
        padding: 35px 15px;
        text-align: center;
        border: 1px dashed #343a46;
        border-radius: 18px;
        color: #8f97a5;
        background: #11141a;
    }

    /* =====================================================
       MODAL
    ====================================================== */

    .modal {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 15px;

        background:
            rgba(0, 0, 0, .72);

        backdrop-filter:
            blur(5px);
    }

    .modal.show {
        display: flex;
    }

    .modal-card {
        width: min(500px, 100%);
        border: 1px solid #343a46;
        border-radius: 20px;
        background: #151820;
        padding: 20px;
        box-shadow:
            0 25px 80px rgba(0, 0, 0, .50);
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
    }

    .modal-header h2 {
        margin: 0;
    }

    .close {
        width: 40px;
        height: 40px;
        padding: 0;
        border-radius: 11px;
        background: #292e38;
        font-size: 20px;
    }

    .field {
        margin-bottom: 13px;
    }

    .field label {
        display: block;
        color: #b9c0cb;
        font-size: 13px;
        margin-bottom: 7px;
    }

    .field input {
        width: 100%;
        padding: 13px;
        border-radius: 12px;
        border: 1px solid #343a46;
        outline: none;
        background: #0e1116;
        color: #fff;
        font-size: 14px;
    }

    .field input:focus {
        border-color: #ff2757;
    }

    .error {
        min-height: 24px;
        color: #ff738e;
        font-size: 13px;
        margin-bottom: 8px;
    }

    .modal-actions {
        display: flex;
        gap: 10px;
    }

    .modal-actions button {
        flex: 1;
    }

    /* =====================================================
       FOOTER
    ====================================================== */

    footer {
        text-align: center;
        color: #68717f;
        font-size: 12px;
        margin-top: 30px;
    }

    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 700px) {

        header {
            flex-direction: column;
            align-items: stretch;
        }

        .header-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .header-actions > * {
            text-align: center;
        }

        .hero {
            padding: 25px 20px;
        }

        .hero-buttons {
            display: grid;
            grid-template-columns: 1fr;
        }

        .hero-buttons > * {
            width: 100%;
            text-align: center;
        }

        .modal-actions {
            flex-direction: column;
        }
    }
</style>

<script>
"use strict";

/* =========================================================
   ELEMENTS
========================================================= */

const startModal =
    document.getElementById(
        "startModal"
    );

const headerStartBtn =
    document.getElementById(
        "headerStartBtn"
    );

const heroStartBtn =
    document.getElementById(
        "heroStartBtn"
    );

const heroRefreshBtn =
    document.getElementById(
        "heroRefreshBtn"
    );

const refreshBtn =
    document.getElementById(
        "refreshBtn"
    );

const closeModalBtn =
    document.getElementById(
        "closeModalBtn"
    );

const cancelBtn =
    document.getElementById(
        "cancelBtn"
    );

const createLiveBtn =
    document.getElementById(
        "createLiveBtn"
    );

const usernameInput =
    document.getElementById(
        "username"
    );

const titleInput =
    document.getElementById(
        "title"
    );

const errorEl =
    document.getElementById(
        "error"
    );

const streamsEl =
    document.getElementById(
        "streams"
    );

const emptyEl =
    document.getElementById(
        "empty"
    );

const streamCountEl =
    document.getElementById(
        "streamCount"
    );

/* =========================================================
   MODAL
========================================================= */

function openStartModal() {

    errorEl.textContent =
        "";

    startModal.classList.add(
        "show"
    );

    setTimeout(
        () => usernameInput.focus(),
        50
    );
}

function closeStartModal() {

    startModal.classList.remove(
        "show"
    );
}

/* =========================================================
   START STREAM
========================================================= */

async function createStream() {

    const username =
        usernameInput.value.trim();

    const title =
        titleInput.value.trim();

    errorEl.textContent =
        "";

    if (!username) {

        errorEl.textContent =
            "نام کاربری را وارد کنید.";

        usernameInput.focus();

        return;
    }

    if (!title) {

        errorEl.textContent =
            "عنوان لایو را وارد کنید.";

        titleInput.focus();

        return;
    }

    createLiveBtn.disabled =
        true;

    createLiveBtn.textContent =
        "در حال ساخت...";

    try {

        const response =
            await fetch(
                "/api/streams/start",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username:
                            username,

                        title:
                            title
                    })
                }
            );

        let data = {};

        try {
            data =
                await response.json();
        }
        catch (_) {}

        if (
            !response.ok ||
            data.success !== true
        ) {

            throw new Error(
                data.message ||
                "ساخت لایو ناموفق بود."
            );
        }

        const streamId =
            data.stream_id;

        if (!streamId) {

            throw new Error(
                "سرور stream_id برنگرداند."
            );
        }

        /*
         * مستقیم وارد صفحه پخش می‌شویم.
         * stream_id و username را به URL
         * می‌فرستیم.
         */

        const params =
            new URLSearchParams();

        params.set(
            "stream_id",
            streamId
        );

        params.set(
            "username",
            username
        );

        params.set(
            "title",
            title
        );

        window.location.href =
            "live.html?" +
            params.toString();

    }
    catch (error) {

        console.error(
            "CREATE LIVE ERROR:",
            error
        );

        errorEl.textContent =
            error.message ||
            "ساخت لایو ناموفق بود.";

        createLiveBtn.disabled =
            false;

        createLiveBtn.textContent =
            "🔴 ساخت لایو";
    }
}

/* =========================================================
   LOAD STREAMS
========================================================= */

async function loadStreams() {

    streamsEl.innerHTML =
        "";

    emptyEl.style.display =
        "none";

    try {

        const response =
            await fetch(
                "/api/streams?ts=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );

        let data = {};

        try {
            data =
                await response.json();
        }
        catch (_) {}

        if (
            !response.ok ||
            data.success !== true
        ) {

            throw new Error(
                data.message ||
                "دریافت لایوها ناموفق بود."
            );
        }

        const streams =
            Array.isArray(
                data.streams
            )
                ? data.streams
                : [];

        streamCountEl.textContent =
            streams.length +
            " لایو";

        if (
            streams.length === 0
        ) {

            emptyEl.style.display =
                "block";

            return;
        }

        for (
            const stream
            of streams
        ) {

            streamsEl.appendChild(
                createStreamCard(
                    stream
                )
            );
        }

    }
    catch (error) {

        console.error(
            "LOAD STREAMS ERROR:",
            error
        );

        emptyEl.style.display =
            "block";

        emptyEl.textContent =
            "❌ دریافت لایوها انجام نشد.";
    }
}

/* =========================================================
   STREAM CARD
========================================================= */

function createStreamCard(
    stream
) {

    const card =
        document.createElement(
            "article"
        );

    card.className =
        "stream-card";

    const preview =
        document.createElement(
            "div"
        );

    preview.className =
        "preview";

    const badge =
        document.createElement(
            "span"
        );

    badge.className =
        "live-badge";

    badge.textContent =
        "LIVE";

    const play =
        document.createElement(
            "div"
        );

    play.className =
        "play";

    play.textContent =
        "▶";

    preview.appendChild(
        badge
    );

    preview.appendChild(
        play
    );

    const info =
        document.createElement(
            "div"
        );

    info.className =
        "stream-info";

    const title =
        document.createElement(
            "h3"
        );

    title.className =
        "stream-title";

    title.textContent =
        stream.title ||
        "لایو بدون عنوان";

    const meta =
        document.createElement(
            "div"
        );

    meta.className =
        "stream-meta";

    const username =
        stream.username ||
        "کاربر";

    const viewers =
        Number(
            stream.viewers || 0
        );

    meta.textContent =
        "👤 " +
        username +
        "   •   👁 " +
        viewers +
        " بیننده";

    const watch =
        document.createElement(
            "button"
        );

    watch.className =
        "watch-button";

    watch.textContent =
        "📺 تماشای لایو";

    watch.addEventListener(
        "click",
        () => {

            const params =
                new URLSearchParams();

            params.set(
                "stream_id",
                stream.stream_id
            );

            window.location.href =
                "viewer.html?" +
                params.toString();
        }
    );

    info.appendChild(
        title
    );

    info.appendChild(
        meta
    );

    info.appendChild(
        watch
    );

    card.appendChild(
        preview
    );

    card.appendChild(
        info
    );

    return card;
}

/* =========================================================
   BUTTONS
========================================================= */

headerStartBtn.addEventListener(
    "click",
    openStartModal
);

heroStartBtn.addEventListener(
    "click",
    openStartModal
);

heroRefreshBtn.addEventListener(
    "click",
    loadStreams
);

refreshBtn.addEventListener(
    "click",
    loadStreams
);

closeModalBtn.addEventListener(
    "click",
    closeStartModal
);

cancelBtn.addEventListener(
    "click",
    closeStartModal
);

createLiveBtn.addEventListener(
    "click",
    createStream
);

/* =========================================================
   ENTER KEY
========================================================= */

usernameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            titleInput.focus();
        }
    }
);

titleInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            createStream();
        }
    }
);

/* =========================================================
   CLICK OUTSIDE MODAL
========================================================= */

startModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            startModal
        ) {

            closeStartModal();
        }
    }
);

/* =========================================================
   INIT
========================================================= */

loadStreams();

/*
 * هر ۱۰ ثانیه لیست لایوها بروزرسانی می‌شود.
 */

setInterval(
    loadStreams,
    10000
);
</script>

</body>
