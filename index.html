<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<title>
LainoLive
</title>


<link rel="manifest" href="/manifest.json">


<meta name="theme-color" content="#ff2757">


<meta name="mobile-web-app-capable" content="yes">


<meta name="apple-mobile-web-app-capable" content="yes">


<meta name="apple-mobile-web-app-status-bar-style" content="black">


<link rel="apple-touch-icon" href="/icons/icon-192.png">



<style>

*{
box-sizing:border-box;
}



body{

margin:0;

background:#050508;

color:white;

font-family:tahoma,Arial;

padding:15px;

}



.container{

max-width:800px;

margin:auto;

}



.header{

background:#15151f;

padding:25px;

border-radius:25px;

text-align:center;

}



.logo{

font-size:38px;

font-weight:bold;

color:#ff2757;

}



.subtitle{

color:#aaa;

}



button{

width:100%;

height:50px;

margin-top:12px;

border:0;

border-radius:15px;

background:#ff2757;

color:white;

font-weight:bold;

font-size:15px;

}



.gray{

background:#333;

}



.card{

margin-top:20px;

background:#15151f;

border-radius:20px;

padding:18px;

}



.stream{

background:#222;

border-radius:15px;

padding:15px;

margin-top:12px;

}



.stream-title{

font-size:18px;

font-weight:bold;

}



.info{

color:#aaa;

font-size:13px;

margin-top:8px;

}



.empty{

text-align:center;

color:#aaa;

padding:20px;

}



</style>


</head>


<body>



<div class="container">



<div class="header">


<div class="logo">

🔴 LainoLive

</div>



<p class="subtitle">

پخش زنده آنلاین با چت

</p>




<button onclick="startLive()">

شروع لایو

</button>




<button class="gray"
onclick="openLogin()">

ورود / ساخت حساب

</button>



</div>








<div class="card">


<h2>

📺 لایوهای فعال

</h2>


<div id="streamList">

در حال دریافت...

</div>


</div>




</div>






<script>


const API =

"http://127.0.0.1:8000";





function startLive(){


location.href =

"live.html";


}




function openLogin(){


location.href =

"login.html";


}








async function loadStreams(){



const box =

document.getElementById(
"streamList"
);



try{


const res =

await fetch(

API+
"/api/streams"

);



const data =

await res.json();





box.innerHTML = "";





if(
!data.streams ||
data.streams.length===0
){


box.innerHTML =

`

<div class="empty">

فعلاً لایوی وجود ندارد

</div>

`;

return;


}






data.streams.forEach(

stream=>{


const item =

document.createElement(
"div"
);



item.className =
"stream";



item.innerHTML =

`

<div class="stream-title">

🔴 ${stream.title}

</div>


<div class="info">

👤 ${stream.username}

<br>

👁 ${stream.viewers} بیننده

</div>


<button>

مشاهده لایو

</button>

`;





item
.querySelector("button")
.onclick = ()=>{


location.href =

"viewer.html?id="

+
stream.id;



};





box.appendChild(
item
);



}

);




}

catch(error){



box.innerHTML =

`

<div class="empty">

اتصال به سرور ناموفق بود

</div>

`;



console.log(error);


}



}








// PWA Service Worker

if(
"serviceWorker" in navigator
){


navigator.serviceWorker.register(

"/service-worker.js"

)

.then(()=>{


console.log(
"LainoLive PWA Ready"
);


});


}








loadStreams();



setInterval(

loadStreams,

5000

);



</script>



</body>

</html>
