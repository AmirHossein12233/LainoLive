<script>

"use strict";


/* =====================================================
   CONFIG
===================================================== */

const LOGIN_KEY =
    "lainolive_logged_in";

const USERNAME_KEY =
    "lainolive_username";

const VIEW_STREAM_KEY =
    "lainolive_view_stream";

const CURRENT_STREAM_KEY =
    "lainolive_current_stream";


/* =====================================================
   LOGIN
===================================================== */

if (
    localStorage.getItem(
        LOGIN_KEY
    ) !== "true"
) {

    window.location.href =
        "/login.html";

}


/* =====================================================
   ELEMENTS
===================================================== */

const streamsList =
    document.getElementById(
        "streamsList"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


const refreshButton =
    document.getElementById(
        "refreshButton"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const startModal =
    document.getElementById(
        "startModal"
    );


const liveTitle =
    document.getElementById(
        "liveTitle"
    );


const liveCategory =
    document.getElementById(
        "liveCategory"
    );


const liveCover =
    document.getElementById(
        "liveCover"
    );


const coverPreview =
    document.getElementById(
        "coverPreview"
    );


const coverPreviewImage =
    document.getElementById(
        "coverPreviewImage"
    );


const uploadStatus =
    document.getElementById(
        "uploadStatus"
    );


const currentUsername =
    localStorage.getItem(
        USERNAME_KEY
    ) || "";


let allStreams = [];

let selectedCoverFile =
    null;

let streamsLoading =
    false;


/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


function getId(
    stream
) {

    return (
        stream?.id
        ??
        stream?.stream_id
    );

}


function getTitle(
    stream
) {

    return (
        stream?.title
        ||
        "لایو بدون عنوان"
    );

}


function getUsername(
    stream
) {

    return (
        stream?.username
        ||
        stream?.user
        ||
        stream?.owner
        ||
        "کاربر"
    );

}


function getCategory(
    stream
) {

    return (
        stream?.category
        ||
        "عمومی"
    );

}


function getViewers(
    stream
) {

    return Number(
        stream?.viewer_count
        ??
        stream?.viewers
        ??
        stream?.viewer_count_now
        ??
        0
    );

}


function getUsers(
    stream
) {

    return Number(
        stream?.users_count
        ??
        stream?.user_count
        ??
        stream?.online_users
        ??
        stream?.online_count
        ??
        stream?.viewer_count
        ??
        stream?.viewers
        ??
        0
    );

}


function getCover(
    stream
) {

    return (
        stream?.cover_url
        ||
        stream?.cover
        ||
        stream?.thumbnail
        ||
        ""
    );

}


/* =====================================================
   VIDEO QUALITY
===================================================== */

function getVideoQuality(
    stream
) {

    const value =
        stream?.video_quality
        ??
        stream?.quality
        ??
        stream?.resolution
        ??
        stream?.video_resolution
        ??
        "";


    if (
        value
    ) {

        const text =
            String(
                value
            ).trim();


        if (
            text
                .toLowerCase()
                .includes("1080")
        ) {

            return "1080p";

        }


        if (
            text
                .toLowerCase()
                .includes("720")
        ) {

            return "720p";

        }


        if (
            text
                .toLowerCase()
                .includes("480")
        ) {

            return "480p";

        }


        return text;

    }


    if (
        stream?.video_width &&
        stream?.video_height
    ) {

        return (
            String(
                stream.video_width
            ) +
            "×" +
            String(
                stream.video_height
            )
        );

    }


    if (
        stream?.width &&
        stream?.height
    ) {

        return (
            String(
                stream.width
            ) +
            "×" +
            String(
                stream.height
            )
        );

    }


    return "نامشخص";

}


/* =====================================================
   AUDIO QUALITY
===================================================== */

function getAudioQuality(
    stream
) {

    const raw =
        stream?.audio_bitrate
        ??
        stream?.audio_quality
        ??
        stream?.bitrate_audio
        ??
        stream?.audio_kbps
        ??
        "";


    if (
        raw === ""
        ||
        raw === null
        ||
        typeof raw ===
            "undefined"
    ) {

        return "نامشخص";

    }


    const numberValue =
        Number(
            raw
        );


    if (
        Number.isFinite(
            numberValue
        )
    ) {

        if (
            numberValue >= 1000
        ) {

            return (
                Math.round(
                    numberValue /
                    1000
                ) +
                " kbps"
            );

        }


        return (
            Math.round(
                numberValue
            ) +
            " kbps"
        );

    }


    const text =
        String(
            raw
        ).trim();


    if (
        text
            .toLowerCase()
            .includes("kbps")
    ) {

        return text;

    }


    return text;

}


/* =====================================================
   USERS LIST
===================================================== */

function getUsersList(
    stream
) {

    const users =
        stream?.users
        ||
        stream?.viewers_list
        ||
        stream?.viewer_users
        ||
        stream?.online_users_list
        ||
        [];


    if (
        !Array.isArray(
            users
        )
    ) {

        return [];

    }


    return users
        .map(
            item => {

                if (
                    typeof item ===
                    "string"
                ) {

                    return item;

                }


                return (
                    item?.username
                    ||
                    item?.user
                    ||
                    item?.name
                    ||
                    ""
                );

            }
        )
        .filter(
            Boolean
        );

}


/* =====================================================
   OWN STREAM FALLBACK
===================================================== */

function getOwnStreamSettings(
    stream
) {

    const owner =
        getUsername(
            stream
        );


    if (
        String(owner)
        !==
        String(
            currentUsername
        )
    ) {

        return {};

    }


    let stored =
        null;


    try {

        const raw =
            sessionStorage.getItem(
                CURRENT_STREAM_KEY
            );


        if (
            raw
        ) {

            stored =
                JSON.parse(
                    raw
                );

            if (
                String(
                    getId(
                        stored
                    )
                )
                !==
                String(
                    getId(
                        stream
                    )
                )
            ) {

                stored =
                    null;

            }

        }

    }
    catch {}


    if (
        !stored
    ) {

        try {

            const raw =
                localStorage.getItem(
                    CURRENT_STREAM_KEY
                );


            if (
                raw
            ) {

                stored =
                    JSON.parse(
                        raw
                    );

            }

        }
        catch {}

    }


    if (
        !stored
    ) {

        return {};

    }


    return {

        videoQuality:
            stored.video_quality
            ||
            stored.quality
            ||
            "",

        audioQuality:
            stored.audio_bitrate
            ||
            stored.audio_quality
            ||
            "",

        users:
            stored.users
            ||
            stored.viewers_list
            ||
            []

    };

}


/* =====================================================
   QUALITY MERGE
===================================================== */

function getEffectiveVideoQuality(
    stream
) {

    const own =
        getOwnStreamSettings(
            stream
        );


    if (
        own.videoQuality
    ) {

        const fakeStream =
            {
                video_quality:
                    own.videoQuality
            };


        return getVideoQuality(
            fakeStream
        );

    }


    return getVideoQuality(
        stream
    );

}


function getEffectiveAudioQuality(
    stream
) {

    const own =
        getOwnStreamSettings(
            stream
        );


    if (
        own.audioQuality
    ) {

        const fakeStream =
            {
                audio_bitrate:
                    own.audioQuality
            };


        return getAudioQuality(
            fakeStream
        );

    }


    return getAudioQuality(
        stream
    );

}

/* =====================================================
   SEARCH
===================================================== */

function normalizeText(
    value
) {

    return String(
        value ?? ""
    )
        .trim()
        .toLowerCase();

}


function applySearch() {

    const query =
        normalizeText(
            searchInput.value
        );


    if (
        !query
    ) {

        renderStreams(
            allStreams
        );

        return;

    }


    const filtered =
        allStreams.filter(
            stream => {

                const title =
                    normalizeText(
                        getTitle(
                            stream
                        )
                    );


                const username =
                    normalizeText(
                        getUsername(
                            stream
                        )
                    );


                const category =
                    normalizeText(
                        getCategory(
                            stream
                        )
                    );


                const video =
                    normalizeText(
                        getEffectiveVideoQuality(
                            stream
                        )
                    );


                const audio =
                    normalizeText(
                        getEffectiveAudioQuality(
                            stream
                        )
                    );


                return (

                    title.includes(
                        query
                    )

                    ||

                    username.includes(
                        query
                    )

                    ||

                    category.includes(
                        query
                    )

                    ||

                    video.includes(
                        query
                    )

                    ||

                    audio.includes(
                        query
                    )

                );

            }
        );


    renderStreams(
        filtered
    );

}

   LOAD STREAMS
===================================================== */

async function loadStreams(
    force = false
) {

    if (
        streamsLoading
    ) {

        return;

    }


    streamsLoading =
        true;


    refreshButton.disabled =
        true;


    try {

        const streams =
            await LainoLiveStreams.fetch({

                force:
                    force,

                ttl:
                    1000

            });


        allStreams =
            Array.isArray(
                streams
            )
                ? streams
                : [];


        statusText.textContent =
            allStreams.length

                ? allStreams.length +
                    " لایو در حال پخش"

                : "فعلاً لایوی فعال نیست";


        applySearch();

    }
    catch (
        error
    ) {

        console.error(
            "load streams error:",
            error
        );


        if (
            !allStreams.length
        ) {

            streamsList.innerHTML =
                `
                    <div class="empty">
                        دریافت لایوها انجام نشد.
                        <br>
                        اتصال سرور را بررسی کنید.
                    </div>
                `;

        }


        statusText.textContent =
            "خطا در دریافت لایوها";

    }
    finally {

        streamsLoading =
            false;


        refreshButton.disabled =
            false;

    }

}

/* =====================================================
   UPLOAD COVER
===================================================== */

async function uploadCover(
    streamId
) {

    if (
        !selectedCoverFile
    ) {

        return null;

    }


    uploadStatus.textContent =
        "در حال آپلود کاور...";


    const formData =
        new FormData();


    formData.append(
        "stream_id",
        String(
            streamId
        )
    );


    formData.append(
        "username",
        currentUsername
    );


    formData.append(
        "cover",
        selectedCoverFile,
        selectedCoverFile.name
    );


    const response =
        await fetch(
            "/api/streams/cover",
            {
                method:
                    "POST",

                body:
                    formData
            }
        );


    if (
        !response.ok
    ) {

        throw new Error(
            "cover upload failed"
        );

    }


    const data =
        await response.json();


    uploadStatus.textContent =
        "کاور با موفقیت آپلود شد.";


    return data;

}


/* =====================================================
   START LIVE
===================================================== */

async function startLive() {

    const title =
        liveTitle.value.trim()
        ||
        "لایو بدون عنوان";


    const category =
        liveCategory.value
        ||
        "عمومی";


    const button =
        document.getElementById(
            "confirmStartButton"
        );


    button.disabled =
        true;


    button.textContent =
        "در حال شروع...";


    try {

        const response =
            await fetch(
                "/api/streams/create",
                {
                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            username:
                                currentUsername,

                            title:
                                title,

                            category:
                                category

                        })

                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "stream create failed"
            );

        }


        const data =
            await response.json();


        const createdStream =
            data.stream
            ||
            data;


        const streamId =
            getId(
                createdStream
            );


        if (

            streamId === null
            ||

            typeof streamId ===
                "undefined"

        ) {

            throw new Error(
                "stream id missing"
            );

        }


        if (
            selectedCoverFile
        ) {

            await uploadCover(
                streamId
            );

        }


        if (
            window.LainoLiveStreams
            &&
            typeof
                window.LainoLiveStreams.clear ===
                    "function"
        ) {

            window.LainoLiveStreams.clear();

        }


        const streamForSession = {

            ...createdStream,

            id:
                streamId,

            stream_id:
                streamId,

            username:
                currentUsername,

            title:
                title,

            category:
                category,

            viewer_count:
                0,

            users_count:
                0,

            video_quality:
                "720p",

            audio_bitrate:
                128000,

            users:
                []

        };


        sessionStorage.setItem(
            CURRENT_STREAM_KEY,
            JSON.stringify(
                streamForSession
            )
        );


        sessionStorage.setItem(
            VIEW_STREAM_KEY,
            JSON.stringify(
                streamForSession
            )
        );


        window.location.href =
            "/live.html";

    }
    catch (
        error
    ) {

        console.error(
            "start live error:",
            error
        );


        uploadStatus.textContent =
            "شروع لایو انجام نشد.";


        button.disabled =
            false;


        button.textContent =
            "شروع لایو";

    }

}
