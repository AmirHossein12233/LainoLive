<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>لاینو | LainoLive</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <style>
        .status-text {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin: 10px 0 16px;
        }

        .live-card {
            cursor: pointer;
        }

        .live-card.owner {
            border-color: #22c55e;
        }

        .owner-badge {
            position: absolute;
            right: 10px;
            bottom: 10px;
            padding: 5px 8px;
            border-radius: 8px;
            background: #132b1d;
            color: #86efac;
            font-size: 10px;
            font-weight: bold;
        }

        .stream-category {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 8px;
            background: #132b1d;
            color: #86efac;
            font-size: 11px;
        }

        .empty-live {
            grid-column: 1 / -1;
        }
    </style>
</head>

<body>

<script>
    const loggedIn =
        localStorage.getItem(
            "lainolive_logged_in"
        );

    const currentUsername =
        localStorage.getItem(
            "lainolive_username"
        );

    if (
        loggedIn !== "true" ||
        !currentUsername
    ) {
        window.location.replace(
            "/login.html"
        );
    }
</script>


<header class="topbar">

    <div class="topbar-left">

        <div class="logo">
            لاینو
        </div>

    </div>


    <div class="topbar-right">

        <button
            id="profileButton"
            class="user-button"
            type="button"
        >
            👤
            <span id="userName">
                کاربر
            </span>
        </button>

    </div>

</header>


<main class="main-content">

    <section class="welcome-section">

        <div>

            <h1 id="welcomeTitle">
                سلام 👋
            </h1>

            <p>
                پخش زنده‌های لاینو را تماشا کن.
            </p>

        </div>


        <button
            id="startLiveButton"
            class="primary-button"
            type="button"
        >
            🔴 شروع پخش زنده
        </button>

    </section>


    <div
        id="serverStatus"
        class="status-text"
    >
        در حال دریافت لایوها...
    </div>


    <section class="section">

        <div class="section-header">

            <h2>
                پخش‌های زنده
            </h2>

            <span
                id="liveCount"
                class="section-count"
            >
                0 پخش
            </span>

        </div>


        <div
            id="liveList"
            class="live-list"
        ></div>

    </section>

</main>


<nav class="bottom-nav">

    <button
        class="nav-item active"
        type="button"
    >
        <span class="nav-icon">
            🏠
        </span>

        <span>
            خانه
        </span>
    </button>


    <button
        id="searchButton"
        class="nav-item"
        type="button"
    >
        <span class="nav-icon">
            🔎
        </span>

        <span>
            جستجو
        </span>
    </button>


    <button
        id="createButton"
        class="nav-item"
        type="button"
    >
        <span class="nav-icon">
            ➕
        </span>

        <span>
            ایجاد
        </span>
    </button>


    <button
        id="messagesButton"
        class="nav-item"
        type="button"
    >
        <span class="nav-icon">
            💬
        </span>

        <span>
            پیام
        </span>
    </button>


    <button
        id="bottomProfileButton"
        class="nav-item"
        type="button"
    >
        <span class="nav-icon">
            👤
        </span>

        <span>
            پروفایل
        </span>
    </button>

</nav>


<!-- =====================================================
     START LIVE MODAL
===================================================== -->

<div
    id="liveModal"
    class="modal hidden"
>

    <div
        class="modal-backdrop"
    ></div>


    <div class="modal-box">

        <div class="modal-header">

            <h2>
                شروع پخش زنده
            </h2>

            <button
                id="closeLiveModal"
                class="close-button"
                type="button"
            >
                ✕
            </button>

        </div>


        <label for="liveTitle">
            عنوان لایو
        </label>

        <input
            id="liveTitle"
            type="text"
            maxlength="100"
            placeholder="مثلاً بازی آنلاین"
        >


        <label for="liveCategory">
            دسته‌بندی
        </label>

        <select id="liveCategory">

            <option value="عمومی">
                عمومی
            </option>

            <option value="بازی">
                بازی
            </option>

            <option value="موسیقی">
                موسیقی
            </option>

            <option value="گفتگو">
                گفتگو
            </option>

            <option value="آموزشی">
                آموزشی
            </option>

        </select>


        <button
            id="confirmLiveButton"
            class="primary-button full"
            type="button"
        >
            شروع لایو
        </button>

    </div>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

    /* =====================================================
       ELEMENTS
    ===================================================== */

    const liveList =
        document.getElementById(
            "liveList"
        );


    const liveCount =
        document.getElementById(
            "liveCount"
        );


    const serverStatus =
        document.getElementById(
            "serverStatus"
        );


    const liveModal =
        document.getElementById(
            "liveModal"
        );


    const liveTitle =
        document.getElementById(
            "liveTitle"
        );


    const liveCategory =
        document.getElementById(
            "liveCategory"
        );


    const toast =
        document.getElementById(
            "toast"
        );


    /* =====================================================
       USER UI
    ===================================================== */

    document.getElementById(
        "userName"
    ).textContent =
        currentUsername;


    document.getElementById(
        "welcomeTitle"
    ).textContent =
        "سلام " +
        currentUsername +
        " 👋";


    /* =====================================================
       TOAST
    ===================================================== */

    function showToast(text) {

        toast.textContent =
            text;

        toast.classList.add(
            "show"
        );

        setTimeout(
            function() {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );
    }


    /* =====================================================
       ESCAPE
    ===================================================== */

    function escapeHtml(text) {

        return String(text)
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );
    }


    /* =====================================================
       LOAD STREAMS
    ===================================================== */

    async function loadStreams() {

        try {

            serverStatus.textContent =
                "در حال دریافت لایوها...";


            const response =
                await fetch(
                    "/api/streams",
                    {
                        cache:
                            "no-store"
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "خطا در دریافت لایوها."
                );
            }


            const streams =
                Array.isArray(
                    data.streams
                )
                    ? data.streams
                    : [];


            renderStreams(
                streams
            );


            serverStatus.textContent =
                "سرور لایو فعال است";


        } catch (error) {

            console.error(
                "Streams:",
                error
            );


            serverStatus.textContent =
                "خطا در دریافت لایوها";


            liveList.innerHTML = `
                <div class="empty-live">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <h3>
                        اتصال به لایوها ناموفق بود
                    </h3>

                    <p>
                        دوباره صفحه را تازه‌سازی کن.
                    </p>

                </div>
            `;
        }
    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderStreams(
        streams
    ) {

        liveList.innerHTML =
            "";


        liveCount.textContent =
            streams.length +
            " پخش";


        if (!streams.length) {

            liveList.innerHTML = `
                <div class="empty-live">

                    <div class="empty-icon">
                        📺
                    </div>

                    <h3>
                        هنوز لایو فعالی وجود ندارد
                    </h3>

                    <p>
                        اولین لایو را شروع کن.
                    </p>

                </div>
            `;

            return;
        }


        streams.forEach(
            stream => {

                const card =
                    document.createElement(
                        "div"
                    );


                const isOwner =
                    stream.username ===
                    currentUsername;


                card.className =
                    "live-card" +
                    (
                        isOwner
                            ? " owner"
                            : ""
                    );


                card.innerHTML = `

                    <div class="live-thumbnail">

                        <div class="live-badge">
                            LIVE
                        </div>

                        <div class="thumbnail-icon">
                            📹
                        </div>

                        <div class="viewer-count">
                            👁
                            ${Number(
                                stream.viewers ||
                                0
                            )}
                        </div>

                        ${
                            isOwner
                                ? `
                                    <div class="owner-badge">
                                        لایو شما
                                    </div>
                                  `
                                : ""
                        }

                    </div>


                    <div class="live-info">

                        <div class="stream-title">
                            ${escapeHtml(
                                stream.title ||
                                "پخش زنده"
                            )}
                        </div>


                        <div class="stream-user">
                            👤
                            ${escapeHtml(
                                stream.username ||
                                "کاربر"
                            )}
                        </div>


                        <div class="stream-category">
                            ${escapeHtml(
                                stream.category ||
                                "عمومی"
                            )}
                        </div>

                    </div>
                `;


                card.addEventListener(
                    "click",
                    function() {

                        openStream(
                            stream
                        );

                    }
                );


                liveList.appendChild(
                    card
                );
            }
        );
    }


    /* =====================================================
       OPEN STREAM
    ===================================================== */

    function openStream(
        stream
    ) {

        if (!stream || !stream.id) {
            return;
        }


        sessionStorage.setItem(
            "lainolive_view_stream",
            JSON.stringify(
                stream
            )
        );


        /*
         * اگر خود کاربر صاحب لایو باشد،
         * وارد صفحه صاحب لایو می‌شود.
         */

        if (
            stream.username ===
            currentUsername
        ) {

            sessionStorage.setItem(
                "lainolive_current_stream",
                JSON.stringify(
                    stream
                )
            );


            window.location.href =
                "/live.html";

            return;
        }


        /*
         * سایر کاربران وارد viewer.html می‌شوند.
         */

        window.location.href =
            "/viewer.html?id=" +
            encodeURIComponent(
                stream.id
            );
    }


    /* =====================================================
       START LIVE
    ===================================================== */

    function openLiveModal() {

        liveModal.classList.remove(
            "hidden"
        );

        liveTitle.focus();
    }


    function closeLiveModal() {

        liveModal.classList.add(
            "hidden"
        );
    }


    document.getElementById(
        "startLiveButton"
    ).addEventListener(
        "click",
        openLiveModal
    );


    document.getElementById(
        "createButton"
    ).addEventListener(
        "click",
        openLiveModal
    );


    document.getElementById(
        "closeLiveModal"
    ).addEventListener(
        "click",
        closeLiveModal
    );


    liveModal
        .querySelector(
            ".modal-backdrop"
        )
        .addEventListener(
            "click",
            closeLiveModal
        );


    /* =====================================================
       CREATE STREAM
    ===================================================== */

    document.getElementById(
        "confirmLiveButton"
    ).addEventListener(
        "click",
        async function() {

            const title =
                liveTitle.value.trim();


            const category =
                liveCategory.value;


            if (!title) {

                showToast(
                    "عنوان لایو را وارد کن."
                );

                return;
            }


            const button =
                document.getElementById(
                    "confirmLiveButton"
                );


            button.disabled =
                true;


            button.textContent =
                "در حال ساخت...";


            try {

                const response =
                    await fetch(
                        "/api/streams/create",
                        {
                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    username:
                                        currentUsername,

                                    title:
                                        title,

                                    category:
                                        category
                                })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    showToast(
                        data.message ||
                        "ساخت لایو ناموفق بود."
                    );

                    return;
                }


                sessionStorage.setItem(
                    "lainolive_current_stream",
                    JSON.stringify(
                        data.stream
                    )
                );


                window.location.href =
                    "/live.html";


            } catch (error) {

                console.error(
                    error
                );


                showToast(
                    "خطا در ارتباط با سرور."
                );

            } finally {

                button.disabled =
                    false;

                button.textContent =
                    "شروع لایو";
            }
        }
    );


    /* =====================================================
       PROFILE
    ===================================================== */

    document.getElementById(
        "profileButton"
    ).addEventListener(
        "click",
        function() {

            window.location.href =
                "/profile.html";

        }
    );


    document.getElementById(
        "bottomProfileButton"
    ).addEventListener(
        "click",
        function() {

            window.location.href =
                "/profile.html";

        }
    );


    /* =====================================================
       SEARCH / MESSAGES
    ===================================================== */

    document.getElementById(
        "searchButton"
    ).addEventListener(
        "click",
        function() {

            showToast(
                "جستجو در مرحله بعد اضافه می‌شود."
            );

        }
    );


    document.getElementById(
        "messagesButton"
    ).addEventListener(
        "click",
        function() {

            showToast(
                "پیام خصوصی در مرحله بعد اضافه می‌شود."
            );

        }
    );


    /* =====================================================
       LOAD
    ===================================================== */

    loadStreams();


    setInterval(
        loadStreams,
        5000
    );

</script>

</body>

</html>
