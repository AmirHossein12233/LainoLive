<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<meta name="theme-color"
content="#ff2757">


<meta name="mobile-web-app-capable"
content="yes">


<meta name="apple-mobile-web-app-capable"
content="yes">


<link rel="manifest"
href="/manifest.json">


<link rel="apple-touch-icon"
href="/icons/icon-192.png">


<title>
LainoLive
</title>



<style>


*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}


body{

margin:0;

min-height:100vh;

font-family:
Tahoma,
Arial,
sans-serif;

background:
radial-gradient(
circle at top,
#19192b,
#050508
);

color:white;

}



button,
input{

font-family:inherit;

}



.page{

padding-bottom:90px;

}



.header{

position:sticky;

top:0;

z-index:10;

padding:16px;

background:
rgba(5,5,10,.9);

backdrop-filter:
blur(15px);

}



.header-row{

display:flex;

align-items:center;

justify-content:space-between;

}



.logo{

font-size:23px;

font-weight:900;

}



.subtitle{

color:#aaa;

font-size:11px;

margin-top:5px;

}



.actions{

display:flex;

gap:8px;

}



.icon{

width:42px;

height:42px;

border:none;

border-radius:14px;

background:
rgba(255,255,255,.08);

color:white;

font-size:18px;

}



.search{

margin-top:15px;

display:flex;

gap:8px;

align-items:center;

background:
rgba(255,255,255,.07);

border-radius:15px;

padding:12px;

}



.search input{

width:100%;

background:none;

border:none;

outline:none;

color:white;

}



.hero{

margin:16px;

padding:22px;

border-radius:22px;

background:
linear-gradient(
135deg,
rgba(255,39,87,.25),
rgba(139,53,255,.25)
);

}



.hero h2{

margin:0;

font-size:20px;

}



.hero p{

color:#ccc;

font-size:12px;

line-height:2;

}



.start{

border:none;

padding:13px 20px;

border-radius:14px;

background:
linear-gradient(
135deg,
#ff2757,
#8b35ff
);

color:white;

font-weight:900;

}



.section{

padding:0 16px;

}



.section-title{

font-size:17px;

font-weight:900;

margin-bottom:12px;

}



#streamsList{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:12px;

}


.card{

overflow:hidden;

border-radius:18px;

background:
rgba(255,255,255,.06);

}



.cover{

height:120px;

display:flex;

align-items:center;

justify-content:center;

font-size:40px;

background:
linear-gradient(
135deg,
#222,
#39205c
);

}



.body{

padding:12px;

}



.title{

font-weight:900;

}



.user{

margin-top:6px;

font-size:11px;

color:#aaa;

}



.empty{

padding:40px;

text-align:center;

color:#aaa;

}

</style>

</head>


<body>


<div class="page">


<header class="header">


<div class="header-row">


<div>

<div class="logo">
🎥 LainoLive
</div>


<div class="subtitle">
پخش زنده و تماشای لایو
</div>


</div>



<div class="actions">


<button
class="icon"
id="refreshButton"
>
🔄
</button>


<button
class="icon"
id="profileButton"
>
👤
</button>


</div>


</div>



<div class="search">

<span>
🔎
</span>


<input
id="searchInput"
placeholder="جستجوی لایو..."
>


</div>



</header>





<section class="hero">


<h2>
🔴 همین حالا لایو شو
</h2>



<p>

لایو خودت را شروع کن و تصویر و صدایت را برای بیننده‌ها پخش کن.

</p>



<button
class="start"
id="startLiveButton"
>

شروع لایو

</button>


</section>






<section class="section">


<div class="section-title">

🔴 لایوهای در حال پخش

</div>



<div
id="statusText"
style="
color:#999;
font-size:12px;
margin-bottom:12px;
"
>

در حال دریافت لایوها...

</div>



<div
id="streamsList"
>


<div class="empty">

در حال دریافت لایوها...

</div>


</div>


</section>


</div>








<nav
style="
position:fixed;
bottom:0;
left:0;
right:0;
height:75px;
background:rgba(5,5,10,.95);
display:grid;
grid-template-columns:repeat(3,1fr);
padding:10px;
border-top:1px solid rgba(255,255,255,.08);
"
>


<button
style="
background:none;
border:none;
color:white;
font-size:12px;
"
>

🏠
<br>
خانه

</button>



<button
id="popularButton"
style="
background:none;
border:none;
color:#aaa;
font-size:12px;
"
>

🔥
<br>
محبوب

</button>




<button
id="profileButton2"
style="
background:none;
border:none;
color:#aaa;
font-size:12px;
"
>

👤
<br>
پروفایل

</button>



</nav>









<script src="/streams-cache.js"></script>

<script src="/app.js"></script>


<script>


if(
"serviceWorker" in navigator
){

navigator.serviceWorker.register(
"/service-worker.js"
);


}





const list =
document.getElementById(
"streamsList"
);



const status =
document.getElementById(
"statusText"
);




async function loadStreams(){


const streams =

await LainoLiveStreams.fetch({
force:false,
ttl:3000
});



if(
!streams.length
){

list.innerHTML =
`
<div class="empty">
فعلاً هیچ لایوی فعال نیست 🎥
</div>
`;

status.textContent =
"بدون لایو";

return;

}




status.textContent =

streams.length +
" لایو فعال";





list.innerHTML =

streams.map(

stream => `

<div
class="card"
onclick="
openStream('${stream.id || stream.stream_id}')
"
>


<div class="cover">

📺

</div>


<div class="body">


<div class="title">

${stream.title || "لایو بدون عنوان"}

</div>



<div class="user">

👤
${stream.username || "کاربر"}

</div>


</div>


</div>

`

).join("");



}








function openStream(id){


location.href =

"/viewer.html?id="
+
encodeURIComponent(id);



}








document
.getElementById(
"refreshButton"
)
.onclick = loadStreams;




document
.getElementById(
"profileButton"
)
.onclick = () => {

location.href =
"/profile.html";

};





document
.getElementById(
"profileButton2"
)
.onclick = () => {

location.href =
"/profile.html";

};





document
.getElementById(
"popularButton"
)
.onclick = () => {

location.href =
"/popular.html";

};





document
.getElementById(
"startLiveButton"
)
.onclick = () => {

location.href =
"/live.html";

};





loadStreams();


setInterval(
loadStreams,
5000
);



</script>


</body>

</html>
