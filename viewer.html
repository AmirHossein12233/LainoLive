<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#020617"
    >

    <title>تماشای لایو | LainoLive</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #020617;
            color: #ffffff;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            overflow: hidden;
        }

        .viewer-page {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .viewer-header {
            min-height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 14px;
            background: #111827;
            border-bottom: 1px solid #273449;
            z-index: 20;
        }

        .viewer-left,
        .viewer-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-button {
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 10px;
            background: #1e293b;
            color: #ffffff;
            cursor: pointer;
            font-size: 18px;
            touch-action: manipulation;
        }

        .viewer-title-area {
            min-width: 0;
        }

        .viewer-title {
            max-width: 320px;
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .viewer-user {
            margin-top: 3px;
            color: #94a3b8;
            font-size: 11px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 10px;
            border-radius: 9px;
            background: #3f0a0a;
            color: #fecaca;
            font-size: 11px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        .viewer-main {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
        }

        .video-area {
            position: relative;
            min-width: 0;
            min-height: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000000;
        }

        .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        .video-placeholder-box {
            width: min(380px, 100%);
            padding: 25px;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.90);
            border: 1px solid #273449;
        }

        .video-icon {
            font-size: 65px;
            margin-bottom: 12px;
        }

        .video-placeholder h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .video-placeholder p {
            margin: 0;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.8;
        }

        .video-controls {
            position: absolute;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            z-index: 10;
        }

        .control-button {
            border: 1px solid #334155;
            border-radius: 11px;
            padding: 11px 15px;
            background: #1e293b;
            color: #ffffff;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 12px;
            touch-action: manipulation;
        }

        .chat-panel {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #111827;
            border-right: 1px solid #273449;
        }

        .chat-header {
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid #273449;
        }

        .chat-title {
            font-size: 14px;
            font-weight: bold;
        }

        .chat-state {
            color: #86efac;
            font-size: 11px;
        }

        .chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .chat-empty {
            text-align: center;
            color: #64748b;
            padding: 70px 10px;
            font-size: 13px;
        }

        .chat-message {
            margin-bottom: 12px;
        }

        .chat-user {
            color: #86efac;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .chat-owner {
            color: #fbbf24;
        }

        .chat-text {
            color: #e2e8f0;
            font-size: 13px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .chat-form {
            display: flex;
            gap: 7px;
            padding: 9px;
            border-top: 1px solid #273449;
        }

        .chat-input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 11px;
            outline: none;
            background: #1e293b;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
        }

        .chat-send {
            border: 0;
            border-radius: 11px;
            padding: 0 14px;
            background: #22c55e;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        .chat-send:disabled {
            opacity: 0.5;
        }

        .connection-info {
            padding: 8px 10px;
            background: #0f172a;
            border-top: 1px solid #273449;
            color: #64748b;
            font-size: 10px;
            direction: ltr;
            text-align: left;
            overflow-wrap: anywhere;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 20px;
            z-index: 1000;
            transform: translate(-50%, 20px);
            opacity: 0;
            pointer-events: none;
            max-width: calc(100% - 30px);
            padding: 11px 16px;
            border-radius: 12px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #ffffff;
            font-size: 13px;
            text-align: center;
            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .fatal-error {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #020617;
        }

        .fatal-error-box {
            width: min(500px, 100%);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            background: #111827;
            border: 1px solid #273449;
        }

        .fatal-error-box h2 {
            margin: 0 0 10px;
        }

        .fatal-error-box p {
            margin: 0 0 18px;
            color: #94a3b8;
            line-height: 1.8;
        }

        .fatal-error-box button {
            border: 0;
            border-radius: 11px;
            padding: 11px 18px;
            background: #22c55e;
            color: #ffffff;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 850px) {
            body {
                overflow: auto;
            }

            .viewer-page {
                height: auto;
                min-height: 100vh;
            }

            .viewer-main {
                grid-template-columns: 1fr;
                grid-template-rows:
                    minmax(300px, 52vh)
                    minmax(350px, 48vh);
            }

            .chat-panel {
                border-right: 0;
                border-top: 1px solid #273449;
            }

            .viewer-title {
                max-width: 180px;
            }

            .video-controls {
                bottom: 12px;
            }
        }
    </style>
</head>

<body>

<script>
    /* =====================================================
       LOGIN CHECK
    ===================================================== */

    const loggedIn =
        localStorage.getItem(
            "lainolive_logged_in"
        );

    const currentUsername =
        localStorage.getItem(
            "lainolive_username"
        );

    if (
        loggedIn !== "true" ||
        !currentUsername
    ) {
        window.location.replace(
            "/login.html"
        );
    }
</script>


<div
    id="fatalError"
    class="fatal-error"
    style="display:none;"
>

    <div class="fatal-error-box">

        <h2>
            خطا در باز کردن لایو
        </h2>

        <p id="fatalErrorText">
            اطلاعات لایو پیدا نشد.
        </p>

        <button
            id="fatalBackButton"
            type="button"
        >
            بازگشت به صفحه اصلی
        </button>

    </div>

</div>


<div
    id="viewerPage"
    class="viewer-page"
    style="display:none;"
>

    <header class="viewer-header">

        <div class="viewer-left">

            <button
                id="backButton"
                class="back-button"
                type="button"
                aria-label="بازگشت"
            >
                ←
            </button>

            <div class="viewer-title-area">

                <div
                    id="viewerTitle"
                    class="viewer-title"
                >
                    پخش زنده
                </div>

                <div
                    id="viewerUser"
                    class="viewer-user"
                >
                    صاحب لایو
                </div>

            </div>

        </div>


        <div class="viewer-right">

            <div
                id="status"
                class="status"
            >

                <span
                    id="statusDot"
                    class="status-dot"
                ></span>

                <span id="statusText">
                    در حال اتصال
                </span>

            </div>

        </div>

    </header>


    <main class="viewer-main">

        <section class="video-area">

            <video
                id="remoteVideo"
                autoplay
                playsinline
                controls
                muted
            ></video>


            <div
                id="videoPlaceholder"
                class="video-placeholder"
            >

                <div class="video-placeholder-box">

                    <div class="video-icon">
                        📺
                    </div>

                    <h2>
                        در حال اتصال
                    </h2>

                    <p id="videoStatusText">
                        منتظر تصویر صاحب لایو...
                    </p>

                </div>

            </div>


            <div class="video-controls">

                <button
                    id="audioButton"
                    class="control-button"
                    type="button"
                >
                    🔊 فعال‌کردن صدا
                </button>

            </div>

        </section>


        <section class="chat-panel">

            <div class="chat-header">

                <div class="chat-title">
                    💬 چت زنده
                </div>

                <div

                >
                    آنلاین
                </div>

            </div>


            <div

            >

                <div class="chat-empty">
                    هنوز پیامی ارسال نشده است.
                </div>

            </div>


            <form

                <input

                    autocomplete="off"
                    placeholder="پیام بنویس..."
                >

                <button
                    id="chatSend"
                    class="chat-send"
                    type="submit"
                >
                    ارسال
                </button>

                WebRTC: آماده
            </div>

        </section>

    </main>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

    /* =====================================================
       GLOBALS
    ===================================================== */

    let currentStream = null;

    let websocket = null;

    let peerConnection = null;

    let myPeerId = null;

    let ownerPeerId = null;

    let lastChatId = "";

    let chatTimer = null;

    let viewerCountJoined = false;

    let cleaningUp = false;

    const pendingCandidates = [];


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const viewerPage =
        document.getElementById(
            "viewerPage"
        );

    const fatalError =
        document.getElementById(
            "fatalError"
        );

    const fatalErrorText =
        document.getElementById(
            "fatalErrorText"
        );

    const fatalBackButton =
        document.getElementById(
            "fatalBackButton"
        );

    const viewerTitle =
        document.getElementById(
            "viewerTitle"
        );

    const viewerUser =
        document.getElementById(
            "viewerUser"
        );

    const status =
        document.getElementById(
            "status"
        );

    const statusDot =
        document.getElementById(
            "statusDot"
        );

    const statusText =
        document.getElementById(
            "statusText"
        );

    const remoteVideo =
        document.getElementById(
            "remoteVideo"
        );

    const videoPlaceholder =
        document.getElementById(
            "videoPlaceholder"
        );

    const videoStatusText =
        document.getElementById(
            "videoStatusText"
        );

    const audioButton =
        document.getElementById(
            "audioButton"
        );

    const chatMessages =
        document.getElementById(
            "chatMessages"
        );

    const chatForm =
        document.getElementById(
            "chatForm"
        );

    const chatInput =
        document.getElementById(
            "chatInput"
        );

    const chatSend =
        document.getElementById(
            "chatSend"
        );

    const chatState =
        document.getElementById(
            "chatState"
        );

    const connectionInfo =
        document.getElementById(
            "connectionInfo"
        );

    const toast =
        document.getElementById(
            "toast"
        );

    const backButton =
        document.getElementById(
            "backButton"
        );


    /* =====================================================
       SIGNALING
    ===================================================== */

    const SIGNALING_URL =
        "wss://lainolive-signaling.onrender.com";


    const RTC_CONFIGURATION = {
        iceServers: [
            {
                urls:
                    "stun:stun.l.google.com:19302"
            },
            {
                urls:
                    "stun:stun1.l.google.com:19302"
            }
        ]
    };


    /* =====================================================
       HELPERS
    ===================================================== */

    function showToast(text) {

        if (!toast) {
            return;
        }

        toast.textContent =
            String(text || "");

        toast.classList.add(
            "show"
        );

        setTimeout(
            () => {
                toast.classList.remove(
                    "show"
                );
            },
            2500
        );
    }


    function escapeHtml(text) {

        return String(
            text ?? ""
        )
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );
    }


    function setStatus(
        text,
        online
    ) {

        if (statusText) {
            statusText.textContent =
                text;
        }

        if (statusDot) {
            statusDot.style.background =
                online
                    ? "#22c55e"
                    : "#ef4444";
        }

        if (status) {
            status.style.background =
                online
                    ? "#132b1d"
                    : "#3f0a0a";
        }
    }


    function getStreamIdFromUrl() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const id =
            params.get("id");

        if (
            id !== null &&
            id !== ""
        ) {
            return id;
        }

        return null;
    }


    function normalizeStream(stream) {

        if (!stream) {
            return null;
        }

        return {
            id:
                stream.id,
            title:
                stream.title ||
                "پخش زنده",
            username:
                stream.username ||
                "کاربر",
            created_at:
                stream.created_at ||
                null,
            viewer_count:
                Number(
                    stream.viewer_count ??
                    stream.viewers ??
                    0
                )
        };
    }


    function showFatalError(
        message
    ) {

        if (viewerPage) {
            viewerPage.style.display =
                "none";
        }

        if (fatalErrorText) {
            fatalErrorText.textContent =
                message;
        }

        if (fatalError) {
            fatalError.style.display =
                "flex";
        }
    }


    function showViewerPage() {

        if (fatalError) {
            fatalError.style.display =
                "none";
        }

        if (viewerPage) {
            viewerPage.style.display =
                "flex";
        }
    }


    function sendSignal(data) {

        if (
            !websocket ||
            websocket.readyState !==
            WebSocket.OPEN
        ) {
            return false;
        }

        try {

            websocket.send(
                JSON.stringify(data)
            );

            return true;

        } catch (error) {

            console.error(
                "WebSocket send:",
                error
            );

            return false;
        }
    }


    /* =====================================================
       LOAD STREAM
    ===================================================== */

    async function loadCurrentStream() {

        const urlStreamId =
            getStreamIdFromUrl();


        /*
         * اولویت با id داخل URL است.
         * این بخش مشکل موبایل را برطرف می‌کند.
         */

        if (
            urlStreamId !== null
        ) {

            try {

                const response =
                    await fetch(
                        "/api/streams",
                        {
                            cache:
                                "no-store"
                        }
                    );


                if (!response.ok) {
                    throw new Error(
                        "HTTP " +
                        response.status
                    );
                }


                const data =
                    await response.json();


                if (
                    data &&
                    data.success
                ) {

                    const streams =
                        Array.isArray(
                            data.streams
                        )
                            ? data.streams
                            : [];


                    const found =
                        streams.find(
                            stream =>
                                String(
                                    stream.id
                                ) ===
                                String(
                                    urlStreamId
                                )
                        );


                    if (found) {

                        currentStream =
                            normalizeStream(
                                found
                            );


                        try {

                            sessionStorage.setItem(
                                "lainolive_view_stream",
                                JSON.stringify(
                                    currentStream
                                )
                            );

                        } catch (error) {
                        }


                        return true;
                    }
                }

            } catch (error) {

                console.error(
                    "Load stream from API:",
                    error
                );
            }
        }


        /*
         * پشتیبان برای لینک‌های قدیمی:
         * sessionStorage
         */

        const possibleKeys = [
            "lainolive_view_stream",
            "lainolive_current_stream"
        ];


        for (
            const key of possibleKeys
        ) {

            try {

                const raw =
                    sessionStorage.getItem(
                        key
                    );


                if (!raw) {
                    continue;
                }


                const parsed =
                    JSON.parse(
                        raw
                    );


                const normalized =
                    normalizeStream(
                        parsed
                    );


                if (
                    normalized &&
                    normalized.id !==
                    undefined &&
                    normalized.id !==
                    null
                ) {

                    if (
                        urlStreamId === null ||
                        String(
                            normalized.id
                        ) ===
                        String(
                            urlStreamId
                        )
                    ) {

                        currentStream =
                            normalized;

                        return true;
                    }
                }

            } catch (error) {

                console.error(
                    "Session stream:",
                    error
                );
            }
        }


        return false;
    }


    /* =====================================================
       PEER CONNECTION
    ===================================================== */

    function createPeerConnection() {

        if (peerConnection) {
            return peerConnection;
        }


        peerConnection =
            new RTCPeerConnection(
                RTC_CONFIGURATION
            );


        peerConnection.ontrack =
            event => {

                if (
                    !event.streams ||
                    !event.streams[0]
                ) {
                    return;
                }


                remoteVideo.srcObject =
                    event.streams[0];


                if (
                    videoPlaceholder
                ) {

                    videoPlaceholder.style.display =
                        "none";
                }


                if (
                    videoStatusText
                ) {

                    videoStatusText.textContent =
                        "تصویر و صدا دریافت شد.";
                }


                setStatus(
                    "LIVE",
                    true
                );


                /*
                 * پخش خودکار ممکن است روی موبایل
                 * توسط مرورگر مسدود شود.
                 */

                remoteVideo
                    .play()
                    .catch(
                        () => {
                            showToast(
                                "برای فعال‌کردن صدا روی دکمه صدا بزن."
                            );
                        }
                    );
            };


        peerConnection.onicecandidate =
            event => {

                if (
                    !event.candidate ||
                    !ownerPeerId
                ) {
                    return;
                }


                sendSignal({

                    type:
                        "ice-candidate",

                    target_peer_id:
                        ownerPeerId,

                    candidate:
                        event.candidate

                });
            };


        peerConnection.onconnectionstatechange =
            () => {

                const state =
                    peerConnection.connectionState;


                if (
                    connectionInfo
                ) {

                    connectionInfo.textContent =
                        "WebRTC: " +
                        state;
                }


                if (
                    state ===
                    "connected"
                ) {

                    setStatus(
                        "متصل",
                        true
                    );

                } else if (
                    state ===
                    "failed"
                ) {

                    setStatus(
                        "اتصال ناموفق",
                        false
                    );


                    showToast(
                        "اتصال WebRTC ناموفق بود."
                    );
                }
            };


        peerConnection.oniceconnectionstatechange =
            () => {

                if (
                    !peerConnection
                ) {
                    return;
                }

                if (
                    connectionInfo
                ) {

                    connectionInfo.textContent =
                        "ICE: " +
                        peerConnection
                            .iceConnectionState;
                }
            };


        return peerConnection;
    }


    async function applyPendingCandidates() {

        if (!peerConnection) {
            return;
        }


        while (
            pendingCandidates.length
        ) {

            const candidate =
                pendingCandidates.shift();


            try {

                await peerConnection.addIceCandidate(
                    candidate
                );

            } catch (error) {

                console.error(
                    "Pending ICE:",
                    error
                );
            }
        }
    }


    /* =====================================================
       SIGNALING
    ===================================================== */

    async function handleSignal(
        message
    ) {

        if (!message) {
            return;
        }


        const type =
            message.type;


        if (
            type === "joined"
        ) {

            myPeerId =
                message.peer_id ||
                null;


            if (chatState) {
                chatState.textContent =
                    "سیگنالینگ متصل";
            }


            if (connectionInfo) {
                connectionInfo.textContent =
                    "WebSocket: متصل";
            }


            setStatus(
                "منتظر صاحب لایو",
                true
            );


            return;
        }


        if (
            type === "owner_available"
        ) {

            ownerPeerId =
                message.peer_id ||
                null;


            if (!ownerPeerId) {
                return;
            }


            createPeerConnection();


            setStatus(
                "صاحب لایو پیدا شد",
                true
            );


            return;
        }


        if (
            type === "offer"
        ) {

            ownerPeerId =
                message.peer_id ||
                ownerPeerId;


            if (!ownerPeerId) {
                return;
            }


            const pc =
                createPeerConnection();


            try {

                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        message.offer
                    )
                );


                await applyPendingCandidates();


                const answer =
                    await pc.createAnswer();


                await pc.setLocalDescription(
                    answer
                );


                sendSignal({

                    type:
                        "answer",

                    target_peer_id:
                        ownerPeerId,

                    answer:
                        pc.localDescription

                });


                setStatus(
                    "در حال اتصال",
                    true
                );


            } catch (error) {

                console.error(
                    "Offer:",
                    error
                );


                showToast(
                    "پردازش اتصال WebRTC ناموفق بود."
                );
            }


            return;
        }


        if (
            type === "ice-candidate"
        ) {

            if (
                !message.candidate
            ) {
                return;
            }


            let candidate;


            try {

                candidate =
                    new RTCIceCandidate(
                        message.candidate
                    );

            } catch (error) {

                console.error(
                    "ICE candidate create:",
                    error
                );

                return;
            }


            if (
                peerConnection &&
                peerConnection.remoteDescription
            ) {

                try {

                    await peerConnection.addIceCandidate(
                        candidate
                    );

                } catch (error) {

                    console.error(
                        "ICE:",
                        error
                    );
                }

            } else {

                pendingCandidates.push(
                    candidate
                );
            }


            return;
        }


        if (
            type === "peer_left"
        ) {

            if (
                message.peer_id ===
                ownerPeerId
            ) {

                setStatus(
                    "پخش پایان یافت",
                    false
                );


                if (
                    videoPlaceholder
                ) {

                    videoPlaceholder.style.display =
                        "flex";
                }


                if (
                    videoStatusText
                ) {

                    videoStatusText.textContent =
                        "صاحب لایو خارج شد.";
                }
            }


            return;
        }


        if (
            type === "error"
        ) {

            showToast(
                message.message ||
                "خطای سیگنالینگ."
            );
        }
    }


    function connectSignaling() {

        if (
            !currentStream
        ) {
            return;
        }


        if (
            connectionInfo
        ) {

            connectionInfo.textContent =
                SIGNALING_URL;
        }


        try {

            websocket =
                new WebSocket(
                    SIGNALING_URL
                );

        } catch (error) {

            console.error(
                "WebSocket create:",
                error
            );


            setStatus(
                "خطا",
                false
            );


            showToast(
                "اتصال WebRTC برقرار نشد."
            );


            return;
        }


        websocket.onopen =
            () => {

                setStatus(
                    "متصل",
                    true
                );


                sendSignal({

                    type:
                        "join",

                    room_id:
                        currentStream.id,

                    username:
                        currentUsername,

                    role:
                        "viewer"

                });
            };


        websocket.onmessage =
            async event => {

                try {

                    const message =
                        JSON.parse(
                            event.data
                        );


                    await handleSignal(
                        message
                    );

                } catch (error) {

                    console.error(
                        "Signal:",
                        error
                    );
                }
            };


        websocket.onerror =
            error => {

                console.error(
                    "WebSocket:",
                    error
                );


                setStatus(
                    "خطا",
                    false
                );
            };


        websocket.onclose =
            () => {

                if (
                    cleaningUp
                ) {
                    return;
                }


                setStatus(
                    "سیگنالینگ قطع شد",
                    false
                );


                if (chatState) {
                    chatState.textContent =
                        "قطع";
                }
            };
    }


    /* =====================================================
       AUDIO
    ===================================================== */

    audioButton.addEventListener(
        "click",
        async () => {

            if (!remoteVideo) {
                return;
            }


            remoteVideo.muted =
                false;

            remoteVideo.volume =
                1;


            try {

                await remoteVideo.play();


                audioButton.textContent =
                    "🔊 صدا فعال است";


            } catch (error) {

                console.error(
                    "Audio play:",
                    error
                );


                showToast(
                    "برای پخش ویدیو دوباره امتحان کن."
                );
            }
        }
    );


    /* =====================================================
       CHAT
    ===================================================== */

    async function loadChat() {

        if (
            !currentStream
        ) {
            return;
        }


        try {

            const params =
                new URLSearchParams();


            params.set(
                "stream_id",
                currentStream.id
            );


            if (
                lastChatId
            ) {

                params.set(
                    "after_id",
                    lastChatId
                );
            }


            const response =
                await fetch(
                    "/api/chat/messages?" +
                    params.toString(),
                    {
                        cache:
                            "no-store"
                    }
                );


            if (!response.ok) {
                return;
            }


            const data =
                await response.json();


            if (
                !data ||
                !data.success
            ) {
                return;
            }


            const messages =
                Array.isArray(
                    data.messages
                )
                    ? data.messages
                    : [];


            if (
                !messages.length
            ) {
                return;
            }


            const empty =
                chatMessages.querySelector(
                    ".chat-empty"
                );


            if (empty) {
                empty.remove();
            }


            messages.forEach(
                message => {

                    const element =
                        document.createElement(
                            "div"
                        );


                    element.className =
                        "chat-message";


                    const owner =
                        String(
                            message.username
                        ) ===
                        String(
                            currentStream.username
                        );


                    element.innerHTML = `
                        <div class="${
                            owner
                                ? "chat-user chat-owner"
                                : "chat-user"
                        }">
                            ${escapeHtml(
                                message.username
                            )}
                            ${owner ? " 👑" : ""}
                        </div>

                        <div class="chat-text">
                            ${escapeHtml(
                                message.text
                            )}
                        </div>
                    `;


                    chatMessages.appendChild(
                        element
                    );


                    lastChatId =
                        message.id;
                }
            );


            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        } catch (error) {

            console.error(
                "Chat:",
                error
            );
        }
    }


    chatForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const text =
                chatInput.value.trim();


            if (
                !text ||
                !currentStream
            ) {
                return;
            }


            chatSend.disabled =
                true;


            try {

                const response =
                    await fetch(
                        "/api/chat/send",
                        {
                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    stream_id:
                                        currentStream.id,

                                    username:
                                        currentUsername,

                                    text:
                                        text

                                })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    showToast(
                        data.message ||
                        "ارسال پیام ناموفق بود."
                    );

                    return;
                }


                chatInput.value =
                    "";


                await loadChat();

            } catch (error) {

                console.error(
                    "Chat send:",
                    error
                );


                showToast(
                    "خطا در ارسال پیام."
                );

            } finally {

                chatSend.disabled =
                    false;

                chatInput.focus();
            }
        }
    );


    /* =====================================================
       VIEWER COUNT
    ===================================================== */

    async function joinViewerCount() {

        if (
            !currentStream ||
            viewerCountJoined
        ) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/streams/viewer",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                stream_id:
                                    currentStream.id,

                                action:
                                    "join"

                            })
                    }
                );


            if (
                response.ok
            ) {

                viewerCountJoined =
                    true;
            }

        } catch (error) {

            console.error(
                "Viewer count:",
                error
            );
        }
    }


    async function leaveViewerCount() {

        if (
            !currentStream ||
            !viewerCountJoined
        ) {
            return;
        }


        viewerCountJoined =
            false;


        try {

            await fetch(
                "/api/streams/viewer",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            stream_id:
                                currentStream.id,

                            action:
                                "leave"

                        })
                }
            );

        } catch (error) {

            console.error(
                "Leave viewer:",
                error
            );
        }
    }


    /* =====================================================
       BACK
    ===================================================== */

    async function goBack() {

        if (cleaningUp) {
            return;
        }

        cleaningUp =
            true;


        if (chatTimer) {

            clearInterval(
                chatTimer
            );

            chatTimer =
                null;
        }


        await leaveViewerCount();


        if (peerConnection) {

            try {
                peerConnection.close();
            } catch (error) {
            }

            peerConnection =
                null;
        }


        if (websocket) {

            try {
                websocket.close();
            } catch (error) {
            }

            websocket =
                null;
        }


        window.location.href =
            "/index.html";
    }


    if (backButton) {

        backButton.addEventListener(
            "click",
            goBack
        );
    }


    if (fatalBackButton) {

        fatalBackButton.addEventListener(
            "click",
            () => {
                window.location.href =
                    "/index.html";
            }
        );
    }


    /* =====================================================
       CLEANUP
    ===================================================== */

    window.addEventListener(
        "beforeunload",
        () => {

            cleaningUp =
                true;


            if (
                chatTimer
            ) {

                clearInterval(
                    chatTimer
                );
            }


            if (
                currentStream &&
                viewerCountJoined
            ) {

                try {

                    const body =
                        JSON.stringify({

                            stream_id:
                                currentStream.id,

                            action:
                                "leave"

                        });


                    if (
                        navigator.sendBeacon
                    ) {

                        navigator.sendBeacon(
                            "/api/streams/viewer",
                            new Blob(
                                [body],
                                {
                                    type:
                                        "application/json"
                                }
                            )
                        );
                    }

                } catch (error) {

                    console.error(
                        "Beacon:",
                        error
                    );
                }
            }


            if (
                peerConnection
            ) {

                try {
                    peerConnection.close();
                } catch (error) {
                }
            }


            if (
                websocket
            ) {

                try {
                    websocket.close();
                } catch (error) {
                }
            }
        }
    );


    /* =====================================================
       START
    ===================================================== */

    async function startViewer() {

        /*
         * اول لایو را پیدا می‌کنیم.
         * تا وقتی پیدا نشده، WebRTC و چت شروع نمی‌شوند.
         */

        const loaded =
            await loadCurrentStream();


        if (!loaded) {

            showFatalError(
                "لایوی با این شناسه پیدا نشد یا لایو به پایان رسیده است."
            );

            return;
        }


        viewerTitle.textContent =
            currentStream.title ||
            "پخش زنده";


        viewerUser.textContent =
            "صاحب لایو: " +
            (
                currentStream.username ||
                "کاربر"
            );


        showViewerPage();


        try {

            createPeerConnection();

        } catch (error) {

            console.error(
                "Peer connection:",
                error
            );


            showToast(
                "مرورگر این دستگاه از WebRTC پشتیبانی نمی‌کند."
            );
        }


        connectSignaling();


        joinViewerCount();


        loadChat();


        chatTimer =
            setInterval(
                loadChat,
                2000
            );
    }


    startViewer();

</script>
