<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#090b12"
    >

    <title>LainoLive - تماشای لایو</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(90,58,180,.16),
                    transparent 30%
                ),
                #090b12;

            color: #fff;
        }

        body {
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            min-height: 100vh;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                calc(12px + env(safe-area-inset-top))
                14px
                12px;

            background:
                rgba(9,11,18,.95);

            border-bottom:
                1px solid
                #202536;

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 12px;

            background: #171b29;
            color: white;

            font-size: 20px;
        }

        .title {
            font-size: 15px;
            font-weight: 900;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 7px;

            padding:
                8px
                11px;

            border-radius: 999px;

            background:
                rgba(255,45,85,.14);

            color: #ff5578;

            font-size: 11px;
            font-weight: 900;
        }

        .dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #ff365f;
        }

        .main {
            width: min(
                1100px,
                100%
            );

            margin: 0 auto;

            padding: 14px;
        }

        .video-card,
        .info-card,
        .audio-card,
        .chat-card {
            background: #10131c;

            border:
                1px solid
                #23283a;

            border-radius: 18px;
        }

        .video-card {
            overflow: hidden;
        }

        .video-wrap {
            position: relative;

            width: 100%;

            aspect-ratio:
                16 / 9;

            background: #000;

            overflow: hidden;
        }

        #remoteVideo {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: #000;
        }

        .overlay {
            position: absolute;
            inset: 0;

            pointer-events: none;
        }

        .status-pill,
        .viewer-pill {
            position: absolute;

            top: 11px;

            padding:
                7px
                10px;

            border-radius: 10px;

            background:
                rgba(0,0,0,.62);

            border:
                1px solid
                rgba(255,255,255,.1);

            font-size: 10px;
        }

        .status-pill {
            right: 11px;
        }

        .viewer-pill {
            left: 11px;
        }

        .video-message {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            text-align: center;

            background:
                rgba(0,0,0,.66);

            color: #e4e7ef;

            font-size: 13px;

            line-height: 2;
        }

        .video-message.hidden {
            display: none;
        }

        .info-card {
            margin-top: 13px;
            padding: 15px;
        }

        .stream-title {
            margin: 0;

            font-size: 19px;

            line-height: 1.6;
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;

            gap: 8px;

            margin-top: 10px;
        }

        .meta {
            padding:
                7px
                10px;

            border-radius: 10px;

            background: #181c29;

            color: #bcc2d2;

            font-size: 10px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;

            gap: 8px;

            margin-top: 12px;
        }

        .control-btn {
            min-height: 43px;

            padding:
                0
                13px;

            border: none;
            border-radius: 12px;

            background: #191e2d;
            color: white;

            font-size: 12px;
            font-weight: 800;
        }

        .control-btn.active {
            background: #5d45d9;
        }

        .audio-card {
            margin-top: 14px;

            padding:
                15px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 900;
        }

        .audio-row {
            margin-top: 15px;
        }

        .audio-head {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 8px;

            font-size: 11px;
        }

        .audio-state {
            color: #8d95a8;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #6a4cff;
        }

        .chat-card {
            margin-top: 14px;

            display: flex;
            flex-direction: column;

            height: 430px;

            overflow: hidden;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                13px
                15px;

            border-bottom:
                1px solid
                #23283a;
        }

        .chat-status {
            color: #8f97aa;
            font-size: 10px;
        }

        #messages {
            flex: 1;

            overflow-y: auto;

            padding: 12px;
        }

        .empty-chat {
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #70798d;

            font-size: 12px;

            text-align: center;
        }

        .message {
            margin-bottom: 9px;

            padding:
                9px
                11px;

            border-radius: 12px;

            background: #171b28;
        }

        .message-user {
            margin-bottom: 4px;

            color: #967fff;

            font-size: 11px;
            font-weight: 900;
        }

        .message-text {
            color: #e6e8ef;

            font-size: 12px;

            line-height: 1.8;

            word-break: break-word;
        }

        .chat-form {
            display: flex;

            gap: 8px;

            padding: 10px;

            border-top:
                1px solid
                #23283a;
        }

        .chat-input {
            flex: 1;

            min-width: 0;

            height: 43px;

            padding:
                0
                11px;

            border:
                1px solid
                #2a3043;

            border-radius: 12px;

            outline: none;

            background: #0d1018;

            color: white;
        }

        .send-btn {
            width: 48px;
            height: 43px;

            border: none;
            border-radius: 12px;

            background: #6a4cff;
            color: white;

            font-size: 17px;
        }

        .notice {
            display: none;

            margin-top: 12px;

            padding:
                11px
                13px;

            border-radius: 12px;

            background:
                rgba(255,45,85,.1);

            border:
                1px solid
                rgba(255,45,85,.2);

            color: #ff9eb0;

            font-size: 11px;

            line-height: 1.8;
        }

        .notice.show {
            display: block;
        }

        /*
            Audio elements are intentionally separate.
            System and microphone are independent.
        */

        .hidden-audio {
            display: none;
        }

        @media (max-width: 600px) {

            .main {
                padding: 8px;
            }

            .topbar {
                padding:
                    calc(
                        9px +
                        env(safe-area-inset-top)
                    )
                    10px
                    9px;
            }

            .video-card,
            .info-card,
            .audio-card,
            .chat-card {
                border-radius: 15px;
            }

            .control-btn {
                flex:
                    1 1
                    calc(50% - 8px);
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="topbar">

        <div class="top-left">

            <button
                id="backBtn"
                class="back-btn"
                type="button"
            >
                ←
            </button>

            <div class="title">
                تماشای پخش زنده
            </div>

        </div>

        <div class="live-badge">
            <span class="dot"></span>
            LIVE
        </div>

    </header>


    <main class="main">

        <section class="video-card">

            <div class="video-wrap">

                <video
                    id="remoteVideo"
                    autoplay
                    playsinline
                    controls
                ></video>

                <div class="overlay">

                    <div
                        id="status"
                        class="status-pill"
                    >
                        در حال اتصال...
                    </div>

                    <div class="viewer-pill">
                        👁
                        <span id="viewerCount">
                            0
                        </span>
                    </div>

                    <div
                        id="videoMessage"
                        class="video-message"
                    >
                        در حال دریافت پخش...
                    </div>

                </div>

            </div>

        </section>


        <div
            id="notice"
            class="notice"
        ></div>


        <section class="info-card">

            <h1
                id="streamTitle"
                class="stream-title"
            >
                پخش زنده LainoLive
            </h1>

            <div class="meta-row">

                <div
                    id="streamCategory"
                    class="meta"
                >
                    عمومی
                </div>

                <div
                    id="streamOwner"
                    class="meta"
                >
                    👤 کاربر
                </div>

                <div
                    id="streamId"
                    class="meta"
                >
                    Stream: -
                </div>

            </div>

        </section>


        <div class="controls">

            <button
                id="playBtn"
                class="control-btn active"
                type="button"
            >
                ▶️ پخش
            </button>

            <button
                id="muteBtn"
                class="control-btn"
                type="button"
            >
                🔊 صدا
            </button>

            <button
                id="fullscreenBtn"
                class="control-btn"
                type="button"
            >
                ⛶ تمام صفحه
            </button>

            <button
                id="reloadBtn"
                class="control-btn"
                type="button"
            >
                🔄 اتصال مجدد
            </button>

        </div>


        <section class="audio-card">

            <div class="section-title">
                🎚️ صدای جداگانه
            </div>


            <div class="audio-row">

                <div class="audio-head">

                    <span>
                        🔊 صدای سیستم / آهنگ
                    </span>

                    <span
                        id="systemAudioState"
                        class="audio-state"
                    >
                        0%
                    </span>

                </div>

                <input
                    id="systemAudioVolume"
                    type="range"
                    min="0"
                    max="100"
                    value="100"
                >

            </div>


            <div class="audio-row">

                <div class="audio-head">

                    <span>
                        🎤 میکروفن / صحبت
                    </span>

                    <span
                        id="microphoneAudioState"
                        class="audio-state"
                    >
                        0%
                    </span>

                </div>

                <input
                    id="microphoneAudioVolume"
                    type="range"
                    min="0"
                    max="100"
                    value="100"
                >

            </div>


            <!--
                دو عنصر صوتی کاملاً جدا
            -->

            <audio
                id="systemAudio"
                class="hidden-audio"
                autoplay
            ></audio>

            <audio
                id="microphoneAudio"
                class="hidden-audio"
                autoplay
            ></audio>

        </section>


        <section class="chat-card">

            <div class="chat-header">

                <div class="section-title">
                    💬 چت زنده
                </div>

                <div
                    id="chatStatus"
                    class="chat-status"
                >
                    قطع
                </div>

            </div>


            <div id="messages">

                <div
                    id="emptyChat"
                    class="empty-chat"
                >
                    هنوز پیامی ارسال نشده است.
                </div>

            </div>


            <form
                id="chatForm"
                class="chat-form"
            >

                <input
                    id="chatInput"
                    class="chat-input"
                    type="text"
                    maxlength="500"
                    autocomplete="off"
                    placeholder="پیام بنویسید..."
                >

                <button
                    class="send-btn"
                    type="submit"
                >
                    ➤
                </button>

            </form>

        </section>

    </main>

</div>


<script>
"use strict";


/* =====================================================
   CONFIG
===================================================== */

const SIGNALING_URL =
    "wss://lainolive-signaling.onrender.com";

const RTC_CONFIG = {
    iceServers: [
        {
            urls: [
                "stun:stun.l.google.com:19302",
                "stun:stun1.l.google.com:19302"
            ]
        }
    ]
};


const STREAM_KEYS = [
    "lainolive_view_stream",
    "LainoLive_view_stream",
    "view_stream",
    "current_stream"
];

const USERNAME_KEYS = [
    "lainolive_username",
    "username"
];


/* =====================================================
   STATE
===================================================== */

let streamData = {};

let streamId = "";

let username = "";

let socket = null;

let peer = null;

let viewerId = "";

let ending = false;

let queuedIce = [];


/*
   Audio classification

   Host sends tracks in this order:

   0 = video
   1 = system audio
   2 = microphone
*/

let systemAudioStream = null;
let microphoneAudioStream = null;


/* =====================================================
   ELEMENTS
===================================================== */

const remoteVideo =
    document.getElementById(
        "remoteVideo"
    );

const systemAudio =
    document.getElementById(
        "systemAudio"
    );

const microphoneAudio =
    document.getElementById(
        "microphoneAudio"
    );

const statusElement =
    document.getElementById(
        "status"
    );

const viewerCount =
    document.getElementById(
        "viewerCount"
    );

const videoMessage =
    document.getElementById(
        "videoMessage"
    );

const notice =
    document.getElementById(
        "notice"
    );

const streamTitle =
    document.getElementById(
        "streamTitle"
    );

const streamCategory =
    document.getElementById(
        "streamCategory"
    );

const streamOwner =
    document.getElementById(
        "streamOwner"
    );

const streamIdElement =
    document.getElementById(
        "streamId"
    );

const playBtn =
    document.getElementById(
        "playBtn"
    );

const muteBtn =
    document.getElementById(
        "muteBtn"
    );

const fullscreenBtn =
    document.getElementById(
        "fullscreenBtn"
    );

const reloadBtn =
    document.getElementById(
        "reloadBtn"
    );

const systemAudioVolume =
    document.getElementById(
        "systemAudioVolume"
    );

const microphoneAudioVolume =
    document.getElementById(
        "microphoneAudioVolume"
    );

const systemAudioState =
    document.getElementById(
        "systemAudioState"
    );

const microphoneAudioState =
    document.getElementById(
        "microphoneAudioState"
    );

const chatStatus =
    document.getElementById(
        "chatStatus"
    );

const messages =
    document.getElementById(
        "messages"
    );

const emptyChat =
    document.getElementById(
        "emptyChat"
    );

const chatForm =
    document.getElementById(
        "chatForm"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );


/* =====================================================
   UI
===================================================== */

function setStatus(text) {
    statusElement.textContent =
        text;
}

function showNotice(text) {
    notice.textContent =
        text;

    notice.classList.add(
        "show"
    );
}

function hideNotice() {
    notice.classList.remove(
        "show"
    );
}

function hideVideoMessage() {
    videoMessage.classList.add(
        "hidden"
    );
}

function showVideoMessage(text) {
    videoMessage.textContent =
        text;

    videoMessage.classList.remove(
        "hidden"
    );
}


/* =====================================================
   STORAGE
===================================================== */

function readStorage(keys) {

    for (const key of keys) {

        try {

            const value =
                sessionStorage.getItem(
                    key
                );

            if (value) {
                return value;
            }

        } catch {}

        try {

            const value =
                localStorage.getItem(
                    key
                );

            if (value) {
                return value;
            }

        } catch {}
    }

    return null;
}


function readStreamData() {

    const raw =
        readStorage(
            STREAM_KEYS
        );

    if (!raw) {
        return {};
    }

    try {
        return JSON.parse(raw);
    } catch {
        return {};
    }
}


function getQueryId() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("id") ||
        params.get("stream_id") ||
        params.get("room_id") ||
        ""
    );
}


function getStreamId(data) {

    return String(
        data.stream_id ??
        data.streamId ??
        data.id ??
        data.room_id ??
        getQueryId() ??
        ""
    );
}


function getUsername(data) {

    return String(
        data.viewer_username ??
        readStorage(
            USERNAME_KEYS
        ) ??
        "کاربر"
    );
}


/* =====================================================
   PEER
===================================================== */

function closePeer() {

    if (!peer) {
        return;
    }

    try {
        peer.close();
    } catch {}

    peer = null;

    queuedIce = [];

    systemAudioStream = null;
    microphoneAudioStream = null;

    systemAudio.srcObject =
        null;

    microphoneAudio.srcObject =
        null;

    remoteVideo.srcObject =
        null;
}


function createPeer() {

    closePeer();


    peer =
        new RTCPeerConnection(
            RTC_CONFIG
        );


    peer.ontrack =
        event => {

            const track =
                event.track;


            const transceiver =
                event.transceiver;


            const transceivers =
                peer.getTransceivers();


            const index =
                transceivers.indexOf(
                    transceiver
                );


            /*
               Host order:

               0 = video
               1 = system audio
               2 = microphone
            */


            if (
                track.kind ===
                "video"
            ) {

                const stream =
                    new MediaStream();

                stream.addTrack(
                    track
                );


                /*
                   اگر مرورگر همراه ویدئو
                   ترک صوتی را در همان
                   stream فرستاد، آن را
                   فقط برای تصویر استفاده
                   می‌کنیم و صدا را جدا
                   نگه می‌داریم.
                */

                remoteVideo.srcObject =
                    stream;


                hideVideoMessage();

                playRemoteVideo();

                return;
            }


            if (
                track.kind ===
                "audio"
            ) {

                const audioStream =
                    new MediaStream();

                audioStream.addTrack(
                    track
                );


                if (index === 1) {

                    systemAudioStream =
                        audioStream;

                    systemAudio.srcObject =
                        audioStream;

                    systemAudio.play()
                        .catch(
                            () => {}
                        );

                    systemAudioState.textContent =
                        "100%";

                    return;
                }


                if (index === 2) {

                    microphoneAudioStream =
                        audioStream;

                    microphoneAudio.srcObject =
                        audioStream;

                    microphoneAudio.play()
                        .catch(
                            () => {}
                        );

                    microphoneAudioState.textContent =
                        "100%";

                    return;
                }


                /*
                   fallback:
                   اگر مرورگر index را
                   متفاوت برگرداند، دومین
                   ترک صوتی دریافت‌شده را
                   به میکروفن می‌دهیم.
                */

                if (
                    !systemAudioStream
                ) {

                    systemAudioStream =
                        audioStream;

                    systemAudio.srcObject =
                        audioStream;

                    systemAudio.play()
                        .catch(
                            () => {}
                        );

                } else {

                    microphoneAudioStream =
                        audioStream;

                    microphoneAudio.srcObject =
                        audioStream;

                    microphoneAudio.play()
                        .catch(
                            () => {}
                        );
                }
            }
        };


    peer.onicecandidate =
        event => {

            if (!event.candidate) {
                return;
            }


            sendSignal(
                {
                    type:
                        "ice-candidate",

                    candidate:
                        event.candidate
                }
            );
        };


    peer.onconnectionstatechange =
        () => {

            if (!peer) {
                return;
            }


            const state =
                peer.connectionState;


            if (
                state ===
                "connected"
            ) {

                setStatus(
                    "پخش زنده متصل است"
                );

                hideVideoMessage();

                return;
            }


            if (
                state ===
                "connecting"
            ) {

                setStatus(
                    "در حال اتصال..."
                );

                return;
            }


            if (
                state ===
                "disconnected"
            ) {

                setStatus(
                    "اتصال موقتاً قطع شد"
                );

                return;
            }


            if (
                state ===
                "failed"
            ) {

                setStatus(
                    "اتصال WebRTC ناموفق بود"
                );

                showVideoMessage(
                    "اتصال پخش برقرار نشد. دوباره تلاش کنید."
                );
            }
        };


    peer.oniceconnectionstatechange =
        () => {

            if (!peer) {
                return;
            }


            if (
                peer.iceConnectionState ===
                "failed"
            ) {

                setStatus(
                    "اتصال شبکه ناموفق بود"
                );
            }
        };


    return peer;
}


/* =====================================================
   SIGNAL
===================================================== */

function sendSignal(message) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {
        return false;
    }


    try {

        socket.send(
            JSON.stringify(
                message
            )
        );

        return true;

    } catch (error) {

        console.error(
            error
        );

        return false;
    }
}


async function addIceCandidate(
    candidate
) {

    if (!candidate) {
        return;
    }


    if (
        !peer ||
        !peer.remoteDescription
    ) {

        queuedIce.push(
            candidate
        );

        return;
    }


    try {

        await peer.addIceCandidate(
            new RTCIceCandidate(
                candidate
            )
        );

    } catch (error) {

        console.warn(
            "ICE error:",
            error
        );
    }
}


async function flushIce() {

    if (
        !peer ||
        !peer.remoteDescription
    ) {
        return;
    }


    const candidates =
        queuedIce;

    queuedIce = [];


    for (
        const candidate
        of candidates
    ) {

        try {

            await peer.addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

        } catch (error) {

            console.warn(
                error
            );
        }
    }
}


/* =====================================================
   OFFER
===================================================== */

async function handleOffer(
    offer
) {

    if (!offer) {
        return;
    }


    try {

        const connection =
            createPeer();


        await connection.setRemoteDescription(
            new RTCSessionDescription(
                offer
            )
        );


        await flushIce();


        const answer =
            await connection.createAnswer();


        await connection.setLocalDescription(
            answer
        );


        sendSignal(
            {
                type:
                    "answer",

                answer:
                    connection.localDescription
            }
        );


        setStatus(
            "در انتظار پخش..."
        );

    } catch (error) {

        console.error(
            "offer error:",
            error
        );


        setStatus(
            "خطا در دریافت پخش"
        );


        showVideoMessage(
            "پخش ویدئو برقرار نشد."
        );
    }
}


/* =====================================================
   SIGNAL CONNECTION
===================================================== */

function connectSignaling() {

    if (!streamId) {

        setStatus(
            "شناسه لایو پیدا نشد"
        );

        showVideoMessage(
            "شناسه لایو پیدا نشد."
        );

        return;
    }


    setStatus(
        "در حال اتصال به سرور..."
    );

    showVideoMessage(
        "در حال اتصال به پخش زنده..."
    );


    try {

        socket =
            new WebSocket(
                SIGNALING_URL
            );

    } catch (error) {

        console.error(
            error
        );

        showNotice(
            "اتصال به سرور انجام نشد."
        );

        return;
    }


    socket.onopen =
        () => {

            chatStatus.textContent =
                "متصل";


            sendSignal(
                {
                    type:
                        "join",

                    role:
                        "viewer",

                    room_id:
                        streamId
                }
            );


            /*
               signaling.py فعلی این
               پیام را پشتیبانی می‌کند.
            */

            sendSignal(
                {
                    type:
                        "ready"
                }
            );
        };


    socket.onmessage =
        async event => {

            let message;


            try {

                message =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;
            }


            switch (
                message.type
            ) {

                case "joined":

                    viewerId =
                        message.viewer_id ||
                        "";


                    if (
                        typeof message.viewer_count ===
                        "number"
                    ) {

                        viewerCount.textContent =
                            String(
                                message.viewer_count
                            );
                    }


                    setStatus(
                        "در انتظار تصویر..."
                    );

                    break;


                case "room-info":

                    if (
                        typeof message.viewer_count ===
                        "number"
                    ) {

                        viewerCount.textContent =
                            String(
                                message.viewer_count
                            );
                    }

                    break;


                case "offer":

                    await handleOffer(
                        message.offer
                    );

                    break;


                case "ice-candidate":

                    await addIceCandidate(
                        message.candidate
                    );

                    break;


                case "chat-message":

                    addChatMessage(
                        message.username ||
                            "کاربر",

                        message.message ||
                            ""
                    );

                    break;


                case "host-left":

                    setStatus(
                        "لایو پایان یافت"
                    );

                    showVideoMessage(
                        "میزبان لایو را پایان داد."
                    );

                    closePeer();

                    break;


                case "error":

                    showNotice(
                        message.message ||
                            "خطای سرور"
                    );

                    break;
            }
        };


    socket.onerror =
        error => {

            console.error(
                error
            );

            chatStatus.textContent =
                "خطا";

            setStatus(
                "خطا در اتصال"
            );
        };


    socket.onclose =
        () => {

            if (!ending) {

                chatStatus.textContent =
                    "قطع";

                setStatus(
                    "اتصال قطع شد"
                );
            }
        };
}


/* =====================================================
   VIDEO CONTROLS
===================================================== */

async function playRemoteVideo() {

    try {

        await remoteVideo.play();

        playBtn.classList.add(
            "active"
        );

    } catch {

        showVideoMessage(
            "برای شروع پخش روی «پخش» بزنید."
        );
    }
}


function toggleMute() {

    /*
       فقط صدای سیستم + میکروفن
       را کنترل نمی‌کنیم؛ این دکمه
       هر دو را با هم mute/unmute می‌کند.
    */

    const muted =
        systemAudio.muted &&
        microphoneAudio.muted;


    systemAudio.muted =
        !muted;

    microphoneAudio.muted =
        !muted;


    muteBtn.textContent =
        muted
            ? "🔊 صدا"
            : "🔇 بی‌صدا";
}


/* =====================================================
   CHAT
===================================================== */

function addChatMessage(
    user,
    text
) {

    if (emptyChat) {
        emptyChat.style.display =
            "none";
    }


    const box =
        document.createElement(
            "div"
        );

    box.className =
        "message";


    const userElement =
        document.createElement(
            "div"
        );

    userElement.className =
        "message-user";

    userElement.textContent =
        user || "کاربر";


    const textElement =
        document.createElement(
            "div"
        );

    textElement.className =
        "message-text";

    textElement.textContent =
        text || "";


    box.appendChild(
        userElement
    );

    box.appendChild(
        textElement
    );


    messages.appendChild(
        box
    );


    messages.scrollTop =
        messages.scrollHeight;
}


async function sendChat(text) {

    if (!text) {
        return;
    }


    if (
        sendSignal(
            {
                type:
                    "chat-message",

                username:
                    username,

                message:
                    text
            }
        )
    ) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/chat/send",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            {
                                stream_id:
                                    streamId,

                                username:
                                    username,

                                message:
                                    text
                            }
                        )
                }
            );


        if (!response.ok) {
            throw new Error(
                "chat failed"
            );
        }

    } catch (error) {

        console.error(
            error
        );

        showNotice(
            "ارسال پیام انجام نشد."
        );
    }
}


/* =====================================================
   CHAT HISTORY
===================================================== */

async function loadChat() {

    if (!streamId) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/chat/messages?stream_id=" +
                encodeURIComponent(
                    streamId
                ),
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        const list =
            Array.isArray(data)
                ? data
                : (
                    Array.isArray(
                        data.messages
                    )
                        ? data.messages
                        : []
                );


        for (
            const item
            of list
        ) {

            addChatMessage(
                item.username ||
                    "کاربر",

                item.message ||
                    ""
            );
        }

    } catch {}
}


/* =====================================================
   AUDIO SLIDERS
===================================================== */

systemAudioVolume.addEventListener(
    "input",
    () => {

        const value =
            Number(
                systemAudioVolume.value
            ) / 100;


        systemAudio.volume =
            value;


        systemAudioState.textContent =
            Math.round(
                value * 100
            ) + "%";
    }
);


microphoneAudioVolume.addEventListener(
    "input",
    () => {

        const value =
            Number(
                microphoneAudioVolume.value
            ) / 100;


        microphoneAudio.volume =
            value;


        microphoneAudioState.textContent =
            Math.round(
                value * 100
            ) + "%";
    }
);


/* =====================================================
   EVENTS
===================================================== */

document
    .getElementById(
        "backBtn"
    )
    .addEventListener(
        "click",
        () => {

            ending = true;

            try {
                socket?.close();
            } catch {}

            window.location.href =
                "/index.html";
        }
    );


playBtn.addEventListener(
    "click",
    playRemoteVideo
);


remoteVideo.addEventListener(
    "click",
    playRemoteVideo
);


muteBtn.addEventListener(
    "click",
    toggleMute
);


fullscreenBtn.addEventListener(
    "click",
    async () => {

        try {

            if (
                document.fullscreenElement
            ) {

                await document.exitFullscreen();

            } else {

                await remoteVideo.requestFullscreen();
            }

        } catch (error) {

            console.warn(
                error
            );
        }
    }
);


reloadBtn.addEventListener(
    "click",
    () => {

        closePeer();

        try {
            socket?.close();
        } catch {}

        setTimeout(
            connectSignaling,
            250
        );
    }
);


chatForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const text =
            chatInput.value.trim();


        if (!text) {
            return;
        }


        chatInput.value =
            "";


        await sendChat(
            text
        );
    }
);


/* =====================================================
   INIT
===================================================== */

async function initialize() {

    streamData =
        readStreamData();


    streamId =
        getStreamId(
            streamData
        );


    username =
        getUsername(
            streamData
        );


    streamTitle.textContent =
        streamData.title ||
        "پخش زنده LainoLive";


    streamCategory.textContent =
        streamData.category ||
        "عمومی";


    streamOwner.textContent =
        "👤 " +
        (
            streamData.username ||
            streamData.owner ||
            streamData.creator ||
            "کاربر"
        );


    streamIdElement.textContent =
        "Stream: " +
        (
            streamId ||
            "-"
        );


    if (!streamId) {

        setStatus(
            "شناسه لایو پیدا نشد"
        );

        showVideoMessage(
            "لینک لایو ناقص است."
        );

        showNotice(
            "از صفحه اصلی دوباره وارد لایو شوید."
        );

        return;
    }


    await loadChat();

    connectSignaling();
}


window.addEventListener(
    "beforeunload",
    () => {

        ending = true;

        closePeer();

        try {
            socket?.close();
        } catch {}
    }
);


initialize();
</script>
