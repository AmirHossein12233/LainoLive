<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08080d">

    <title>تماشای لایو - LainoLive</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;

            background:
                radial-gradient(
                    circle at top,
                    #19192a 0%,
                    #08080d 52%,
                    #030304 100%
                );

            color: white;

            font-family:
                Tahoma,
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            min-height: 100vh;
            padding-bottom:
                calc(
                    90px +
                    env(safe-area-inset-bottom)
                );
        }

        /* HEADER */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                calc(
                    12px +
                    env(safe-area-inset-top)
                )
                14px
                12px;

            background:
                rgba(7,7,12,.94);

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);

            border-bottom:
                1px solid
                rgba(255,255,255,.07);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;

            min-width: 0;
        }

        .back-btn,
        .share-btn {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 13px;

            background:
                rgba(255,255,255,.07);

            color: white;

            font-size: 18px;
        }

        .header-text {
            min-width: 0;
        }

        .header-title {
            font-size: 16px;
            font-weight: 900;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-user {
            margin-top: 3px;

            color: #9999a7;

            font-size: 10px;
        }

        /* VIDEO */

        .video-box {
            position: relative;

            width: 100%;

            background: black;

            aspect-ratio: 16 / 9;

            overflow: hidden;
        }

        video {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: black;
        }

        .video-placeholder {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 12px;

            background:
                radial-gradient(
                    circle at center,
                    #1b1b2a,
                    #050509
                );

            text-align: center;

            padding: 25px;
        }

        .video-icon {
            font-size: 48px;
        }

        .video-status {
            font-size: 14px;
            font-weight: 900;
        }

        .video-substatus {
            max-width: 330px;

            color: #a0a0ad;

            font-size: 11px;
            line-height: 1.8;
        }

        .status-dot {
            display: inline-block;

            width: 9px;
            height: 9px;

            margin-left: 5px;

            border-radius: 50%;

            background: #f3a500;
        }

        .status-dot.online {
            background: #25d366;
        }

        .status-dot.error {
            background: #ff345b;
        }

        /* INFO */

        .info {
            padding: 15px 16px 8px;
        }

        .title {
            font-size: 19px;
            font-weight: 900;

            line-height: 1.6;
        }

        .username {
            margin-top: 5px;

            color: #aaaab7;

            font-size: 12px;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;

            gap: 8px;

            margin-top: 12px;
        }

        .pill {
            padding:
                6px
                10px;

            border-radius: 999px;

            background:
                rgba(255,255,255,.06);

            color: #cfcfd8;

            font-size: 10px;
        }

        .pill.live {
            background:
                rgba(255,29,77,.15);

            color: #ff809b;
        }

        /* CHAT */

        .chat-section {
            margin: 10px 16px;
            padding: 15px;

            border-radius: 20px;

            background:
                rgba(255,255,255,.035);

            border:
                1px solid
                rgba(255,255,255,.07);
        }

        .chat-title {
            font-size: 14px;
            font-weight: 900;
        }

        .messages {
            height: 190px;

            margin-top: 12px;

            overflow-y: auto;

            padding: 3px;
        }

        .message {
            margin-bottom: 8px;

            padding: 9px 10px;

            border-radius: 13px;

            background:
                rgba(255,255,255,.045);
        }

        .message-user {
            color: #b98cff;

            font-size: 10px;
            font-weight: 900;
        }

        .message-text {
            margin-top: 4px;

            color: #efeff5;

            font-size: 12px;

            line-height: 1.7;

            overflow-wrap: anywhere;
        }

        .chat-input-row {
            display: flex;

            gap: 8px;

            margin-top: 10px;
        }

        .chat-input {
            flex: 1;

            min-width: 0;

            border: none;

            border-radius: 13px;

            padding:
                12px
                13px;

            outline: none;

            background:
                rgba(255,255,255,.07);

            color: white;

            font-size: 12px;
        }

        .chat-input::placeholder {
            color: #777785;
        }

        .chat-send {
            border: none;

            border-radius: 13px;

            padding:
                0
                15px;

            background:
                linear-gradient(
                    135deg,
                    #ff2757,
                    #8b35ff
                );

            color: white;

            font-weight: 900;
        }

        /* BOTTOM */

        .bottom-bar {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 300;

            display: flex;
            justify-content: center;

            padding:
                10px
                10px
                calc(
                    10px +
                    env(safe-area-inset-bottom)
                );

            background:
                rgba(7,7,12,.94);

            border-top:
                1px solid
                rgba(255,255,255,.07);

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);
        }

        .leave-button {
            width: min(
                650px,
                100%
            );

            min-height: 50px;

            border: none;

            border-radius: 15px;

            background:
                rgba(255,255,255,.07);

            color: white;

            font-size: 13px;
            font-weight: 900;
        }

        /* SHARE */

        .share-modal {
            position: fixed;

            inset: 0;

            z-index: 500;

            display: none;

            align-items: flex-end;

            justify-content: center;

            background:
                rgba(0,0,0,.66);
        }

        .share-modal.show {
            display: flex;
        }

        .share-card {
            width: 100%;
            max-width: 560px;

            padding:
                20px
                18px
                calc(
                    20px +
                    env(safe-area-inset-bottom)
                );

            border-radius:
                24px
                24px
                0
                0;

            background:
                #111119;

            border-top:
                1px solid
                rgba(255,255,255,.08);
        }

        .share-title {
            font-size: 17px;
            font-weight: 900;
        }

        .share-link {
            margin-top: 12px;

            width: 100%;

            border: none;
            outline: none;

            padding: 12px;

            border-radius: 13px;

            background:
                rgba(255,255,255,.06);

            color: #bfbfc9;

            font-size: 11px;

            direction: ltr;
            text-align: left;
        }

        .share-actions {
            display: grid;

            grid-template-columns:
                repeat(2,1fr);

            gap: 9px;

            margin-top: 12px;
        }

        .share-action {
            min-height: 45px;

            border: none;

            border-radius: 13px;

            color: white;

            background:
                rgba(255,255,255,.07);

            font-weight: 900;
        }

        .share-close {
            width: 100%;

            margin-top: 9px;

            min-height: 43px;

            border: none;

            border-radius: 13px;

            background:
                rgba(255,255,255,.04);

            color: #9999a5;
        }

        @media (min-width: 700px) {

            .page {
                max-width: 900px;
                margin: 0 auto;
            }

            .bottom-bar {
                left: 50%;
                right: auto;

                width: min(
                    700px,
                    calc(100% - 30px)
                );

                transform:
                    translateX(-50%);

                bottom: 14px;

                border:
                    1px solid
                    rgba(255,255,255,.07);

                border-radius: 20px;

                padding: 8px;
            }

            .leave-button {
                background:
                    linear-gradient(
                        135deg,
                        #ff2757,
                        #8b35ff
                    );
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header class="header">

        <div class="header-left">

            <button
                id="backButton"
                class="back-btn"
                type="button"
            >
                ←
            </button>

            <div class="header-text">

                <div
                    id="headerTitle"
                    class="header-title"
                >
                    در حال دریافت لایو...
                </div>

                <div
                    id="headerUser"
                    class="header-user"
                >
                    LainoLive
                </div>

            </div>

        </div>

        <button
            id="shareButton"
            class="share-btn"
            type="button"
        >
            ↗
        </button>

    </header>


    <section class="video-box">

        <video
            id="remoteVideo"
            autoplay
            playsinline
            controls
        ></video>

        <div
            id="videoPlaceholder"
            class="video-placeholder"
        >

            <div class="video-icon">
                📺
            </div>

            <div
                id="videoStatus"
                class="video-status"
            >
                <span
                    id="statusDot"
                    class="status-dot"
                ></span>
                در حال اتصال...
            </div>

            <div
                id="videoSubstatus"
                class="video-substatus"
            >
                در حال برقراری ارتباط با پخش‌کننده لایو
            </div>

        </div>

    </section>


    <section class="info">

        <div
            id="streamTitle"
            class="title"
        >
            لایو
        </div>

        <div
            id="streamUsername"
            class="username"
        >
            👤 کاربر
        </div>

        <div class="meta">

            <div class="pill live">
                ● LIVE
            </div>

            <div
                id="viewerPill"
                class="pill"
            >
                👁 0 بیننده
            </div>

            <div
                id="categoryPill"
                class="pill"
            >
                🎮 عمومی
            </div>

        </div>

    </section>


    <section class="chat-section">

        <div class="chat-title">
            💬 چت لایو
        </div>

        <div
            id="messages"
            class="messages"
        ></div>

        <div class="chat-input-row">

            <input
                id="chatInput"
                class="chat-input"
                type="text"
                maxlength="250"
                placeholder="پیام خود را بنویسید..."
                autocomplete="off"
            >

            <button
                id="chatSend"
                class="chat-send"
                type="button"
            >
                ارسال
            </button>

        </div>

    </section>

</div>


<div class="bottom-bar">

    <button
        id="leaveButton"
        class="leave-button"
        type="button"
    >
        بازگشت
    </button>

</div>


<div
    id="shareModal"
    class="share-modal"
>

    <div class="share-card">

        <div class="share-title">
            اشتراک‌گذاری لایو
        </div>

        <input
            id="shareLink"
            class="share-link"
            readonly
        >

        <div class="share-actions">

            <button
                id="nativeShareButton"
                class="share-action"
                type="button"
            >
                📤 اشتراک‌گذاری
            </button>

            <button
                id="copyShareButton"
                class="share-action"
                type="button"
            >
                📋 کپی لینک
            </button>

        </div>

        <button
            id="closeShareButton"
            class="share-close"
            type="button"
        >
            بستن
        </button>

    </div>

</div>


<script>
    /*
     * ============================
     * SETTINGS
     * ============================
     */

    const SIGNALING_URL =
        "wss://lainolive-signaling.onrender.com";


    const LOGIN_KEY =
        "lainolive_logged_in";

    const USERNAME_KEY =
        "lainolive_username";

    const VIEW_STREAM_KEY =
        "lainolive_view_stream";


    /*
     * ============================
     * ELEMENTS
     * ============================
     */

    const remoteVideo =
        document.getElementById(
            "remoteVideo"
        );

    const videoPlaceholder =
        document.getElementById(
            "videoPlaceholder"
        );

    const videoStatus =
        document.getElementById(
            "videoStatus"
        );

    const videoSubstatus =
        document.getElementById(
            "videoSubstatus"
        );

    const statusDot =
        document.getElementById(
            "statusDot"
        );

    const headerTitle =
        document.getElementById(
            "headerTitle"
        );

    const headerUser =
        document.getElementById(
            "headerUser"
        );

    const streamTitle =
        document.getElementById(
            "streamTitle"
        );

    const streamUsername =
        document.getElementById(
            "streamUsername"
        );

    const viewerPill =
        document.getElementById(
            "viewerPill"
        );

    const categoryPill =
        document.getElementById(
            "categoryPill"
        );

    const messages =
        document.getElementById(
            "messages"
        );

    const chatInput =
        document.getElementById(
            "chatInput"
        );

    const chatSend =
        document.getElementById(
            "chatSend"
        );


    /*
     * ============================
     * GLOBAL STATE
     * ============================
     */

    let stream = null;

    let streamId = null;

    let currentUsername =
        localStorage.getItem(
            USERNAME_KEY
        ) || "";

    let socket = null;

    let peerConnection = null;

    let remoteDescriptionReady =
        false;

    let pendingIceCandidates = [];

    let joinedViewer = false;

    let stopped = false;


    /*
     * ============================
     * LOGIN
     * ============================
     */

    if (
        localStorage.getItem(
            LOGIN_KEY
        ) !== "true"
    ) {
        window.location.href =
            "/login.html";
    }


    /*
     * ============================
     * HELPERS
     * ============================
     */

    function escapeHtml(value) {

        return String(
            value ?? ""
        )
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );
    }


    function getId(item) {

        return (
            item?.id
            ??
            item?.stream_id
        );
    }


    function getTitle(item) {

        return (
            item?.title
            ||
            "لایو بدون عنوان"
        );
    }


    function getUsername(item) {

        return (
            item?.username
            ||
            item?.user
            ||
            "کاربر"
        );
    }


    function getCategory(item) {

        return (
            item?.category
            ||
            "عمومی"
        );
    }


    function getViewers(item) {

        return Number(
            item?.viewer_count
            ??
            item?.viewers
            ??
            0
        );
    }


    function setStatus(
        title,
        subtitle,
        type = "loading"
    ) {

        videoStatus.innerHTML =
            `
                <span
                    class="status-dot ${
                        type === "online"
                            ? "online"
                            : type === "error"
                                ? "error"
                                : ""
                    }"
                ></span>
                ${escapeHtml(title)}
            `;

        videoSubstatus.textContent =
            subtitle;

        if (
            type === "online"
        ) {

            videoPlaceholder.style.display =
                "none";

        } else {

            videoPlaceholder.style.display =
                "flex";
        }
    }


    function goBack() {

        try {

            history.back();

        } catch {

            window.location.href =
                "/index.html";
        }
    }


    /*
     * ============================
     * LOAD STREAM
     * ============================
     */

    async function loadStream() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const urlId =
            params.get("id");


        /*
         * First try URL ID.
         */

        if (urlId) {

            streamId =
                urlId;

            try {

                const response =
                    await fetch(
                        "/api/streams",
                        {
                            cache:
                                "no-store"
                        }
                    );

                if (
                    response.ok
                ) {

                    const data =
                        await response.json();

                    const streams =
                        Array.isArray(
                            data.streams
                        )
                            ? data.streams
                            : Array.isArray(data)
                                ? data
                                : [];

                    const found =
                        streams.find(
                            item =>
                                String(
                                    getId(item)
                                )
                                ===
                                String(
                                    urlId
                                )
                        );

                    if (found) {

                        stream =
                            found;
                    }
                }

            } catch (error) {

                console.error(
                    "stream fetch error",
                    error
                );
            }
        }


        /*
         * Fallback to sessionStorage.
         */

        if (!stream) {

            try {

                const saved =
                    sessionStorage.getItem(
                        VIEW_STREAM_KEY
                    );

                if (saved) {

                    const parsed =
                        JSON.parse(
                            saved
                        );

                    if (
                        !urlId
                        ||
                        String(
                            getId(parsed)
                        )
                        ===
                        String(
                            urlId
                        )
                    ) {

                        stream =
                            parsed;

                        streamId =
                            getId(parsed);
                    }
                }

            } catch (error) {

                console.error(
                    "session stream error",
                    error
                );
            }
        }


        if (
            !streamId
            &&
            stream
        ) {

            streamId =
                getId(stream);
        }


        if (
            !stream
            ||
            streamId === null
        ) {

            setStatus(
                "لایو پیدا نشد",
                "این لایو دیگر در حال پخش نیست.",
                "error"
            );

            return false;
        }


        renderStream();

        return true;
    }


    /*
     * ============================
     * RENDER STREAM
     * ============================
     */

    function renderStream() {

        const title =
            getTitle(stream);

        const username =
            getUsername(stream);

        const category =
            getCategory(stream);

        const viewers =
            getViewers(stream);


        document.title =
            title +
            " - LainoLive";


        headerTitle.textContent =
            title;

        headerUser.textContent =
            "👤 " +
            username;


        streamTitle.textContent =
            title;

        streamUsername.textContent =
            "👤 " +
            username;


        viewerPill.textContent =
            "👁 " +
            viewers +
            " بیننده";


        categoryPill.textContent =
            "🎮 " +
            category;
    }


    /*
     * ============================
     * WEBRTC
     * ============================
     */

    function createPeerConnection() {

        if (
            peerConnection
        ) {

            return;
        }


        peerConnection =
            new RTCPeerConnection(
                {
                    iceServers: [
                        {
                            urls:
                                "stun:stun.l.google.com:19302"
                        },
                        {
                            urls:
                                "stun:stun1.l.google.com:19302"
                        }
                    ]
                }
            );


        peerConnection.onicecandidate =
            event => {

                if (
                    !event.candidate
                ) {
                    return;
                }

                sendSignal({
                    type:
                        "ice-candidate",

                    room_id:
                        String(
                            streamId
                        ),

                    candidate:
                        event.candidate
                });
            };


        peerConnection.ontrack =
            event => {

                console.log(
                    "REMOTE TRACK",
                    event
                );


                if (
                    event.streams
                    &&
                    event.streams[0]
                ) {

                    remoteVideo.srcObject =
                        event.streams[0];

                } else {

                    if (
                        !remoteVideo.srcObject
                    ) {

                        remoteVideo.srcObject =
                            new MediaStream();
                    }

                    remoteVideo.srcObject.addTrack(
                        event.track
                    );
                }


                remoteVideo.play()
                    .catch(
                        error => {

                            console.warn(
                                "video autoplay blocked",
                                error
                            );

                        }
                    );


                setStatus(
                    "لایو وصل شد",
                    "در حال پخش تصویر و صدا...",
                    "online"
                );
            };


        peerConnection.onconnectionstatechange =
            () => {

                const state =
                    peerConnection
                        .connectionState;

                console.log(
                    "connectionState:",
                    state
                );


                if (
                    state ===
                    "connected"
                ) {

                    setStatus(
                        "لایو وصل شد",
                        "پخش زنده فعال است.",
                        "online"
                    );
                }


                if (
                    state ===
                    "connecting"
                ) {

                    setStatus(
                        "در حال اتصال...",
                        "در حال برقراری اتصال با پخش‌کننده."
                    );
                }


                if (
                    state ===
                    "disconnected"
                ) {

                    setStatus(
                        "اتصال قطع شد",
                        "در حال تلاش برای اتصال مجدد...",
                        "error"
                    );
                }


                if (
                    state ===
                    "failed"
                ) {

                    setStatus(
                        "اتصال برقرار نشد",
                        "پخش‌کننده یا سرور ارتباطی در دسترس نیست.",
                        "error"
                    );
                }


                if (
                    state ===
                    "closed"
                ) {

                    setStatus(
                        "اتصال بسته شد",
                        "اتصال WebRTC بسته شده است.",
                        "error"
                    );
                }
            };


        peerConnection.oniceconnectionstatechange =
            () => {

                console.log(
                    "iceConnectionState:",
                    peerConnection
                        .iceConnectionState
                );
            };


        peerConnection.onsignalingstatechange =
            () => {

                console.log(
                    "signalingState:",
                    peerConnection
                        .signalingState
                );
            };
    }


    async function addIceCandidate(
        candidate
    ) {

        if (
            !candidate
            ||
            !peerConnection
        ) {
            return;
        }


        if (
            !remoteDescriptionReady
        ) {

            pendingIceCandidates.push(
                candidate
            );

            return;
        }


        try {

            await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

        } catch (error) {

            console.error(
                "add ICE error",
                error
            );
        }
    }


    async function flushIce() {

        if (
            !peerConnection
        ) {
            return;
        }


        while (
            pendingIceCandidates.length
        ) {

            const candidate =
                pendingIceCandidates.shift();

            try {

                await peerConnection
                    .addIceCandidate(
                        new RTCIceCandidate(
                            candidate
                        )
                    );

            } catch (error) {

                console.error(
                    "flush ICE error",
                    error
                );
            }
        }
    }


    /*
     * ============================
     * SIGNALING
     * ============================
     */

    function sendSignal(
        payload
    ) {

        if (
            !socket
            ||
            socket.readyState !==
                WebSocket.OPEN
        ) {

            console.warn(
                "socket not open",
                payload
            );

            return false;
        }


        try {

            socket.send(
                JSON.stringify(
                    payload
                )
            );

            return true;

        } catch (error) {

            console.error(
                "send signal error",
                error
            );

            return false;
        }
    }


    function connectSignaling() {

        setStatus(
            "در حال اتصال...",
            "در حال اتصال به سرور ارتباطی."
        );


        try {

            socket =
                new WebSocket(
                    SIGNALING_URL
                );

        } catch (error) {

            console.error(
                "websocket create error",
                error
            );

            setStatus(
                "خطای اتصال",
                "اتصال به سرور ارتباطی ایجاد نشد.",
                "error"
            );

            return;
        }


        socket.onopen =
            () => {

                console.log(
                    "SIGNALING CONNECTED"
                );


                setStatus(
                    "در حال انتظار برای پخش...",
                    "در حال ورود به اتاق لایو."
                );


                createPeerConnection();


                joinedViewer =
                    sendSignal({
                        type:
                            "join",

                        room_id:
                            String(
                                streamId
                            ),

                        role:
                            "viewer"
                    });


                if (
                    !joinedViewer
                ) {

                    setStatus(
                        "خطای اتصال",
                        "پیام ورود به اتاق ارسال نشد.",
                        "error"
                    );
                }
            };


        socket.onmessage =
            async event => {

                try {

                    const message =
                        JSON.parse(
                            event.data
                        );


                    console.log(
                        "SIGNAL:",
                        message
                    );


                    await handleSignal(
                        message
                    );

                } catch (error) {

                    console.error(
                        "signal message error",
                        error
                    );
                }
            };


        socket.onerror =
            error => {

                console.error(
                    "SIGNALING ERROR",
                    error
                );


                setStatus(
                    "خطای سرور ارتباطی",
                    "اتصال WebSocket به سرور لایو برقرار نشد.",
                    "error"
                );
            };


        socket.onclose =
            event => {

                console.warn(
                    "SIGNALING CLOSED",
                    event.code,
                    event.reason
                );


                if (
                    stopped
                ) {
                    return;
                }


                setStatus(
                    "اتصال سرور قطع شد",
                    "ارتباط با سرور سیگنالینگ قطع شده است.",
                    "error"
                );
            };
    }


    async function handleSignal(
        message
    ) {

        const type =
            message?.type;


        if (
            type ===
            "host-present"
        ) {

            setStatus(
                "پخش‌کننده پیدا شد",
                "در حال برقراری اتصال..."
            );

            return;
        }


        if (
            type ===
            "viewer-joined"
        ) {

            return;
        }


        if (
            type ===
            "offer"
        ) {

            createPeerConnection();


            try {

                await peerConnection
                    .setRemoteDescription(
                        new RTCSessionDescription(
                            message.offer
                            ||
                            message.description
                            ||
                            message
                        )
                    );


                remoteDescriptionReady =
                    true;


                await flushIce();


                const answer =
                    await peerConnection
                        .createAnswer();


                await peerConnection
                    .setLocalDescription(
                        answer
                    );


                sendSignal({
                    type:
                        "answer",

                    room_id:
                        String(
                            streamId
                        ),

                    answer:
                        peerConnection
                            .localDescription
                });


                setStatus(
                    "در حال اتصال...",
                    "پاسخ اتصال برای پخش‌کننده ارسال شد."
                );

            } catch (error) {

                console.error(
                    "offer handling error",
                    error
                );


                setStatus(
                    "خطای WebRTC",
                    "دریافت اتصال پخش‌کننده ناموفق بود.",
                    "error"
                );
            }

            return;
        }


        if (
            type ===
            "ice-candidate"
            ||
            type ===
            "candidate"
            ||
            type ===
            "ice"
        ) {

            const candidate =
                message.candidate
                ||
                message.ice;


            await addIceCandidate(
                candidate
            );

            return;
        }


        if (
            type ===
            "host-left"
        ) {

            setStatus(
                "لایو پایان یافت",
                "پخش‌کننده لایو را بسته است.",
                "error"
            );

            return;
        }


        if (
            type ===
            "room-info"
        ) {

            if (
                message.host_present
                ||
                message.host
                ||
                message.hostPresent
            ) {

                setStatus(
                    "پخش‌کننده آنلاین است",
                    "در حال اتصال به تصویر و صدا."
                );
            }

            return;
        }
    }


    /*
     * ============================
     * VIEWER JOIN
     * ============================
     */

    async function joinViewer() {

        if (
            !streamId
        ) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/streams/viewer",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                stream_id:
                                    String(
                                        streamId
                                    ),

                                action:
                                    "join"
                            })
                    }
                );


            if (
                response.ok
            ) {

                const data =
                    await response.json();


                if (
                    data
                    &&
                    typeof data.viewer_count
                        !== "undefined"
                ) {

                    viewerPill.textContent =
                        "👁 " +
                        Number(
                            data.viewer_count
                        ) +
                        " بیننده";
                }
            }

        } catch (error) {

            console.warn(
                "viewer join error",
                error
            );
        }
    }


    async function leaveViewer() {

        if (
            !streamId
        ) {
            return;
        }


        try {

            await fetch(
                "/api/streams/viewer",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            stream_id:
                                String(
                                    streamId
                                ),

                            action:
                                "leave"
                        }),

                    keepalive:
                        true
                }
            );

        } catch (error) {

            console.warn(
                "viewer leave error",
                error
            );
        }
    }


    /*
     * ============================
     * CHAT
     * ============================
     */

    async function loadMessages() {

        if (
            !streamId
        ) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/chat/messages?stream_id="
                    +
                    encodeURIComponent(
                        streamId
                    ),
                    {
                        cache:
                            "no-store"
                    }
                );


            if (
                !response.ok
            ) {
                return;
            }


            const data =
                await response.json();


            const list =
                Array.isArray(
                    data.messages
                )
                    ? data.messages
                    : Array.isArray(data)
                        ? data
                        : [];


            messages.innerHTML =
                list
                    .map(
                        item => {

                            const user =
                                item.username
                                ||
                                item.user
                                ||
                                "کاربر";

                            const text =
                                item.message
                                ??
                                item.text
                                ??
                                "";


                            return `
                                <div class="message">

                                    <div class="message-user">
                                        ${escapeHtml(user)}
                                    </div>

                                    <div class="message-text">
                                        ${escapeHtml(text)}
                                    </div>

                                </div>
                            `;
                        }
                    )
                    .join("");


            messages.scrollTop =
                messages.scrollHeight;

        } catch (error) {

            console.warn(
                "chat load error",
                error
            );
        }
    }


    async function sendChat() {

        const text =
            chatInput.value.trim();


        if (
            !text
            ||
            !streamId
        ) {
            return;
        }


        chatSend.disabled =
            true;


        try {

            const response =
                await fetch(
                    "/api/chat/send",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                stream_id:
                                    String(
                                        streamId
                                    ),

                                username:
                                    currentUsername,

                                message:
                                    text
                            })
                    }
                );


            if (
                response.ok
            ) {

                chatInput.value = "";

                await loadMessages();
            }

        } catch (error) {

            console.error(
                "chat send error",
                error
            );

        } finally {

            chatSend.disabled =
                false;
        }
    }


    /*
     * ============================
     * SHARE
     * ============================
     */

    const shareModal =
        document.getElementById(
            "shareModal"
        );

    const shareLink =
        document.getElementById(
            "shareLink"
        );


    function getShareUrl() {

        return (
            window.location.origin
            +
            "/viewer.html?id="
            +
            encodeURIComponent(
                streamId
            )
        );
    }


    function openShare() {

        shareLink.value =
            getShareUrl();

        shareModal.classList.add(
            "show"
        );
    }


    function closeShare() {

        shareModal.classList.remove(
            "show"
        );
    }


    async function copyShareLink() {

        const url =
            getShareUrl();


        try {

            await navigator.clipboard
                .writeText(
                    url
                );

            alert(
                "لینک لایو کپی شد."
            );

        } catch {

            shareLink.select();

            document.execCommand(
                "copy"
            );

            alert(
                "لینک لایو کپی شد."
            );
        }
    }


    async function nativeShare() {

        const url =
            getShareUrl();


        if (
            navigator.share
        ) {

            try {

                await navigator.share({
                    title:
                        getTitle(
                            stream
                        ),

                    text:
                        "تماشای لایو در LainoLive",

                    url
                });

            } catch {
                // user cancelled
            }

            return;
        }


        await copyShareLink();
    }


    /*
     * ============================
     * EVENTS
     * ============================
     */

    document
        .getElementById(
            "backButton"
        )
        .addEventListener(
            "click",
            () => {
                goBack();
            }
        );


    document
        .getElementById(
            "leaveButton"
        )
        .addEventListener(
            "click",
            async () => {

                stopped =
                    true;

                await leaveViewer();

                if (
                    socket
                    &&
                    socket.readyState ===
                        WebSocket.OPEN
                ) {

                    try {

                        socket.send(
                            JSON.stringify({
                                type:
                                    "leave",

                                room_id:
                                    String(
                                        streamId
                                    ),

                                role:
                                    "viewer"
                            })
                        );

                    } catch {}
                }


                if (
                    peerConnection
                ) {

                    try {
                        peerConnection.close();
                    } catch {}
                }


                if (
                    socket
                ) {

                    try {
                        socket.close();
                    } catch {}
                }


                window.location.href =
                    "/index.html";
            }
        );


    document
        .getElementById(
            "shareButton"
        )
        .addEventListener(
            "click",
            openShare
        );


    document
        .getElementById(
            "closeShareButton"
        )
        .addEventListener(
            "click",
            closeShare
        );


    shareModal.addEventListener(
        "click",
        event => {

            if (
                event.target ===
                shareModal
            ) {

                closeShare();
            }
        }
    );


    document
        .getElementById(
            "copyShareButton"
        )
        .addEventListener(
            "click",
            copyShareLink
        );


    document
        .getElementById(
            "nativeShareButton"
        )
        .addEventListener(
            "click",
            nativeShare
        );


    chatSend.addEventListener(
        "click",
        sendChat
    );


    chatInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                event.preventDefault();

                sendChat();
            }
        }
    );


    /*
     * ============================
     * CLEANUP
     * ============================
     */

    window.addEventListener(
        "beforeunload",
        () => {

            stopped =
                true;


            /*
             * Best-effort viewer leave.
             */

            try {

                fetch(
                    "/api/streams/viewer",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                stream_id:
                                    String(
                                        streamId
                                    ),

                                action:
                                    "leave"
                            }),

                        keepalive:
                            true
                    }
                );

            } catch {}


            if (
                socket
                &&
                socket.readyState ===
                    WebSocket.OPEN
            ) {

                try {

                    socket.send(
                        JSON.stringify({
                            type:
                                "leave",

                            room_id:
                                String(
                                    streamId
                                ),

                            role:
                                "viewer"
                        })
                    );

                } catch {}
            }
        }
    );


    /*
     * ============================
     * START
     * ============================
     */

    async function start() {

        try {

            const ok =
                await loadStream();


            if (!ok) {
                return;
            }


            await joinViewer();


            await loadMessages();


            connectSignaling();


            setInterval(
                loadMessages,
                3000
            );


            setInterval(
                async () => {

                    try {

                        const response =
                            await fetch(
                                "/api/streams",
                                {
                                    cache:
                                        "no-store"
                                }
                            );


                        if (
                            !response.ok
                        ) {
                            return;
                        }


                        const data =
                            await response.json();


                        const list =
                            Array.isArray(
                                data.streams
                            )
                                ? data.streams
                                : Array.isArray(data)
                                    ? data
                                    : [];


                        const current =
                            list.find(
                                item =>
                                    String(
                                        getId(item)
                                    )
                                    ===
                                    String(
                                        streamId
                                    )
                            );


                        if (
                            current
                        ) {

                            stream =
                                current;

                            renderStream();
                        }

                    } catch {}
                },
                5000
            );

        } catch (error) {

            console.error(
                "viewer startup error",
                error
            );


            setStatus(
                "خطا در باز کردن لایو",
                "خطای برنامه رخ داد. صفحه را دوباره باز کنید.",
                "error"
            );
        }
    }


    start();
</script>
