</div>

<script>
"use strict";

/* =========================================================
   ELEMENTS
========================================================= */

const streamIdInput =
    document.getElementById("streamId");

const video =
    document.getElementById("video");

const connectBtn =
    document.getElementById("connectBtn");

const playBtn =
    document.getElementById("playBtn");

const disconnectBtn =
    document.getElementById("disconnectBtn");

const stateEl =
    document.getElementById("state");

const viewerCountEl =
    document.getElementById("viewerCount");

const broadcasterCountEl =
    document.getElementById("broadcasterCount");

const statusEl =
    document.getElementById("status");

/* =========================================================
   STATE
========================================================= */

let websocket = null;

let peerConnection = null;

let viewerClientId = null;

let broadcasterClientId = null;

/* =========================================================
   HELPERS
========================================================= */

function getStreamId() {
    return streamIdInput.value.trim();
}

function setState(text) {
    stateEl.textContent =
        String(text || "");
}

function setStatus(text) {
    statusEl.textContent =
        String(text || "");
}

function isSocketOpen() {

    return (
        websocket &&
        websocket.readyState ===
        WebSocket.OPEN
    );
}

/* =========================================================
   API
========================================================= */

async function getStreamInfo() {

    const streamId =
        getStreamId();

    if (!streamId) {
        throw new Error(
            "stream_id وارد نشده است."
        );
    }

    const response =
        await fetch(
            "/api/streams/" +
            encodeURIComponent(
                streamId
            ),
            {
                method: "GET",
                cache: "no-store"
            }
        );

    let data = {};

    try {
        data =
            await response.json();
    }
    catch (_) {}

    if (
        !response.ok ||
        data.success !== true
    ) {

        throw new Error(
            data.message ||
            "لایو پیدا نشد."
        );
    }

    return data.stream;
}

/* =========================================================
   SOCKET URL
========================================================= */

function getViewerSocketUrl() {

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    return (
        protocol +
        "//" +
        location.host +
        "/ws/viewer/" +
        encodeURIComponent(
            getStreamId()
        )
    );
}

/* =========================================================
   SIGNAL
========================================================= */

function sendSignal(payload) {

    if (!isSocketOpen()) {
        return false;
    }

    try {

        websocket.send(
            JSON.stringify(payload)
        );

        return true;

    }
    catch (error) {

        console.error(
            "SIGNAL ERROR:",
            error
        );

        return false;
    }
}

/* =========================================================
   PEER CONNECTION
========================================================= */

function createPeerConnection() {

    if (peerConnection) {

        try {
            peerConnection.close();
        }
        catch (_) {}
    }

    peerConnection =
        new RTCPeerConnection({
            iceServers: [
                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },
                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }
            ]
        });

    peerConnection.ontrack =
        event => {

            if (
                event.streams &&
                event.streams.length
            ) {

                video.srcObject =
                    event.streams[0];

            }
            else {

                if (
                    !video.srcObject
                ) {

                    video.srcObject =
                        new MediaStream();
                }

                video.srcObject.addTrack(
                    event.track
                );
            }

            setState(
                "در حال پخش"
            );

            setStatus(
                "تصویر و صدای لایو دریافت شد."
            );

            video.play()
                .catch(() => {});

        };

    peerConnection.onicecandidate =
        event => {

            if (
                !event.candidate
            ) {
                return;
            }

            sendSignal({
                type:
                    "ice-candidate",

                target:
                    broadcasterClientId,

                candidate:
                    event.candidate
            });
        };

    peerConnection.onconnectionstatechange =
        () => {

            const state =
                peerConnection.connectionState;

            console.log(
                "VIEWER RTC:",
                state
            );

            if (
                state === "connected"
            ) {

                setState(
                    "متصل"
                );

                setStatus(
                    "اتصال WebRTC برقرار شد."
                );
            }

            else if (
                state === "connecting"
            ) {

                setState(
                    "در حال اتصال"
                );
            }

            else if (
                state === "disconnected"
            ) {

                setState(
                    "قطع موقت"
                );
            }

            else if (
                state === "failed"
            ) {

                setState(
                    "خطا"
                );

                setStatus(
                    "اتصال WebRTC ناموفق شد."
                );
            }
        };

    peerConnection.oniceconnectionstatechange =
        () => {

            console.log(
                "VIEWER ICE:",
                peerConnection.iceConnectionState
            );
        };

    return peerConnection;
}

/* =========================================================
   HANDLE OFFER
========================================================= */

async function handleOffer(
    data
) {

    if (!data.sdp) {
        return;
    }

    broadcasterClientId =
        data.sender ||
        data.broadcaster_id ||
        data.broadcasterId ||
        broadcasterClientId;

    const pc =
        createPeerConnection();

    try {

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                data.sdp
            )
        );

        const answer =
            await pc.createAnswer();

        await pc.setLocalDescription(
            answer
        );

        sendSignal({
            type:
                "answer",

            target:
                broadcasterClientId,

            sdp:
                pc.localDescription
        });

        setState(
            "در حال مذاکره"
        );

        setStatus(
            "Offer دریافت شد و Answer ارسال شد."
        );

    }
    catch (error) {

        console.error(
            "OFFER HANDLE ERROR:",
            error
        );

        setState(
            "خطا"
        );

        setStatus(
            "پردازش Offer ناموفق بود:\n" +
            error.message
        );
    }
}

/* =========================================================
   HANDLE ICE
========================================================= */

async function handleIce(
    data
) {

    if (
        !peerConnection ||
        !data.candidate
    ) {
        return;
    }

    try {

        await peerConnection.addIceCandidate(
            new RTCIceCandidate(
                data.candidate
            )
        );

    }
    catch (error) {

        console.warn(
            "ADD ICE ERROR:",
            error
        );
    }
}

/* =========================================================
   CONNECT VIEWER
========================================================= */

async function connectViewer() {

    const streamId =
        getStreamId();

    if (!streamId) {

        setStatus(
            "stream_id را وارد کنید."
        );

        return;
    }

    disconnectViewer();

    try {

        const stream =
            await getStreamInfo();

        if (
            stream.is_live !== true
        ) {

            setStatus(
                "این لایو در حال حاضر فعال نیست."
            );

            setState(
                "آفلاین"
            );

            return;
        }

        viewerCountEl.textContent =
            stream.viewers ??
            0;

        broadcasterCountEl.textContent =
            stream.broadcasters ??
            0;

    }
    catch (error) {

        setStatus(
            error.message
        );

        return;
    }

    setState(
        "در حال اتصال"
    );

    setStatus(
        "در حال اتصال Viewer به سرور..."
    );

    websocket =
        new WebSocket(
            getViewerSocketUrl()
        );

    websocket.onopen =
        () => {

            setState(
                "متصل به سرور"
            );

            setStatus(
                "Viewer به WebSocket متصل شد."
            );

            sendSignal({
                type:
                    "viewer-ready"
            });
        };

    websocket.onmessage =
        async event => {

            let data;

            try {

                data =
                    JSON.parse(
                        event.data
                    );

            }
            catch (_) {

                return;
            }

            console.log(
                "VIEWER SIGNAL:",
                data
            );

            switch (data.type) {

                case "connected":

                    viewerClientId =
                        data.client_id ||
                        null;

                    viewerCountEl.textContent =
                        data.viewer_count ??
                        0;

                    setStatus(
                        "Viewer ثبت شد. منتظر broadcaster..."
                    );

                    break;

                case "broadcaster-ready":

                    setStatus(
                        "Broadcaster پیدا شد. منتظر Offer..."
                    );

                    break;

                case "offer":

                    await handleOffer(
                        data
                    );

                    break;

                case "ice-candidate":

                    await handleIce(
                        data
                    );

                    break;

                case "candidate":

                    await handleIce(
                        data
                    );

                    break;

                case "viewer-count":

                    viewerCountEl.textContent =
                        data.count ??
                        0;

                    break;

                case "stream-ended":

                    video.srcObject =
                        null;

                    setState(
                        "پایان یافته"
                    );

                    setStatus(
                        "این لایو به پایان رسید."
                    );

                    break;

                case "broadcaster-left":

                    video.srcObject =
                        null;

                    setState(
                        "قطع"
                    );

                    setStatus(
                        "Broadcaster از لایو خارج شد."
                    );

                    break;

                default:

                    console.log(
                        "Unhandled viewer event:",
                        data
                    );
            }

            await refreshStreamStats();
        };

    websocket.onerror =
        error => {

            console.error(
                "VIEWER WS ERROR:",
                error
            );

            setState(
                "خطا"
            );

            setStatus(
                "خطا در WebSocket Viewer."
            );
        };

    websocket.onclose =
        () => {

            if (
                stateEl.textContent !==
                "پایان یافته"
            ) {

                setState(
                    "قطع"
                );
            }

            setStatus(
                "WebSocket Viewer قطع شد."
            );
        };
}

/* =========================================================
   REFRESH
========================================================= */

async function refreshStreamStats() {

    try {

        const stream =
            await getStreamInfo();

        viewerCountEl.textContent =
            stream.viewers ??
            0;

        broadcasterCountEl.textContent =
            stream.broadcasters ??
            0;

    }
    catch (_) {}
}

/* =========================================================
   PLAY
========================================================= */

async function playVideo() {

    try {

        await video.play();

        setStatus(
            "پخش فعال شد."
        );

    }
    catch (error) {

        console.error(
            error
        );

        setStatus(
            "مرورگر اجازه پخش خودکار را نداد. روی پخش بزنید."
        );
    }
}

/* =========================================================
   DISCONNECT
========================================================= */

function disconnectViewer() {

    if (websocket) {

        try {
            websocket.close();
        }
        catch (_) {}
    }

    websocket = null;

    if (peerConnection) {

        try {
            peerConnection.close();
        }
        catch (_) {}
    }

    peerConnection = null;

    viewerClientId = null;

    broadcasterClientId =
        null;

    video.srcObject =
        null;
}

/* =========================================================
   BUTTONS
========================================================= */

connectBtn.addEventListener(
    "click",
    connectViewer
);

playBtn.addEventListener(
    "click",
    playVideo
);

disconnectBtn.addEventListener(
    "click",
    () => {

        disconnectViewer();

        setState(
            "متوقف"
        );

        setStatus(
            "اتصال Viewer متوقف شد."
        );
    }
);

/* =========================================================
   INIT
========================================================= */

(async function init() {

    try {

        const stream =
            await getStreamInfo();

        viewerCountEl.textContent =
            stream.viewers ??
            0;

        broadcasterCountEl.textContent =
            stream.broadcasters ??
            0;

        setStatus(
            "لایو آماده است: " +
            (stream.title || "بدون عنوان")
        );

    }
    catch (_) {

        setStatus(
            "برای این stream_id لایو فعالی پیدا نشد."
        );
    }

})();
</script>
