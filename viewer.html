<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#ff2757">

<title>
LainoLive Viewer
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#050508;

color:white;

font-family:tahoma,Arial;

padding:15px;

}



.container{

max-width:750px;

margin:auto;

}



video{

width:100%;

height:380px;

background:black;

border-radius:20px;

object-fit:cover;

}



.card{

background:#15151f;

border-radius:20px;

padding:15px;

margin-top:15px;

}



h2{

margin:0;

}



.info{

color:#aaa;

font-size:13px;

line-height:2;

}



.live{

color:#ff2757;

font-weight:bold;

}



#messages{

height:230px;

overflow-y:auto;

background:#08080d;

border-radius:15px;

padding:10px;

}



.msg{

background:#222;

padding:8px;

border-radius:10px;

margin-bottom:8px;

font-size:13px;

}



.chat{

display:flex;

gap:8px;

margin-top:10px;

}



.chat input{

flex:1;

height:45px;

border:0;

border-radius:12px;

background:#222;

color:white;

padding:0 12px;

}



button{

height:45px;

border:0;

border-radius:12px;

background:#ff2757;

color:white;

padding:0 18px;

font-weight:bold;

}



.back{

width:100%;

margin-top:15px;

background:#333;

}


</style>

</head>


<body>


<div class="container">


<video

id="player"

controls

autoplay

playsinline>

</video>




<div class="card">


<h2 id="title">

در حال دریافت لایو...

</h2>


<div class="info">


👤 سازنده:

<span id="owner">
-
</span>


<br>


🔴 وضعیت:

<span class="live">
زنده
</span>


<br>


👁 بیننده:

<span id="viewers">
0
</span>


</div>


</div>







<div class="card">


<h3>
💬 چت آنلاین
</h3>



<div id="messages">

</div>



<div class="chat">


<input

id="messageInput"

placeholder="پیام...">



<button

id="send">

ارسال

</button>


</div>


</div>



<button

class="back"

onclick="history.back()">

بازگشت

</button>


</div>






<script src="/chat.js"></script>


<script>


const API = "https://mygapino.shop";



const id =

new URLSearchParams(
location.search
)
.get("id");



const title =
document.getElementById(
"title"
);


const owner =
document.getElementById(
"owner"
);


const viewers =
document.getElementById(
"viewers"
);



const messages =
document.getElementById(
"messages"
);



const input =
document.getElementById(
"messageInput"
);








async function loadStream(){


if(!id)
return;



try{


const res =

await fetch(

API+
"/api/streams/"
+
id

);



const data =

await res.json();



if(data.success){


title.textContent =
data.stream.title;



owner.textContent =
data.stream.username;



viewers.textContent =
data.stream.viewers;



}



}

catch(e){

console.log(e);

}



}









async function joinViewer(){


await fetch(

API+
"/api/streams/viewer/join",

{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:

JSON.stringify({

stream_id:id

})

}

).catch(()=>{});


}









async function leaveViewer(){


await fetch(

API+
"/api/streams/viewer/leave",

{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:

JSON.stringify({

stream_id:id

})

}

).catch(()=>{});


}









function addMessage(data){


const div =

document.createElement(
"div"
);



div.className =
"msg";



div.textContent =

"👤 "
+
data.username
+
": "
+
data.message;



messages.appendChild(
div
);



messages.scrollTop =
messages.scrollHeight;


}








function startChat(){


if(
typeof LainoChat !== "undefined"
){


LainoChat.connect(

id,

addMessage

);


}


}








document

.getElementById(
"send"
)

.onclick = ()=>{


const text =

input.value.trim();



if(!text)
return;



if(
typeof LainoChat !== "undefined"
){


LainoChat.send(
text
);


}



input.value="";


};








joinViewer();

loadStream();

startChat();



setInterval(

loadStream,

5000

);



window.addEventListener(

"beforeunload",

leaveViewer

);



</script>


</body>

</html>
