<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#090b12"
    >

    <title>LainoLive - تماشای لایو</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            min-height: 100%;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(90, 58, 180, 0.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(0, 150, 255, 0.07),
                    transparent 35%
                ),
                #090b12;

            color: #fff;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            min-height: 100vh;
        }

        /* =========================
           TOPBAR
        ========================= */

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                calc(
                    12px +
                    env(safe-area-inset-top)
                )
                14px
                12px;

            background:
                rgba(9, 11, 18, 0.95);

            border-bottom:
                1px solid
                #202536;

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 12px;

            background: #171b29;
            color: #fff;

            font-size: 20px;
        }

        .top-title {
            font-size: 16px;
            font-weight: 900;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 7px;

            padding:
                8px
                12px;

            border-radius: 999px;

            background:
                rgba(
                    255,
                    45,
                    85,
                    0.14
                );

            color: #ff5578;

            font-size: 12px;
            font-weight: 900;
        }

        .live-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #ff365f;

            box-shadow:
                0 0 12px
                rgba(
                    255,
                    54,
                    95,
                    0.8
                );
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            width: min(
                1100px,
                100%
            );

            margin: 0 auto;

            padding: 14px;
        }

        /* =========================
           VIDEO
        ========================= */

        .video-card {
            overflow: hidden;

            background: #10131c;

            border:
                1px solid
                #23283a;

            border-radius: 20px;

            box-shadow:
                0 20px 60px
                rgba(
                    0,
                    0,
                    0,
                    0.3
                );
        }

        .video-wrap {
            position: relative;

            width: 100%;

            aspect-ratio:
                16 / 9;

            background: #000;

            overflow: hidden;
        }

        #remoteVideo {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: #000;
        }

        .video-overlay {
            position: absolute;
            inset: 0;

            pointer-events: none;
        }

        .connection-pill {
            position: absolute;

            top: 12px;
            right: 12px;

            max-width: 75%;

            padding:
                8px
                11px;

            border-radius: 10px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.62
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            font-size: 11px;
        }

        .viewer-pill {
            position: absolute;

            left: 12px;
            top: 12px;

            padding:
                8px
                11px;

            border-radius: 10px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.62
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            font-size: 11px;
        }

        .video-message {
            position: absolute;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 24px;

            text-align: center;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.72
                );

            color: #e4e7ef;

            font-size: 14px;

            line-height: 2;
        }

        .video-message.show {
            display: flex;
        }

        .video-message-box {
            max-width: 420px;
        }

        .video-message-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        /* =========================
           INFO
        ========================= */

        .info-card {
            margin-top: 14px;

            padding: 16px;

            background: #10131c;

            border:
                1px solid
                #23283a;

            border-radius: 18px;
        }

        .stream-title {
            margin: 0;

            font-size: 20px;
            line-height: 1.6;
        }

        .meta-row {
            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 12px;
        }

        .meta {
            padding:
                7px
                10px;

            border-radius: 10px;

            background: #181c29;

            color: #b9bfd1;

            font-size: 11px;
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {
            display: flex;

            flex-wrap: wrap;

            gap: 9px;

            margin-top: 14px;
        }

        .control-btn {
            min-height: 44px;

            padding:
                0
                14px;

            border-radius: 12px;

            background: #191e2d;
            color: #fff;

            font-size: 12px;
            font-weight: 700;
        }

        .control-btn.active {
            background: #5d45d9;
        }

        /* =========================
           CHAT
        ========================= */

        .chat-card {
            margin-top: 14px;

            min-height: 360px;

            display: flex;
            flex-direction: column;

            background: #10131c;

            border:
                1px solid
                #23283a;

            border-radius: 18px;

            overflow: hidden;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                13px
                15px;

            border-bottom:
                1px solid
                #23283a;
        }

        .chat-title {
            font-size: 14px;
            font-weight: 900;
        }

        .chat-status {
            color: #8f97aa;
            font-size: 11px;
        }

        #messages {
            flex: 1;

            min-height: 250px;

            overflow-y: auto;

            padding: 13px;
        }

        .empty-chat {
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #70788b;

            text-align: center;

            font-size: 12px;
        }

        .message {
            margin-bottom: 10px;

            padding:
                9px
                11px;

            border-radius: 12px;

            background: #171b28;
        }

        .message-user {
            margin-bottom: 4px;

            color: #977fff;

            font-size: 11px;
            font-weight: 900;
        }

        .message-text {
            color: #e4e7ef;

            font-size: 12px;

            line-height: 1.8;

            word-break: break-word;
        }

        .chat-form {
            display: flex;

            gap: 8px;

            padding: 11px;

            border-top:
                1px solid
                #23283a;
        }

        .chat-input {
            flex: 1;

            min-width: 0;

            height: 44px;

            padding:
                0
                12px;

            border:
                1px solid
                #2a3043;

            border-radius: 12px;

            outline: none;

            background: #0d1018;

            color: #fff;
        }

        .chat-input:focus {
            border-color: #6a4cff;
        }

        .send-btn {
            width: 48px;
            height: 44px;

            border-radius: 12px;

            background: #6a4cff;
            color: white;

            font-size: 18px;
        }

        /* =========================
           ERROR / NOTICE
        ========================= */

        .notice {
            display: none;

            margin-top: 14px;

            padding:
                12px
                14px;

            border-radius: 14px;

            background:
                rgba(
                    255,
                    58,
                    91,
                    0.1
                );

            border:
                1px solid
                rgba(
                    255,
                    58,
                    91,
                    0.22
                );

            color: #ff9bad;

            font-size: 12px;

            line-height: 1.8;
        }

        .notice.show {
            display: block;
        }

        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 850px) {

            .main {
                padding: 20px;
            }

            .chat-card {
                max-width: 700px;
                margin-left: auto;
                margin-right: auto;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .main {
                padding: 8px;
            }

            .topbar {
                padding:
                    calc(
                        9px +
                        env(safe-area-inset-top)
                    )
                    10px
                    9px;
            }

            .top-title {
                font-size: 14px;
            }

            .live-badge {
                padding:
                    7px
                    9px;

                font-size: 10px;
            }

            .video-card,
            .info-card,
            .chat-card {
                border-radius: 15px;
            }

            .stream-title {
                font-size: 18px;
            }

            .control-btn {
                flex:
                    1 1
                    calc(50% - 9px);
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- TOPBAR -->
    <header class="topbar">

        <div class="top-left">

            <button
                id="backBtn"
                class="back-btn"
                type="button"
            >
                ←
            </button>

            <div class="top-title">
                تماشای پخش زنده
            </div>

        </div>

        <div class="live-badge">
            <span class="live-dot"></span>
            LIVE
        </div>

    </header>


    <main class="main">

        <!-- VIDEO -->
        <section class="video-card">

            <div class="video-wrap">

                <video
                    id="remoteVideo"
                    autoplay
                    playsinline
                    controls
                ></video>

                <div class="video-overlay">

                    <div
                        id="connectionStatus"
                        class="connection-pill"
                    >
                        در حال اتصال...
                    </div>

                    <div class="viewer-pill">
                        👁
                        <span id="viewerCount">
                            0
                        </span>
                    </div>

                    <div
                        id="videoMessage"
                        class="video-message"
                    >
                        <div class="video-message-box">

                            <div class="video-message-icon">
                                📺
                            </div>

                            <div id="videoMessageText">
                                در حال دریافت تصویر...
                            </div>

                        </div>
                    </div>

                </div>

            </div>

        </section>


        <!-- NOTICE -->
        <div
            id="notice"
            class="notice"
        ></div>


        <!-- INFO -->
        <section class="info-card">

            <h1
                id="streamTitle"
                class="stream-title"
            >
                پخش زنده LainoLive
            </h1>

            <div class="meta-row">

                <div
                    id="streamCategory"
                    class="meta"
                >
                    عمومی
                </div>

                <div
                    id="streamUsername"
                    class="meta"
                >
                    👤 کاربر
                </div>

                <div
                    id="streamId"
                    class="meta"
                >
                    Stream: -
                </div>

            </div>

        </section>


        <!-- CONTROLS -->
        <div class="controls">

            <button
                id="playBtn"
                class="control-btn active"
                type="button"
            >
                ▶️ پخش
            </button>

            <button
                id="muteBtn"
                class="control-btn"
                type="button"
            >
                🔊 صدا
            </button>

            <button
                id="fullscreenBtn"
                class="control-btn"
                type="button"
            >
                ⛶ تمام صفحه
            </button>

            <button
                id="reloadBtn"
                class="control-btn"
                type="button"
            >
                🔄 اتصال مجدد
            </button>

        </div>


        <!-- CHAT -->
        <section class="chat-card">

            <div class="chat-header">

                <div class="chat-title">
                    💬 چت زنده
                </div>

                <div
                    id="chatStatus"
                    class="chat-status"
                >
                    متصل نیست
                </div>

            </div>


            <div id="messages">

                <div
                    id="emptyChat"
                    class="empty-chat"
                >
                    هنوز پیامی ارسال نشده است.
                </div>

            </div>


            <form
                id="chatForm"
                class="chat-form"
            >

                <input
                    id="chatInput"
                    class="chat-input"
                    type="text"
                    maxlength="500"
                    autocomplete="off"
                    placeholder="پیام بنویسید..."
                >

                <button
                    class="send-btn"
                    type="submit"
                >
                    ➤
                </button>

            </form>

        </section>

    </main>

</div>


<script>
"use strict";

/* =====================================================
   CONFIG
===================================================== */

const SIGNALING_URL =
    "wss://lainolive-signaling.onrender.com";

const RTC_CONFIG = {
    iceServers: [
        {
            urls: [
                "stun:stun.l.google.com:19302",
                "stun:stun1.l.google.com:19302"
            ]
        }
    ]
};


/* =====================================================
   STORAGE
===================================================== */

const VIEW_STREAM_KEYS = [
    "lainolive_view_stream",
    "LainoLive_view_stream",
    "view_stream",
    "current_stream"
];

const USERNAME_KEYS = [
    "lainolive_username",
    "username"
];


/* =====================================================
   STATE
===================================================== */

let streamData = null;

let streamId = "";

let streamOwner = "";

let username = "";

let viewerId = "";

let signalingSocket = null;

let peer = null;

let queuedIceCandidates = [];

let connected = false;

let reconnecting = false;

let isEnding = false;


/* =====================================================
   ELEMENTS
===================================================== */

const remoteVideo =
    document.getElementById(
        "remoteVideo"
    );

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );

const viewerCount =
    document.getElementById(
        "viewerCount"
    );

const videoMessage =
    document.getElementById(
        "videoMessage"
    );

const videoMessageText =
    document.getElementById(
        "videoMessageText"
    );

const streamTitle =
    document.getElementById(
        "streamTitle"
    );

const streamCategory =
    document.getElementById(
        "streamCategory"
    );

const streamUsername =
    document.getElementById(
        "streamUsername"
    );

const streamIdElement =
    document.getElementById(
        "streamId"
    );

const notice =
    document.getElementById(
        "notice"
    );

const playBtn =
    document.getElementById(
        "playBtn"
    );

const muteBtn =
    document.getElementById(
        "muteBtn"
    );

const fullscreenBtn =
    document.getElementById(
        "fullscreenBtn"
    );

const reloadBtn =
    document.getElementById(
        "reloadBtn"
    );

const chatStatus =
    document.getElementById(
        "chatStatus"
    );

const messages =
    document.getElementById(
        "messages"
    );

const emptyChat =
    document.getElementById(
        "emptyChat"
    );

const chatForm =
    document.getElementById(
        "chatForm"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );


/* =====================================================
   UI HELPERS
===================================================== */

function setStatus(text) {
    connectionStatus.textContent =
        text;
}

function showNotice(text) {
    notice.textContent =
        text;

    notice.classList.add(
        "show"
    );
}

function hideNotice() {
    notice.classList.remove(
        "show"
    );
}

function showVideoMessage(text) {
    videoMessageText.textContent =
        text;

    videoMessage.classList.add(
        "show"
    );
}

function hideVideoMessage() {
    videoMessage.classList.remove(
        "show"
    );
}


/* =====================================================
   STORAGE HELPERS
===================================================== */

function getStorageValue(keys) {

    for (const key of keys) {

        try {

            const value =
                sessionStorage.getItem(
                    key
                );

            if (value) {
                return value;
            }

        } catch (error) {
            console.warn(error);
        }


        try {

            const value =
                localStorage.getItem(
                    key
                );

            if (value) {
                return value;
            }

        } catch (error) {
            console.warn(error);
        }
    }

    return null;
}


/* =====================================================
   STREAM DATA
===================================================== */

function readStreamData() {

    const raw =
        getStorageValue(
            VIEW_STREAM_KEYS
        );

    if (!raw) {
        return null;
    }

    try {

        return JSON.parse(
            raw
        );

    } catch (error) {

        console.error(
            "stream JSON error:",
            error
        );

        return null;
    }
}


function getQueryStreamId() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("id") ||
        params.get("stream_id") ||
        params.get("room_id") ||
        ""
    );
}


function normalizeStream(data) {

    if (!data) {
        return {};
    }

    if (typeof data === "string") {

        return {
            stream_id: data
        };
    }

    return {
        ...data
    };
}


function findStreamId(data) {

    return String(
        data.stream_id ??
        data.streamId ??
        data.id ??
        data.room_id ??
        getQueryStreamId() ??
        ""
    );
}


function findOwner(data) {

    return String(
        data.username ??
        data.user ??
        data.owner ??
        data.creator ??
        ""
    );
}


function findUsername(data) {

    const stored =
        getStorageValue(
            USERNAME_KEYS
        );

    return String(
        data.viewer_username ??
        stored ??
        "کاربر"
    );
}


function updateStreamInfo() {

    streamTitle.textContent =
        streamData.title ||
        streamData.name ||
        "پخش زنده LainoLive";

    streamCategory.textContent =
        streamData.category ||
        "عمومی";

    streamOwner =
        findOwner(
            streamData
        );

    streamUsername.textContent =
        "👤 " +
        (
            streamOwner ||
            "کاربر"
        );

    streamIdElement.textContent =
        "Stream: " +
        (
            streamId ||
            "-"
        );
}


/* =====================================================
   CHAT
===================================================== */

function addChatMessage(
    user,
    text
) {

    if (emptyChat) {
        emptyChat.style.display =
            "none";
    }


    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message";


    const userEl =
        document.createElement(
            "div"
        );

    userEl.className =
        "message-user";

    userEl.textContent =
        user ||
        "کاربر";


    const textEl =
        document.createElement(
            "div"
        );

    textEl.className =
        "message-text";

    textEl.textContent =
        text ||
        "";


    wrapper.appendChild(
        userEl
    );

    wrapper.appendChild(
        textEl
    );


    messages.appendChild(
        wrapper
    );


    messages.scrollTop =
        messages.scrollHeight;
}


/* =====================================================
   PEER CLEANUP
===================================================== */

function closePeer() {

    if (!peer) {
        return;
    }

    try {
        peer.ontrack = null;
        peer.onicecandidate = null;
        peer.onconnectionstatechange = null;
        peer.oniceconnectionstatechange = null;

        peer.close();

    } catch (error) {

        console.warn(
            "peer close:",
            error
        );
    }

    peer = null;
}


function clearVideo() {

    try {
        remoteVideo.srcObject =
            null;
    } catch (error) {
        console.warn(error);
    }
}


/* =====================================================
   CREATE PEER
===================================================== */

function createPeer() {

    closePeer();

    queuedIceCandidates = [];

    peer =
        new RTCPeerConnection(
            RTC_CONFIG
        );


    peer.ontrack =
        event => {

            if (
                !event.streams ||
                !event.streams.length
            ) {
                return;
            }

            const remoteStream =
                event.streams[0];

            remoteVideo.srcObject =
                remoteStream;

            hideVideoMessage();

            setStatus(
                "پخش زنده متصل شد"
            );

            connected =
                true;


            const playPromise =
                remoteVideo.play();


            if (
                playPromise &&
                typeof playPromise.catch ===
                    "function"
            ) {

                playPromise.catch(
                    () => {
                        showVideoMessage(
                            "برای شروع پخش روی دکمه «پخش» بزنید."
                        );
                    }
                );
            }
        };


    peer.onicecandidate =
        event => {

            if (
                !event.candidate
            ) {
                return;
            }

            sendSignal(
                {
                    type:
                        "ice-candidate",

                    candidate:
                        event.candidate
                }
            );
        };


    peer.onconnectionstatechange =
        () => {

            if (!peer) {
                return;
            }

            const state =
                peer.connectionState;


            if (
                state ===
                    "connected"
            ) {

                connected =
                    true;

                setStatus(
                    "پخش زنده متصل است"
                );

                hideVideoMessage();

                return;
            }


            if (
                state ===
                    "connecting"
            ) {

                setStatus(
                    "در حال اتصال به پخش..."
                );

                return;
            }


            if (
                state ===
                    "disconnected"
            ) {

                setStatus(
                    "اتصال موقتاً قطع شد"
                );

                showVideoMessage(
                    "ارتباط موقتاً قطع شده است..."
                );

                return;
            }


            if (
                state ===
                    "failed"
            ) {

                setStatus(
                    "اتصال WebRTC ناموفق بود"
                );

                showVideoMessage(
                    "ارتباط مستقیم ویدئو برقرار نشد. دوباره تلاش کنید."
                );
            }
        };


    peer.oniceconnectionstatechange =
        () => {

            if (!peer) {
                return;
            }

            const state =
                peer.iceConnectionState;


            if (
                state ===
                    "checking"
            ) {

                setStatus(
                    "در حال بررسی اتصال شبکه..."
                );
            }


            if (
                state ===
                    "connected" ||
                state ===
                    "completed"
            ) {

                setStatus(
                    "اتصال شبکه برقرار شد"
                );
            }


            if (
                state ===
                    "failed"
            ) {

                setStatus(
                    "ICE اتصال ناموفق بود"
                );

                showVideoMessage(
                    "اتصال بین گوشی و پخش‌کننده برقرار نشد."
                );
            }
        };

    return peer;
}


/* =====================================================
   SEND SIGNAL
===================================================== */

function sendSignal(message) {

    if (
        !signalingSocket ||
        signalingSocket.readyState !==
            WebSocket.OPEN
    ) {
        return false;
    }


    try {

        signalingSocket.send(
            JSON.stringify(
                message
            )
        );

        return true;

    } catch (error) {

        console.error(
            "signal send error:",
            error
        );

        return false;
    }
}


/* =====================================================
   ADD ICE SAFELY
===================================================== */

async function addRemoteIceCandidate(
    candidate
) {

    if (!candidate) {
        return;
    }


    if (
        !peer ||
        !peer.remoteDescription
    ) {

        queuedIceCandidates.push(
            candidate
        );

        return;
    }


    try {

        await peer.addIceCandidate(
            new RTCIceCandidate(
                candidate
            )
        );

    } catch (error) {

        console.warn(
            "add ICE error:",
            error
        );
    }
}


async function flushIceCandidates() {

    if (
        !peer ||
        !peer.remoteDescription
    ) {
        return;
    }


    const list =
        queuedIceCandidates;

    queuedIceCandidates = [];


    for (
        const candidate
        of list
    ) {

        try {

            await peer.addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

        } catch (error) {

            console.warn(
                "queued ICE error:",
                error
            );
        }
    }
}


/* =====================================================
   SIGNALING CONNECTION
===================================================== */

function connectSignaling() {

    if (!streamId) {

        setStatus(
            "شناسه لایو پیدا نشد"
        );

        showNotice(
            "شناسه لایو در لینک پیدا نشد."
        );

        showVideoMessage(
            "شناسه لایو پیدا نشد."
        );

        return;
    }


    if (
        signalingSocket &&
        (
            signalingSocket.readyState ===
                WebSocket.OPEN ||
            signalingSocket.readyState ===
                WebSocket.CONNECTING
        )
    ) {
        return;
    }


    reconnecting =
        false;


    setStatus(
        "در حال اتصال به سرور..."
    );

    showVideoMessage(
        "در حال اتصال به پخش زنده..."
    );


    try {

        signalingSocket =
            new WebSocket(
                SIGNALING_URL
            );

    } catch (error) {

        console.error(
            error
        );

        setStatus(
            "ساخت اتصال ناموفق بود"
        );

        showNotice(
            "اتصال به سرور لایو انجام نشد."
        );

        return;
    }


    signalingSocket.onopen =
        () => {

            setStatus(
                "اتصال به سرور برقرار شد"
            );

            chatStatus.textContent =
                "متصل";


            sendSignal(
                {
                    type:
                        "join",

                    role:
                        "viewer",

                    room_id:
                        streamId
                }
            );


            sendSignal(
                {
                    type:
                        "ready"
                }
            );
        };


    signalingSocket.onmessage =
        async event => {

            let message;


            try {

                message =
                    JSON.parse(
                        event.data
                    );

            } catch (error) {

                console.warn(
                    "invalid server message:",
                    error
                );

                return;
            }


            await handleSignalMessage(
                message
            );
        };


    signalingSocket.onerror =
        error => {

            console.error(
                "WebSocket error:",
                error
            );

            chatStatus.textContent =
                "خطا";

            setStatus(
                "خطا در اتصال به سرور"
            );
        };


    signalingSocket.onclose =
        () => {

            chatStatus.textContent =
                "قطع";

            if (isEnding) {
                return;
            }


            connected =
                false;


            setStatus(
                "اتصال قطع شد"
            );


            showVideoMessage(
                "اتصال به سرور قطع شد."
            );


            if (
                !reconnecting
            ) {

                reconnecting =
                    true;


                setTimeout(
                    () => {

                        if (
                            !isEnding
                        ) {

                            reconnecting =
                                false;

                            connectSignaling();
                        }

                    },
                    3000
                );
            }
        };
}


/* =====================================================
   HANDLE SIGNAL
===================================================== */

async function handleSignalMessage(
    message
) {

    if (!message) {
        return;
    }


    switch (
        message.type
    ) {

        case "joined":

            if (
                message.role ===
                "viewer"
            ) {

                viewerId =
                    message.viewer_id ||
                    "";

                if (
                    typeof message.viewer_count ===
                    "number"
                ) {

                    viewerCount.textContent =
                        String(
                            message.viewer_count
                        );
                }

                setStatus(
                    "در انتظار تصویر..."
                );
            }

            break;


        case "room-info":

            if (
                typeof message.viewer_count ===
                "number"
            ) {

                viewerCount.textContent =
                    String(
                        message.viewer_count
                    );
            }

            break;


        case "offer":

            await handleOffer(
                message
            );

            break;


        case "ice-candidate":

            await addRemoteIceCandidate(
                message.candidate
            );

            break;


        case "chat-message":

            addChatMessage(
                message.username ||
                    message.user ||
                    "کاربر",
                message.message ||
                    message.text ||
                    ""
            );

            break;


        case "host-left":

            setStatus(
                "لایو پایان یافت"
            );

            showVideoMessage(
                "پخش زنده توسط میزبان پایان یافت."
            );

            clearVideo();

            break;


        case "error":

            setStatus(
                "خطای سرور"
            );

            showNotice(
                message.message ||
                    "خطای نامشخص سرور"
            );

            showVideoMessage(
                message.message ||
                    "خطای سرور"
            );

            break;
    }
}


/* =====================================================
   HANDLE OFFER
===================================================== */

async function handleOffer(
    message
) {

    if (!message.offer) {
        return;
    }


    const connection =
        createPeer();


    try {

        setStatus(
            "در حال آماده‌سازی تصویر..."
        );


        await connection.setRemoteDescription(
            new RTCSessionDescription(
                message.offer
            )
        );


        await flushIceCandidates();


        const answer =
            await connection.createAnswer();


        await connection.setLocalDescription(
            answer
        );


        const sent =
            sendSignal(
                {
                    type:
                        "answer",

                    answer:
                        connection.localDescription
                }
            );


        if (!sent) {

            throw new Error(
                "answer ارسال نشد"
            );
        }


        setStatus(
            "در انتظار اتصال ویدئو..."
        );


    } catch (error) {

        console.error(
            "offer handling error:",
            error
        );


        setStatus(
            "خطا در اتصال ویدئو"
        );


        showNotice(
            "اتصال تصویر برقرار نشد: " +
            (
                error?.message ||
                "خطای نامشخص"
            )
        );


        showVideoMessage(
            "اتصال تصویر برقرار نشد."
        );
    }
}


/* =====================================================
   CHAT LOAD
===================================================== */

async function loadChat() {

    if (!streamId) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/chat/messages?stream_id=" +
                encodeURIComponent(
                    streamId
                ),
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        const list =
            Array.isArray(data)
                ? data
                : (
                    Array.isArray(
                        data.messages
                    )
                        ? data.messages
                        : []
                );


        for (
            const item
            of list
        ) {

            addChatMessage(
                item.username ||
                    item.user ||
                    "کاربر",

                item.message ||
                    item.text ||
                    ""
            );
        }

    } catch (error) {

        console.warn(
            "load chat error:",
            error
        );
    }
}


/* =====================================================
   CHAT SEND
===================================================== */

async function sendChat(
    text
) {

    if (
        !text ||
        !streamId
    ) {
        return;
    }


    const sentViaSocket =
        sendSignal(
            {
                type:
                    "chat-message",

                username:
                    username,

                message:
                    text
            }
        );


    if (sentViaSocket) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/chat/send",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            {
                                stream_id:
                                    streamId,

                                username:
                                    username,

                                message:
                                    text
                            }
                        )
                }
            );


        if (!response.ok) {
            throw new Error(
                "chat failed"
            );
        }


        addChatMessage(
            username ||
                "شما",
            text
        );

    } catch (error) {

        console.error(
            error
        );

        showNotice(
            "ارسال پیام انجام نشد."
        );
    }
}


/* =====================================================
   PLAY
===================================================== */

async function playRemoteVideo() {

    try {

        await remoteVideo.play();

        hideVideoMessage();

        playBtn.classList.add(
            "active"
        );

    } catch (error) {

        console.warn(
            "play error:",
            error
        );

        showVideoMessage(
            "برای شروع پخش روی دکمه «پخش» بزنید."
        );
    }
}


/* =====================================================
   EVENTS
===================================================== */

function setupEvents() {

    document
        .getElementById(
            "backBtn"
        )
        .addEventListener(
            "click",
            () => {

                isEnding = true;

                if (
                    signalingSocket
                ) {

                    try {
                        signalingSocket.close();
                    } catch {}
                }

                window.location.href =
                    "/index.html";
            }
        );


    playBtn.addEventListener(
        "click",
        playRemoteVideo
    );


    muteBtn.addEventListener(
        "click",
        () => {

            remoteVideo.muted =
                !remoteVideo.muted;


            muteBtn.textContent =
                remoteVideo.muted
                    ? "🔇 بی‌صدا"
                    : "🔊 صدا";
        }
    );


    fullscreenBtn.addEventListener(
        "click",
        async () => {

            try {

                if (
                    document.fullscreenElement
                ) {

                    await document.exitFullscreen();

                } else {

                    if (
                        remoteVideo.requestFullscreen
                    ) {

                        await remoteVideo.requestFullscreen();

                    } else if (
                        remoteVideo.webkitEnterFullscreen
                    ) {

                        remoteVideo.webkitEnterFullscreen();
                    }
                }

            } catch (error) {

                console.warn(
                    "fullscreen:",
                    error
                );
            }
        }
    );


    reloadBtn.addEventListener(
        "click",
        () => {

            closePeer();

            clearVideo();

            queuedIceCandidates =
                [];

            if (
                signalingSocket
            ) {

                try {
                    signalingSocket.close();
                } catch {}
            }

            setTimeout(
                () => {
                    connectSignaling();
                },
                300
            );
        }
    );


    remoteVideo.addEventListener(
        "click",
        playRemoteVideo
    );


    chatForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const text =
                chatInput.value.trim();


            if (!text) {
                return;
            }


            chatInput.value =
                "";


            await sendChat(
                text
            );
        }
    );
}


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize() {

    streamData =
        normalizeStream(
            readStreamData()
        );


    streamId =
        findStreamId(
            streamData
        );


    username =
        findUsername(
            streamData
        );


    updateStreamInfo();


    setupEvents();


    if (!streamId) {

        setStatus(
            "شناسه لایو پیدا نشد"
        );

        showVideoMessage(
            "شناسه لایو در لینک وجود ندارد."
        );

        showNotice(
            "لینک لایو ناقص است. از صفحه اصلی دوباره وارد لایو شوید."
        );

        return;
    }


    await loadChat();


    connectSignaling();
}


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        isEnding = true;

        closePeer();


        if (
            signalingSocket
        ) {

            try {
                signalingSocket.close();
            } catch {}
        }
    }
);


/* =====================================================
   START
===================================================== */

initialize();
</script>
