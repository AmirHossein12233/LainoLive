<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#08080f"
    >

    <title>LainoLive - تماشای لایو</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;

            background:
                radial-gradient(
                    circle at top,
                    #1c1730 0%,
                    #09090f 48%,
                    #040406 100%
                );

            color: white;

            font-family:
                Tahoma,
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        .page {
            min-height: 100vh;
            padding-bottom: 25px;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 50;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 14px 16px;

            background:
                rgba(7, 7, 12, .90);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-bottom:
                1px solid
                rgba(255,255,255,.07);
        }

        .header-title {
            font-size: 18px;
            font-weight: 900;
        }

        .status {
            margin-top: 4px;

            color: #aaaab7;
            font-size: 10px;
        }

        .back-btn {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 13px;

            background:
                rgba(255,255,255,.07);

            color: white;

            font-size: 18px;
        }

        .content {
            width: 100%;
            max-width: 1000px;

            margin: 0 auto;

            padding: 16px;
        }

        .video-box {
            position: relative;

            width: 100%;
            aspect-ratio: 16 / 9;

            overflow: hidden;

            border-radius: 22px;

            background: #000;

            border:
                1px solid
                rgba(255,255,255,.08);

            box-shadow:
                0 18px 60px
                rgba(0,0,0,.35);
        }

        #remoteVideo {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: #000;
        }

        .live-badge {
            position: absolute;

            top: 12px;
            right: 12px;

            padding:
                6px 10px;

            border-radius: 999px;

            background: #ff174d;

            font-size: 10px;
            font-weight: 900;

            z-index: 5;
        }

        .viewer-badge {
            position: absolute;

            left: 12px;
            top: 12px;

            padding:
                7px 10px;

            border-radius: 999px;

            background:
                rgba(0,0,0,.72);

            font-size: 11px;

            z-index: 5;
        }

        .play-overlay {
            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            pointer-events: none;
        }

        .play-button {
            width: 70px;
            height: 70px;

            border: none;
            border-radius: 50%;

            background:
                rgba(139,53,255,.90);

            color: white;

            font-size: 28px;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,.35);

            cursor: pointer;

            pointer-events: auto;
        }

        .info-card {
            margin-top: 14px;

            padding: 16px;

            border-radius: 20px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid
                rgba(255,255,255,.07);
        }

        .stream-title {
            font-size: 20px;
            font-weight: 900;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;

            gap: 8px;

            margin-top: 10px;
        }

        .tag {
            padding:
                6px 10px;

            border-radius: 999px;

            background:
                rgba(139,53,255,.12);

            color: #d3bcff;

            font-size: 10px;
        }

        .actions {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            margin-top: 14px;
        }

        .action-btn {
            min-height: 48px;

            border: none;
            border-radius: 15px;

            background:
                rgba(255,255,255,.06);

            color: white;

            font-size: 12px;
            font-weight: 800;
        }

        .chat-card {
            margin-top: 14px;

            padding: 14px;

            border-radius: 20px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid
                rgba(255,255,255,.07);
        }

        .chat-title {
            font-size: 15px;
            font-weight: 900;
        }

        #chatMessages {
            height: 220px;

            margin-top: 10px;

            overflow-y: auto;

            padding: 8px;

            border-radius: 14px;

            background:
                rgba(0,0,0,.18);
        }

        .message {
            margin-bottom: 9px;

            padding: 8px 10px;

            border-radius: 12px;

            background:
                rgba(255,255,255,.045);
        }

        .message-user {
            color: #ffb0c1;
            font-size: 10px;
            font-weight: 900;
        }

        .message-text {
            margin-top: 4px;

            font-size: 12px;
            line-height: 1.7;

            word-break: break-word;
        }

        .chat-form {
            display: flex;
            gap: 8px;

            margin-top: 10px;
        }

        #chatInput {
            flex: 1;

            min-width: 0;

            height: 46px;

            padding:
                0 13px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 14px;

            outline: none;

            background:
                rgba(0,0,0,.25);

            color: white;
        }

        #chatSend {
            width: 78px;

            border: none;
            border-radius: 14px;

            background:
                #8b35ff;

            color: white;

            font-weight: 900;
        }

        .log {
            margin-top: 12px;

            color: #8f8f9e;

            font-size: 10px;
            line-height: 1.7;
        }

        @media (max-width: 560px) {

            .stream-title {
                font-size: 17px;
            }

            .actions {
                grid-template-columns:
                    1fr 1fr;
            }

        }

    </style>
</head>

<body>

<div class="page">

    <header class="header">

        <div>

            <div class="header-title">
                📺 تماشای لایو
            </div>

            <div
                id="status"
                class="status"
            >
                در حال اتصال...
            </div>

        </div>

        <button
            id="backButton"
            class="back-btn"
            type="button"
            aria-label="بازگشت"
        >
            ✕
        </button>

    </header>


    <main class="content">

        <section class="video-box">

            <video
                id="remoteVideo"
                autoplay
                playsinline
                controls
            ></video>

            <div class="live-badge">
                ● LIVE
            </div>

            <div
                id="viewerBadge"
                class="viewer-badge"
            >
                👁 0 بیننده
            </div>

            <div
                id="playOverlay"
                class="play-overlay"
            >

                <button
                    id="playButton"
                    class="play-button"
                    type="button"
                    aria-label="پخش"
                >
                    ▶
                </button>

            </div>

        </section>


        <section class="info-card">

            <div
                id="streamTitle"
                class="stream-title"
            >
                لایو
            </div>


            <div class="meta">

                <div
                    id="usernameTag"
                    class="tag"
                >
                    👤 کاربر
                </div>

                <div
                    id="categoryTag"
                    class="tag"
                >
                    📂 عمومی
                </div>

            </div>


            <div class="actions">

                <button
                    id="shareButton"
                    class="action-btn"
                    type="button"
                >
                    🔗 اشتراک‌گذاری
                </button>

                <button
                    id="fullscreenButton"
                    class="action-btn"
                    type="button"
                >
                    ⛶ تمام صفحه
                </button>

            </div>

        </section>


        <section class="chat-card">

            <div class="chat-title">
                💬 چت لایو
            </div>


            <div id="chatMessages"></div>


            <form
                id="chatForm"
                class="chat-form"
            >

                <input
                    id="chatInput"
                    type="text"
                    maxlength="500"
                    autocomplete="off"
                    placeholder="پیام خود را بنویسید..."
                >

                <button
                    id="chatSend"
                    type="submit"
                >
                    ارسال
                </button>

            </form>


            <div
                id="log"
                class="log"
            ></div>

        </section>

    </main>

</div>


<script>

"use strict";


/* =========================
   STORAGE
   ========================= */

const LOGIN_KEY =
    "lainolive_logged_in";

const USERNAME_KEY =
    "lainolive_username";

const VIEW_STREAM_KEY =
    "lainolive_view_stream";


if (
    localStorage.getItem(
        LOGIN_KEY
    ) !== "true"
) {

    window.location.href =
        "/login.html";
}


/* =========================
   ELEMENTS
   ========================= */

const remoteVideo =
    document.getElementById(
        "remoteVideo"
    );

const statusEl =
    document.getElementById(
        "status"
    );

const viewerBadge =
    document.getElementById(
        "viewerBadge"
    );

const playOverlay =
    document.getElementById(
        "playOverlay"
    );

const playButton =
    document.getElementById(
        "playButton"
    );

const backButton =
    document.getElementById(
        "backButton"
    );

const shareButton =
    document.getElementById(
        "shareButton"
    );

const fullscreenButton =
    document.getElementById(
        "fullscreenButton"
    );

const streamTitle =
    document.getElementById(
        "streamTitle"
    );

const usernameTag =
    document.getElementById(
        "usernameTag"
    );

const categoryTag =
    document.getElementById(
        "categoryTag"
    );

const chatMessages =
    document.getElementById(
        "chatMessages"
    );

const chatForm =
    document.getElementById(
        "chatForm"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );

const logEl =
    document.getElementById(
        "log"
    );


/* =========================
   STREAM
   ========================= */

function getStreamFromStorage() {

    try {

        const raw =
            sessionStorage.getItem(
                VIEW_STREAM_KEY
            );

        if (!raw) {
            return null;
        }

        return JSON.parse(
            raw
        );

    } catch (error) {

        console.error(
            "stream storage error:",
            error
        );

        return null;
    }
}


const urlParams =
    new URLSearchParams(
        window.location.search
    );


const queryId =
    urlParams.get("id");


let stream =
    getStreamFromStorage();


/*
 * اگر id در URL وجود داشته باشد
 * و stream ذخیره شده برای همان id نباشد،
 * فقط id را به عنوان شناسه استفاده می‌کنیم.
 */
const streamId =
    queryId ||
    stream?.id ||
    stream?.stream_id ||
    null;


if (!streamId) {

    statusEl.textContent =
        "شناسه لایو پیدا نشد.";

}


/* =========================
   DATA
   ========================= */

const title =
    stream?.title ||
    "لایو";

const username =
    stream?.username ||
    stream?.user ||
    "کاربر";

const category =
    stream?.category ||
    "عمومی";


streamTitle.textContent =
    title;

usernameTag.textContent =
    "👤 " + username;

categoryTag.textContent =
    "📂 " + category;


/* =========================
   SIGNALING
   ========================= */

const SIGNALING_URL =
    "wss://lainolive-signaling.onrender.com";


let socket =
    null;

let peerConnection =
    null;

let viewerId =
    null;

let joined =
    false;

let stopped =
    false;

let reconnectTimer =
    null;

let heartbeatTimer =
    null;


/* =========================
   ICE
   ========================= */

const rtcConfig = {

    iceServers: [

        {
            urls:
                [
                    "stun:stun.l.google.com:19302",
                    "stun:stun1.l.google.com:19302"
                ]
        }

    ]

};


/* =========================
   STATUS / LOG
   ========================= */

function setStatus(
    text
) {

    statusEl.textContent =
        text;
}


function log(
    text
) {

    logEl.textContent =
        text;
}


/* =========================
   VIEWER COUNT
   ========================= */

function updateViewerCount(
    count
) {

    const value =
        Math.max(
            0,
            Number(count) || 0
        );

    viewerBadge.textContent =
        "👁 " +
        value +
        " بیننده";
}


/* =========================
   SEND
   ========================= */

function send(
    data
) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        return false;
    }


    try {

        socket.send(
            JSON.stringify(data)
        );

        return true;

    } catch (error) {

        console.error(
            "socket send error:",
            error
        );

        return false;
    }
}


/* =========================
   CREATE PEER
   ========================= */

function createPeerConnection() {

    if (peerConnection) {

        try {
            peerConnection.close();
        } catch {}

        peerConnection =
            null;
    }


    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    peerConnection =
        pc;


    pc.ontrack =
        event => {

            const streams =
                event.streams || [];


            if (
                streams.length > 0
            ) {

                remoteVideo.srcObject =
                    streams[0];

            } else {

                const mediaStream =
                    remoteVideo.srcObject ||
                    new MediaStream();


                mediaStream.addTrack(
                    event.track
                );


                remoteVideo.srcObject =
                    mediaStream;
            }


            playOverlay.style.display =
                "none";


            remoteVideo
                .play()
                .catch(
                    () => {}
                );


            setStatus(
                "در حال پخش لایو"
            );
        };


    pc.onicecandidate =
        event => {

            if (
                !event.candidate
            ) {

                return;
            }


            send(
                {
                    type:
                        "ice-candidate",

                    viewer_id:
                        viewerId,

                    candidate:
                        event.candidate
                }
            );
        };


    pc.onconnectionstatechange =
        () => {

            const state =
                pc.connectionState;


            if (
                state ===
                "connected"
            ) {

                setStatus(
                    "در حال پخش لایو"
                );

                log(
                    "اتصال ویدیو برقرار شد."
                );
            }


            if (
                state ===
                "disconnected"
            ) {

                setStatus(
                    "ارتباط ویدیو ناپایدار است..."
                );
            }


            if (
                state ===
                "failed"
            ) {

                setStatus(
                    "اتصال ویدیو ناموفق بود."
                );
            }


            if (
                state ===
                "closed"
            ) {

                setStatus(
                    "اتصال ویدیو بسته شد."
                );
            }
        };


    return pc;
}


/* =========================
   JOIN STREAM
   ========================= */

function joinStream() {

    if (
        !streamId ||
        stopped
    ) {

        return;
    }


    send(
        {
            type:
                "join",

            role:
                "viewer",

            room_id:
                String(
                    streamId
                ),

            username:
                localStorage.getItem(
                    USERNAME_KEY
                ) ||
                "کاربر"
        }
    );
}


/* =========================
   CONNECT
   ========================= */

function connectSocket() {

    if (
        stopped
    ) {

        return;
    }


    try {

        socket =
            new WebSocket(
                SIGNALING_URL
            );

    } catch (error) {

        console.error(
            "websocket create error:",
            error
        );

        setStatus(
            "اتصال به سرور ناموفق بود."
        );

        scheduleReconnect();

        return;
    }


    socket.onopen =
        () => {

            setStatus(
                "اتصال به سرور برقرار شد..."
            );

            joinStream();

            startHeartbeat();
        };


    socket.onmessage =
        async event => {

            let message;

            try {

                message =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;
            }


            const type =
                message?.type;


            /* =====================
               JOINED
               ===================== */

            if (
                type ===
                "joined"
            ) {

                viewerId =
                    message?.viewer_id ||
                    message?.id ||
                    null;


                joined =
                    true;


                createPeerConnection();


                /*
                 * به سرور اعلام می‌کنیم
                 * که آماده دریافت offer هستیم.
                 */

                send(
                    {
                        type:
                            "ready",

                        viewer_id:
                            viewerId
                    }
                );


                /*
                 * بعضی نسخه‌های سرور
                 * offer را بلافاصله بعد از joined
                 * می‌فرستند.
                 */

                setStatus(
                    "منتظر شروع پخش..."
                );

                return;
            }


            /* =====================
               OFFER
               ===================== */

            if (
                type ===
                "offer"
            ) {

                const incomingViewerId =
                    message?.viewer_id;


                if (
                    viewerId &&
                    incomingViewerId &&
                    String(
                        incomingViewerId
                    ) !==
                    String(
                        viewerId
                    )
                ) {

                    return;
                }


                if (
                    !peerConnection
                ) {

                    createPeerConnection();
                }


                if (
                    !message?.sdp
                ) {

                    return;
                }


                try {

                    await peerConnection.setRemoteDescription(
                        new RTCSessionDescription(
                            message.sdp
                        )
                    );


                    const answer =
                        await peerConnection.createAnswer();


                    await peerConnection.setLocalDescription(
                        answer
                    );


                    send(
                        {
                            type:
                                "answer",

                            viewer_id:
                                viewerId,

                            sdp:
                                peerConnection.localDescription
                        }
                    );


                    setStatus(
                        "در حال برقراری پخش..."
                    );

                } catch (error) {

                    console.error(
                        "offer handling error:",
                        error
                    );

                    log(
                        "خطا در برقراری اتصال ویدیو."
                    );
                }

                return;
            }


            /* =====================
               ICE
               ===================== */

            if (
                type ===
                "ice-candidate"
            ) {

                const incomingViewerId =
                    message?.viewer_id;


                if (
                    viewerId &&
                    incomingViewerId &&
                    String(
                        incomingViewerId
                    ) !==
                    String(
                        viewerId
                    )
                ) {

                    return;
                }


                if (
                    !peerConnection ||
                    !message?.candidate
                ) {

                    return;
                }


                try {

                    await peerConnection.addIceCandidate(
                        new RTCIceCandidate(
                            message.candidate
                        )
                    );

                } catch (error) {

                    console.error(
                        "ice error:",
                        error
                    );
                }

                return;
            }


            /* =====================
               ROOM INFO
               ===================== */

            if (
                type ===
                "room-info"
            ) {

                updateViewerCount(
                    message?.viewer_count
                );

                return;
            }


            /* =====================
               VIEWER LEFT / HOST LEFT
               ===================== */

            if (
                type ===
                "host-left"
            ) {

                setStatus(
                    "پخش‌کننده لایو را پایان داد."
                );


                playOverlay.style.display =
                    "flex";


                try {

                    remoteVideo.pause();

                } catch {}


                return;
            }


            if (
                type ===
                "stream-ended"
            ) {

                setStatus(
                    "این لایو پایان یافته است."
                );

                return;
            }


            /* =====================
               CHAT
               ===================== */

            if (
                type ===
                "chat-message"
            ) {

                appendChatMessage(
                    message?.username ||
                        "کاربر",

                    message?.message ||
                        ""
                );

                return;
            }
        };


    socket.onclose =
        () => {

            stopHeartbeat();


            if (!stopped) {

                joined =
                    false;

                setStatus(
                    "ارتباط قطع شد؛ تلاش مجدد..."
                );

                scheduleReconnect();
            }
        };


    socket.onerror =
        error => {

            console.error(
                "websocket error:",
                error
            );
        };
}


/* =========================
   RECONNECT
   ========================= */

function scheduleReconnect() {

    if (
        reconnectTimer ||
        stopped
    ) {

        return;
    }


    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;

                connectSocket();

            },
            2000
        );
}


/* =========================
   HEARTBEAT
   ========================= */

function startHeartbeat() {

    stopHeartbeat();


    heartbeatTimer =
        setInterval(
            () => {

                send(
                    {
                        type:
                            "ping"
                    }
                );

            },
            15000
        );
}


function stopHeartbeat() {

    if (
        heartbeatTimer
    ) {

        clearInterval(
            heartbeatTimer
        );

        heartbeatTimer =
            null;
    }
}


/* =========================
   CHAT
   ========================= */

function appendChatMessage(
    chatUser,
    message
) {

    if (!message) {
        return;
    }


    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message";


    const userEl =
        document.createElement(
            "div"
        );

    userEl.className =
        "message-user";

    userEl.textContent =
        "👤 " +
        chatUser;


    const textEl =
        document.createElement(
            "div"
        );

    textEl.className =
        "message-text";

    textEl.textContent =
        message;


    wrapper.appendChild(
        userEl
    );

    wrapper.appendChild(
        textEl
    );


    chatMessages.appendChild(
        wrapper
    );


    chatMessages.scrollTop =
        chatMessages.scrollHeight;
}


chatForm.addEventListener(
    "submit",
    event => {

        event.preventDefault();


        const message =
            chatInput.value.trim();


        if (!message) {
            return;
        }


        const chatUsername =
            localStorage.getItem(
                USERNAME_KEY
            ) ||
            "کاربر";


        if (
            send(
                {
                    type:
                        "chat-message",

                    room_id:
                        String(
                            streamId
                        ),

                    username:
                        chatUsername,

                    message:
                        message
                }
            )
        ) {

            appendChatMessage(
                chatUsername,
                message
            );

            chatInput.value =
                "";
        }
    }
);


/* =========================
   PLAY
   ========================= */

async function playVideo() {

    try {

        await remoteVideo.play();

        playOverlay.style.display =
            "none";

    } catch (error) {

        console.error(
            "play error:",
            error
        );

        setStatus(
            "برای شروع پخش روی دکمه پخش بزنید."
        );
    }
}


playButton.addEventListener(
    "click",
    async () => {

        await playVideo();
    }
);


/* =========================
   VIDEO EVENTS
   ========================= */

remoteVideo.addEventListener(
    "playing",
    () => {

        playOverlay.style.display =
            "none";

        setStatus(
            "در حال پخش لایو"
        );
    }
);


remoteVideo.addEventListener(
    "waiting",
    () => {

        setStatus(
            "در حال بافر..."
        );
    }
);


/* =========================
   SHARE
   ========================= */

shareButton.addEventListener(
    "click",
    async () => {

        const shareUrl =
            window.location.origin +
            "/viewer.html?id=" +
            encodeURIComponent(
                String(
                    streamId
                )
            );


        try {

            if (
                navigator.share
            ) {

                await navigator.share(
                    {
                        title:
                            title,

                        text:
                            "مشاهده لایو در LainoLive",

                        url:
                            shareUrl
                    }
                );

                return;
            }


            await navigator.clipboard.writeText(
                shareUrl
            );


            alert(
                "لینک لایو کپی شد."
            );

        } catch (error) {

            console.error(
                "share error:",
                error
            );
        }
    }
);


/* =========================
   FULLSCREEN
   ========================= */

fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                remoteVideo.requestFullscreen
            ) {

                await remoteVideo.requestFullscreen();

                return;
            }


            if (
                remoteVideo.webkitEnterFullscreen
            ) {

                remoteVideo.webkitEnterFullscreen();
            }

        } catch (error) {

            console.error(
                "fullscreen error:",
                error
            );
        }
    }
);


/* =========================
   LEAVE SERVER
   ========================= */

async function notifyLeave() {

    if (!streamId) {
        return;
    }


    try {

        await fetch(
            "/api/streams/viewer",
            {
                method:
                    "POST",

                headers:
                    {
                        "Content-Type":
                            "application/json"
                    },

                body:
                    JSON.stringify(
                        {
                            stream_id:
                                String(
                                    streamId
                                ),

                            username:
                                localStorage.getItem(
                                    USERNAME_KEY
                                ) ||
                                "کاربر",

                            action:
                                "leave"
                        }
                    ),

                keepalive:
                    true
            }
        );

    } catch (error) {

        console.error(
            "viewer leave error:",
            error
        );
    }
}


/* =========================
   BACK
   ========================= */

async function leaveViewer() {

    if (stopped) {
        return;
    }


    stopped =
        true;


    stopHeartbeat();


    if (reconnectTimer) {

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer =
            null;
    }


    try {

        send(
            {
                type:
                    "leave",

                room_id:
                    String(
                        streamId
                    ),

                viewer_id:
                    viewerId
            }
        );

    } catch {}


    await notifyLeave();


    if (peerConnection) {

        try {
            peerConnection.close();
        } catch {}

        peerConnection =
            null;
    }


    try {

        if (
            remoteVideo.srcObject
        ) {

            remoteVideo.srcObject =
                null;
        }

    } catch {}


    try {

        if (
            socket &&
            socket.readyState !==
            WebSocket.CLOSED
        ) {

            socket.close();
        }

    } catch {}


    window.location.href =
        "/index.html";
}


backButton.addEventListener(
    "click",
    async () => {

        await leaveViewer();
    }
);


/* =========================
   PAGE EXIT
   ========================= */

window.addEventListener(
    "beforeunload",
    () => {

        try {

            if (
                socket &&
                socket.readyState ===
                WebSocket.OPEN
            ) {

                socket.send(
                    JSON.stringify(
                        {
                            type:
                                "leave",

                            room_id:
                                String(
                                    streamId
                                ),

                            viewer_id:
                                viewerId
                        }
                    )
                );
            }

        } catch {}


        try {

            navigator.sendBeacon(
                "/api/streams/viewer",
                new Blob(
                    [
                        JSON.stringify(
                            {
                                stream_id:
                                    String(
                                        streamId
                                    ),

                                username:
                                    localStorage.getItem(
                                        USERNAME_KEY
                                    ) ||
                                    "کاربر",

                                action:
                                    "leave"
                            }
                        )
                    ],
                    {
                        type:
                            "application/json"
                    }
                )
            );

        } catch {}
    }
);


/* =========================
   REGISTER VIEWER
   ========================= */

async function registerViewer() {

    if (!streamId) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/streams/viewer",
                {
                    method:
                        "POST",

                    headers:
                        {
                            "Content-Type":
                                "application/json"
                        },

                    body:
                        JSON.stringify(
                            {
                                stream_id:
                                    String(
                                        streamId
                                    ),

                                username:
                                    localStorage.getItem(
                                        USERNAME_KEY
                                    ) ||
                                    "کاربر",

                                action:
                                    "join"
                            }
                        )
                }
            );


        if (
            !response.ok
        ) {

            console.warn(
                "viewer register failed:",
                response.status
            );

            return;
        }


        const data =
            await response.json();


        if (
            data &&
            data.viewer_count !==
                undefined
        ) {

            updateViewerCount(
                data.viewer_count
            );
        }

    } catch (error) {

        console.error(
            "viewer register error:",
            error
        );
    }
}


/* =========================
   START
   ========================= */

(async function init() {

    if (!streamId) {

        setStatus(
            "شناسه لایو نامعتبر است."
        );

        return;
    }


    await registerViewer();


    createPeerConnection();


    connectSocket();

})();

</script>
