<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff2757">
<title>LainoLive - تماشای لایو</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d0f14;
    color: white;
    font-family: Tahoma, Arial, sans-serif;
}

.container {
    width: min(1100px, 94%);
    margin: 25px auto;
}

.card {
    background: #171a21;
    border: 1px solid #292e38;
    border-radius: 18px;
    padding: 18px;
}

h1 {
    margin-top: 0;
}

.row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: 1px solid #343a46;
    background: #0f1217;
    color: white;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 12px 18px;
    background: #ff2757;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

video {
    width: 100%;
    min-height: 300px;
    max-height: 70vh;
    background: black;
    border-radius: 15px;
    object-fit: contain;
}

.status {
    margin-top: 15px;
    background: #10131a;
    padding: 14px;
    border-radius: 12px;
    white-space: pre-wrap;
}

.info {
    margin-top: 12px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.box {
    background: #10131a;
    padding: 12px;
    text-align: center;
    border-radius: 12px;
}

.box b {
    display: block;
    margin-top: 5px;
    font-size: 20px;
}

@media(max-width:700px) {
    .row {
        grid-template-columns: 1fr;
    }

    .info {
        grid-template-columns: 1fr;
    }
}
</style>

</head>

<body>

<div class="container">

```
<div class="card">

    <h1>📺 تماشای LainoLive</h1>

    <div class="row">

        <input
            id="streamId"
            value="9b995ee8-8196-4d3b-b508-0c78c5d9ea8a"
            placeholder="stream_id"
        >

        <button id="connectBtn">
            ▶️ اتصال
        </button>

    </div>

    <video
        id="video"
        autoplay

```

</div>

<script>
"use strict";

const video =
    document.getElementById("video");

const streamIdInput =
    document.getElementById("streamId");

const connectBtn =
    document.getElementById("connectBtn");

const statusEl =
    document.getElementById("status");

const stateEl =
    document.getElementById("state");

const viewersEl =
    document.getElementById("viewers");

const broadcastersEl =
    document.getElementById("broadcasters");

let websocket = null;
let peerConnection = null;

/* =========================================================
   HELPERS
========================================================= */

function setStatus(text) {
    statusEl.textContent = text;
}

function setState(text) {
    stateEl.textContent = text;
}

function getStreamId() {
    return streamIdInput.value.trim();
}

function socketUrl() {

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    return (
        protocol +
        "//" +
        location.host +
        "/ws/stream/" +
        encodeURIComponent(
            getStreamId()
        ) +
        "?role=viewer"
    );
}

/* =========================================================
   PEER CONNECTION
========================================================= */

function createPeerConnection() {

    if (peerConnection) {
        try {
            peerConnection.close();
        }
        catch (_) {}
    }

    peerConnection =
        new RTCPeerConnection({
            iceServers: [
                {
                    urls: "stun:stun.l.google.com:19302"
                },
                {
                    urls: "stun:stun1.l.google.com:19302"
                }
            ]
        });

    peerConnection.ontrack =
        event => {

            if (
                event.streams &&
                event.streams[0]
            ) {
                video.srcObject =
                    event.streams[0];
            }
            else {

                let stream =
                    video.srcObject;

                if (!stream) {
                    stream =
                        new MediaStream();

                    video.srcObject =
                        stream;
                }

                stream.addTrack(
                    event.track
                );
            }

            setState("در حال پخش");
            setStatus(
                "تصویر لایو دریافت شد."
            );
        };

    peerConnection.onicecandidate =
        event => {

            if (!event.candidate) {
                return;
            }

            sendSignal({
                type: "ice",
                candidate:
                    event.candidate
            });
        };

    peerConnection.onconnectionstatechange =
        () => {

            const state =
                peerConnection.connectionState;

            setState(state);

            if (
                state ===
                "connected"
            ) {
                setStatus(
                    "به لایو متصل شدی."
                );
            }

            if (
                state ===
                "failed"
            ) {
                setStatus(
                    "اتصال WebRTC ناموفق شد."
                );
            }
        };

    return peerConnection;
}

/* =========================================================
   SIGNAL
========================================================= */

function sendSignal(data) {

    if (
        !websocket ||
        websocket.readyState !==
        WebSocket.OPEN
    ) {
        return;
    }

    websocket.send(
        JSON.stringify(data)
    );
}

/* =========================================================
   WEBSOCKET
========================================================= */

async function connect() {

    const streamId =
        getStreamId();

    if (!streamId) {
        setStatus(
            "stream_id را وارد کنید."
        );
        return;
    }

    disconnect();

    createPeerConnection();

    setState("در حال اتصال");

    setStatus(
        "در حال اتصال به سرور..."
    );

    websocket =
        new WebSocket(
            socketUrl()
        );

    websocket.onopen =
        () => {

            setState("متصل");

            setStatus(
                "اتصال به سرور برقرار شد. منتظر پخش‌کننده..."
            );

            sendSignal({
                type: "join"
            });
        };

    websocket.onmessage =
        async event => {

            let data;

            try {
                data =
                    JSON.parse(
                        event.data
                    );
            }
            catch (_) {
                return;
            }

            console.log(
                "VIEWER SIGNAL:",
                data
            );

            switch (data.type) {

                case "offer":

                    await handleOffer(
                        data
                    );

                    break;

                case "ice":

                    if (
                        peerConnection &&
                        data.candidate
                    ) {

                        try {
                            await peerConnection
                                .addIceCandidate(
                                    new RTCIceCandidate(
                                        data.candidate
                                    )
                                );
                        }
                        catch (error) {

                            console.warn(
                                "ICE:",
                                error
                            );
                        }
                    }

                    break;

                case "stats":

                    viewersEl.textContent =
                        data.viewers ?? 0;

                    broadcastersEl.textContent =
                        data.broadcasters ?? 0;

                    break;

                case "stream_started":

                    setStatus(
                        "پخش شروع شده است."
                    );

                    break;

                case "stream_stopped":

                    video.srcObject =
                        null;

                    setState(
                        "متوقف"
                    );

                    setStatus(
                        "پخش توسط broadcaster متوقف شد."
                    );

                    break;

                case "error":

                    setStatus(
                        data.message ||
                        "خطای سرور"
                    );

                    break;

                default:

                    console.log(
                        "Unhandled:",
                        data
                    );
            }
        };

    websocket.onerror =
        error => {

            console.error(
                error
            );

            setState("خطا");

            setStatus(
                "خطا در اتصال WebSocket."
            );
        };

    websocket.onclose =
        () => {

            if (
                stateEl.textContent !==
                "در حال پخش"
            ) {
                setState("قطع");
            }

            setStatus(
                "اتصال سیگنالینگ قطع شد."
            );
        };
}

/* =========================================================
   OFFER
========================================================= */

async function handleOffer(data) {

    if (!peerConnection) {
        createPeerConnection();
    }

    const sdp =
        data.sdp;

    if (!sdp) {
        return;
    }

    await peerConnection.setRemoteDescription(
        new RTCSessionDescription(
            sdp
        )
    );

    const answer =
        await peerConnection.createAnswer();

    await peerConnection.setLocalDescription(
        answer
    );

    sendSignal({
        type: "answer",
        sdp: peerConnection.localDescription
    });

    setStatus(
        "در حال برقراری اتصال ویدیو..."
    );
}

/* =========================================================
   DISCONNECT
========================================================= */

function disconnect() {

    if (websocket) {
        try {
            websocket.close();
        }
        catch (_) {}
    }

    websocket = null;

    if (peerConnection) {
        try {
            peerConnection.close();
        }
        catch (_) {}
    }

    peerConnection = null;

    video.srcObject = null;
}

/* =========================================================
   BUTTON
========================================================= */

connectBtn.addEventListener(
    "click",
    connect
);

/* =========================================================
   AUTO CONNECT
========================================================= */

window.addEventListener(
    "load",
    () => {

        if (
            getStreamId()
        ) {
            connect();
        }

    }
);

</script>

</body>
</html>
