<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta name="theme-color" content="#09090f">

<title>
LainoLive Viewer
</title>


<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}


body{

margin:0;

min-height:100vh;

background:
radial-gradient(
circle at top,
#19192b,
#050508
);

font-family:
Tahoma,
Arial;

color:white;

}



.header{

height:60px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 15px;

background:
rgba(8,8,15,.9);

border-bottom:
1px solid
rgba(255,255,255,.08);

}



.logo{

font-size:20px;

font-weight:900;

}



.back{

background:
rgba(255,255,255,.08);

border:none;

color:white;

width:40px;

height:40px;

border-radius:13px;

font-size:18px;

}



.container{

padding:12px;

}



.video-box{

width:100%;

aspect-ratio:
16/9;

background:black;

border-radius:20px;

overflow:hidden;

position:relative;

}



video{

width:100%;

height:100%;

object-fit:cover;

}



.live-badge{

position:absolute;

top:10px;

right:10px;

background:#ff174f;

padding:
6px 12px;

border-radius:30px;

font-size:12px;

font-weight:bold;

}



.viewer{

position:absolute;

bottom:10px;

right:10px;

background:
rgba(0,0,0,.7);

padding:
7px 12px;

border-radius:20px;

font-size:12px;

}



.card{

margin-top:12px;

padding:15px;

border-radius:18px;

background:
rgba(255,255,255,.06);

border:
1px solid
rgba(255,255,255,.08);

}



.title{

font-size:17px;

font-weight:900;

}



.info{

margin-top:10px;

font-size:12px;

color:#aaa;

line-height:2;

}



.tags{

display:flex;

gap:8px;

flex-wrap:wrap;

margin-top:10px;

}



.tag{

background:
rgba(139,53,255,.18);

padding:
6px 10px;

border-radius:20px;

font-size:11px;

}



.chat-box{

height:320px;

display:flex;

flex-direction:column;

}



.messages{

flex:1;

overflow-y:auto;

padding:10px;

background:
rgba(0,0,0,.2);

border-radius:15px;

}



.message{

margin-bottom:10px;

font-size:13px;

}



.message b{

color:#bd9bff;

}



.chat-input{

display:flex;

gap:8px;

margin-top:10px;

}



.chat-input input{

flex:1;

height:45px;

border:none;

outline:none;

border-radius:14px;

padding:0 12px;

background:
rgba(255,255,255,.08);

color:white;

}



.chat-input button{

width:70px;

border:none;

border-radius:14px;

background:
linear-gradient(
135deg,
#ff2757,
#8b35ff
);

color:white;

font-weight:bold;

}


</style>

</head>


<body>


<header class="header">


<div class="logo">

🎥 LainoLive

</div>


<button
class="back"
onclick="history.back()"
>
←
</button>


</header>


<div class="container">


<div class="video-box">


<video
id="player"
autoplay
playsinline
controls
>

</video>


<div class="live-badge">

🔴 LIVE

</div>


<div
id="viewerCount"
class="viewer"
>

👁 0

</div>


</div>
<div class="card">


<div
id="streamTitle"
class="title"
>

در حال دریافت لایو...

</div>



<div
id="streamInfo"
class="info"
>

اتصال به سرور...

</div>



<div class="tags">


<div
id="videoTag"
class="tag"
>

🎥 کیفیت تصویر

</div>



<div
id="audioTag"
class="tag"
>

🎵 کیفیت صدا

</div>



<div
id="usersTag"
class="tag"
>

👤 کاربران آنلاین

</div>


</div>


</div>







<div class="card chat-box">


<div class="title">

💬 چت آنلاین

</div>



<div
id="messages"
class="messages"
>

</div>




<div class="chat-input">


<input
id="messageInput"
placeholder="پیام بنویس..."
maxlength="200"
/>



<button
id="sendButton"
>

ارسال

</button>



</div>


</div>


</div>






<script>


"use strict";



const player =
document.getElementById(
"player"
);



const streamTitle =
document.getElementById(
"streamTitle"
);



const streamInfo =
document.getElementById(
"streamInfo"
);



const viewerCount =
document.getElementById(
"viewerCount"
);



const videoTag =
document.getElementById(
"videoTag"
);



const audioTag =
document.getElementById(
"audioTag"
);



const usersTag =
document.getElementById(
"usersTag"
);



const messages =
document.getElementById(
"messages"
);



const messageInput =
document.getElementById(
"messageInput"
);



const sendButton =
document.getElementById(
"sendButton"
);





let streamData = null;


let username =
localStorage.getItem(
"lainolive_username"
)
||
"مهمان";




function escapeHtml(
text
){

return String(text ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}







function loadStream(){


const params =
new URLSearchParams(
location.search
);



const id =
params.get(
"id"
);



const saved =
sessionStorage.getItem(
"lainolive_view_stream"
);



if(saved){

try{


streamData =
JSON.parse(
saved
);


}

catch{}



}



if(!streamData){


streamInfo.textContent =
"لایو پیدا نشد";


return;


}



streamTitle.textContent =
"🔴 "
+
(
streamData.title
||
"لایو"
);



const videoQuality =
streamData.video_quality
||
streamData.quality
||
"نامشخص";



const audioQuality =
streamData.audio_quality
||
streamData.audio_bitrate
||
"نامشخص";




videoTag.textContent =
"🎥 "
+
videoQuality;



audioTag.textContent =
"🎵 "
+
audioQuality;





updateViewer();





connectStream();


}





function updateViewer(){


const viewers =

streamData.viewer_count
||
streamData.viewers
||
0;



const users =

streamData.users_count
||
streamData.users
||
0;



viewerCount.textContent =

"👁 "
+
viewers;



usersTag.textContent =

"👤 "
+
users
+
" آنلاین";



streamInfo.innerHTML =

`
سازنده:
${escapeHtml(streamData.username || "کاربر")}

<br>

دسته:
${escapeHtml(streamData.category || "عمومی")}

`;



}






function connectStream(){


/*
اینجا اتصال WebRTC
یا HLS قرار می‌گیرد
*/


if(
streamData.video_url
){


player.src =
streamData.video_url;



}


else{


streamInfo.innerHTML +=
"<br>در انتظار ارسال تصویر از استریمر...";


}



}








/* =====================================================
   CHAT WEBSOCKET
===================================================== */


let chatSocket = null;



function connectChat(){


try{


chatSocket =

new WebSocket(

"wss://mygapino.shop/ws/chat"

);





chatSocket.onopen = ()=>{


addMessage(
"سیستم",
"اتصال به چت برقرار شد ✅"
);


};






chatSocket.onmessage = event =>{


try{


const data =

JSON.parse(
event.data
);



addMessage(

data.username
||
"کاربر",

data.message

);



}

catch{


addMessage(

"پیام",

event.data

);


}



};





chatSocket.onerror = ()=>{


addMessage(

"سیستم",

"خطا در اتصال چت"

);


};





}

catch(error){


console.log(error);


}



}








function addMessage(
user,
text
){


const div =

document.createElement(
"div"
);



div.className =
"message";



div.innerHTML =

`
<b>
${escapeHtml(user)}
:
</b>

${escapeHtml(text)}
`;



messages.appendChild(
div
);



messages.scrollTop =

messages.scrollHeight;


}







function sendMessage(){


const text =

messageInput.value.trim();



if(!text){

return;

}




const data = {


username:

username,


message:

text,


stream_id:

streamData?.id

||
streamData?.stream_id



};





if(

chatSocket

&&

chatSocket.readyState === 1

){


chatSocket.send(

JSON.stringify(
data
)

);



}



else{


addMessage(

username,

text

);



}





messageInput.value = "";


}







sendButton.onclick =

sendMessage;





messageInput.addEventListener(

"keydown",

event=>{


if(
event.key === "Enter"
){


sendMessage();


}



}

);









/* =====================================================
   VIEWER COUNTER
===================================================== */


async function updateViewers(){


if(!streamData){

return;

}




try{


const id =

streamData.id

||

streamData.stream_id;





const response =

await fetch(

"/api/streams/viewers?id="

+

encodeURIComponent(id)

);





if(response.ok){


const data =

await response.json();





streamData.viewer_count =

data.viewer_count
||
data.viewers
||
0;





streamData.users_count =

data.users_count
||
data.users
||
0;





updateViewer();


}



}

catch(error){


console.log(
"viewer update error",
error
);


}



}








/* =====================================================
   LEAVE STREAM
===================================================== */


window.addEventListener(

"beforeunload",

()=>{


if(chatSocket){


chatSocket.close();


}



}

);









/* =====================================================
   START
===================================================== */


loadStream();


connectChat();



setInterval(

()=>{

updateViewers();

},

3000

);



</script>


</body>

</html>
