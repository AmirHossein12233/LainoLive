<script>
"use strict";

/* =========================================================
   ELEMENTS
========================================================= */

const streamIdInput =
    document.getElementById("streamId");

const usernameInput =
    document.getElementById("username");

const preview =
    document.getElementById("preview");

const cameraBtn =
    document.getElementById("cameraBtn");

const screenBtn =
    document.getElementById("screenBtn");

const tabBtn =
    document.getElementById("tabBtn");

const micBtn =
    document.getElementById("micBtn");

const stopSourceBtn =
    document.getElementById("stopSourceBtn");

const connectBtn =
    document.getElementById("connectBtn");

const disconnectBtn =
    document.getElementById("disconnectBtn");

const viewerCountEl =
    document.getElementById("viewerCount");

const broadcasterCountEl =
    document.getElementById("broadcasterCount");

const stateEl =
    document.getElementById("state");

const statusEl =
    document.getElementById("status");

/* =========================================================
   STATE
========================================================= */

let localStream = null;

let websocket = null;

let broadcasterClientId = null;

let currentSource = null;

const peerConnections =
    new Map();

/* =========================================================
   BASIC HELPERS
========================================================= */

function setStatus(text) {
    statusEl.textContent =
        String(text || "");
}

function setState(text) {
    stateEl.textContent =
        String(text || "");
}

function getStreamId() {
    return streamIdInput.value.trim();
}

function getUsername() {
    return usernameInput.value.trim() ||
        "testuser";
}

function isWebSocketOpen() {
    return (
        websocket &&
        websocket.readyState ===
        WebSocket.OPEN
    );
}

/* =========================================================
   API
========================================================= */

async function getStreamInfo() {

    const streamId =
        getStreamId();

    if (!streamId) {
        throw new Error(
            "stream_id وارد نشده است."
        );
    }

    const response =
        await fetch(
            "/api/streams/" +
            encodeURIComponent(streamId),
            {
                method: "GET",
                cache: "no-store"
            }
        );

    let data = {};

    try {
        data =
            await response.json();
    }
    catch (_) {}

    if (
        !response.ok ||
        data.success !== true
    ) {
        throw new Error(
            data.message ||
            "لایو پیدا نشد."
        );
    }

    return data.stream;
}

/* =========================================================
   WEBSOCKET URL
========================================================= */

function getBroadcasterSocketUrl() {

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    return (
        protocol +
        "//" +
        location.host +
        "/ws/broadcaster/" +
        encodeURIComponent(
            getStreamId()
        )
    );
}

/* =========================================================
   SEND SIGNAL
========================================================= */

function sendSignal(payload) {

    if (!isWebSocketOpen()) {
        return false;
    }

    try {

        websocket.send(
            JSON.stringify(payload)
        );

        return true;

    }
    catch (error) {

        console.error(
            "SIGNAL SEND ERROR:",
            error
        );

        return false;
    }
}

/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

    stopLocalTracks();

    try {

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    video: {
                        width: {
                            ideal: 1280
                        },
                        height: {
                            ideal: 720
                        },
                        frameRate: {
                            ideal: 30,
                            max: 30
                        }
                    },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        channelCount: 2
                    }
                });

        localStream =
            stream;

        currentSource =
            "camera";

        preview.srcObject =
            stream;

        setState("دوربین");

        setStatus(
            "دوربین و میکروفن فعال شد."
        );

        await refreshStreamStats();

    }
    catch (error) {

        console.error(error);

        setStatus(
            "دسترسی به دوربین/میکروفن انجام نشد:\n" +
            error.message
        );

        setState("خطا");
    }
}

/* =========================================================
   SCREEN SHARE
========================================================= */

async function startScreenShare() {

    stopLocalTracks();

    try {

        const stream =
            await navigator.mediaDevices
                .getDisplayMedia({
                    video: {
                        frameRate: {
                            ideal: 30,
                            max: 30
                        }
                    },
                    audio: true
                });

        localStream =
            stream;

        currentSource =
            "screen";

        preview.srcObject =
            stream;

        const videoTrack =
            stream.getVideoTracks()[0];

        if (videoTrack) {

            videoTrack.onended =
                () => {

                    setStatus(
                        "اشتراک صفحه متوقف شد."
                    );

                    stopLocalTracks();

                    if (
                        isWebSocketOpen()
                    ) {
                        setState(
                            "متوقف"
                        );
                    }
                };
        }

        setState("صفحه");

        setStatus(
            "اشتراک صفحه فعال شد."
        );

        await refreshStreamStats();

    }
    catch (error) {

        console.error(error);

        setStatus(
            "اشتراک صفحه فعال نشد:\n" +
            error.message
        );

        setState("خطا");
    }
}

/* =========================================================
   TAB SHARE
========================================================= */

async function startTabShare() {

    stopLocalTracks();

    try {

        const stream =
            await navigator.mediaDevices
                .getDisplayMedia({
                    video: {
                        frameRate: {
                            ideal: 30,
                            max: 30
                        }
                    },
                    audio: true
                });

        localStream =
            stream;

        currentSource =
            "tab";

        preview.srcObject =
            stream;

        const videoTrack =
            stream.getVideoTracks()[0];

        if (videoTrack) {

            videoTrack.onended =
                () => {

                    setStatus(
                        "اشتراک تب متوقف شد."
                    );

                    stopLocalTracks();
                };
        }

        setState("تب");

        setStatus(
            "اشتراک تب + صدای تب فعال شد."
        );

        await refreshStreamStats();

    }
    catch (error) {

        console.error(error);

        setStatus(
            "اشتراک تب فعال نشد:\n" +
            error.message
        );

        setState("خطا");
    }
}

/* =========================================================
   MICROPHONE
========================================================= */

async function enableMicrophone() {

    try {

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        channelCount: 2
                    }
                });

        if (!localStream) {

            localStream =
                stream;
        }
        else {

            for (
                const track
                of stream.getAudioTracks()
            ) {

                localStream.addTrack(
                    track
                );
            }
        }

        preview.srcObject =
            localStream;

        setStatus(
            "میکروفن فعال شد."
        );

    }
    catch (error) {

        console.error(error);

        setStatus(
            "میکروفن فعال نشد:\n" +
            error.message
        );
    }
}

/* =========================================================
   STOP SOURCE
========================================================= */

function stopLocalTracks() {

    if (localStream) {

        for (
            const track
            of localStream.getTracks()
        ) {

            try {
                track.stop();
            }
            catch (_) {}
        }
    }

    localStream = null;

    preview.srcObject =
        null;

    currentSource =
        null;
}

/* =========================================================
   CREATE PEER CONNECTION
========================================================= */

function createPeerConnection(
    viewerId
) {

    const id =
        String(viewerId);

    if (
        peerConnections.has(id)
    ) {

        try {
            peerConnections
                .get(id)
                .close();
        }
        catch (_) {}

        peerConnections.delete(id);
    }

    const pc =
        new RTCPeerConnection({
            iceServers: [
                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },
                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }
            ]
        });

    if (localStream) {

        for (
            const track
            of localStream.getTracks()
        ) {

            pc.addTrack(
                track,
                localStream
            );
        }
    }

    pc.onicecandidate =
        event => {

            if (
                !event.candidate
            ) {
                return;
            }

            sendSignal({
                type:
                    "ice-candidate",

                target:
                    id,

                candidate:
                    event.candidate
            });
        };

    pc.onconnectionstatechange =
        () => {

            const state =
                pc.connectionState;

            console.log(
                "Viewer",
                id,
                "connection:",
                state
            );

            if (
                state === "connected"
            ) {

                setStatus(
                    "Viewer " +
                    id +
                    " متصل شد."
                );
            }

            if (
                state === "failed"
            ) {

                setStatus(
                    "اتصال Viewer " +
                    id +
                    " ناموفق شد."
                );
            }

            if (
                state === "closed" ||
                state === "failed"
            ) {

                peerConnections.delete(
                    id
                );
            }
        };

    pc.oniceconnectionstatechange =
        () => {

            console.log(
                "Viewer",
                id,
                "ICE:",
                pc.iceConnectionState
            );
        };

    peerConnections.set(
        id,
        pc
    );

    return pc;
}

/* =========================================================
   CREATE OFFER
========================================================= */

async function createOfferForViewer(
    viewerId
) {

    const id =
        String(viewerId);

    if (!localStream) {

        setStatus(
            "قبل از اتصال Viewer باید دوربین یا صفحه فعال باشد."
        );

        return;
    }

    const pc =
        createPeerConnection(
            id
        );

    try {

        const offer =
            await pc.createOffer({
                offerToReceiveAudio:
                    false,

                offerToReceiveVideo:
                    false
            });

        await pc.setLocalDescription(
            offer
        );

        sendSignal({
            type: "offer",
            target: id,
            sdp: pc.localDescription
        });

        setStatus(
            "Offer برای Viewer " +
            id +
            " ارسال شد."
        );

    }
    catch (error) {

        console.error(
            "OFFER ERROR:",
            error
        );

        setStatus(
            "ساخت Offer ناموفق بود:\n" +
            error.message
        );
    }
}

/* =========================================================
   HANDLE ANSWER
========================================================= */

async function handleAnswer(
    data
) {

    const viewerId =
        data.sender ||
        data.viewer_id ||
        data.viewerId;

    if (!viewerId) {
        return;
    }

    const pc =
        peerConnections.get(
            String(viewerId)
        );

    if (!pc) {
        return;
    }

    if (!data.sdp) {
        return;
    }

    try {

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                data.sdp
            )
        );

        setStatus(
            "Answer Viewer " +
            viewerId +
            " دریافت شد."
        );

    }
    catch (error) {

        console.error(
            "ANSWER ERROR:",
            error
        );

        setStatus(
            "ثبت Answer ناموفق بود:\n" +
            error.message
        );
    }
}

/* =========================================================
   HANDLE ICE
========================================================= */

async function handleIce(
    data
) {

    const viewerId =
        data.sender ||
        data.viewer_id ||
        data.viewerId;

    if (!viewerId) {
        return;
    }

    const pc =
        peerConnections.get(
            String(viewerId)
        );

    if (
        !pc ||
        !data.candidate
    ) {
        return;
    }

    try {

        await pc.addIceCandidate(
            new RTCIceCandidate(
                data.candidate
            )
        );

    }
    catch (error) {

        console.warn(
            "ICE ADD ERROR:",
            error
        );
    }
}

/* =========================================================
   CLOSE VIEWER
========================================================= */

function closeViewer(
    viewerId
) {

    const id =
        String(viewerId);

    const pc =
        peerConnections.get(id);

    if (pc) {

        try {
            pc.close();
        }
        catch (_) {}
    }

    peerConnections.delete(id);
}

/* =========================================================
   CONNECT BROADCASTER
========================================================= */

async function connectBroadcaster() {

    if (!getStreamId()) {

        setStatus(
            "stream_id را وارد کنید."
        );

        return;
    }

    if (!localStream) {

        setStatus(
            "ابتدا دوربین، صفحه یا تب را فعال کنید."
        );

        return;
    }

    try {

        const stream =
            await getStreamInfo();

        if (!stream.is_live) {

            setStatus(
                "این لایو فعال نیست."
            );

            return;
        }

    }
    catch (error) {

        setStatus(
            error.message
        );

        return;
    }

    disconnectWebSocketOnly();

    setState("در حال اتصال");

    setStatus(
        "در حال اتصال broadcaster به سرور..."
    );

    websocket =
        new WebSocket(
            getBroadcasterSocketUrl()
        );

    websocket.onopen =
        () => {

            setState("متصل");

            setStatus(
                "Broadcaster به WebSocket وصل شد."
            );
        };

    websocket.onmessage =
        async event => {

            let data;

            try {

                data =
                    JSON.parse(
                        event.data
                    );

            }
            catch (_) {

                return;
            }

            console.log(
                "BROADCASTER SIGNAL:",
                data
            );

            switch (data.type) {

                case "connected":

                    broadcasterClientId =
                        data.client_id ||
                        null;

                    viewerCountEl.textContent =
                        data.viewer_count ??
                        0;

                    setState("پخش‌کننده");

                    setStatus(
                        "اتصال broadcaster برقرار شد."
                    );

                    break;

                case "viewer-ready":

                    if (
                        data.viewer_id
                    ) {

                        await createOfferForViewer(
                            data.viewer_id
                        );
                    }

                    break;

                case "answer":

                    await handleAnswer(
                        data
                    );

                    break;

                case "ice-candidate":

                    await handleIce(
                        data
                    );

                    break;

                case "candidate":

                    await handleIce(
                        data
                    );

                    break;

                case "viewer-left":

                    if (
                        data.viewer_id
                    ) {

                        closeViewer(
                            data.viewer_id
                        );
                    }

                    await refreshStreamStats();

                    break;

                case "viewer-count":

                    viewerCountEl.textContent =
                        data.count ??
                        0;

                    break;

                case "broadcaster-ready":

                    break;

                default:

                    console.log(
                        "Unhandled broadcaster event:",
                        data
                    );
            }

            if (
                data.stream_id ===
                getStreamId()
            ) {

                await refreshStreamStats();
            }
        };

    websocket.onerror =
        error => {

            console.error(
                "BROADCASTER WS ERROR:",
                error
            );

            setState("خطا");

            setStatus(
                "خطا در WebSocket broadcaster."
            );
        };

    websocket.onclose =
        () => {

            broadcasterClientId =
                null;

            if (
                stateEl.textContent !==
                "متوقف"
            ) {

                setState(
                    "قطع"
                );
            }

            setStatus(
                "WebSocket broadcaster قطع شد."
            );
        };
}

/* =========================================================
   DISCONNECT WEBSOCKET ONLY
========================================================= */

function disconnectWebSocketOnly() {

    if (websocket) {

        try {
            websocket.close();
        }
        catch (_) {}
    }

    websocket = null;

    for (
        const pc
        of peerConnections.values()
    ) {

        try {
            pc.close();
        }
        catch (_) {}
    }

    peerConnections.clear();

    broadcasterClientId =
        null;
}

/* =========================================================
   FULL DISCONNECT
========================================================= */

function disconnectAll() {

    disconnectWebSocketOnly();

    stopLocalTracks();

    setState(
        "متوقف"
    );

    setStatus(
        "اتصال و پخش متوقف شد."
    );

    viewerCountEl.textContent =
        "0";

    broadcasterCountEl.textContent =
        "0";
}

/* =========================================================
   REFRESH STATS
========================================================= */

async function refreshStreamStats() {

    try {

        const stream =
            await getStreamInfo();

        viewerCountEl.textContent =
            stream.viewers ??
            0;

        broadcasterCountEl.textContent =
            stream.broadcasters ??
            0;

    }
    catch (_) {}
}

/* =========================================================
   BUTTONS
========================================================= */

cameraBtn.addEventListener(
    "click",
    startCamera
);

screenBtn.addEventListener(
    "click",
    startScreenShare
);

tabBtn.addEventListener(
    "click",
    startTabShare
);

micBtn.addEventListener(
    "click",
    enableMicrophone
);

stopSourceBtn.addEventListener(
    "click",
    () => {

        stopLocalTracks();

        setStatus(
            "منبع تصویر/صدا متوقف شد."
        );

        setState(
            "آماده"
        );
    }
);

connectBtn.addEventListener(
    "click",
    connectBroadcaster
);

disconnectBtn.addEventListener(
    "click",
    disconnectAll
);

/* =========================================================
   INIT
========================================================= */

(async function init() {

    try {

        const stream =
            await getStreamInfo();

        viewerCountEl.textContent =
            stream.viewers ??
            0;

        broadcasterCountEl.textContent =
            stream.broadcasters ??
            0;

        setStatus(
            "لایو آماده است: " +
            (stream.title || "بدون عنوان")
        );

    }
    catch (_) {

        setStatus(
            "لایو هنوز برای این stream_id پیدا نشد."
        );
    }

})();
</script>
