<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08080d">

    <title>پخش لایو - LainoLive</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background:
                radial-gradient(
                    circle at top,
                    #1a192b 0%,
                    #08080d 52%,
                    #030304 100%
                );
            color: white;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            min-height: 100vh;
            padding-bottom:
                calc(
                    90px +
                    env(safe-area-inset-bottom)
                );
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                calc(
                    12px +
                    env(safe-area-inset-top)
                )
                14px
                12px;

            background: rgba(7,7,12,.94);

            border-bottom:
                1px solid
                rgba(255,255,255,.07);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .back-btn,
        .share-btn {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 13px;
            background: rgba(255,255,255,.07);
            color: white;
            font-size: 18px;
        }

        .header-text {
            min-width: 0;
        }

        .header-title {
            font-size: 16px;
            font-weight: 900;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-user {
            margin-top: 3px;
            color: #9999a7;
            font-size: 10px;
        }

        .video-section {
            position: relative;
            background: black;
            aspect-ratio: 16 / 9;
            overflow: hidden;
        }

        #localVideo {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }

        .video-overlay {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 12px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .status {
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(0,0,0,.72);
            font-size: 10px;
            backdrop-filter: blur(10px);
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-left: 5px;
            border-radius: 50%;
            background: #f5a400;
        }

        .status-dot.live {
            background: #25d366;
        }

        .status-dot.error {
            background: #ff345b;
        }

        .viewer-count {
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(0,0,0,.72);
            font-size: 10px;
            backdrop-filter: blur(10px);
        }

        .info {
            padding: 15px 16px 8px;
        }

        .title {
            font-size: 20px;
            font-weight: 900;
            line-height: 1.6;
        }

        .username {
            margin-top: 5px;
            color: #a5a5b1;
            font-size: 12px;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .pill {
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,.06);
            color: #ceced7;
            font-size: 10px;
        }

        .pill.live {
            background: rgba(255,29,77,.14);
            color: #ff809b;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 10px;
            padding: 10px 16px;
        }

        .action-btn {
            min-height: 48px;
            border: none;
            border-radius: 14px;
            background: rgba(255,255,255,.06);
            color: white;
            font-size: 12px;
            font-weight: 900;
        }

        .action-btn.primary {
            background:
                linear-gradient(
                    135deg,
                    #ff2757,
                    #8b35ff
                );
        }

        .chat-section {
            margin: 12px 16px;
            padding: 15px;
            border-radius: 20px;
            background: rgba(255,255,255,.035);
            border: 1px solid rgba(255,255,255,.07);
        }

        .chat-title {
            font-size: 14px;
            font-weight: 900;
        }

        .messages {
            height: 190px;
            margin-top: 12px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 8px;
            padding: 9px 10px;
            border-radius: 13px;
            background: rgba(255,255,255,.045);
        }

        .message-user {
            color: #bd91ff;
            font-size: 10px;
            font-weight: 900;
        }

        .message-text {
            margin-top: 4px;
            color: #ececf2;
            font-size: 12px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .chat-input-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .chat-input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            padding: 12px 13px;
            border-radius: 13px;
            background: rgba(255,255,255,.07);
            color: white;
            font-size: 12px;
        }

        .chat-send {
            border: none;
            padding: 0 15px;
            border-radius: 13px;
            background:
                linear-gradient(
                    135deg,
                    #ff2757,
                    #8b35ff
                );
            color: white;
            font-weight: 900;
        }

        .bottom-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 300;

            padding:
                10px
                10px
                calc(
                    10px +
                    env(safe-area-inset-bottom)
                );

            background: rgba(7,7,12,.94);

            border-top:
                1px solid
                rgba(255,255,255,.07);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .stop-button {
            width: 100%;
            min-height: 50px;
            border: none;
            border-radius: 15px;
            background:
                linear-gradient(
                    135deg,
                    #ff2757,
                    #8b35ff
                );
            color: white;
            font-size: 13px;
            font-weight: 900;
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 500;

            display: none;
            align-items: flex-end;
            justify-content: center;

            background: rgba(0,0,0,.65);
        }

        .modal.show {
            display: flex;
        }

        .modal-card {
            width: 100%;
            max-width: 560px;

            padding:
                20px
                18px
                calc(
                    20px +
                    env(safe-area-inset-bottom)
                );

            border-radius:
                24px
                24px
                0
                0;

            background: #111119;
        }

        .modal-title {
            font-size: 17px;
            font-weight: 900;
        }

        .share-link {
            width: 100%;
            margin-top: 12px;
            padding: 12px;

            border: none;
            outline: none;
            border-radius: 13px;

            background: rgba(255,255,255,.06);
            color: #c3c3cd;

            direction: ltr;
            font-size: 11px;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 9px;
            margin-top: 12px;
        }

        .modal-btn {
            min-height: 45px;
            border: none;
            border-radius: 13px;
            background: rgba(255,255,255,.07);
            color: white;
            font-weight: 900;
        }

        .modal-close {
            width: 100%;
            margin-top: 9px;
            min-height: 43px;
            border: none;
            border-radius: 13px;
            background: rgba(255,255,255,.04);
            color: #9999a5;
        }

        @media (min-width:700px) {

            .page {
                max-width: 900px;
                margin: 0 auto;
            }

            .bottom-bar {
                left: 50%;
                right: auto;
                width:
                    min(
                        700px,
                        calc(100% - 30px)
                    );

                transform: translateX(-50%);
                bottom: 14px;

                border:
                    1px solid
                    rgba(255,255,255,.07);

                border-radius: 20px;
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header class="header">

        <div class="header-left">

            <button
                id="backButton"
                class="back-btn"
                type="button"
            >
                ←
            </button>

            <div class="header-text">

                <div
                    id="headerTitle"
                    class="header-title"
                >
                    در حال آماده‌سازی لایو...
                </div>

                <div
                    id="headerUser"
                    class="header-user"
                >
                    LainoLive
                </div>

            </div>

        </div>

        <button
            id="shareButton"
            class="share-btn"
            type="button"
        >
            ↗
        </button>

    </header>


    <section class="video-section">

        <video
            id="localVideo"
            autoplay
            muted
            playsinline
        ></video>

        <div class="video-overlay">

            <div
                id="statusBox"
                class="status"
            >
                <span class="status-dot"></span>
                در حال آماده‌سازی...
            </div>

            <div
                id="viewerCount"
                class="viewer-count"
            >
                👁 0 بیننده
            </div>

        </div>

    </section>


    <section class="info">

        <div
            id="streamTitle"
            class="title"
        >
            لایو
        </div>

        <div
            id="streamUsername"
            class="username"
        >
            👤 کاربر
        </div>

        <div class="meta">

            <div class="pill live">
                ● در حال پخش
            </div>

            <div
                id="categoryPill"
                class="pill"
            >
                🎮 عمومی
            </div>

        </div>

    </section>


    <section class="actions">

        <button
            id="cameraButton"
            class="action-btn"
            type="button"
        >
            📷 تعویض دوربین
        </button>

        <button
            id="shareAction"
            class="action-btn primary"
            type="button"
        >
            📤 اشتراک‌گذاری
        </button>

    </section>


    <section class="chat-section">

        <div class="chat-title">
            💬 چت لایو
        </div>

        <div
            id="messages"
            class="messages"
        ></div>

        <div class="chat-input-row">

            <input
                id="chatInput"
                class="chat-input"
                type="text"
                maxlength="250"
                placeholder="پیام خود را بنویسید..."
                autocomplete="off"
            >

            <button
                id="chatSend"
                class="chat-send"

            >
                ارسال
            </button>

        </div>

    </section>

</div>


<div class="bottom-bar">

    <button
        id="stopButton"
        class="stop-button"
        type="button"
    >
        ⏹ پایان لایو
    </button>

</div>


<div
    id="shareModal"
    class="modal"
>

    <div class="modal-card">

        <div class="modal-title">
            اشتراک‌گذاری لایو
        </div>

        <input
            id="shareLink"
            class="share-link"
            readonly
        >

        <div class="modal-actions">

            <button
                id="nativeShareButton"
                class="modal-btn"
                type="button"
            >
                📤 اشتراک‌گذاری
            </button>

            <button
                id="copyShareButton"
                class="modal-btn"
                type="button"
            >
                📋 کپی لینک
            </button>

        </div>

        <button
            id="closeShareButton"
            class="modal-close"
            type="button"
        >
            بستن
        </button>

    </div>

</div>


<script>
const SIGNALING_URL =
    "wss://lainolive-signaling.onrender.com";

const LOGIN_KEY =
    "lainolive_logged_in";

const USERNAME_KEY =
    "lainolive_username";

const CURRENT_STREAM_KEY =
    "lainolive_current_stream";


const localVideo =
    document.getElementById("localVideo");

const statusBox =
    document.getElementById("statusBox");

const viewerCountElement =
    document.getElementById("viewerCount");

const headerTitle =
    document.getElementById("headerTitle");

const headerUser =
    document.getElementById("headerUser");

const streamTitleElement =
    document.getElementById("streamTitle");

const streamUsernameElement =
    document.getElementById("streamUsername");

const categoryPill =
    document.getElementById("categoryPill");

const messages =
    document.getElementById("messages");

const chatInput =
    document.getElementById("chatInput");

const chatSend =
    document.getElementById("chatSend");

const shareModal =
    document.getElementById("shareModal");

const shareLink =
    document.getElementById("shareLink");


if (
    localStorage.getItem(LOGIN_KEY) !== "true"
) {
    window.location.href = "/login.html";
}


let currentUsername =
    localStorage.getItem(USERNAME_KEY) || "";

let stream = null;
let streamId = null;
let localStream = null;
let socket = null;
let stopped = false;
let reconnectTimer = null;
let qualityMonitorTimer = null;

const peerConnections = new Map();

let currentMaxBitrate = 700000;

const BITRATE_LEVELS = [
    250000,
    450000,
    700000
];


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function getId(item) {
    return item?.id ?? item?.stream_id;
}


function getTitle(item) {
    return item?.title || "لایو بدون عنوان";
}


function getUsername(item) {
    return (
        item?.username ||
        item?.user ||
        currentUsername ||
        "کاربر"
    );
}


function getCategory(item) {
    return item?.category || "عمومی";
}


function getViewers(item) {
    return Number(
        item?.viewer_count ??
        item?.viewers ??
        0
    );
}


function setStatus(
    text,
    type = "loading"
) {

    const dot =
        type === "live"
            ? "live"
            : type === "error"
                ? "error"
                : "";

    statusBox.innerHTML =
        `
            <span class="status-dot ${dot}"></span>
            ${escapeHtml(text)}
        `;
}


function updateRealtimeViewerCount(count) {

    const value =
        Math.max(
            0,
            Number(count || 0)
        );

    viewerCountElement.textContent =
        "👁 " +
        value +
        " بیننده";
}


function loadStoredStream() {

    try {

        const saved =
            sessionStorage.getItem(
                CURRENT_STREAM_KEY
            );

        if (!saved) {
            return false;
        }

        const parsed =
            JSON.parse(saved);

        if (!parsed) {
            return false;
        }

        stream = parsed;
        streamId = getId(parsed);

        return Boolean(streamId);

    } catch (error) {

        console.error(
            "load stream error",
            error
        );

        return false;
    }
}


function renderStream() {

    if (!stream) {
        return;
    }

    const title = getTitle(stream);
    const username = getUsername(stream);
    const category = getCategory(stream);

    document.title =
        title + " - LainoLive";

    headerTitle.textContent = title;
    headerUser.textContent = "👤 " + username;

    streamTitleElement.textContent = title;
    streamUsernameElement.textContent =
        "👤 " + username;

    categoryPill.textContent =
        "🎮 " + category;

    updateRealtimeViewerCount(
        getViewers(stream)
    );
}


async function startCamera() {

    setStatus(
        "در حال روشن کردن دوربین..."
    );

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        setStatus(
            "دوربین پشتیبانی نمی‌شود",
            "error"
        );

        throw new Error(
            "getUserMedia unavailable"
        );
    }

    try {

        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {
                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        },

                        frameRate: {
                            ideal: 30,
                            max: 30
                        }
                    },

                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

    } catch (error) {

        console.warn(
            "high quality camera failed",
            error
        );

        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {
                        width: {
                            ideal: 640
                        },

                        height: {
                            ideal: 480
                        },

                        frameRate: {
                            ideal: 24,
                            max: 24
                        }
                    },

                    audio: true
                });
    }

    localVideo.srcObject =
        localStream;

    try {
        await localVideo.play();
    } catch {}

    setStatus(
        "دوربین آماده است",
        "live"
    );
}


function closeViewerConnection(
    viewerId
) {

    const state =
        peerConnections.get(
            viewerId
        );

    if (!state) {
        return;
    }

    try {
        state.pc.close();
    } catch {}

    peerConnections.delete(
        viewerId
    );
}


function createPeerConnection(
    viewerId
) {

    closeViewerConnection(
        viewerId
    );

    const pc =
        new RTCPeerConnection({

            bundlePolicy:
                "max-bundle",

            rtcpMuxPolicy:
                "require",

            iceServers: [
                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },

                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }
            ]
        });


    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track => {

                    pc.addTrack(
                        track,
                        localStream
                    );
                }
            );
    }


    const state = {
        pc,
        remoteDescriptionReady: false,
        pendingIceCandidates: []
    };


    peerConnections.set(
        viewerId,
        state
    );


    pc.onicecandidate =
        event => {

            if (!event.candidate) {
                return;
            }

            sendSignal({

                type:
                    "ice-candidate",

                room_id:
                    String(streamId),

                viewer_id:
                    viewerId,

                candidate:
                    event.candidate
            });
        };


    pc.onconnectionstatechange =
        () => {

            const connectionState =
                pc.connectionState;

            console.log(
                "Viewer:",
                viewerId,
                "connection:",
                connectionState
            );

            if (
                connectionState === "connected"
            ) {

                setStatus(
                    peerConnections.size +
                    " بیننده متصل",
                    "live"
                );
            }

            if (
                connectionState === "failed"
            ) {

                console.warn(
                    "viewer connection failed:",
                    viewerId
                );
            }
        };


    pc.oniceconnectionstatechange =
        () => {

            console.log(
                "Viewer:",
                viewerId,
                "ICE:",
                pc.iceConnectionState
            );
        };


    return state;
}


function sendSignal(
    payload
) {

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {

        return false;
    }

    try {

        socket.send(
            JSON.stringify(payload)
        );

        return true;

    } catch (error) {

        console.error(
            "signal send error",
            error
        );

        return false;
    }
}


async function createOfferForViewer(
    viewerId
) {

    if (
        stopped ||
        !localStream ||
        !viewerId
    ) {
        return;
    }

    const state =
        createPeerConnection(
            viewerId
        );

    try {

        const offer =
            await state.pc.createOffer();

        await state.pc.setLocalDescription(
            offer
        );

        sendSignal({

            type:
                "offer",

            room_id:
                String(streamId),

            viewer_id:
                viewerId,

            offer:
                state.pc.localDescription
        });

        await applyVideoQuality(
            state.pc
        );

        setStatus(
            peerConnections.size +
            " بیننده متصل",
            "live"
        );

    } catch (error) {

        console.error(
            "offer error",
            viewerId,
            error
        );

        closeViewerConnection(
            viewerId
        );
    }
}


async function handleViewerAnswer(
    message
) {

    const viewerId =
        String(
            message.viewer_id || ""
        );

    if (!viewerId) {
        return;
    }

    const state =
        peerConnections.get(
            viewerId
        );

    if (!state) {
        return;
    }

    const answer =
        message.answer ||
        message.description;

    if (!answer) {
        return;
    }

    try {

        await state.pc.setRemoteDescription(
            new RTCSessionDescription(
                answer
            )
        );

        state.remoteDescriptionReady =
            true;

        await flushViewerIce(
            viewerId
        );

        await applyVideoQuality(
            state.pc
        );

        setStatus(
            peerConnections.size +
            " بیننده متصل",
            "live"
        );

    } catch (error) {

        console.error(
            "answer error",
            viewerId,
            error
        );
    }
}


async function handleViewerIce(
    message
) {

    const viewerId =
        String(
            message.viewer_id || ""
        );

    if (!viewerId) {
        return;
    }

    const state =
        peerConnections.get(
            viewerId
        );

    if (!state) {
        return;
    }

    const candidate =
        message.candidate ||
        message.ice;

    if (!candidate) {
        return;
    }

    if (
        !state.remoteDescriptionReady
    ) {

        state.pendingIceCandidates.push(
            candidate
        );

        return;
    }

    try {

        await state.pc.addIceCandidate(
            new RTCIceCandidate(
                candidate
            )
        );

    } catch (error) {

        console.error(
            "ICE error",
            viewerId,
            error
        );
    }
}


async function flushViewerIce(
    viewerId
) {

    const state =
        peerConnections.get(
            viewerId
        );

    if (!state) {
        return;
    }

    while (
        state.pendingIceCandidates.length
    ) {

        const candidate =
            state.pendingIceCandidates.shift();

        try {

            await state.pc.addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

        } catch (error) {

            console.error(
                "flush ICE error",
                viewerId,
                error
            );
        }
    }
}


async function handleSignal(
    message
) {

    const type =
        message?.type;

    console.log(
        "HOST SIGNAL:",
        message
    );


    if (
        type === "viewer-joined"
    ) {

        const viewerId =
            String(
                message.viewer_id || ""
            );

        if (!viewerId) {
            return;
        }

        setStatus(
            "بیننده جدید وارد شد..."
        );

        await createOfferForViewer(
            viewerId
        );

        return;
    }


    if (
        type === "answer"
    ) {

        await handleViewerAnswer(
            message
        );

        return;
    }


    if (
        type === "ice-candidate" ||
        type === "candidate" ||
        type === "ice"
    ) {

        await handleViewerIce(
            message
        );

        return;
    }


    if (
        type === "viewer-left"
    ) {

        const viewerId =
            String(
                message.viewer_id || ""
            );

        if (viewerId) {

            closeViewerConnection(
                viewerId
            );
        }

        setStatus(
            "لایو در حال پخش است",
            "live"
        );

        return;
    }


    if (
        type === "room-info"
    ) {

        updateRealtimeViewerCount(
            message.viewer_count
        );

        const count =
            Number(
                message.viewer_count || 0
            );

        setStatus(
            count > 0
                ? count +
                    " بیننده در حال تماشا"
                : "لایو در حال پخش است",
            "live"
        );

        return;
    }


    if (
        type === "host-replaced"
    ) {

        setStatus(
            "این لایو از جای دیگری شروع شد",
            "error"
        );
    }
}


function connectSignaling() {

    if (stopped) {
        return;
    }

    if (
        socket &&
        (
            socket.readyState ===
                WebSocket.OPEN ||
            socket.readyState ===
                WebSocket.CONNECTING
        )
    ) {
        return;
    }

    setStatus(
        "در حال اتصال به سرور ارتباطی..."
    );

    try {

        socket =
            new WebSocket(
                SIGNALING_URL
            );

    } catch (error) {

        console.error(
            "WebSocket create error",
            error
        );

        scheduleReconnect();

        return;
    }


    socket.onopen =
        () => {

            console.log(
                "HOST SIGNALING CONNECTED"
            );

            sendSignal({

                type:
                    "join",

                room_id:
                    String(streamId),

                role:
                    "host"
            });

            setStatus(
                "لایو آماده است",
                "live"
            );
        };


    socket.onmessage =
        async event => {

            try {

                const message =
                    JSON.parse(
                        event.data
                    );

                await handleSignal(
                    message
                );

            } catch (error) {

                console.error(
                    "signal message error",
                    error
                );
            }
        };


    socket.onerror =
        error => {

            console.error(
                "SIGNALING ERROR",
                error
            );

            setStatus(
                "خطای سرور ارتباطی",
                "error"
            );
        };


    socket.onclose =
        () => {

            if (stopped) {
                return;
            }

            setStatus(
                "اتصال سرور قطع شد",
                "error"
            );

            scheduleReconnect();
        };
}


function scheduleReconnect() {

    if (
        reconnectTimer ||
        stopped
    ) {
        return;
    }

    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;

                connectSignaling();

            },
            3000
        );
}


async function applyVideoQuality(
    pc
) {

    if (!pc) {
        return;
    }

    const sender =
        pc.getSenders()
            .find(
                item =>
                    item.track &&
                    item.track.kind === "video"
            );

    if (!sender) {
        return;
    }

    try {

        const parameters =
            sender.getParameters();

        if (
            !parameters.encodings ||
            parameters.encodings.length === 0
        ) {

            parameters.encodings = [{}];
        }

        const encoding =
            parameters.encodings[0];

        encoding.maxBitrate =
            currentMaxBitrate;

        encoding.maxFramerate =
            currentMaxBitrate <= 250000
                ? 20
                : currentMaxBitrate <= 450000
                    ? 24
                    : 30;

        encoding.scaleResolutionDownBy =
            currentMaxBitrate <= 250000
                ? 2
                : currentMaxBitrate <= 450000
                    ? 1.5
                    : 1;

        await sender.setParameters(
            parameters
        );

    } catch (error) {

        console.warn(
            "quality error",
            error
        );
    }
}


async function monitorConnectionQuality() {

    if (
        peerConnections.size === 0
    ) {
        return;
    }

    let worstLoss = 0;

    for (
        const state of
        peerConnections.values()
    ) {

        const pc =
            state.pc;

        if (
            pc.connectionState !==
            "connected"
        ) {
            continue;
        }

        try {

            const stats =
                await pc.getStats();

            let outbound = null;

            stats.forEach(
                report => {

                    if (
                        report.type ===
                            "outbound-rtp" &&
                        (
                            report.kind ===
                                "video" ||
                            report.mediaType ===
                                "video"
                        )
                    ) {

                        outbound =
                            report;
                    }
                }
            );

            if (!outbound) {
                continue;
            }

            const lost =
                Number(
                    outbound.packetsLost ||
                    0
                );

            const sent =
                Number(
                    outbound.packetsSent ||
                    0
                );

            const total =
                sent + lost;

            if (total <= 0) {
                continue;
            }

            const loss =
                lost / total;

            worstLoss =
                Math.max(
                    worstLoss,
                    loss
                );

        } catch {}
    }


    if (
        worstLoss > 0.08 &&
        currentMaxBitrate > 250000
    ) {

        currentMaxBitrate =
            currentMaxBitrate === 700000
                ? 450000
                : 250000;


        for (
            const state of
            peerConnections.values()
        ) {

            await applyVideoQuality(
                state.pc
            );
        }
    }
}


async function updateViewerCount() {

    if (!streamId) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/streams",
                {
                    cache:
                        "no-store"
                }
            );

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        const streams =
            Array.isArray(
                data.streams
            )
                ? data.streams
                : Array.isArray(data)
                    ? data
                    : [];

        const current =
            streams.find(
                item =>
                    String(
                        getId(item)
                    ) ===
                    String(streamId)
            );

        if (current) {

            stream = current;

            updateRealtimeViewerCount(
                getViewers(current)
            );
        }

    } catch {}
}


async function loadMessages() {

    if (!streamId) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/chat/messages?stream_id=" +
                encodeURIComponent(streamId),
                {
                    cache:
                        "no-store"
                }
            );

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        const list =
            Array.isArray(
                data.messages
            )
                ? data.messages
                : Array.isArray(data)
                    ? data
                    : [];

        messages.innerHTML =
            list
                .map(
                    item => {

                        const username =
                            item.username ||
                            item.user ||
                            "کاربر";

                        const text =
                            item.message ??
                            item.text ??
                            "";

                        return `
                            <div class="message">

                                <div class="message-user">
                                    ${escapeHtml(username)}
                                </div>

                                <div class="message-text">
                                    ${escapeHtml(text)}
                                </div>

                            </div>
                        `;
                    }
                )
                .join("");

        messages.scrollTop =
            messages.scrollHeight;

    } catch {}
}


async function sendChat() {

    const text =
        chatInput.value.trim();

    if (
        !text ||
        !streamId
    ) {
        return;
    }

    chatSend.disabled =
        true;

    try {

        const response =
            await fetch(
                "/api/chat/send",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            stream_id:
                                String(streamId),

                            username:
                                currentUsername,

                            message:
                                text
                        })
                }
            );

        if (response.ok) {

            chatInput.value = "";

            await loadMessages();
        }

    } catch {

    } finally {

        chatSend.disabled =
            false;
    }
}

async function copyShare() {

    const url =
        getShareUrl();

    try {

        await navigator.clipboard
            .writeText(url);

        alert(
            "لینک لایو کپی شد."
        );

    } catch {

        shareLink.select();

        document.execCommand("copy");

        alert(

        );

}


async function nativeShare() {

    const url =
        getShareUrl();

    if (navigator.share) {

        try {

            await navigator.share({
                title:
                    getTitle(stream),

                text:
                    "تماشای لایو در LainoLive",

                url
            });

        } catch {}

        return;
    }

    await copyShare();
}


async function switchCamera() {

    if (!localStream) {
        return;
    }

    const oldTrack =
        localStream
            .getVideoTracks()[0];

    if (!oldTrack) {
        return;
    }

    const settings =
        oldTrack.getSettings();

    const currentFacing =
        settings.facingMode || "user";

    const nextFacing =
        currentFacing === "environment"
            ? "user"
            : "environment";

    try {

        const newStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {
                        facingMode: {
                            exact:
                                nextFacing
                        }
                    },

                    audio: false
                });

        const newTrack =
            newStream
                .getVideoTracks()[0];

        if (!newTrack) {
            return;
        }

        for (
            const state of
            peerConnections.values()
        ) {

            const sender =
                state.pc
                    .getSenders()
                    .find(
                        item =>
                            item.track &&
                            item.track.kind ===
                                "video"
                    );

            if (sender) {

                await sender.replaceTrack(
                    newTrack
                );

                await applyVideoQuality(
                    state.pc
                );
            }
        }

        oldTrack.stop();

        const audioTracks =
            localStream.getAudioTracks();

        localStream =
            new MediaStream([
                newTrack,
                ...audioTracks
            ]);

        localVideo.srcObject =
            localStream;

    } catch (error) {

        console.warn(
            "switch camera error",
            error
        );
    }
}


async function stopStream() {

    if (stopped) {
        return;
    }

    stopped = true;

    if (qualityMonitorTimer) {

        clearInterval(
            qualityMonitorTimer
        );

        qualityMonitorTimer =
            null;
    }

    if (reconnectTimer) {

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer =
            null;
    }

    try {

        await fetch(
            "/api/streams/stop",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        stream_id:
                            String(streamId),

                        username:
                            currentUsername
                    }),

                keepalive: true
            }
        );

    } catch {}

    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {

        try {

            socket.send(
                JSON.stringify({
                    type: "leave",
                    room_id:
                        String(streamId),
                    role: "host"
                })
            );

        } catch {}
    }

    for (
        const state of
        peerConnections.values()
    ) {

        try {
            state.pc.close();
        } catch {}
    }

    peerConnections.clear();

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );
    }

    if (socket) {

        try {
            socket.close();
        } catch {}
    }

    sessionStorage.removeItem(
        CURRENT_STREAM_KEY
    );

    window.location.href =
        "/index.html";
}

        if (stopped) {

        if (
            socket &&
            socket.readyState === WebSocket.OPEN
        ) {

            try {

                socket.send(
                    JSON.stringify({
                        type: "leave",
                        room_id:
                            String(streamId),
                        role: "host"
                    })
                );

            } catch {}
        }
    }
);


async function start() {

    try {

        if (!loadStoredStream()) {

            setStatus(
                "لایو پیدا نشد",
                "error"
            );

            return;
        }

        renderStream();

        await startCamera();

        connectSignaling();

        await loadMessages();

        await updateViewerCount();

        setInterval(
            loadMessages,
            3000
        );

        setInterval(
            updateViewerCount,
            3000
        );

        qualityMonitorTimer =
            setInterval(
                monitorConnectionQuality,
                4000
            );

    } catch (error) {

        console.error(
            "LIVE START ERROR",
            error
        );

        setStatus(
            "اجرای لایو ناموفق بود",
            "error"
        );
    }
}


start();
