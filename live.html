<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#020617"
    >

    <title>پخش زنده | LainoLive</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: #020617;
            overflow: hidden;
        }

        .live-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .live-header {
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 14px;
            background: #111827;
            border-bottom: 1px solid #273449;
        }

        .live-header-left,
        .live-header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-title-area {
            min-width: 0;
        }

        .live-title {
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .live-user {
            margin-top: 3px;
            color: #94a3b8;
            font-size: 11px;
        }

        .live-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #fecaca;
            font-size: 11px;
            background: #3f0a0a;
            padding: 6px 8px;
            border-radius: 8px;
        }

        .live-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        .live-main {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
        }

        .camera-area {
            min-width: 0;
            min-height: 0;
            position: relative;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #cameraPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000000;
        }

        .camera-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        .camera-placeholder-box {
            max-width: 340px;
            padding: 25px;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid #273449;
        }

        .camera-icon {
            font-size: 60px;
            margin-bottom: 12px;
        }

        .camera-placeholder h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .camera-placeholder p {
            margin: 0;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.8;
        }

        .camera-controls {
            position: absolute;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .camera-button {
            border: 0;
            border-radius: 12px;
            padding: 12px 15px;
            color: #ffffff;
            background: #1e293b;
            border: 1px solid #334155;
            font-weight: bold;
            cursor: pointer;
        }

        .camera-button:hover {
            background: #273449;
        }

        .camera-button.start {
            background: #22c55e;
            border-color: #22c55e;
        }

        .camera-button.start:hover {
            background: #16a34a;
        }

        .camera-button.stop {
            background: #ef4444;
            border-color: #ef4444;
        }

        .chat-panel {
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #111827;
            border-right: 1px solid #273449;
        }

        .chat-header {
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid #273449;
        }

        .chat-header-title {
            font-weight: bold;
        }

        .chat-online {
            color: #86efac;
            font-size: 11px;
        }

        .chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 12px;
        }

        .chat-empty {
            text-align: center;
            color: #64748b;
            padding: 70px 10px;
            font-size: 13px;
        }

        .chat-message {
            margin-bottom: 12px;
        }

        .chat-user {
            color: #86efac;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .chat-owner {
            color: #fbbf24;
        }

        .chat-text {
            color: #e2e8f0;
            font-size: 13px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .chat-form {
            display: flex;
            gap: 7px;
            padding: 9px;
            border-top: 1px solid #273449;
        }

        .chat-input {
            flex: 1;
            min-width: 0;
            border: 1px solid #334155;
            outline: none;
            border-radius: 11px;
            padding: 12px;
            background: #1e293b;
            color: #ffffff;
            font-family: inherit;
            font-size: 13px;
        }

        .chat-input:focus {
            border-color: #22c55e;
        }

        .chat-send {
            border: 0;
            border-radius: 11px;
            padding: 0 15px;
            background: #22c55e;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info-bar {
            padding: 9px 12px;
            background: #0f172a;
            border-top: 1px solid #273449;
            color: #94a3b8;
            font-size: 11px;
            line-height: 1.7;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translate(-50%, 20px);
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            padding: 10px 15px;
            border-radius: 11px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #ffffff;
            font-size: 13px;
            transition: 0.2s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 800px) {
            body {
                overflow: auto;
            }

            .live-page {
                height: auto;
                min-height: 100vh;
            }

            .live-main {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(300px, 55vh) minmax(340px, 45vh);
            }

            .chat-panel {
                border-right: 0;
                border-top: 1px solid #273449;
            }

            .live-header {
                position: sticky;
                top: 0;
                z-index: 20;
            }

            .camera-area {
                min-height: 300px;
            }
        }
    </style>
</head>

<body>

<script>
    const loggedIn =
        localStorage.getItem(
            "lainolive_logged_in"
        );

    const currentUsername =
        localStorage.getItem(
            "lainolive_username"
        );

    if (
        loggedIn !== "true" ||
        !currentUsername
    ) {
        window.location.replace(
            "/login.html"
        );
    }
</script>


<div class="live-page">

    <header class="live-header">

        <div class="live-header-left">

            <button
                id="backButton"
                class="icon-button"
                type="button"
            >
                ←
            </button>

            <div class="live-title-area">

                <div
                    id="liveTitle"
                    class="live-title"
                >
                    پخش زنده
                </div>

                <div
                    id="liveUser"
                    class="live-user"
                >
                    در حال آماده‌سازی
                </div>

            </div>

        </div>


        <div class="live-header-right">

            <div
                id="liveStatus"
                class="live-status"
            >
                <span
                    class="live-status-dot"
                ></span>

                <span>
                    آماده
                </span>
            </div>

        </div>

    </header>


    <main class="live-main">

        <!-- CAMERA -->

        <section class="camera-area">

            <video
                id="cameraPreview"
                autoplay
                muted
                playsinline
            ></video>


            <div
                id="cameraPlaceholder"
                class="camera-placeholder"
            >

                <div class="camera-placeholder-box">

                    <div class="camera-icon">
                        📹
                    </div>

                    <h2>
                        آماده پخش زنده
                    </h2>

                    <p>
                        برای فعال کردن دوربین و میکروفون،
                        روی «شروع دوربین» بزن.
                    </p>

                </div>

            </div>


            <div class="camera-controls">

                <button
                    id="cameraButton"
                    class="camera-button start"
                    type="button"
                >
                    🎥 شروع دوربین
                </button>

                <button
                    id="stopLiveButton"
                    class="camera-button stop"
                    type="button"
                >
                    ⛔ پایان لایو
                </button>

            </div>

        </section>


        <!-- CHAT -->

        <section class="chat-panel">

            <div class="chat-header">

                <div class="chat-header-title">
                    💬 چت زنده
                </div>

                <div
                    id="chatOnline"
                    class="chat-online"
                >
                    آنلاین
                </div>

            </div>


            <div
                id="chatMessages"
                class="chat-messages"
            >

                <div class="chat-empty">
                    هنوز پیامی ارسال نشده است.
                </div>

            </div>


            <form
                id="chatForm"
                class="chat-form"
            >

                <input
                    id="chatInput"
                    class="chat-input"
                    type="text"
                    maxlength="500"
                    autocomplete="off"
                    placeholder="پیام بنویس..."
                >

                <button
                    id="chatSend"
                    class="chat-send"
                    type="submit"
                >
                    ارسال
                </button>

            </form>


            <div class="info-bar">
                پیام‌های این لایو از سرور دریافت می‌شوند.
            </div>

        </section>

    </main>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

    const currentStreamRaw =
        sessionStorage.getItem(
            "lainolive_current_stream"
        );


    let currentStream = null;


    if (currentStreamRaw) {

        try {
            currentStream =
                JSON.parse(
                    currentStreamRaw
                );
        } catch (error) {

            currentStream = null;
        }
    }


    const liveTitle =
        document.getElementById(
            "liveTitle"
        );

    const liveUser =
        document.getElementById(
            "liveUser"
        );

    const liveStatus =
        document.getElementById(
            "liveStatus"
        );

    const cameraPreview =
        document.getElementById(
            "cameraPreview"
        );

    const cameraPlaceholder =
        document.getElementById(
            "cameraPlaceholder"
        );

    const cameraButton =
        document.getElementById(
            "cameraButton"
        );

    const stopLiveButton =
        document.getElementById(
            "stopLiveButton"
        );

    const chatMessages =
        document.getElementById(
            "chatMessages"
        );

    const chatForm =
        document.getElementById(
            "chatForm"
        );

    const chatInput =
        document.getElementById(
            "chatInput"
        );

    const chatSend =
        document.getElementById(
            "chatSend"
        );

    const toast =
        document.getElementById(
            "toast"
        );


    let mediaStream = null;

    let lastChatId = "";

    let chatInterval = null;

    let cameraStarted = false;


    /*
     * =====================================================
     * NO STREAM
     * =====================================================
     */

    if (!currentStream) {

        liveTitle.textContent =
            "لایوی انتخاب نشده";

        liveUser.textContent =
            currentUsername;

        cameraButton.disabled =
            true;

        stopLiveButton.disabled =
            true;

        cameraPlaceholder.innerHTML = `
            <div class="camera-placeholder-box">

                <div class="camera-icon">
                    ⚠️
                </div>

                <h2>
                    لایو پیدا نشد
                </h2>

                <p>
                    ابتدا از صفحه اصلی یک لایو بساز.
                </p>

            </div>
        `;

    } else {

        liveTitle.textContent =
            currentStream.title;

        liveUser.textContent =
            "صاحب لایو: " +
            currentStream.username;
    }


    /*
     * =====================================================
     * TOAST
     * =====================================================
     */

    function showToast(text) {

        toast.textContent =
            text;

        toast.classList.add(
            "show"
        );

        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );
    }


    /*
     * =====================================================
     * ESCAPE
     * =====================================================
     */

    function escapeHtml(text) {

        return String(text)
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );
    }


    /*
     * =====================================================
     * STATUS
     * =====================================================
     */

    function setLiveStatus(
        text,
        color,
        background
    ) {

        liveStatus.innerHTML = `
            <span
                class="live-status-dot"
                style="background:${color};"
            ></span>

            <span>
                ${escapeHtml(text)}
            </span>
        `;

        liveStatus.style.background =
            background;
    }


    /*
     * =====================================================
     * CAMERA
     * =====================================================
     */

    async function startCamera() {

        if (cameraStarted) {
            return;
        }

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            showToast(
                "مرورگر از دوربین پشتیبانی نمی‌کند."
            );

            return;
        }

        cameraButton.disabled =
            true;

        cameraButton.textContent =
            "در حال فعال‌سازی...";

        try {

            mediaStream =
                await navigator.mediaDevices.getUserMedia(
                    {
                        video: true,
                        audio: true
                    }
                );


            cameraPreview.srcObject =
                mediaStream;


            cameraPlaceholder.style.display =
                "none";


            cameraStarted = true;


            cameraButton.textContent =
                "✅ دوربین فعال است";

            cameraButton.classList.remove(
                "start"
            );


            setLiveStatus(
                "LIVE",
                "#22c55e",
                "#132b1d"
            );


            showToast(
                "دوربین و میکروفون فعال شدند."
            );

        } catch (error) {

            console.error(error);

            cameraButton.disabled =
                false;

            cameraButton.textContent =
                "🎥 شروع دوربین";

            showToast(
                "دسترسی دوربین یا میکروفون داده نشد."
            );
        }
    }


    function stopCamera() {

        if (!mediaStream) {
            return;
        }

        mediaStream
            .getTracks()
            .forEach(
                track => track.stop()
            );


        mediaStream = null;

        cameraPreview.srcObject =
            null;

        cameraStarted = false;

        cameraPlaceholder.style.display =
            "flex";

        cameraButton.disabled =
            false;

        cameraButton.textContent =
            "🎥 شروع دوربین";

        cameraButton.classList.add(
            "start"
        );


        setLiveStatus(
            "متوقف",
            "#94a3b8",
            "#1e293b"
        );
    }


    cameraButton.addEventListener(
        "click",
        startCamera
    );


    /*
     * =====================================================
     * LOAD CHAT
     * =====================================================
     */

    async function loadChat() {

        if (!currentStream) {
            return;
        }

        try {

            const params =
                new URLSearchParams();

            params.set(
                "stream_id",
                currentStream.id
            );


            if (lastChatId) {

                params.set(
                    "after_id",
                    lastChatId
                );
            }


            const response =
                await fetch(
                    "/api/chat/messages?" +
                    params.toString(),
                    {
                        cache: "no-store"
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {
                return;
            }


            const messages =
                data.messages || [];


            if (!messages.length) {
                return;
            }


            const empty =
                chatMessages.querySelector(
                    ".chat-empty"
                );


            if (empty) {
                empty.remove();
            }


            messages.forEach(
                message => {

                    const element =
                        document.createElement(
                            "div"
                        );

                    element.className =
                        "chat-message";


                    const isOwner =
                        message.username ===
                        currentUsername;


                    element.innerHTML = `
                        <div
                            class="${
                                isOwner
                                    ? "chat-user chat-owner"
                                    : "chat-user"
                            }"
                        >
                            ${
                                escapeHtml(
                                    message.username
                                )
                            }
                            ${
                                isOwner
                                    ? " 👑"
                                    : ""
                            }
                        </div>

                        <div class="chat-text">
                            ${
                                escapeHtml(
                                    message.text
                                )
                            }
                        </div>
                    `;


                    chatMessages.appendChild(
                        element
                    );


                    lastChatId =
                        message.id;
                }
            );


            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        } catch (error) {

            console.error(
                "Chat error:",
                error
            );
        }
    }


    /*
     * =====================================================
     * SEND CHAT
     * =====================================================
     */

    chatForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            if (!currentStream) {
                return;
            }


            const text =
                chatInput.value.trim();


            if (!text) {
                return;
            }


            chatSend.disabled =
                true;


            try {

                const response =
                    await fetch(
                        "/api/chat/send",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                stream_id:
                                    currentStream.id,

                                username:
                                    currentUsername,

                                text:
                                    text

                            })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    showToast(
                        data.message ||
                        "ارسال پیام ناموفق بود."
                    );

                    return;
                }


                chatInput.value = "";


                await loadChat();

            } catch (error) {

                showToast(
                    "خطا در ارسال پیام."
                );

            } finally {

                chatSend.disabled =
                    false;

                chatInput.focus();
            }
        }
    );


    /*
     * =====================================================
     * STOP LIVE
     * =====================================================
     */

    stopLiveButton.addEventListener(
        "click",
        async () => {

            if (!currentStream) {
                return;
            }


            try {

                const response =
                    await fetch(
                        "/api/streams/stop",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                stream_id:
                                    currentStream.id,

                                username:
                                    currentUsername

                            })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    showToast(
                        data.message ||
                        "توقف لایو ناموفق بود."
                    );

                    return;
                }


                stopCamera();


                clearInterval(
                    chatInterval
                );


                sessionStorage.removeItem(
                    "lainolive_current_stream"
                );


                showToast(
                    "لایو پایان یافت."
                );


                setTimeout(
                    () => {

                        window.location.href =
                            "/index.html";

                    },
                    700
                );


            } catch (error) {

                showToast(
                    "خطا در پایان لایو."
                );
            }
        }
    );


    /*
     * =====================================================
     * BACK
     * =====================================================
     */

    document
        .getElementById(
            "backButton"
        )
        .addEventListener(
            "click",
            async () => {

                stopCamera();

                clearInterval(
                    chatInterval
                );

                window.location.href =
                    "/index.html";
            }
        );


    /*
     * =====================================================
     * CLEANUP
     * =====================================================
     */

    window.addEventListener(
        "beforeunload",
        () => {

            stopCamera();
        }
    );


    /*
     * =====================================================
     * START CHAT POLLING
     * =====================================================
     */

    if (currentStream) {

        loadChat();


        chatInterval =
            setInterval(
                loadChat,
                2000
            );
    }

</script>

</body>

</html>
