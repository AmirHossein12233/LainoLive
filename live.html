<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d0f14;
    color: #fff;
    font-family: Tahoma, Arial, sans-serif;
}

.container {
    width: min(1000px, 94%);
    margin: 25px auto;
}

.card {
    background: #171a21;
    border: 1px solid #292e38;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 15px 45px rgba(0,0,0,.25);
}

h1 {
    margin-top: 0;
}

video {
    width: 100%;
    max-height: 65vh;
    background: #000;
    border-radius: 15px;
    display: block;
    object-fit: contain;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 12px 16px;
    cursor: pointer;
    background: #ff2757;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
}

button.secondary {
    background: #292e38;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
}

input {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: 1px solid #343a46;
    background: #0f1217;
    color: white;
    outline: none;
}

.status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 12px;
    background: #10131a;
    color: #ddd;
    white-space: pre-wrap;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.stat {
    background: #10131a;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
}

.stat b {
    display: block;
    font-size: 22px;
    margin-top: 5px;
}

@media (max-width: 700px) {
    .row {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: 1fr;
    }
}
</style>

</head>

<body>

<div class="container">

```

</div>

<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const API_BASE = window.location.origin;

const streamIdInput = document.getElementById("streamId");
const usernameInput = document.getElementById("username");

const preview = document.getElementById("preview");

const cameraBtn = document.getElementById("cameraBtn");
const screenBtn = document.getElementById("screenBtn");
const tabBtn = document.getElementById("tabBtn");
const micBtn = document.getElementById("micBtn");
const stopSourceBtn = document.getElementById("stopSourceBtn");

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

const viewerCount = document.getElementById("viewerCount");
const broadcasterCount = document.getElementById("broadcasterCount");
const stateEl = document.getElementById("state");
const statusEl = document.getElementById("status");

let localStream = null;
let websocket = null;

let isConnected = false;
let currentSource = null;

const peerConnections = new Map();

/* =========================================================
   HELPERS
========================================================= */

function setStatus(text) {
    statusEl.textContent = text;
}

function setState(text) {
    stateEl.textContent = text;
}

function getStreamId() {
    return streamIdInput.value.trim();
}

function getUsername() {
    return usernameInput.value.trim() || "testuser";
}

function wsUrl() {
    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    return (
        protocol +
        "//" +
        location.host +
        "/ws/stream/" +
        encodeURIComponent(getStreamId()) +
        "?role=broadcaster&username=" +
        encodeURIComponent(getUsername())
    );
}

/* =========================================================
   API
========================================================= */

async function getStreamInfo() {
    const id = getStreamId();

    if (!id) {
        throw new Error("stream_id وارد نشده است.");
    }

    const response = await fetch(
        API_BASE + "/api/streams/" + encodeURIComponent(id),
        {
            method: "GET",
            cache: "no-store"
        }
    );

    const data = await response.json();

    if (!response.ok || data.success !== true) {
        throw new Error(
            data.message || "لایو پیدا نشد."
        );
    }

    return data.stream;
}

/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {
    try {
        stopLocalTracks();

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    width: {
                        ideal: 1280
                    },
                    height: {
                        ideal: 720
                    },
                    frameRate: {
                        ideal: 30,
                        max: 30
                    }
                },
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });

        localStream = stream;
        currentSource = "camera";

        preview.srcObject = stream;

        setStatus("دوربین و میکروفن فعال شدند.");
        setState("دوربین");
    }
    catch (error) {
        console.error(error);

        setStatus(
            "خطا در دسترسی به دوربین/میکروفن:\n" +
            error.message
        );
    }
}

/* =========================================================
   SCREEN
========================================================= */

async function startScreenShare(withAudio = true) {
    try {
        stopLocalTracks();

        const stream =
            await navigator.mediaDevices.getDisplayMedia({
                video: {
                    frameRate: {
                        ideal: 30,
                        max: 30
                    }
                },
                audio: withAudio
            });

        localStream = stream;
        currentSource = "screen";

        preview.srcObject = stream;

        const videoTrack =
            stream.getVideoTracks()[0];

        if (videoTrack) {
            videoTrack.addEventListener(
                "ended",
                () => {
                    setStatus(
                        "اشتراک صفحه توسط مرورگر متوقف شد."
                    );

                    stopLocalTracks();
                }
            );
        }

        setStatus(
            withAudio
                ? "اشتراک صفحه با صدا فعال شد."
                : "اشتراک صفحه فعال شد."
        );

        setState("صفحه");
    }
    catch (error) {
        console.error(error);

        setStatus(
            "اشتراک صفحه فعال نشد:\n" +
            error.message
        );
    }
}

/* =========================================================
   TAB
========================================================= */

async function startTabShare() {
    await startScreenShare(true);
}

/* =========================================================
   MICROPHONE
========================================================= */

async function enableMicrophone() {
    try {
        const micStream =
            await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });

        if (!localStream) {
            localStream = micStream;
        }
        else {
            for (
                const track of
                micStream.getAudioTracks()
            ) {
                localStream.addTrack(track);
            }
        }

        preview.srcObject = localStream;

        setStatus("میکروفن فعال شد.");
    }
    catch (error) {
        console.error(error);

        setStatus(
            "میکروفن فعال نشد:\n" +
            error.message
        );
    }
}

/* =========================================================
   STOP TRACKS
========================================================= */

function stopLocalTracks() {
    if (localStream) {
        for (
            const track of
            localStream.getTracks()
        ) {
            try {
                track.stop();
            }
            catch (_) {}
        }
    }

    localStream = null;
    preview.srcObject = null;
    currentSource = null;
}

/* =========================================================
   RTC
========================================================= */

function createPeerConnection(viewerId) {

    const pc =
        new RTCPeerConnection({
            iceServers: [
                {
                    urls: "stun:stun.l.google.com:19302"
                },
                {
                    urls: "stun:stun1.l.google.com:19302"
                }
            ]
        });

    if (localStream) {
        for (
            const track
            of localStream.getTracks()
        ) {
            pc.addTrack(
                track,
                localStream
            );
        }
    }

    pc.onicecandidate = event => {

        if (!event.candidate) {
            return;
        }

        sendSignal({
            type: "ice",
            target: viewerId,
            candidate: event.candidate
        });
    };

    pc.onconnectionstatechange = () => {

        console.log(
            "PC",
            viewerId,
            pc.connectionState
        );

        if (
            pc.connectionState ===
            "failed" ||
            pc.connectionState ===
            "closed"
        ) {
            try {
                pc.close();
            }
            catch (_) {}

            peerConnections.delete(
                viewerId
            );
        }
    };

    peerConnections.set(
        viewerId,
        pc
    );

    return pc;
}

/* =========================================================
   SIGNAL
========================================================= */

function sendSignal(data) {

    if (
        !websocket ||
        websocket.readyState !==
        WebSocket.OPEN
    ) {
        return;
    }

    websocket.send(
        JSON.stringify(data)
    );
}

/* =========================================================
   OFFER
========================================================= */

async function sendOffer(viewerId) {

    let pc =
        peerConnections.get(viewerId);

    if (!pc) {
        pc =
            createPeerConnection(
                viewerId
            );
    }

    const offer =
        await pc.createOffer();

    await pc.setLocalDescription(
        offer
    );

    sendSignal({
        type: "offer",
        target: viewerId,
        sdp: pc.localDescription
    });
}

/* =========================================================
   WEBSOCKET
========================================================= */

function connectWebSocket() {

    if (websocket) {
        try {
            websocket.close();
        }
        catch (_) {}
    }

    websocket =
        new WebSocket(
            wsUrl()
        );

    websocket.onopen = async () => {

        setStatus(
            "اتصال WebSocket برقرار شد."
        );

        setState("متصل");

        isConnected = true;

        try {
            const stream =
                await getStreamInfo();

            viewerCount.textContent =
                stream.viewers ?? 0;

            broadcasterCount.textContent =
                stream.broadcasters ?? 0;
        }
        catch (_) {}
    };

    websocket.onmessage = async event => {

        let data;

        try {
            data =
                JSON.parse(
                    event.data
                );
        }
        catch (_) {
            return;
        }

        console.log(
            "SIGNAL:",
            data
        );

        switch (data.type) {

            case "viewer_joined":

                {
                    const viewerId =
                        data.viewer_id ||
                        data.viewerId ||
                        data.id;

                    if (viewerId) {

                        await sendOffer(
                            String(viewerId)
                        );
                    }
                }

                break;

            case "answer":

                {
                    const viewerId =
                        data.viewer_id ||
                        data.viewerId ||
                        data.sender ||
                        data.from ||
                        data.id;

                    const pc =
                        peerConnections.get(
                            String(viewerId)
                        );

                    if (
                        pc &&
                        data.sdp
                    ) {
                        await pc.setRemoteDescription(
                            new RTCSessionDescription(
                                data.sdp
                            )
                        );
                    }
                }

                break;

            case "ice":

                {
                    const viewerId =
                        data.viewer_id ||
                        data.viewerId ||
                        data.sender ||
                        data.from;

                    const pc =
                        peerConnections.get(
                            String(viewerId)
                        );

                    if (
                        pc &&
                        data.candidate
                    ) {
                        try {
                            await pc.addIceCandidate(
                                new RTCIceCandidate(
                                    data.candidate
                                )
                            );
                        }
                        catch (error) {
                            console.warn(
                                "ICE error:",
                                error
                            );
                        }
                    }
                }

                break;

            case "viewer_left":

                {
                    const viewerId =
                        data.viewer_id ||
                        data.viewerId ||
                        data.id;

                    const pc =
                        peerConnections.get(
                            String(viewerId)
                        );

                    if (pc) {
                        try {
                            pc.close();
                        }
                        catch (_) {}

                        peerConnections.delete(
                            String(viewerId)
                        );
                    }
                }

                break;

            case "stats":

                viewerCount.textContent =
                    data.viewers ?? 0;

                broadcasterCount.textContent =
                    data.broadcasters ?? 0;

                break;

            case "error":

                setStatus(
                    "خطای سرور:\n" +
                    (
                        data.message ||
                        "خطای نامشخص"
                    )
                );

                break;

            default:

                console.log(
                    "Unhandled signal:",
                    data
                );
        }
    };

    websocket.onerror = error => {

        console.error(
            "WebSocket error:",
            error
        );

        setStatus(
            "خطا در WebSocket."
        );

        setState("خطا");
    };

    websocket.onclose = () => {

        isConnected = false;

        setState("قطع");

        setStatus(
            "اتصال WebSocket قطع شد."
        );
    };
}

/* =========================================================
   START
========================================================= */

startBtn.addEventListener(
    "click",
    async () => {

        try {

            if (!localStream) {
                await startCamera();
            }

            if (!localStream) {
                return;
            }

            const info =
                await getStreamInfo();

            setStatus(
                "لایو پیدا شد:\n" +
                info.title
            );

            connectWebSocket();
        }
        catch (error) {

            console.error(error);

            setStatus(
                "شروع اتصال انجام نشد:\n" +
                error.message
            );
        }
    }
);

/* =========================================================
   STOP
========================================================= */

stopBtn.addEventListener(
    "click",
    () => {

        for (
            const pc
            of peerConnections.values()
        ) {
            try {
                pc.close();
            }
            catch (_) {}
        }

        peerConnections.clear();

        if (websocket) {
            try {
                websocket.close();
            }
            catch (_) {}
        }

        websocket = null;

        stopLocalTracks();

        setState("متوقف");

        setStatus(
            "پخش متوقف شد."
        );
    }
);

/* =========================================================
   BUTTONS
========================================================= */

cameraBtn.addEventListener(
    "click",
    startCamera
);

screenBtn.addEventListener(
    "click",
    () => startScreenShare(false)
);

tabBtn.addEventListener(
    "click",
    startTabShare
);

micBtn.addEventListener(
    "click",
    enableMicrophone
);

stopSourceBtn.addEventListener(
    "click",
    stopLocalTracks
);

/* =========================================================
   INIT
========================================================= */

(async function init() {

    try {

        const info =
            await getStreamInfo();

        viewerCount.textContent =
            info.viewers ?? 0;

        broadcasterCount.textContent =
            info.broadcasters ?? 0;

        setStatus(
            "لایو آماده است: " +
            info.title
        );

    }
    catch (error) {

        setStatus(
            "در حال آماده‌سازی لایو..."
        );
    }

})();
</script>
