<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#090b12"
    >

    <title>
        LainoLive - پخش زنده
    </title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(90, 58, 180, 0.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(0, 150, 255, 0.07),
                    transparent 35%
                ),
                #090b12;

            color: #ffffff;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            min-height: 100vh;
        }

        /* =========================
           TOPBAR
        ========================= */

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                calc(12px + env(safe-area-inset-top))
                14px
                12px;

            background:
                rgba(
                    9,
                    11,
                    18,
                    0.96
                );

            border-bottom:
                1px solid
                #202536;

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 12px;

            background: #171b29;
            color: #ffffff;

            font-size: 20px;
        }

        .top-title {
            font-size: 16px;
            font-weight: 900;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 7px;

            padding:
                8px
                12px;

            border-radius: 999px;

            background:
                rgba(
                    255,
                    45,
                    85,
                    0.14
                );

            color: #ff5578;

            font-size: 12px;
            font-weight: 900;
        }

        .live-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #ff365f;

            box-shadow:
                0 0 12px
                rgba(
                    255,
                    54,
                    95,
                    0.8
                );
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            width: min(
                1250px,
                100%
            );

            margin:
                0
                auto;

            padding: 16px;
        }

        .layout {
            display: grid;

            grid-template-columns:
                minmax(
                    0,
                    1fr
                )
                360px;

            gap: 16px;

            align-items:
                start;
        }

        /* =========================
           CARDS
        ========================= */

        .video-card,
        .panel,
        .info-card {

            background:
                #10131c;

            border:
                1px solid
                #23283a;

            border-radius:
                18px;
        }

        .video-card {
            overflow: hidden;
        }

        /* =========================
           VIDEO
        ========================= */

        .video-wrap {
            position: relative;

            width: 100%;

            aspect-ratio:
                16 / 9;

            background:
                #000000;

            overflow: hidden;
        }

        #localVideo {

            display: block;

            width: 100%;
            height: 100%;

            object-fit:
                contain;

            background:
                #000000;
        }

        .overlay {

            position: absolute;

            inset: 0;

            pointer-events:
                none;
        }

        .status-pill,
        .viewer-pill {

            position: absolute;

            top: 12px;

            padding:
                8px
                11px;

            border-radius:
                10px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.64
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            font-size:
                11px;
        }

        .status-pill {
            right: 12px;
        }

        .viewer-pill {
            left: 12px;
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {

            display:
                flex;

            flex-wrap:
                wrap;

            gap: 9px;

            padding: 12px;

            background:
                #0e1119;
        }

        .control-btn {

            min-height: 44px;

            padding:
                0
                13px;

            border: none;

            border-radius:
                12px;

            background:
                #191e2d;

            color:
                #ffffff;

            font-size:
                12px;

            font-weight:
                800;
        }

        .control-btn.active {

            background:
                #5c43dd;
        }

        .control-btn.red {

            background:
                #d72f50;
        }

        .control-btn:hover {

            filter:
                brightness(
                    1.08
                );
        }

        /* =========================
           INFO
        ========================= */

        .info-card {

            margin-top:
                14px;

            padding:
                16px;
        }

        .stream-title {

            margin:
                0;

            font-size:
                20px;

            line-height:
                1.6;
        }

        .meta-row {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                8px;

            margin-top:
                11px;
        }

        .meta {

            padding:
                7px
                10px;

            border-radius:
                10px;

            background:
                #181c29;

            color:
                #bbc1d2;

            font-size:
                11px;
        }

        /* =========================
           AUDIO
        ========================= */

        .panel {

            overflow:
                hidden;
        }

        .panel + .panel {

            margin-top:
                14px;
        }

        .panel-header {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                13px
                15px;

            border-bottom:
                1px solid
                #23283a;
        }

        .panel-title {

            font-size:
                14px;

            font-weight:
                900;
        }

        .panel-sub {

            color:
                #8f97aa;

            font-size:
                11px;
        }

        .audio-box {

            padding:
                14px;
        }

        .audio-row {

            margin-bottom:
                17px;
        }

        .audio-row:last-child {

            margin-bottom:
                0;
        }

        .audio-head {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            margin-bottom:
                8px;

            color:
                #d2d5df;

            font-size:
                12px;
        }

        .audio-state {

            color:
                #8d95a8;
        }

        input[type="range"] {

            width:
                100%;

            accent-color:
                #6a4cff;
        }

        /* =========================
           DIAGNOSTIC
        ========================= */

        .diagnostic {

            margin-top:
                14px;

            padding:
                12px
                14px;

            border-radius:
                14px;

            background:
                rgba(
                    106,
                    76,
                    255,
                    0.08
                );

            border:
                1px solid
                rgba(
                    106,
                    76,
                    255,
                    0.18
                );

            color:
                #c9c2ff;

            font-size:
                11px;

            line-height:
                1.9;

            word-break:
                break-word;
        }

        .diagnostic strong {

            color:
                #ffffff;
        }

        .diagnostic.ok {

            background:
                rgba(
                    46,
                    180,
                    110,
                    0.08
                );

            border-color:
                rgba(
                    46,
                    180,
                    110,
                    0.2
                );

            color:
                #a9efc8;
        }

        .diagnostic.warning {

            background:
                rgba(
                    255,
                    170,
                    55,
                    0.08
                );

            border-color:
                rgba(
                    255,
                    170,
                    55,
                    0.2
                );

            color:
                #ffd49b;
        }

        /* =========================
           NOTICE
        ========================= */

        .notice {

            display:
                none;

            margin-top:
                14px;

            padding:
                12px
                14px;

            border-radius:
                13px;

            background:
                rgba(
                    255,
                    45,
                    85,
                    0.1
                );

            border:
                1px solid
                rgba(
                    255,
                    45,
                    85,
                    0.2
                );

            color:
                #ff9eb0;

            font-size:
                12px;

            line-height:
                1.8;
        }

        .notice.show {

            display:
                block;
        }

        /* =========================
           CHAT
        ========================= */

        .chat-panel {

            display:
                flex;

            flex-direction:
                column;

            height:
                470px;
        }

        #messages {

            flex:
                1;

            overflow-y:
                auto;

            padding:
                12px;
        }

        .empty-chat {

            height:
                100%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            color:
                #70798d;

            font-size:
                12px;

            text-align:
                center;
        }

        .message {

            margin-bottom:
                9px;

            padding:
                9px
                11px;

            border-radius:
                12px;

            background:
                #171b28;
        }

        .message-user {

            margin-bottom:
                4px;

            color:
                #967fff;

            font-size:
                11px;

            font-weight:
                900;
        }

        .message-text {

            color:
                #e6e8ef;

            font-size:
                12px;

            line-height:
                1.8;

            word-break:
                break-word;
        }

        .chat-form {

            display:
                flex;

            gap:
                8px;

            padding:
                10px;

            border-top:
                1px solid
                #23283a;
        }

        .chat-input {

            flex:
                1;

            min-width:
                0;

            height:
                44px;

            padding:
                0
                12px;

            border:
                1px solid
                #2a3043;

            border-radius:
                12px;

            outline:
                none;

            background:
                #0d1018;

            color:
                #ffffff;
        }

        .send-btn {

            width:
                48px;

            height:
                44px;

            border:
                none;

            border-radius:
                12px;

            background:
                #6a4cff;

            color:
                #ffffff;

            font-size:
                18px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 980px) {

            .layout {

                grid-template-columns:
                    1fr;
            }
        }

        @media (max-width: 600px) {

            .main {

                padding:
                    8px;
            }

            .topbar {

                padding:
                    calc(
                        9px +
                        env(
                            safe-area-inset-top
                        )
                    )
                    10px
                    9px;
            }

            .top-title {

                font-size:
                    14px;
            }

            .live-badge {

                padding:
                    7px
                    9px;
            }

            .video-card,
            .panel,
            .info-card {

                border-radius:
                    15px;
            }

            .control-btn {

                flex:
                    1 1
                    calc(
                        50% -
                        9px
                    );
            }
        }

    </style>

</head>

<body>

<div class="app">

    <header class="topbar">

        <div class="top-left">

            <button
                id="backBtn"
                class="back-btn"
                type="button"
            >
                ←
            </button>

            <div class="top-title">
                پخش زنده
            </div>

        </div>


        <div class="live-badge">

            <span class="live-dot"></span>

            LIVE

        </div>

    </header>


    <main class="main">

        <div class="layout">

            <section>

                <div class="video-card">

                    <div class="video-wrap">

                        <video
                            id="localVideo"
                            autoplay
                            playsinline
                            muted
                        ></video>


                        <div class="overlay">

                            <div
                                id="status"
                                class="status-pill"
                            >
                                آماده‌سازی...
                            </div>


                            <div class="viewer-pill">

                                👁

                                <span id="viewerCount">
                                    0
                                </span>

                            </div>

                        </div>

                    </div>


                    <div class="controls">

                        <button
                            id="cameraBtn"
                            class="control-btn active"
                            type="button"
                        >
                            📷 دوربین
                        </button>


                        <button
                            id="screenBtn"
                            class="control-btn"
                            type="button"
                        >
                            🖥️ صفحه + صدا
                        </button>


                        <button
                            id="tabBtn"
                            class="control-btn"
                            type="button"
                        >
                            🌐 تب + صدای تب
                        </button>


                        <button
                            id="micBtn"
                            class="control-btn active"
                            type="button"
                        >
                            🎤 میکروفن
                        </button>


                        <button
                            id="systemAudioBtn"
                            class="control-btn"
                            type="button"
                        >
                            🔊 صدای منبع
                        </button>


                        <button
                            id="stopBtn"
                            class="control-btn"
                            type="button"
                        >
                            ⏹ توقف منبع
                        </button>


                        <button
                            id="endBtn"
                            class="control-btn red"
                            type="button"
                        >
                            🔴 پایان لایو
                        </button>

                    </div>

                </div>


                <div
                    id="notice"
                    class="notice"
                ></div>


                <div
                    id="diagnostic"
                    class="diagnostic"
                >
                    در حال بررسی منابع صوتی...
                </div>


                <div class="info-card">

                    <h1
                        id="streamTitle"
                        class="stream-title"
                    >
                        پخش زنده LainoLive
                    </h1>


                    <div class="meta-row">

                        <div
                            id="streamCategory"
                            class="meta"
                        >
                            عمومی
                        </div>


                        <div
                            id="streamId"
                            class="meta"
                        >
                            Stream: -
                        </div>

                    </div>

                </div>

            </section>


            <aside>

                <section class="panel">

                    <div class="panel-header">

                        <div class="panel-title">
                            🎚️ کنترل صدا
                        </div>

                        <div class="panel-sub">
                            جداگانه
                        </div>

                    </div>


                    <div class="audio-box">

                        <div class="audio-row">

                            <div class="audio-head">

                                <span>
                                    🔊 صدای سیستم / تب
                                </span>


                                <span
                                    id="systemValue"
                                    class="audio-state"
                                >
                                    خاموش
                                </span>

                            </div>


                            <input
                                id="systemVolume"
                                type="range"
                                min="0"
                                max="100"
                                value="100"
                            >

                        </div>


                        <div class="audio-row">

                            <div class="audio-head">

                                <span>
                                    🎤 میکروفن / صحبت
                                </span>


                                <span
                                    id="micValue"
                                    class="audio-state"
                                >
                                    روشن
                                </span>

                            </div>


                            <input
                                id="micVolume"
                                type="range"
                                min="0"
                                max="100"
                                value="100"
                            >

                        </div>

                    </div>

                </section>


                <section
                    class="panel chat-panel"
                >

                    <div class="panel-header">

                        <div class="panel-title">
                            💬 چت زنده
                        </div>

                        <div class="panel-sub">
                            آنلاین
                        </div>

                    </div>


                    <div id="messages">

                        <div
                            id="emptyChat"
                            class="empty-chat"
                        >
                            هنوز پیامی ارسال نشده است.
                        </div>

                    </div>


                    <form
                        id="chatForm"
                        class="chat-form"
                    >

                        <input
                            id="chatInput"
                            class="chat-input"
                            type="text"
                            maxlength="500"
                            autocomplete="off"
                            placeholder="پیام بنویسید..."
                        >


                        <button
                            class="send-btn"
                            type="submit"
                        >
                            ➤
                        </button>

                    </form>

                </section>

            </aside>

        </div>

    </main>

</div>


<script>

"use strict";


/* =====================================================
   CONFIG
===================================================== */

const SIGNALING_URL =
    "wss://lainolive-signaling.onrender.com";


const RTC_CONFIG = {

    iceServers: [

        {
            urls: [

                "stun:stun.l.google.com:19302",

                "stun:stun1.l.google.com:19302"

            ]
        }

    ]

};


const STREAM_KEYS = [

    "lainolive_current_stream",

    "LainoLive_current_stream",

    "current_stream"

];


const USERNAME_KEYS = [

    "lainolive_username",

    "username"

];


/* =====================================================
   STATE
===================================================== */

let streamData = {};

let streamId = "";

let username = "";

let socket = null;

let currentMode = "none";

let cameraTrack = null;

let screenTrack = null;

let systemAudioTrack = null;

let microphoneTrack = null;

let systemAudioEnabled = false;

let microphoneEnabled = true;

let peers = new Map();

let viewerIds = new Set();

let ending = false;

let extensionAudioContext = null;

let extensionAudioSource = null;


/* =====================================================
   ELEMENTS
===================================================== */

const localVideo =
    document.getElementById(
        "localVideo"
    );


const statusElement =
    document.getElementById(
        "status"
    );


const viewerCount =
    document.getElementById(
        "viewerCount"
    );


const notice =
    document.getElementById(
        "notice"
    );


const diagnostic =
    document.getElementById(
        "diagnostic"
    );


const streamTitle =
    document.getElementById(
        "streamTitle"
    );


const streamCategory =
    document.getElementById(
        "streamCategory"
    );


const streamIdElement =
    document.getElementById(
        "streamId"
    );


const cameraBtn =
    document.getElementById(
        "cameraBtn"
    );


const screenBtn =
    document.getElementById(
        "screenBtn"
    );


const tabBtn =
    document.getElementById(
        "tabBtn"
    );


const micBtn =
    document.getElementById(
        "micBtn"
    );


const systemAudioBtn =
    document.getElementById(
        "systemAudioBtn"
    );


const stopBtn =
    document.getElementById(
        "stopBtn"
    );


const endBtn =
    document.getElementById(
        "endBtn"
    );


const systemVolume =
    document.getElementById(
        "systemVolume"
    );


const micVolume =
    document.getElementById(
        "micVolume"
    );


const systemValue =
    document.getElementById(
        "systemValue"
    );


const micValue =
    document.getElementById(
        "micValue"
    );


const messages =
    document.getElementById(
        "messages"
    );


const emptyChat =
    document.getElementById(
        "emptyChat"
    );


const chatForm =
    document.getElementById(
        "chatForm"
    );


const chatInput =
    document.getElementById(
        "chatInput"
    );


/* =====================================================
   UI
===================================================== */

function setStatus(
    text
) {

    statusElement.textContent =
        text;

}


function showNotice(
    text
) {

    notice.textContent =
        text;

    notice.classList.add(
        "show"
    );

}


function hideNotice() {

    notice.classList.remove(
        "show"
    );

}


function setDiagnostic(
    text,
    type = ""
) {

    diagnostic.className =
        "diagnostic";


    if (type) {

        diagnostic.classList.add(
            type
        );

    }


    diagnostic.innerHTML =
        text;

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   STORAGE
===================================================== */

function readStorage(
    keys
) {

    for (
        const key
        of keys
    ) {

        try {

            const sessionValue =
                sessionStorage.getItem(
                    key
                );


            if (
                sessionValue
            ) {

                return sessionValue;

            }

        } catch {}


        try {

            const localValue =
                localStorage.getItem(
                    key
                );


            if (
                localValue
            ) {

                return localValue;

            }

        } catch {}

    }


    return null;

}


function readStreamData() {

    const raw =
        readStorage(
            STREAM_KEYS
        );


    if (!raw) {

        return {};

    }


    try {

        return JSON.parse(
            raw
        );

    } catch {

        return {};

    }

}


function getQueryId() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    return (

        params.get("id") ||

        params.get(
            "stream_id"
        ) ||

        params.get(
            "room_id"
        ) ||

        ""

    );

}


function getStreamId(
    data
) {

    return String(

        data.stream_id ??

        data.streamId ??

        data.id ??

        data.room_id ??

        getQueryId() ??

        ""

    );

}


function getUsername(
    data
) {

    return String(

        data.username ??

        data.owner ??

        readStorage(
            USERNAME_KEYS
        ) ??

        ""

    );

}


/* =====================================================
   MEDIA
===================================================== */

function stopTrack(
    track
) {

    if (!track) {

        return;

    }


    try {

        track.stop();

    } catch {}

}


function stopExtensionAudio() {

    try {

        extensionAudioSource?.disconnect();

    } catch {}


    try {

        extensionAudioContext?.close();

    } catch {}


    extensionAudioSource = null;

    extensionAudioContext = null;

}


function stopAllMedia() {

    stopExtensionAudio();


    stopTrack(
        cameraTrack
    );


    stopTrack(
        screenTrack
    );


    stopTrack(
        systemAudioTrack
    );


    stopTrack(
        microphoneTrack
    );


    cameraTrack = null;

    screenTrack = null;

    systemAudioTrack = null;

    microphoneTrack = null;


    localVideo.srcObject =
        null;

}


function updatePreview() {

    const preview =
        new MediaStream();


    const videoTrack =
        cameraTrack ||
        screenTrack;


    if (videoTrack) {

        preview.addTrack(
            videoTrack
        );

    }


    if (systemAudioTrack) {

        preview.addTrack(
            systemAudioTrack
        );

    }


    if (microphoneTrack) {

/* =====================================================
   EXTENSION TAB CAPTURE
===================================================== */

function requestExtensionTabCapture() {

    return new Promise(
        (
            resolve
        ) => {

            const requestId =

                "lainolive_" +

                Date.now() +

                "_" +

                Math.random()
                    .toString(
                        36
                    )
                    .slice(
                        2
                    );


            let finished = false;


            const timeout =

                setTimeout(
                    () => {

                        if (
                            finished
                        ) {

                            return;

                        }


                        finished =
                            true;


                        window.removeEventListener(
                            "message",
                            handler
                        );


                        resolve(
                            {
                                ok: false,

                                error:
                                    "افزونه LainoLive پاسخ نداد."
                            }
                        );

                    },
                    10000
                );


            function handler(
                event
            ) {

                if (
                    event.source !==
                    window
                ) {

                    return;

                }


                const data =
                    event.data;


                if (
                    !data ||
                    data.type !==
                        "LAINOLIVE_TAB_CAPTURE_RESULT"
                ) {

                    return;

                }


                if (
                    data.requestId !==
                    requestId
                ) {

                    return;

                }


                if (
                    finished
                ) {

                    return;

                }


                finished =
                    true;


                clearTimeout(
                    timeout
                );


                window.removeEventListener(
                    "message",
                    handler
                );


                resolve(

                    data.response ||

                    {
                        ok: false,

                        error:
                            "پاسخ نامعتبر از افزونه."
                    }

                );

            }


            window.addEventListener(
                "message",
                handler
            );


            window.postMessage(

                {
                    type:
                        "LAINOLIVE_REQUEST_TAB_CAPTURE",

                    requestId:
                        requestId
                },

                window.location.origin

            );

        }
    );

}

/* =====================================================
   PEERS
===================================================== */

function closePeer(
    viewerId
) {

    const peer =
        peers.get(
            viewerId
        );


    if (!peer) {

        return;
    }


    try {

        peer.close();

    } catch {}


    peers.delete(
        viewerId
    );

}


function closeAllPeers() {

    for (
        const [
            viewerId,
            peer
        ]
        of peers.entries()
    ) {

        try {

            peer.close();

        } catch {}


        peers.delete(
            viewerId
        );

    }

}


function createPeer(
    viewerId
) {

    closePeer(
        viewerId
    );


    const peer =
        new RTCPeerConnection(
            RTC_CONFIG
        );


    peers.set(
        viewerId,
        peer
    );


    /*
     * VIDEO
     */

    const videoTrack =
        cameraTrack ||
        screenTrack;


    if (
        videoTrack
    ) {

        peer.addTrack(

            videoTrack,

            new MediaStream([
                videoTrack
            ])

        );

    }


    /*
     * AUDIO 1:
     * system/tab
     */

    if (
        systemAudioTrack
    ) {

        peer.addTrack(

            systemAudioTrack,

            new MediaStream([
                systemAudioTrack
            ])

        );

    }


    /*
     * AUDIO 2:
     * microphone
     */

    if (
        microphoneTrack
    ) {

        peer.addTrack(

            microphoneTrack,

            new MediaStream([
                microphoneTrack
            ])

        );

    }


    peer.onicecandidate =
        event => {

            if (
                !event.candidate
            ) {

                return;

            }


            sendSignal(

                {
                    type:
                        "ice-candidate",

                    viewer_id:
                        viewerId,

                    candidate:
                        event.candidate
                }

            );

        };


    peer.onconnectionstatechange =
        () => {

            if (

                peer.connectionState ===
                    "failed"

                ||

                peer.connectionState ===
                    "closed"

            ) {

                closePeer(
                    viewerId
                );

            }

        };


    return peer;

}


async function createOffer(
    viewerId
) {

    if (
        !viewerId ||
        ending
    ) {

        return;

    }


    const peer =
        createPeer(
            viewerId
        );


    try {

        const offer =
            await peer.createOffer();


        await peer.setLocalDescription(
            offer
        );


        sendSignal(

            {

                type:
                    "offer",

                viewer_id:
                    viewerId,

                offer:
                    peer.localDescription

            }

        );

    }
    catch (
        error
    ) {

        console.error(
            "offer error:",
            error
        );


        closePeer(
            viewerId
        );

    }

}


/* =====================================================
   RENEGOTIATION
===================================================== */

async function renegotiateAllViewers() {

    for (
        const viewerId
        of Array.from(
            viewerIds
        )
    ) {

        if (
            !viewerId
        ) {

            continue;

        }


        await createOffer(
            viewerId
        );

    }

}


/* =====================================================
   SIGNALING
===================================================== */

function sendSignal(
    message
) {

    if (

        !socket ||

        socket.readyState !==
            WebSocket.OPEN

    ) {

        return false;

    }


    try {

        socket.send(
            JSON.stringify(
                message
            )
        );


        return true;

    }
    catch (
        error
    ) {

        console.error(
            "signal error:",
            error
        );


        return false;

    }

}


function connectSignaling() {

    if (
        !streamId
    ) {

        setStatus(
            "شناسه لایو پیدا نشد"
        );


        showNotice(
            "ابتدا یک لایو از صفحه اصلی بسازید."
        );


        return;

    }


    setStatus(
        "در حال اتصال به سرور..."
    );


    try {

        socket =
            new WebSocket(
                SIGNALING_URL
            );

    }
    catch (
        error
    ) {

        console.error(
            error
        );


        showNotice(
            "اتصال به سرور لایو ایجاد نشد."
        );


        return;

    }


    socket.onopen =
        () => {

            setStatus(
                "اتصال برقرار شد"
            );


            sendSignal(

                {

                    type:
                        "join",

                    role:
                        "host",

                    room_id:
                        streamId,

                    username:
                        username

                }

            );

        };


    socket.onmessage =
        async event => {

            let message;


            try {

                message =
                    JSON.parse(
                        event.data
                    );

            }
            catch {

                return;

            }


            await handleSignal(
                message
            );

        };


    socket.onerror =
        error => {

            console.error(
                "WebSocket error:",
                error
            );


            setStatus(
                "خطا در اتصال"
            );

        };


    socket.onclose =
        () => {

            if (
                !ending
            ) {

                setStatus(
                    "ارتباط با سرور قطع شد"
                );

            }

        };

}


/* =====================================================
   SIGNAL HANDLER
===================================================== */

async function handleSignal(
    message
) {

    if (
        !message
    ) {

        return;

    }


    switch (
        message.type
    ) {

        case "joined":

            if (
                typeof
                    message.viewer_count ===
                        "number"
            ) {

                viewerCount.textContent =
                    String(
                        message.viewer_count
                    );

            }


            setStatus(
                "لایو آماده است"
            );


            break;


        case "room-info":

            if (
                typeof
                    message.viewer_count ===
                        "number"
            ) {

                viewerCount.textContent =
                    String(
                        message.viewer_count
                    );

            }


            break;


        case "viewer-joined": {

            const viewerId =
                String(
                    message.viewer_id ||
                    ""
                );


            if (
                viewerId
            ) {

                viewerIds.add(
                    viewerId
                );


                await createOffer(
                    viewerId
                );

            }


            break;

        }


        case "answer": {

            const viewerId =
                String(
                    message.viewer_id ||
                    ""
                );


            const peer =
                peers.get(
                    viewerId
                );


            if (
                !peer ||
                !message.answer
            ) {

                break;

            }


            try {

                await peer.setRemoteDescription(

                    new RTCSessionDescription(
                        message.answer
                    )

                );

            }
            catch (
                error
            ) {

                console.error(
                    "answer error:",
                    error
                );

            }


            break;

        }


        case "ice-candidate": {

            const viewerId =
                String(
                    message.viewer_id ||
                    ""
                );


            const peer =
                peers.get(
                    viewerId
                );


            if (
                !peer ||
                !message.candidate
            ) {

                break;

            }


            try {

                await peer.addIceCandidate(

                    new RTCIceCandidate(
                        message.candidate
                    )

                );

            }
            catch (
                error
            ) {

                console.warn(
                    "ICE error:",
                    error
                );

            }


            break;

        }


        case "viewer-left": {

            const viewerId =
                String(
                    message.viewer_id ||
                    ""
                );


            viewerIds.delete(
                viewerId
            );


            closePeer(
                viewerId
            );


            break;

        }


        case "chat-message":

            addChatMessage(

                message.username ||
                    message.user ||
                    "کاربر",

                message.message ||
                    ""

            );


            break;


        case "error":

            showNotice(

                message.message ||
                "خطای سرور"

            );


            break;

    }

}


/* =====================================================
   CHAT
===================================================== */

function addChatMessage(
    user,
    text
) {

    if (
        emptyChat
    ) {

        emptyChat.style.display =
            "none";

    }


    const box =
        document.createElement(
            "div"
        );


    box.className =
        "message";


    const userElement =
        document.createElement(
            "div"
        );


    userElement.className =
        "message-user";


    userElement.textContent =
        user ||
        "کاربر";


    const textElement =
        document.createElement(
            "div"
        );


    textElement.className =
        "message-text";


    textElement.textContent =
        text ||
        "";


    box.appendChild(
        userElement
    );


    box.appendChild(
        textElement
    );


    messages.appendChild(
        box
    );


    messages.scrollTop =
        messages.scrollHeight;

}


async function sendChat(
    text
) {

    if (
        !text
    ) {

        return;

    }


    if (

        sendSignal(

            {

                type:
                    "chat-message",

                username:
                    username,

                message:
                    text

            }

        )

    ) {

        return;

    }


    try {

        const response =
            await fetch(

                "/api/chat/send",

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(

                            {

                                stream_id:
                                    streamId,

                                username:
                                    username,

                                message:
                                    text

                            }

                        )

                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "chat failed"
            );

        }

    }
    catch (
        error
    ) {

        console.error(
            error
        );


        showNotice(
            "ارسال پیام انجام نشد."
        );

    }

}

/* =====================================================
   END LIVE
===================================================== */

async function stopServerStream() {

    if (
        !streamId
    ) {

        return;

    }


    try {

        await fetch(

            "/api/streams/stop",

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        stream_id:
                            streamId,

                        username:
                            username

                    })

            }

        );

    }
    catch (
        error
    ) {

        console.warn(
            "stop stream:",
            error
        );

    }

}


async function endLive() {

    if (
        ending
    ) {

        return;

    }


    const confirmEnd =
        window.confirm(

            "آیا می‌خواهید لایو را پایان دهید؟"

        );


    if (
        !confirmEnd
    ) {

        return;

    }


    ending =
        true;


    setStatus(
        "در حال پایان لایو..."
    );


    closeAllPeers();


    stopAllMedia();


    viewerIds.clear();


    if (
        socket
    ) {

        try {

            sendSignal(
                {
                    type:
                        "leave"
                }
            );

        } catch {}


        try {

            socket.close();

        } catch {}

    }


    await stopServerStream();


    try {

        sessionStorage.removeItem(
            "lainolive_current_stream"
        );


        sessionStorage.removeItem(
            "LainoLive_current_stream"
        );

    } catch {}


    try {

        localStorage.removeItem(
            "lainolive_current_stream"
        );


        localStorage.removeItem(
            "LainoLive_current_stream"
        );

    } catch {}


    window.location.href =
        "/index.html";

}


/* =====================================================
   INIT
===================================================== */

async function initialize() {

    streamData =
        readStreamData();


    streamId =
        getStreamId(
            streamData
        );


    username =
        getUsername(
            streamData
        );


    streamTitle.textContent =

        streamData.title ||

        "پخش زنده LainoLive";


    streamCategory.textContent =

        streamData.category ||

        "عمومی";


    streamIdElement.textContent =

        "Stream: " +

        (
            streamId ||
            "-"
        );


    if (
        !window.isSecureContext
    ) {

        showNotice(
            "اشتراک صفحه باید از طریق HTTPS اجرا شود."
        );

    }


    if (

        !navigator.mediaDevices ||

        !navigator.mediaDevices.getUserMedia ||

        !navigator.mediaDevices.getDisplayMedia

    ) {

        setStatus(
            "مرورگر پشتیبانی نمی‌شود"
        );


        showNotice(
            "مرورگر شما قابلیت لازم برای پخش زنده را ندارد."
        );


        return;

    }


    if (
        !streamId
    ) {

        setStatus(
            "شناسه لایو پیدا نشد"
        );


        showNotice(
            "ابتدا یک لایو از صفحه اصلی ایجاد کنید."
        );


        return;

    }


    connectSignaling();


    await startCamera();

}


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        ending =
            true;


        closeAllPeers();


        stopAllMedia();


        viewerIds.clear();


        try {

            socket?.close();

        } catch {}

    }
);


/* =====================================================
   START
===================================================== */

initialize();
