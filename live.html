<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#020617"
    >

    <title>تماشای لایو | LainoLive</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #020617;
            color: #ffffff;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            overflow: hidden;
        }

        .viewer-page {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .viewer-header {
            min-height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 14px;
            background: #111827;
            border-bottom: 1px solid #273449;
            z-index: 20;
        }

        .viewer-left,
        .viewer-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-button {
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 10px;
            background: #1e293b;
            color: #ffffff;
            cursor: pointer;
            font-size: 18px;
        }

        .viewer-title-area {
            min-width: 0;
        }

        .viewer-title {
            max-width: 320px;
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .viewer-user {
            margin-top: 3px;
            color: #94a3b8;
            font-size: 11px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 10px;
            border-radius: 9px;
            background: #3f0a0a;
            color: #fecaca;
            font-size: 11px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        .viewer-main {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
        }

        .video-area {
            position: relative;
            min-width: 0;
            min-height: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000000;
        }

        .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        .video-placeholder-box {
            width: min(380px, 100%);
            padding: 25px;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.90);
            border: 1px solid #273449;
        }

        .video-icon {
            font-size: 65px;
            margin-bottom: 12px;
        }

        .video-placeholder h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .video-placeholder p {
            margin: 0;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.8;
        }

        .video-controls {
            position: absolute;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            z-index: 10;
        }

        .control-button {
            border: 1px solid #334155;
            border-radius: 11px;
            padding: 11px 15px;
            background: #1e293b;
            color: #ffffff;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 12px;
        }

        .chat-panel {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #111827;
            border-right: 1px solid #273449;
        }

        .chat-header {
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid #273449;
        }

        .chat-title {
            font-size: 14px;
            font-weight: bold;
        }

        .chat-state {
            color: #86efac;
            font-size: 11px;
        }

        .chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 12px;
        }

        .chat-empty {
            text-align: center;
            color: #64748b;
            padding: 70px 10px;
            font-size: 13px;
        }

        .chat-message {
            margin-bottom: 12px;
        }

        .chat-user {
            color: #86efac;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .chat-owner {
            color: #fbbf24;
        }

        .chat-text {
            color: #e2e8f0;
            font-size: 13px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .chat-form {
            display: flex;
            gap: 7px;
            padding: 9px;
            border-top: 1px solid #273449;
        }

        .chat-input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 11px;
            outline: none;
            background: #1e293b;
            color: #ffffff;
            font-family: inherit;
        }

        .chat-send {
            border: 0;
            border-radius: 11px;
            padding: 0 14px;
            background: #22c55e;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-send:disabled {
            opacity: 0.5;
        }

        .connection-info {
            padding: 8px 10px;
            background: #0f172a;
            border-top: 1px solid #273449;
            color: #64748b;
            font-size: 10px;
            direction: ltr;
            text-align: left;
            overflow-wrap: anywhere;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 20px;
            z-index: 1000;
            transform: translate(-50%, 20px);
            opacity: 0;
            pointer-events: none;
            max-width: calc(100% - 30px);
            padding: 11px 16px;
            border-radius: 12px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #ffffff;
            font-size: 13px;
            text-align: center;
            transition: opacity 0.2s ease,
                        transform 0.2s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 850px) {
            body {
                overflow: auto;
            }

            .viewer-page {
                height: auto;
                min-height: 100vh;
            }

            .viewer-main {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(300px, 52vh) minmax(350px, 48vh);
            }

            .chat-panel {
                border-right: 0;
                border-top: 1px solid #273449;
            }

            .viewer-title {
                max-width: 180px;
            }
        }
    </style>
</head>

<body>

<script>
    const loggedIn =
        localStorage.getItem(
            "lainolive_logged_in"
        );

    const currentUsername =
        localStorage.getItem(
            "lainolive_username"
        );

    if (
        loggedIn !== "true" ||
        !currentUsername
    ) {
        window.location.replace(
            "/login.html"
        );
    }
</script>


<div class="viewer-page">

    <header class="viewer-header">

        <div class="viewer-left">

            <button
                id="backButton"
                class="back-button"
                type="button"
            >
                ←
            </button>

            <div class="viewer-title-area">

                <div
                    id="viewerTitle"
                    class="viewer-title"
                >
                    پخش زنده
                </div>

                <div
                    id="viewerUser"
                    class="viewer-user"
                >
                    صاحب لایو
                </div>

            </div>

        </div>


        <div class="viewer-right">

            <div
                id="status"
                class="status"
            >

                <span
                    id="statusDot"
                    class="status-dot"
                ></span>

                <span id="statusText">
                    در حال اتصال
                </span>

            </div>

        </div>

    </header>


    <main class="viewer-main">

        <section class="video-area">

            <video
                id="remoteVideo"
                autoplay
                playsinline
                controls
            ></video>


            <div
                id="videoPlaceholder"
                class="video-placeholder"
            >

                <div class="video-placeholder-box">

                    <div class="video-icon">
                        📺
                    </div>

                    <h2>
                        در حال اتصال
                    </h2>

                    <p id="videoStatusText">
                        منتظر تصویر صاحب لایو...
                    </p>

                </div>

            </div>


            <div class="video-controls">

                <button
                    id="audioButton"
                    class="control-button"
                    type="button"
                >
                    🔊 فعال‌کردن صدا
                </button>

            </div>

        </section>


        <section class="chat-panel">

            <div class="chat-header">

                <div class="chat-title">
                    💬 چت زنده
                </div>

                <div
                    id="chatState"
                    class="chat-state"
                >
                    آنلاین
                </div>

            </div>


            <div
                id="chatMessages"
                class="chat-messages"
            >

                <div class="chat-empty">
                    هنوز پیامی ارسال نشده است.
                </div>

            </div>


            <form
                id="chatForm"
                class="chat-form"
            >

                <input
                    id="chatInput"
                    class="chat-input"
                    type="text"
                    maxlength="500"
                    autocomplete="off"
                    placeholder="پیام بنویس..."
                >

                <button
                    id="chatSend"
                    class="chat-send"
                    type="submit"
                >
                    ارسال
                </button>

            </form>


            <div
                id="connectionInfo"
                class="connection-info"
            >
                WebRTC: آماده
            </div>

        </section>

    </main>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

    /* =====================================================
       STREAM
    ===================================================== */

    const streamRaw =
        sessionStorage.getItem(
            "lainolive_view_stream"
        );


    let currentStream = null;


    try {

        currentStream =
            streamRaw
                ? JSON.parse(streamRaw)
                : null;

    } catch (error) {

        currentStream = null;
    }


    if (!currentStream) {

        window.location.replace(
            "/index.html"
        );
    }


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const viewerTitle =
        document.getElementById(
            "viewerTitle"
        );

    const viewerUser =
        document.getElementById(
            "viewerUser"
        );

    const status =
        document.getElementById(
            "status"
        );

    const statusDot =
        document.getElementById(
            "statusDot"
        );

    const statusText =
        document.getElementById(
            "statusText"
        );

    const remoteVideo =
        document.getElementById(
            "remoteVideo"
        );

    const videoPlaceholder =
        document.getElementById(
            "videoPlaceholder"
        );

    const videoStatusText =
        document.getElementById(
            "videoStatusText"
        );

    const audioButton =
        document.getElementById(
            "audioButton"
        );

    const chatMessages =
        document.getElementById(
            "chatMessages"
        );

    const chatForm =
        document.getElementById(
            "chatForm"
        );

    const chatInput =
        document.getElementById(
            "chatInput"
        );

    const chatSend =
        document.getElementById(
            "chatSend"
        );

    const chatState =
        document.getElementById(
            "chatState"
        );

    const connectionInfo =
        document.getElementById(
            "connectionInfo"
        );

    const toast =
        document.getElementById(
            "toast"
        );


    viewerTitle.textContent =
        currentStream?.title ||
        "پخش زنده";


    viewerUser.textContent =
        "صاحب لایو: " +
        (
            currentStream?.username ||
            "کاربر"
        );


    /* =====================================================
       WEBRTC
    ===================================================== */

    const SIGNALING_URL =
        "wss://lainolive-signaling.onrender.com";


    const RTC_CONFIGURATION = {
        iceServers: [
            {
                urls:
                    "stun:stun.l.google.com:19302"
            },
            {
                urls:
                    "stun:stun1.l.google.com:19302"
            }
        ]
    };


    let websocket = null;

    let peerConnection = null;

    let myPeerId = null;

    let ownerPeerId = null;

    let lastChatId = "";

    let chatTimer = null;

    const pendingCandidates = [];


    /* =====================================================
       HELPERS
    ===================================================== */

    function showToast(text) {

        toast.textContent =
            text;

        toast.classList.add(
            "show"
        );

        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );
    }


    function escapeHtml(text) {

        return String(text)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    function setStatus(
        text,
        online
    ) {

        statusText.textContent =
            text;

        statusDot.style.background =
            online
                ? "#22c55e"
                : "#ef4444";

        status.style.background =
            online
                ? "#132b1d"
                : "#3f0a0a";
    }


    function sendSignal(data) {

        if (
            !websocket ||
            websocket.readyState !==
            WebSocket.OPEN
        ) {
            return false;
        }


        websocket.send(
            JSON.stringify(data)
        );


        return true;
    }


    /* =====================================================
       PEER CONNECTION
    ===================================================== */

    function createPeerConnection() {

        if (peerConnection) {
            return peerConnection;
        }


        peerConnection =
            new RTCPeerConnection(
                RTC_CONFIGURATION
            );


        peerConnection.ontrack =
            event => {

                if (
                    !event.streams ||
                    !event.streams[0]
                ) {
                    return;
                }


                remoteVideo.srcObject =
                    event.streams[0];


                videoPlaceholder.style.display =
                    "none";


                videoStatusText.textContent =
                    "تصویر و صدا دریافت شد.";


                setStatus(
                    "LIVE",
                    true
                );


                remoteVideo.play()
                    .catch(
                        () => {
                            showToast(
                                "برای فعال‌کردن صدا روی دکمه صدا بزن."
                            );
                        }
                    );
            };


        peerConnection.onicecandidate =
            event => {

                if (
                    !event.candidate ||
                    !ownerPeerId
                ) {
                    return;
                }


                sendSignal({

                    type:
                        "ice-candidate",

                    target_peer_id:
                        ownerPeerId,

                    candidate:
                        event.candidate

                });
            };


        peerConnection.onconnectionstatechange =
            () => {

                const state =
                    peerConnection.connectionState;


                connectionInfo.textContent =
                    "WebRTC: " +
                    state;


                if (
                    state === "connected"
                ) {

                    setStatus(
                        "متصل",
                        true
                    );

                } else if (
                    state === "failed"
                ) {

                    setStatus(
                        "اتصال ناموفق",
                        false
                    );


                    showToast(
                        "اتصال WebRTC ناموفق بود."
                    );
                }
            };


        peerConnection.oniceconnectionstatechange =
            () => {

                connectionInfo.textContent =
                    "ICE: " +
                    peerConnection.iceConnectionState;
            };


        return peerConnection;
    }


    async function applyPendingCandidates() {

        if (!peerConnection) {
            return;
        }


        while (
            pendingCandidates.length
        ) {

            const candidate =
                pendingCandidates.shift();


            try {

                await peerConnection.addIceCandidate(
                    candidate
                );

            } catch (error) {

                console.error(
                    "Pending ICE:",
                    error
                );
            }
        }
    }


    /* =====================================================
       SIGNALING
    ===================================================== */

    async function handleSignal(
        message
    ) {

        const type =
            message.type;


        if (
            type === "joined"
        ) {

            myPeerId =
                message.peer_id ||
                null;


            chatState.textContent =
                "سیگنالینگ متصل";


            connectionInfo.textContent =
                "WebSocket: متصل";


            setStatus(
                "منتظر صاحب لایو",
                true
            );


            return;
        }


        if (
            type === "owner_available"
        ) {

            ownerPeerId =
                message.peer_id ||
                null;


            if (!ownerPeerId) {
                return;
            }


            createPeerConnection();


            setStatus(
                "صاحب لایو پیدا شد",
                true
            );


            return;
        }


        if (
            type === "offer"
        ) {

            ownerPeerId =
                message.peer_id ||
                ownerPeerId;


            if (!ownerPeerId) {
                return;
            }


            const pc =
                createPeerConnection();


            try {

                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        message.offer
                    )
                );


                await applyPendingCandidates();


                const answer =
                    await pc.createAnswer();


                await pc.setLocalDescription(
                    answer
                );


                sendSignal({

                    type:
                        "answer",

                    target_peer_id:
                        ownerPeerId,

                    answer:
                        pc.localDescription

                });


                setStatus(
                    "در حال اتصال",
                    true
                );


            } catch (error) {

                console.error(
                    "Offer:",
                    error
                );


                showToast(
                    "پردازش اتصال WebRTC ناموفق بود."
                );
            }


            return;
        }


        if (
            type === "ice-candidate"
        ) {

            const candidate =
                new RTCIceCandidate(
                    message.candidate
                );


            if (
                peerConnection &&
                peerConnection.remoteDescription
            ) {

                try {

                    await peerConnection.addIceCandidate(
                        candidate
                    );

                } catch (error) {

                    console.error(
                        "ICE:",
                        error
                    );
                }

            } else {

                pendingCandidates.push(
                    candidate
                );
            }


            return;
        }


        if (
            type === "peer_left"
        ) {

            if (
                message.peer_id ===
                ownerPeerId
            ) {

                setStatus(
                    "پخش پایان یافت",
                    false
                );


                videoPlaceholder.style.display =
                    "flex";


                videoStatusText.textContent =
                    "صاحب لایو خارج شد.";
            }


            return;
        }


        if (
            type === "error"
        ) {

            showToast(
                message.message ||
                "خطای سیگنالینگ."
            );
        }
    }


    function connectSignaling() {

        connectionInfo.textContent =
            SIGNALING_URL;


        try {

            websocket =
                new WebSocket(
                    SIGNALING_URL
                );

        } catch (error) {

            setStatus(
                "خطا",
                false
            );

            showToast(
                "اتصال WebRTC برقرار نشد."
            );

            return;
        }


        websocket.onopen =
            () => {

                sendSignal({

                    type:
                        "join",

                    room_id:
                        currentStream.id,

                    username:
                        currentUsername,

                    role:
                        "viewer"

                });
            };


        websocket.onmessage =
            async event => {

                try {

                    const message =
                        JSON.parse(
                            event.data
                        );


                    await handleSignal(
                        message
                    );

                } catch (error) {

                    console.error(
                        "Signal:",
                        error
                    );
                }
            };


        websocket.onerror =
            error => {

                console.error(
                    "WebSocket:",
                    error
                );


                setStatus(
                    "خطا",
                    false
                );
            };


        websocket.onclose =
            () => {

                setStatus(
                    "سیگنالینگ قطع شد",
                    false
                );


                chatState.textContent =
                    "قطع";
            };
    }


    /* =====================================================
       AUDIO
    ===================================================== */

    audioButton.addEventListener(
        "click",
        async () => {

            remoteVideo.muted =
                false;

            remoteVideo.volume =
                1;


            try {

                await remoteVideo.play();


                audioButton.textContent =
                    "🔊 صدا فعال است";


            } catch (error) {

                showToast(
                    "برای پخش ویدیو دوباره امتحان کن."
                );
            }
        }
    );


    /* =====================================================
       CHAT
    ===================================================== */

    async function loadChat() {

        if (!currentStream) {
            return;
        }


        try {

            const params =
                new URLSearchParams();


            params.set(
                "stream_id",
                currentStream.id
            );


            if (lastChatId) {

                params.set(
                    "after_id",
                    lastChatId
                );
            }


            const response =
                await fetch(
                    "/api/chat/messages?" +
                    params.toString(),
                    {
                        cache:
                            "no-store"
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {
                return;
            }


            const messages =
                data.messages || [];


            if (!messages.length) {
                return;
            }


            const empty =
                chatMessages.querySelector(
                    ".chat-empty"
                );


            if (empty) {
                empty.remove();
            }


            messages.forEach(
                message => {

                    const element =
                        document.createElement(
                            "div"
                        );


                    element.className =
                        "chat-message";


                    const owner =
                        message.username ===
                        currentStream.username;


                    element.innerHTML = `
                        <div class="${
                            owner
                                ? "chat-user chat-owner"
                                : "chat-user"
                        }">
                            ${escapeHtml(
                                message.username
                            )}
                            ${owner ? " 👑" : ""}
                        </div>

                        <div class="chat-text">
                            ${escapeHtml(
                                message.text
                            )}
                        </div>
                    `;


                    chatMessages.appendChild(
                        element
                    );


                    lastChatId =
                        message.id;
                }
            );


            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        } catch (error) {

            console.error(
                "Chat:",
                error
            );
        }
    }


    chatForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const text =
                chatInput.value.trim();


            if (
                !text ||
                !currentStream
            ) {
                return;
            }


            chatSend.disabled =
                true;


            try {

                const response =
                    await fetch(
                        "/api/chat/send",
                        {
                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    stream_id:
                                        currentStream.id,

                                    username:
                                        currentUsername,

                                    text:
                                        text

                                })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    showToast(
                        data.message ||
                        "ارسال پیام ناموفق بود."
                    );

                    return;
                }


                chatInput.value =
                    "";


                await loadChat();

            } catch (error) {

                showToast(
                    "خطا در ارسال پیام."
                );

            } finally {

                chatSend.disabled =
                    false;

                chatInput.focus();
            }
        }
    );


    /* =====================================================
       VIEWER COUNT
    ===================================================== */

    async function joinViewerCount() {

        try {

            await fetch(
                "/api/streams/viewer",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            stream_id:
                                currentStream.id,

                            action:
                                "join"

                        })
                }
            );

        } catch (error) {

            console.error(
                "Viewer count:",
                error
            );
        }
    }


    async function leaveViewerCount() {

        if (!currentStream) {
            return;
        }


        try {

            await fetch(
                "/api/streams/viewer",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            stream_id:
                                currentStream.id,

                            action:
                                "leave"

                        })
                }
            );

        } catch (error) {

            console.error(
                "Leave viewer:",
                error
            );
        }
    }


    /* =====================================================
       BACK
    ===================================================== */

    document
        .getElementById(
            "backButton"
        )
        .addEventListener(
            "click",
            async () => {

                await leaveViewerCount();

                window.location.href =
                    "/index.html";
            }
        );


    /* =====================================================
       CLEANUP
    ===================================================== */

    window.addEventListener(
        "beforeunload",
        () => {

            if (
                currentStream
            ) {

                navigator.sendBeacon(
                    "/api/streams/viewer",
                    new Blob(
                        [
                            JSON.stringify({

                                stream_id:
                                    currentStream.id,

                                action:
                                    "leave"

                            })
                        ],
                        {
                            type:
                                "application/json"
                        }
                    )
                );
            }


            if (
                peerConnection
            ) {

                try {
                    peerConnection.close();
                } catch (error) {
                }

            }


            if (websocket) {

                try {
                    websocket.close();
                } catch (error) {
                }
            }
        }
    );


    /* =====================================================
       START
    ===================================================== */

    createPeerConnection();

    connectSignaling();

    joinViewerCount();

    loadChat();


    chatTimer =
        setInterval(
            loadChat,
            2000
        );

</script>

</body>

</html>
