<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<meta name="theme-color"
content="#ff2757">


<title>
شروع لایو - LainoLive
</title>



<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

font-family:
Tahoma,Arial;

background:
radial-gradient(
circle at top,
#24163a,
#050508
);

color:white;

padding:20px;

}



.card{

max-width:500px;

margin:auto;

background:
rgba(255,255,255,.07);

border-radius:25px;

padding:20px;

}



h1{

text-align:center;

font-size:24px;

}



video{

width:100%;

height:260px;

background:#000;

border-radius:20px;

object-fit:cover;

}



.group{

margin-top:15px;

}



label{

display:block;

font-size:12px;

color:#aaa;

margin-bottom:8px;

}



input,
select{

width:100%;

height:48px;

border:none;

outline:none;

border-radius:14px;

background:
rgba(255,255,255,.1);

color:white;

padding:0 15px;

}



option{

background:#111;

}



.buttons{

display:flex;

gap:10px;

margin-top:20px;

}



button{

flex:1;

height:50px;

border:none;

border-radius:15px;

font-weight:900;

}



.start{

background:
linear-gradient(
135deg,
#ff2757,
#8b35ff
);

color:white;

}



.stop{

background:
rgba(255,50,80,.2);

color:#ff9aaa;

}



.back{

width:100%;

margin-top:12px;

background:
rgba(255,255,255,.08);

color:white;

}



.status{

text-align:center;

margin-top:15px;

font-size:12px;

color:#aaa;

}



</style>

</head>


<body>


<div class="card">


<h1>
🔴 شروع لایو
</h1>


<video
id="preview"
autoplay
muted
playsinline
></video>





<div class="group">

<label>
عنوان لایو
</label>


<input
id="title"
placeholder="عنوان لایو را وارد کنید"
>


</div>





<div class="group">

<label>
کیفیت تصویر
</label>


<select id="videoQuality">


<option value="360">
360p
</option>


<option value="480">
480p
</option>


<option value="720">
720p HD
</option>


<option value="1080">
1080p Full HD
</option>


</select>


</div>





<div class="group">

<label>
کیفیت صدا
</label>


<select id="audioQuality">


<option value="64000">
64kbps
</option>


<option value="128000">
128kbps
</option>


<option value="192000">
192kbps
</option>


</select>


</div>





<div class="buttons">


<button
class="start"
id="startBtn"
>

شروع پخش

</button>



<button
class="stop"
id="stopBtn"
>

توقف

</button>


</div>


<button
class="back"
id="backBtn"
>

بازگشت

</button>


<div
class="status"
id="status"
>

آماده شروع لایو

</div>

<script>


let stream = null;



const video =
document.getElementById(
"preview"
);


const status =
document.getElementById(
"status"
);





async function startCamera(){


try{


stream =

await navigator.mediaDevices.getUserMedia(

{


video:
{

width:
{
ideal:
Number(
document.getElementById(
"videoQuality"
).value
)
*
16
/
9
},

height:
{
ideal:
Number(
document.getElementById(
"videoQuality"
).value
)
}


},


audio:
{

echoCancellation:
true,


noiseSuppression:
true,


sampleRate:
48000


}


}

);





video.srcObject =
stream;



status.textContent =
"دوربین و میکروفن فعال شد ✅";



}

catch(error){



status.textContent =
"دسترسی دوربین یا میکروفن داده نشد ❌";


console.log(error);



}


}









function stopCamera(){



if(stream){


stream
.getTracks()
.forEach(

track =>

track.stop()

);



stream = null;



video.srcObject =
null;



}



status.textContent =
"لایو متوقف شد";



}









async function startLive(){



if(!stream){


await startCamera();


}



const title =

document.getElementById(
"title"
)
.value
.trim()
||
"LainoLive";





const data = {


title:
title,


username:

localStorage.getItem(
"lainolive_username"
)
||
"guest",



videoQuality:

document.getElementById(
"videoQuality"
)
.value,



audioQuality:

document.getElementById(
"audioQuality"
)
.value



};







try{


const response =

fetch("https://mygapino.shop/api/streams/start",

{


method:
"POST",


headers:
{

"Content-Type":
"application/json"

},


body:

JSON.stringify(
data
)


}


);





const result =

await response.json()
.catch(
()=>({})
);







if(result.stream_id || result.id){



localStorage.setItem(

"lainolive_current_stream",

JSON.stringify(
result
)

);



status.textContent =
"لایو شروع شد 🔴";



}

else{


status.textContent =
"اتصال به سرور ناموفق بود";


}



}



catch(error){



// حالت تستی بدون سرور


const fake = {


id:
Date.now(),


title:
title,


username:
data.username,


local:
true


};



localStorage.setItem(

"lainolive_current_stream",

JSON.stringify(
fake
)

);



status.textContent =
"لایو آزمایشی شروع شد 🔴";



}



}









document
.getElementById(
"startBtn"
)
.onclick =
startLive;





document
.getElementById(
"stopBtn"
)
.onclick =
()=>{


stopCamera();


fetch(
"/api/streams/stop",
{

method:
"POST",

headers:
{

"Content-Type":
"application/json"

},


body:

JSON.stringify({

stream_id:

JSON.parse(

localStorage.getItem(
"lainolive_current_stream"
)

||
"{}"

).id

})


}

)
.catch(()=>{});



localStorage.removeItem(

"lainolive_current_stream"

);



};







document
.getElementById(
"backBtn"
)
.onclick =
()=>{


location.href =
"/";


};





</script>


</body>

</html>
