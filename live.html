<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08080d">

    <title>پخش لایو - LainoLive</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;

            background:
                radial-gradient(
                    circle at top,
                    #1a192b 0%,
                    #08080d 52%,
                    #030304 100%
                );

            color: white;

            font-family:
                Tahoma,
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            min-height: 100vh;

            padding-bottom:
                calc(
                    90px +
                    env(safe-area-inset-bottom)
                );
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                calc(
                    12px +
                    env(safe-area-inset-top)
                )
                14px
                12px;

            background:
                rgba(7,7,12,.94);

            border-bottom:
                1px solid
                rgba(255,255,255,.07);

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);
        }

        .header-left {
            display: flex;
            align-items: center;

            gap: 10px;

            min-width: 0;
        }

        .back-btn,
        .share-btn {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 13px;

            background:
                rgba(255,255,255,.07);

            color: white;

            font-size: 18px;
        }

        .header-text {
            min-width: 0;
        }

        .header-title {
            font-size: 16px;
            font-weight: 900;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-user {
            margin-top: 3px;

            color: #9999a7;

            font-size: 10px;
        }

        /* =========================
           VIDEO
        ========================= */

        .video-section {
            position: relative;

            background: black;

            aspect-ratio: 16 / 9;

            overflow: hidden;
        }

        #localVideo {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: black;
        }

        .video-overlay {
            position: absolute;

            left: 12px;
            right: 12px;
            bottom: 12px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;
        }

        .status {
            padding:
                7px
                10px;

            border-radius: 999px;

            background:
                rgba(0,0,0,.72);

            font-size: 10px;

            backdrop-filter:
                blur(10px);
        }

        .status-dot {
            display: inline-block;

            width: 8px;
            height: 8px;

            margin-left: 5px;

            border-radius: 50%;

            background: #f5a400;
        }

        .status-dot.live {
            background: #25d366;
        }

        .status-dot.error {
            background: #ff345b;
        }

        .viewer-count {
            padding:
                7px
                10px;

            border-radius: 999px;

            background:
                rgba(0,0,0,.72);

            font-size: 10px;

            backdrop-filter:
                blur(10px);
        }

        /* =========================
           INFO
        ========================= */

        .info {
            padding:
                15px 16px 8px;
        }

        .title {
            font-size: 20px;
            font-weight: 900;
            line-height: 1.6;
        }

        .username {
            margin-top: 5px;

            color: #a5a5b1;

            font-size: 12px;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;

            gap: 8px;

            margin-top: 12px;
        }

        .pill {
            padding:
                6px
                10px;

            border-radius: 999px;

            background:
                rgba(255,255,255,.06);

            color: #ceced7;

            font-size: 10px;
        }

        .pill.live {
            background:
                rgba(255,29,77,.14);

            color: #ff809b;
        }

        /* =========================
           ACTIONS
        ========================= */

        .actions {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            padding:
                10px 16px;
        }

        .action-btn {
            min-height: 48px;

            border: none;

            border-radius: 14px;

            background:
                rgba(255,255,255,.06);

            color: white;

            font-size: 12px;
            font-weight: 900;
        }

        .action-btn.primary {
            background:
                linear-gradient(
                    135deg,
                    #ff2757,
                    #8b35ff
                );
        }

        /* =========================
           CHAT
        ========================= */

        .chat-section {
            margin:
                12px 16px;

            padding:
                15px;

            border-radius: 20px;

            background:
                rgba(255,255,255,.035);

            border:
                1px solid
                rgba(255,255,255,.07);
        }

        .chat-title {
            font-size: 14px;
            font-weight: 900;
        }

        .messages {
            height: 190px;

            margin-top: 12px;

            overflow-y: auto;
        }

        .message {
            margin-bottom: 8px;

            padding:
                9px 10px;

            border-radius: 13px;

            background:
                rgba(255,255,255,.045);
        }

        .message-user {
            color: #bd91ff;

            font-size: 10px;
            font-weight: 900;
        }

        .message-text {
            margin-top: 4px;

            color: #ececf2;

            font-size: 12px;

            line-height: 1.7;

            overflow-wrap: anywhere;
        }

        .chat-input-row {
            display: flex;

            gap: 8px;

            margin-top: 10px;
        }

        .chat-input {
            flex: 1;

            min-width: 0;

            border: none;
            outline: none;

            padding:
                12px 13px;

            border-radius: 13px;

            background:
                rgba(255,255,255,.07);

            color: white;

            font-size: 12px;
        }

        .chat-input::placeholder {
            color: #777784;
        }

        .chat-send {
            border: none;

            padding:
                0 15px;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #ff2757,
                    #8b35ff
                );

            color: white;

            font-weight: 900;
        }

        /* =========================
           BOTTOM
        ========================= */

        .bottom-bar {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 300;

            padding:
                10px
                10px
                calc(
                    10px +
                    env(safe-area-inset-bottom)
                );

            background:
                rgba(7,7,12,.94);

            border-top:
                1px solid
                rgba(255,255,255,.07);

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);
        }

        .stop-button {
            width: 100%;

            min-height: 50px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #ff2757,
                    #8b35ff
                );

            color: white;

            font-size: 13px;
            font-weight: 900;
        }

        /* =========================
           SHARE MODAL
        ========================= */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 500;

            display: none;

            align-items: flex-end;
            justify-content: center;

            background:
                rgba(0,0,0,.65);
        }

        .modal.show {
            display: flex;
        }

        .modal-card {
            width: 100%;
            max-width: 560px;

            padding:
                20px
                18px
                calc(
                    20px +
                    env(safe-area-inset-bottom)
                );

            border-radius:
                24px
                24px
                0
                0;

            background:
                #111119;

            border-top:
                1px solid
                rgba(255,255,255,.08);
        }

        .modal-title {
            font-size: 17px;
            font-weight: 900;
        }

        .share-link {
            width: 100%;

            margin-top: 12px;

            padding: 12px;

            border: none;
            outline: none;

            border-radius: 13px;

            background:
                rgba(255,255,255,.06);

            color: #c3c3cd;

            direction: ltr;

            font-size: 11px;
        }

        .modal-actions {
            display: grid;

            grid-template-columns:
                repeat(2,1fr);

            gap: 9px;

            margin-top: 12px;
        }

        .modal-btn {
            min-height: 45px;

            border: none;

            border-radius: 13px;

            background:
                rgba(255,255,255,.07);

            color: white;

            font-weight: 900;
        }

        .modal-close {
            width: 100%;

            margin-top: 9px;

            min-height: 43px;

            border: none;

            border-radius: 13px;

            background:
                rgba(255,255,255,.04);

            color: #9999a5;
        }

        @media (min-width:700px) {

            .page {
                max-width: 900px;
                margin: 0 auto;
            }

            .bottom-bar {
                left: 50%;
                right: auto;

                width:
                    min(
                        700px,
                        calc(100% - 30px)
                    );

                transform:
                    translateX(-50%);

                bottom: 14px;

                border:
                    1px solid
                    rgba(255,255,255,.07);

                border-radius: 20px;

                padding: 8px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header class="header">

        <div class="header-left">

            <button
                id="backButton"
                class="back-btn"
                type="button"
            >
                ←
            </button>

            <div class="header-text">

                <div
                    id="headerTitle"
                    class="header-title"
                >
                    در حال آماده‌سازی لایو...
                </div>

                <div
                    id="headerUser"
                    class="header-user"
                >
                    LainoLive
                </div>

            </div>

        </div>

        <button
            id="shareButton"
            class="share-btn"
            type="button"
        >
            ↗
        </button>

    </header>


    <section class="video-section">

        <video
            id="localVideo"
            autoplay
            muted
            playsinline
        ></video>

        <div class="video-overlay">

            <div
                id="statusBox"
                class="status"
            >
                <span
                    id="statusDot"
                    class="status-dot"
                ></span>

                در حال آماده‌سازی...
            </div>

            <div
                id="viewerCount"
                class="viewer-count"
            >
                👁 0 بیننده
            </div>

        </div>

    </section>


    <section class="info">

        <div
            id="streamTitle"
            class="title"
        >
            لایو
        </div>

        <div
            id="streamUsername"
            class="username"
        >
            👤 کاربر
        </div>

        <div class="meta">

            <div class="pill live">
                ● در حال پخش
            </div>

            <div
                id="categoryPill"
                class="pill"
            >
                🎮 عمومی
            </div>

        </div>

    </section>


    <section class="actions">

        <button
            id="cameraButton"
            class="action-btn"
            type="button"
        >
            📷 تعویض دوربین
        </button>

        <button
            id="shareAction"
            class="action-btn primary"
            type="button"
        >
            📤 اشتراک‌گذاری
        </button>

    </section>


    <section class="chat-section">

        <div class="chat-title">
            💬 چت لایو
        </div>

        <div
            id="messages"
            class="messages"
        ></div>

        <div class="chat-input-row">

            <input
                id="chatInput"
                class="chat-input"
                type="text"
                maxlength="250"
                placeholder="پیام خود را بنویسید..."
                autocomplete="off"
            >

            <button
                id="chatSend"
                class="chat-send"
                type="button"
            >
                ارسال
            </button>

        </div>

    </section>

</div>


<div class="bottom-bar">

    <button
        id="stopButton"
        class="stop-button"
        type="button"
    >
        ⏹ پایان لایو
    </button>

</div>


<div
    id="shareModal"
    class="modal"
>

    <div class="modal-card">

        <div class="modal-title">
            اشتراک‌گذاری لایو
        </div>

        <input
            id="shareLink"
            class="share-link"
            readonly
        >

        <div class="modal-actions">

            <button
                id="nativeShareButton"
                class="modal-btn"
                type="button"
            >
                📤 اشتراک‌گذاری
            </button>

            <button
                id="copyShareButton"
                class="modal-btn"
                type="button"
            >
                📋 کپی لینک
            </button>

        </div>

        <button
            id="closeShareButton"
            class="modal-close"
            type="button"
        >
            بستن
        </button>

    </div>

</div>


<script>
/*
 * =========================================================
 * CONFIG
 * =========================================================
 */

const SIGNALING_URL =
    "wss://lainolive-signaling.onrender.com";

const LOGIN_KEY =
    "lainolive_logged_in";

const USERNAME_KEY =
    "lainolive_username";

const CURRENT_STREAM_KEY =
    "lainolive_current_stream";


/*
 * =========================================================
 * ELEMENTS
 * =========================================================
 */

const localVideo =
    document.getElementById(
        "localVideo"
    );

const statusBox =
    document.getElementById(
        "statusBox"
    );

const viewerCountElement =
    document.getElementById(
        "viewerCount"
    );

const headerTitle =
    document.getElementById(
        "headerTitle"
    );

const headerUser =
    document.getElementById(
        "headerUser"
    );

const streamTitleElement =
    document.getElementById(
        "streamTitle"
    );

const streamUsernameElement =
    document.getElementById(
        "streamUsername"
    );

const categoryPill =
    document.getElementById(
        "categoryPill"
    );

const messages =
    document.getElementById(
        "messages"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );

const chatSend =
    document.getElementById(
        "chatSend"
    );

const shareModal =
    document.getElementById(
        "shareModal"
    );

const shareLink =
    document.getElementById(
        "shareLink"
    );


/*
 * =========================================================
 * STATE
 * =========================================================
 */

let currentUsername =
    localStorage.getItem(
        USERNAME_KEY
    ) || "";

let stream = null;

let streamId = null;

let localStream = null;

let socket = null;

let peerConnection = null;

let stopped = false;

let remoteViewerWaiting = false;

let remoteDescriptionReady = false;

let pendingIceCandidates = [];

let qualityMonitorTimer = null;

let reconnectTimer = null;

let currentMaxBitrate = 700000;

let lastPacketsSent = 0;

let lastPacketsLost = 0;

let lastStatsTime = 0;

const BITRATE_LEVELS = [
    250000,
    450000,
    700000
];


/*
 * =========================================================
 * LOGIN
 * =========================================================
 */

if (
    localStorage.getItem(
        LOGIN_KEY
    ) !== "true"
) {

    window.location.href =
        "/login.html";
}


/*
 * =========================================================
 * HELPERS
 * =========================================================
 */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


function getId(item) {

    return (
        item?.id
        ??
        item?.stream_id
    );
}


function getTitle(item) {

    return (
        item?.title
        ||
        "لایو بدون عنوان"
    );
}


function getUsername(item) {

    return (
        item?.username
        ||
        item?.user
        ||
        currentUsername
        ||
        "کاربر"
    );
}


function getCategory(item) {

    return (
        item?.category
        ||
        "عمومی"
    );
}


function getViewers(item) {

    return Number(
        item?.viewer_count
        ??
        item?.viewers
        ??
        0
    );
}


function setStatus(
    text,
    type = "loading"
) {

    const dotClass =
        type === "live"
            ? "live"
            : type === "error"
                ? "error"
                : "";

    statusBox.innerHTML =
        `
            <span
                class="status-dot ${dotClass}"
            ></span>

            ${escapeHtml(text)}
        `;
}


/*
 * =========================================================
 * STREAM
 * =========================================================
 */

function loadStoredStream() {

    try {

        const saved =
            sessionStorage.getItem(
                CURRENT_STREAM_KEY
            );

        if (!saved) {
            return false;
        }


        const parsed =
            JSON.parse(
                saved
            );


        if (!parsed) {
            return false;
        }


        stream =
            parsed;

        streamId =
            getId(parsed);


        return Boolean(
            streamId
        );

    } catch (error) {

        console.error(
            "load stored stream error",
            error
        );

        return false;
    }
}


function renderStream() {

    if (!stream) {
        return;
    }


    const title =
        getTitle(stream);

    const username =
        getUsername(stream);

    const category =
        getCategory(stream);


    document.title =
        title +
        " - LainoLive";


    headerTitle.textContent =
        title;

    headerUser.textContent =
        "👤 " +
        username;


    streamTitleElement.textContent =
        title;

    streamUsernameElement.textContent =
        "👤 " +
        username;

    categoryPill.textContent =
        "🎮 " +
        category;


    viewerCountElement.textContent =
        "👁 " +
        getViewers(stream) +
        " بیننده";
}


/*
 * =========================================================
 * CAMERA
 * =========================================================
 */

async function startCamera() {

    setStatus(
        "در حال روشن کردن دوربین..."
    );


    if (
        !navigator.mediaDevices
        ||
        !navigator.mediaDevices.getUserMedia
    ) {

        setStatus(
            "دوربین پشتیبانی نمی‌شود",
            "error"
        );

        throw new Error(
            "getUserMedia unavailable"
        );
    }


    try {

        localStream =
            await navigator.mediaDevices
                .getUserMedia({
                    video: {
                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        },

                        frameRate: {
                            ideal: 30,
                            max: 30
                        }
                    },

                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

    } catch (firstError) {

        console.warn(
            "high quality camera failed",
            firstError
        );


        localStream =
            await navigator.mediaDevices
                .getUserMedia({
                    video: {
                        width: {
                            ideal: 640
                        },

                        height: {
                            ideal: 480
                        },

                        frameRate: {
                            ideal: 24,
                            max: 24
                        }
                    },

                    audio: true
                });
    }


    localVideo.srcObject =
        localStream;


    try {

        await localVideo.play();

    } catch (error) {

        console.warn(
            "local video play failed",
            error
        );
    }


    setStatus(
        "دوربین آماده است",
        "live"
    );
}


/*
 * =========================================================
 * PEER CONNECTION
 * =========================================================
 */

function createPeerConnection() {

    if (
        peerConnection
    ) {

        try {
            peerConnection.close();
        } catch {}

        peerConnection = null;
    }


    remoteDescriptionReady =
        false;

    pendingIceCandidates =
        [];


    peerConnection =
        new RTCPeerConnection({
            bundlePolicy:
                "max-bundle",

            rtcpMuxPolicy:
                "require",

            iceServers: [
                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },
                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }
            ]
        });


    /*
     * Camera / microphone tracks
     */

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );
                }
            );
    }


    /*
     * ICE
     */

    peerConnection.onicecandidate =
        event => {

            if (
                !event.candidate
            ) {
                return;
            }


            sendSignal({
                type:
                    "ice-candidate",

                room_id:
                    String(
                        streamId
                    ),

                candidate:
                    event.candidate
            });
        };


    /*
     * Connection state
     */

    peerConnection.onconnectionstatechange =
        () => {

            if (
                !peerConnection
            ) {
                return;
            }


            const state =
                peerConnection
                    .connectionState;


            console.log(
                "HOST connectionState:",
                state
            );


            if (
                state ===
                "connected"
            ) {

                setStatus(
                    "لایو در حال پخش است",
                    "live"
                );
            }


            if (
                state ===
                "connecting"
            ) {

                setStatus(
                    "در حال اتصال بیننده..."
                );
            }


            if (
                state ===
                "disconnected"
            ) {

                setStatus(
                    "ارتباط بیننده ناپایدار است"
                );
            }


            if (
                state ===
                "failed"
            ) {

                setStatus(
                    "اتصال WebRTC ناموفق بود",
                    "error"
                );
            }
        };


    /*
     * ICE connection state
     */

    peerConnection.oniceconnectionstatechange =
        () => {

            if (
                !peerConnection
            ) {
                return;
            }


            console.log(
                "HOST ICE:",
                peerConnection
                    .iceConnectionState
            );
        };


    /*
     * Signaling state
     */

    peerConnection.onsignalingstatechange =
        () => {

            if (
                !peerConnection
            ) {
                return;
            }


            console.log(
                "HOST SIGNALING:",
                peerConnection
                    .signalingState
            );
        };
}


/*
 * =========================================================
 * QUALITY CONTROL
 * =========================================================
 */

async function applyVideoQuality() {

    if (
        !peerConnection
    ) {
        return;
    }


    const sender =
        peerConnection
            .getSenders()
            .find(
                item =>
                    item.track
                    &&
                    item.track.kind ===
                        "video"
            );


    if (!sender) {
        return;
    }


    try {

        const parameters =
            sender.getParameters();


        if (
            !parameters.encodings
            ||
            !parameters.encodings.length
        ) {

            parameters.encodings =
                [{}];
        }


        const encoding =
            parameters.encodings[0];


        encoding.maxBitrate =
            currentMaxBitrate;

        encoding.maxFramerate =
            currentMaxBitrate <= 250000
                ? 20
                : currentMaxBitrate <= 450000
                    ? 24
                    : 30;

        encoding.scaleResolutionDownBy =
            currentMaxBitrate <= 250000
                ? 2
                : currentMaxBitrate <= 450000
                    ? 1.5
                    : 1;


        await sender.setParameters(
            parameters
        );


        console.log(
            "Applied video quality:",
            {
                bitrate:
                    currentMaxBitrate,

                fps:
                    encoding.maxFramerate,

                scale:
                    encoding.scaleResolutionDownBy
            }
        );

    } catch (error) {

        console.warn(
            "apply quality error",
            error
        );
    }
}


function setBitrateLevel(
    bitrate
) {

    const allowed =
        BITRATE_LEVELS.includes(
            bitrate
        )
            ? bitrate
            : 700000;


    if (
        currentMaxBitrate ===
        allowed
    ) {

        return false;
    }


    currentMaxBitrate =
        allowed;


    return true;
}


async function monitorConnectionQuality() {

    if (
        !peerConnection
        ||
        peerConnection.connectionState !==
            "connected"
    ) {

        return;
    }


    try {

        const stats =
            await peerConnection.getStats();


        let outbound =
            null;

        let candidatePair =
            null;


        stats.forEach(
            report => {

                if (
                    report.type ===
                        "outbound-rtp"
                    &&
                    (
                        report.kind ===
                            "video"
                        ||
                        report.mediaType ===
                            "video"
                    )
                ) {

                    outbound =
                        report;
                }


                if (
                    report.type ===
                        "candidate-pair"
                    &&
                    (
                        report.state ===
                            "succeeded"
                        ||
                        report.nominated ===
                            true
                    )
                ) {

                    candidatePair =
                        report;
                }
            }
        );


        if (
            !outbound
        ) {
            return;
        }


        const packetsSent =
            Number(
                outbound.packetsSent
                ||
                0
            );


        const packetsLost =
            Number(
                outbound.packetsLost
                ||
                0
            );


        const now =
            Date.now();


        let loss =
            0;


        if (
            packetsSent +
            packetsLost >
                0
        ) {

            loss =
                packetsLost /
                (
                    packetsSent +
                    packetsLost
                );
        }


        const rtt =
            candidatePair
            &&
            candidatePair.currentRoundTripTime
                ? candidatePair.currentRoundTripTime *
                    1000
                : 0;


        console.log(
            "WebRTC quality:",
            {
                loss:
                    Math.round(
                        loss * 100
                    ) +
                    "%",

                rtt:
                    Math.round(
                        rtt
                    ) +
                    "ms",

                packetsSent,

                packetsLost
            }
        );


        /*
         * ---------------------------------
         * وضعیت اولیه
         * ---------------------------------
         */

        if (
            !lastStatsTime
        ) {

            lastStatsTime =
                now;

            lastPacketsSent =
                packetsSent;

            lastPacketsLost =
                packetsLost;

            return;
        }


        /*
         * فقط وقتی آمار جدید داریم.
         */

        const newPacketsSent =
            Math.max(
                0,
                packetsSent -
                lastPacketsSent
            );


        const newPacketsLost =
            Math.max(
                0,
                packetsLost -
                lastPacketsLost
            );


        const packetTotal =
            newPacketsSent +
            newPacketsLost;


        const intervalLoss =
            packetTotal > 0
                ? newPacketsLost /
                    packetTotal
                : loss;


        lastPacketsSent =
            packetsSent;

        lastPacketsLost =
            packetsLost;

        lastStatsTime =
            now;


        /*
         * ---------------------------------
         * اینترنت ضعیف
         * ---------------------------------
         */

        if (
            intervalLoss > 0.08
            ||
            loss > 0.08
            ||
            rtt > 500
        ) {

            let changed =
                false;


            if (
                currentMaxBitrate ===
                700000
            ) {

                changed =
                    setBitrateLevel(
                        450000
                    );

            } else if (
                currentMaxBitrate ===
                450000
            ) {

                changed =
                    setBitrateLevel(
                        250000
                    );
            }


            if (
                changed
            ) {

                await applyVideoQuality();


                setStatus(
                    "کیفیت کاهش یافت",
                    "برای جلوگیری از قطع شدن لایو."
                );
            }


            return;
        }


        /*
         * ---------------------------------
         * اینترنت متوسط
         * ---------------------------------
         */

        if (
            intervalLoss > 0.03
            ||
            loss > 0.03
            ||
            rtt > 300
        ) {

            if (
                currentMaxBitrate ===
                700000
            ) {

                setBitrateLevel(
                    450000
                );


                await applyVideoQuality();


                setStatus(
                    "کیفیت پخش تنظیم شد",
                    "اتصال کمی ناپایدار است."
                );
            }


            return;
        }


        /*
         * ---------------------------------
         * اینترنت خوب
         * ---------------------------------
         */

        if (
            intervalLoss < 0.02
            &&
            loss < 0.02
            &&
            (
                !rtt
                ||
                rtt < 180
            )
        ) {

            let changed =
                false;


            if (
                currentMaxBitrate ===
                250000
            ) {

                changed =
                    setBitrateLevel(
                        450000
                    );

            } else if (
                currentMaxBitrate ===
                450000
            ) {

                changed =
                    setBitrateLevel(
                        700000
                    );
            }


            if (
                changed
            ) {

                await applyVideoQuality();


                setStatus(
                    "کیفیت پخش بهتر شد",
                    "اتصال پایدار است.",
                    "live"
                );
            }
        }
    } catch (error) {

        console.warn(
            "quality monitor error",
            error
        );
    }
}


function startQualityMonitor() {

    if (
        qualityMonitorTimer
    ) {

        clearInterval(
            qualityMonitorTimer
        );
    }


    lastPacketsSent =
        0;

    lastPacketsLost =
        0;

    lastStatsTime =
        0;


    qualityMonitorTimer =
        setInterval(
            monitorConnectionQuality,
            3000
        );
}

async function handleIceCandidate(
    candidate
) {

    if (
        !candidate
        ||
        !peerConnection
    ) {

        return;
    }


    if (
        !remoteDescriptionReady
    ) {

        pendingIceCandidates.push(
            candidate
        );

        return;
    }


    try {

        await peerConnection
            .addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

    } catch (error) {

        console.error(
            "add host ICE error",
            error
        );
    }
}


async function flushIceCandidates() {

    if (
        !peerConnection
    ) {

        return;
    }


    while (
        pendingIceCandidates.length
    ) {

        const candidate =
            pendingIceCandidates.shift();


        try {

            await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

        } catch (error) {

            console.error(
                "flush host ICE error",
                error
            );
        }
    }
}


async function handleSignal(
    message
) {

    const type =
        message?.type;


    console.log(
        "HOST SIGNAL:",
        message
    );


    /*
     * Viewer joined.
     */

    if (
        type ===
        "viewer-joined"
    ) {

        remoteViewerWaiting =
            true;


        setStatus(
            "بیننده وارد لایو شد..."
        );


        await createOfferForViewer();

        return;
    }


    /*
     * Viewer answer.
     */

    if (
        type ===
        "answer"
    ) {

        if (
            !peerConnection
        ) {

            console.warn(
                "answer received without peer"
            );

            return;
        }


        const answer =
            message.answer
            ||
            message.description;


        if (
            !answer
        ) {

            console.warn(
                "answer payload missing"
            );

            return;
        }


        try {

            await peerConnection
                .setRemoteDescription(
                    new RTCSessionDescription(
                        answer
                    )
                );


            remoteDescriptionReady =
                true;


            await flushIceCandidates();

            await applyVideoQuality();


            setStatus(
                "لایو در حال پخش است",
                "live"
            );

        } catch (error) {

            console.error(
                "set remote answer error",
                error
            );


            setStatus(
                "خطا در اتصال WebRTC",
                "error"
            );
        }


        return;
    }


    /*
     * Viewer ICE.
     */

    if (
        type ===
        "ice-candidate"
        ||
        type ===
        "candidate"
        ||
        type ===
        "ice"
    ) {

        const candidate =
            message.candidate
            ||
            message.ice;


        await handleIceCandidate(
            candidate
        );

        return;
    }


    /*
     * Viewer left.
     */

    if (
        type ===
        "viewer-left"
    ) {

        remoteViewerWaiting =
            false;


        remoteDescriptionReady =
            false;


        pendingIceCandidates =
            [];


        if (
            peerConnection
        ) {

            try {
                peerConnection.close();
            } catch {}

            peerConnection =
                null;
        }


        setStatus(
            "لایو در حال پخش است",
            "live"
        );


        return;
    }


    /*
     * Host info / ping.
     */

    if (
        type ===
        "room-info"
    ) {

        console.log(
            "ROOM INFO:",
            message
        );

        return;
    }


    if (
        type ===
        "pong"
    ) {

        return;
    }
}


function scheduleSignalingReconnect() {

    if (
        stopped
        ||
        reconnectTimer
    ) {

        return;
    }


    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;


                if (
                    stopped
                ) {
                    return;
                }


                connectSignaling();
            },
            3000
        );
}


function connectSignaling() {

    if (
        stopped
    ) {
        return;
    }


    if (
        socket
        &&
        (
            socket.readyState ===
                WebSocket.OPEN
            ||
            socket.readyState ===
                WebSocket.CONNECTING
        )
    ) {

        return;
    }


    setStatus(
        "در حال اتصال به سرور ارتباطی..."
    );


    try {

        socket =
            new WebSocket(
                SIGNALING_URL
            );

    } catch (error) {

        console.error(
            "WebSocket create error",
            error
        );


        setStatus(
            "اتصال به سرور ناموفق بود",
            "error"
        );


        scheduleSignalingReconnect();

        return;
    }


    socket.onopen =
        () => {

            console.log(
                "HOST SIGNALING CONNECTED"
            );


            setStatus(
                "لایو آماده است",
                "live"
            );


            sendSignal({
                type:
                    "join",

                room_id:
                    String(
                        streamId
                    ),

                role:
                    "host"
            });
        };


    socket.onmessage =
        async event => {

            try {

                const message =
                    JSON.parse(
                        event.data
                    );


                await handleSignal(
                    message
                );

            } catch (error) {

                console.error(
                    "signal message error",
                    error
                );
            }
        };


    socket.onerror =
        error => {

            console.error(
                "HOST SIGNALING ERROR",
                error
            );


            setStatus(
                "خطای سرور ارتباطی",
                "error"
            );
        };


    socket.onclose =
        event => {

            console.warn(
                "HOST SIGNALING CLOSED",
                event.code,
                event.reason
            );


            if (
                stopped
            ) {

                return;
            }


            setStatus(
                "اتصال سرور قطع شد",
                "error"
            );


            scheduleSignalingReconnect();
        };
}

async function loadMessages() {

    if (
        !streamId
    ) {

        return;
    }


    try {

        const response =
            await fetch(
                "/api/chat/messages?stream_id="
                +
                encodeURIComponent(
                    streamId
                ),
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            return;
        }


        const data =
            await response.json();


        const list =
            Array.isArray(
                data.messages
            )
                ? data.messages
                : Array.isArray(data)
                    ? data
                    : [];


        messages.innerHTML =
            list
                .map(
                    item => {

                        const username =
                            item.username
                            ||
                            item.user
                            ||
                            "کاربر";

                        const text =
                            item.message
                            ??
                            item.text
                            ??
                            "";


                        return `
                            <div class="message">

                                <div class="message-user">
                                    ${escapeHtml(username)}
                                </div>

                                <div class="message-text">
                                    ${escapeHtml(text)}
                                </div>

                            </div>
                        `;
                    }
                )
                .join("");


        messages.scrollTop =
            messages.scrollHeight;

    } catch (error) {

        console.warn(
            "chat load error",
            error
        );
    }
}


async function sendChat() {

    const text =
        chatInput.value.trim();


    if (
        !text
        ||
        !streamId
    ) {

        return;
    }


    chatSend.disabled =
        true;


    try {

        const response =
            await fetch(
                "/api/chat/send",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            stream_id:
                                String(
                                    streamId
                                ),

                            username:
                                currentUsername,

                            message:
                                text
                        })
                }
            );


        if (
            response.ok
        ) {

            chatInput.value =
                "";

            await loadMessages();
        }

    } catch (error) {

        console.error(
            "send chat error",
            error
        );

    } finally {

        chatSend.disabled =
            false;
    }
}

/*
 * =========================================================
 * CAMERA SWITCH
 * =========================================================
 */

async function switchCamera() {

    if (
        !localStream
    ) {

        return;
    }


    const videoTrack =
        localStream
            .getVideoTracks()[0];


    if (
        !videoTrack
    ) {

        return;
    }


    const settings =
        videoTrack.getSettings();


    const currentFacing =
        settings.facingMode
        ||
        "user";


    const nextFacing =
        currentFacing ===
            "environment"
            ? "user"
            : "environment";


    try {

        const newStream =
            await navigator.mediaDevices
                .getUserMedia({
                    video: {
                        facingMode: {
                            exact:
                                nextFacing
                        }
                    },

                    audio: false
                });


        const newTrack =
            newStream
                .getVideoTracks()[0];


        if (!newTrack) {

            return;
        }


        const sender =
            peerConnection
                ?.getSenders()
                .find(
                    item =>
                        item.track
                        &&
                        item.track.kind ===
                            "video"
                );


        if (
            sender
        ) {

            await sender.replaceTrack(
                newTrack
            );

        }


        videoTrack.stop();


        const audioTracks =
            localStream
                .getAudioTracks();


        localStream =
            new MediaStream([
                newTrack,
                ...audioTracks
            ]);


        localVideo.srcObject =
            localStream;


        /*
         * Apply current quality
         * to the new video sender.
         */

        await applyVideoQuality();

    } catch (error) {

        console.warn(
            "switch camera error",
            error
        );
    }
}


/*
 * =========================================================
 * STOP STREAM
 * =========================================================
 */

async function stopStream() {

    if (
        stopped
    ) {

        return;
    }


    stopped =
        true;


    setStatus(
        "در حال پایان لایو..."
    );


    if (
        qualityMonitorTimer
    ) {

        clearInterval(
            qualityMonitorTimer
        );

        qualityMonitorTimer =
            null;
    }


    if (
        reconnectTimer
    ) {

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer =
            null;
    }


    try {

        await fetch(
            "/api/streams/stop",
            {
                method:
                    "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        stream_id:
                            String(
                                streamId
                            ),

                        username:
                            currentUsername
                    }),

                keepalive:
                    true
            }
        );

    } catch (error) {

        console.warn(
            "stop stream error",
            error
        );
    }


    if (
        socket
        &&
        socket.readyState ===
            WebSocket.OPEN
    ) {

        try {

            socket.send(
                JSON.stringify({
                    type:
                        "leave",

                    room_id:
                        String(
                            streamId
                        ),

                    role:
                        "host"
                })
            );

        } catch {}
    }


    if (
        peerConnection
    ) {

        try {
            peerConnection.close();
        } catch {}
    }


    if (
        localStream
    ) {

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );
    }


    if (
        localVideo
    ) {

        localVideo.srcObject =
            null;
    }


    if (
        socket
    ) {

        try {
            socket.close();
        } catch {}
    }


    sessionStorage.removeItem(
        CURRENT_STREAM_KEY
    );


    window.location.href =
        "/index.html";
}

            shareModal
        ) {

            closeShare();
        }
    }
);


chatSend.addEventListener(
    "click",
    sendChat
);


chatInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendChat();
        }
    }
);


/*
 * =========================================================
 * CLEANUP
 * =========================================================
 */

window.addEventListener(
    "beforeunload",
    () => {

        if (
            stopped
        ) {

            return;
        }


        if (
            qualityMonitorTimer
        ) {

            clearInterval(
                qualityMonitorTimer
            );
        }


        if (
            reconnectTimer
        ) {

            clearTimeout(
                reconnectTimer
            );
        }


        /*
         * فقط signaling leave.
         * refresh نباید لایو را از API متوقف کند.
         */

        if (
            socket
            &&
            socket.readyState ===
                WebSocket.OPEN
        ) {

            try {

                socket.send(
                    JSON.stringify({
                        type:
                            "leave",

                        room_id:
                            String(
                                streamId
                            ),

                        role:
                            "host"
                    })
                );

            } catch {}
        }
    }
);


/*
 * =========================================================
 * START
 * =========================================================
 */

async function start() {

    try {

        const exists =
            loadStoredStream();


        if (!exists) {

            setStatus(
                "لایو پیدا نشد",
                "error"
            );

            return;
        }


        renderStream();


        /*
         * Camera MUST be ready first.
         */

        await startCamera();


        /*
         * Signaling after camera.
         */

        connectSignaling();


        /*
         * Chat.
         */

        await loadMessages();


        setInterval(
            loadMessages,
            3000
        );


        /*
         * Viewer count.
         */

        await updateViewerCount();


        setInterval(
            updateViewerCount,
            3000
        );

    } catch (error) {

        console.error(
            "LIVE START ERROR",
            error
        );


        setStatus(
            "اجرای لایو ناموفق بود",
            "error"
        );
    }
}


start();
</script>

</body>
</html>
