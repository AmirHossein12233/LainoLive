<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
LainoLive - Start Live
</title>


<style>

body{

margin:0;

background:#050508;

color:white;

font-family:tahoma;

padding:20px;

}


.box{

max-width:600px;

margin:auto;

background:#15151f;

padding:20px;

border-radius:20px;

}


video{

width:100%;

height:330px;

background:black;

border-radius:20px;

}


input,select,button{

width:100%;

height:50px;

margin-top:12px;

border:0;

border-radius:14px;

padding:0 15px;

}



input,select{

background:#222;

color:white;

}



button{

font-weight:bold;

}



.start{

background:#ff2757;

color:white;

}



.stop{

background:#333;

color:white;

}



#status{

margin-top:15px;

text-align:center;

color:#aaa;

}


</style>

</head>



<body>



<div class="box">


<h2>
🔴 LainoLive
</h2>


<video

id="preview"

autoplay

muted

playsinline>

</video>



<input

id="title"

placeholder="عنوان لایو">



<select id="quality">

<option value="360">
360p
</option>

<option value="480">
480p
</option>

<option value="720"
selected>

720p HD

</option>

<option value="1080">

1080p

</option>


</select>




<button

class="start"

id="startBtn">

شروع لایو

</button>



<button

class="stop"

id="stopBtn">

توقف

</button>



<div id="status">

آماده

</div>


</div>





<script src="/live-webrtc.js"></script>


<script>


const API = "https://mygapino.shop";



let mediaStream = null;

let streamId = null;





const preview =

document.getElementById(
"preview"
);



const status =

document.getElementById(
"status"
);






async function camera(){


try{


mediaStream =

await navigator.mediaDevices.getUserMedia(

{

video:

{

width:

{

ideal:

Number(

document.getElementById(
"quality"
)
.value

)

},


height:

{

ideal:

Number(

document.getElementById(
"quality"
)
.value

)

}

},



audio:

{

echoCancellation:true,

noiseSuppression:true

}


}

);



preview.srcObject =

mediaStream;



status.textContent =

"دوربین فعال شد ✅";



}

catch(error){


console.log(error);


status.textContent =

"خطا در دسترسی دوربین ❌";


}



}









async function startLive(){



if(!mediaStream){

await camera();

}




try{


const response =

await fetch(

API+
"/api/streams/start",

{


method:"POST",


headers:

{

"Content-Type":

"application/json"

},


body:

JSON.stringify({

title:

document.getElementById(
"title"
).value
||
"LainoLive",



username:

localStorage.getItem(
"lainolive_username"
)
||
"guest",



videoQuality:

document.getElementById(
"quality"
).value,


audioQuality:

"128000"


})


}

);



const data =

await response.json();





if(data.success){


streamId =

data.stream_id;



localStorage.setItem(

"lainolive_current_stream",

JSON.stringify(

data.stream

)

);





LainoWebRTC.start(

streamId,

mediaStream

);



status.textContent =

"🔴 لایو فعال شد";



}

else{


status.textContent =

"شروع لایو ناموفق بود";


}



}

catch(error){


console.log(error);


status.textContent =

"اتصال به سرور ناموفق بود ❌";


}



}









async function stopLive(){



if(streamId){


await fetch(

API+
"/api/streams/stop",

{


method:"POST",


headers:

{

"Content-Type":

"application/json"

},


body:

JSON.stringify({

stream_id:

streamId

})


}

).catch(()=>{});



}



if(mediaStream){


mediaStream

.getTracks()

.forEach(

track=>

track.stop()

);


}



if(
LainoWebRTC.peer
){

LainoWebRTC.peer.close();

}



status.textContent =

"لایو متوقف شد";



}








document

.getElementById(
"startBtn"
)

.onclick =

startLive;





document

.getElementById(
"stopBtn"
)

.onclick =

stopLive;



camera();



</script>



</body>

</html>
