<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#020617"
    >

    <title>پخش زنده | LainoLive</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #020617;
            color: #ffffff;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            overflow: hidden;
        }

        .live-page {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .live-header {
            min-height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 14px;
            background: #111827;
            border-bottom: 1px solid #273449;
        }

        .live-left,
        .live-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-button {
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 10px;
            background: #1e293b;
            color: #ffffff;
            cursor: pointer;
            font-size: 18px;
        }

        .live-title-area {
            min-width: 0;
        }

        .live-title {
            max-width: 320px;
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .live-user {
            margin-top: 3px;
            color: #94a3b8;
            font-size: 11px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 10px;
            border-radius: 9px;
            background: #132b1d;
            color: #bbf7d0;
            font-size: 11px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
        }

        .stop-button {
            border: 0;
            border-radius: 10px;
            padding: 10px 15px;
            background: #dc2626;
            color: #ffffff;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .live-main {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
        }

        .video-area {
            position: relative;
            min-width: 0;
            min-height: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #localVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000000;
        }

        .video-overlay {
            position: absolute;
            left: 14px;
            top: 14px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .live-badge,
        .viewer-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 10px;
            border-radius: 9px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #334155;
            font-size: 11px;
        }

        .live-badge {
            color: #fca5a5;
        }

        .viewer-badge {
            color: #bfdbfe;
        }

        .chat-panel {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #111827;
            border-right: 1px solid #273449;
        }

        .chat-header {
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid #273449;
        }

        .chat-title {
            font-size: 14px;
            font-weight: bold;
        }

        .chat-state {
            color: #86efac;
            font-size: 11px;
        }

        .chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 12px;
        }

        .chat-empty {
            text-align: center;
            color: #64748b;
            padding: 70px 10px;
            font-size: 13px;
        }

        .chat-message {
            margin-bottom: 12px;
        }

        .chat-user {
            color: #86efac;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .chat-owner {
            color: #fbbf24;
        }

        .chat-text {
            color: #e2e8f0;
            font-size: 13px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .chat-form {
            display: flex;
            gap: 7px;
            padding: 9px;
            border-top: 1px solid #273449;
        }

        .chat-input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 11px;
            outline: none;
            background: #1e293b;
            color: #ffffff;
            font-family: inherit;
        }

        .chat-send {
            border: 0;
            border-radius: 11px;
            padding: 0 14px;
            background: #22c55e;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-send:disabled {
            opacity: 0.5;
        }

        .connection-info {
            padding: 8px 10px;
            background: #0f172a;
            border-top: 1px solid #273449;
            color: #64748b;
            font-size: 10px;
            direction: ltr;
            text-align: left;
            overflow-wrap: anywhere;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 20px;
            z-index: 1000;
            transform: translate(-50%, 20px);
            opacity: 0;
            pointer-events: none;
            max-width: calc(100% - 30px);
            padding: 11px 16px;
            border-radius: 12px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #ffffff;
            font-size: 13px;
            text-align: center;
            transition: opacity 0.2s ease,
                        transform 0.2s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 850px) {
            body {
                overflow: auto;
            }

            .live-page {
                height: auto;
                min-height: 100vh;
            }

            .live-main {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(300px, 52vh) minmax(350px, 48vh);
            }

            .chat-panel {
                border-right: 0;
                border-top: 1px solid #273449;
            }

            .live-title {
                max-width: 180px;
            }

            .viewer-badge {
                display: none;
            }
        }
    </style>
</head>

<body>

<script>
    const loggedIn =
        localStorage.getItem(
            "lainolive_logged_in"
        );

    const currentUsername =
        localStorage.getItem(
            "lainolive_username"
        );

    if (
        loggedIn !== "true" ||
        !currentUsername
    ) {
        window.location.replace(
            "/login.html"
        );
    }
</script>


<div class="live-page">

    <header class="live-header">

        <div class="live-left">

            <button
                id="backButton"
                class="back-button"
                type="button"
            >
                ←
            </button>

            <div class="live-title-area">

                <div
                    id="liveTitle"
                    class="live-title"
                >
                    پخش زنده
                </div>

                <div
                    id="liveUser"
                    class="live-user"
                >
                    شما
                </div>

            </div>

        </div>


        <div class="live-right">

            <div
                id="status"
                class="status"
            >
                <span
                    id="statusDot"
                    class="status-dot"
                ></span>

                <span id="statusText">
                    در حال آماده‌سازی
                </span>
            </div>

            <button
                id="stopButton"
                class="stop-button"
                type="button"
            >
                پایان لایو
            </button>

        </div>

    </header>


    <main class="live-main">

        <section class="video-area">

            <video
                id="localVideo"
                autoplay
                muted
                playsinline
            ></video>


            <div class="video-overlay">

                <div class="live-badge">
                    🔴 LIVE
                </div>

                <div
                    id="viewerBadge"
                    class="viewer-badge"
                >
                    👁 بیننده: 0
                </div>

            </div>

        </section>


        <section class="chat-panel">

            <div class="chat-header">

                <div class="chat-title">
                    💬 چت زنده
                </div>

                <div
                    id="chatState"
                    class="chat-state"
                >
                    آماده
                </div>

            </div>


            <div
                id="chatMessages"

            >

                <div class="chat-empty">
                    هنوز پیامی ارسال نشده است.
                </div>

            </div>


            <form

                <input

                    placeholder="پیام بنویس..."

                <button
                    id="chatSend"

                    type="submit"
                >
                    ارسال
                </button>

            </form>


            <div
                id="connectionInfo"
                class="connection-info"
            >
                WebRTC: آماده
            </div>

        </section>

    </main>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

    /* =====================================================
       STREAM
    ===================================================== */

    const streamRaw =
        sessionStorage.getItem(
            "lainolive_current_stream"
        );

    let currentStream = null;

    try {

        currentStream =
            streamRaw
                ? JSON.parse(streamRaw)
                : null;

    } catch (error) {

        currentStream = null;
    }

    if (!currentStream) {

        window.location.replace(
            "/index.html"
        );
    }


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const liveTitle =
        document.getElementById(
            "liveTitle"
        );

    const liveUser =
        document.getElementById(
            "liveUser"
        );

    const status =
        document.getElementById(
            "status"
        );

    const statusDot =
        document.getElementById(
            "statusDot"
        );

    const statusText =
        document.getElementById(
            "statusText"
        );

    const localVideo =
        document.getElementById(
            "localVideo"
        );

    const viewerBadge =
        document.getElementById(
            "viewerBadge"
        );

    const stopButton =
        document.getElementById(
            "stopButton"
        );

    const chatState =
        document.getElementById(
            "chatState"
        );

    const chatMessages =
        document.getElementById(
            "chatMessages"
        );

    const chatForm =
        document.getElementById(
            "chatForm"
        );

    const chatInput =
        document.getElementById(
            "chatInput"
        );

    const chatSend =
        document.getElementById(
            "chatSend"
        );

    const connectionInfo =
        document.getElementById(
            "connectionInfo"
        );

    const toast =
        document.getElementById(
            "toast"
        );


    liveTitle.textContent =
        currentStream?.title ||
        "پخش زنده";

    liveUser.textContent =
        "صاحب لایو: " +
        (
            currentStream?.username ||
            currentUsername
        );


    /* =====================================================
       WEBRTC
    ===================================================== */

    const SIGNALING_URL =
        "wss://lainolive-signaling.onrender.com";

    const RTC_CONFIGURATION = {
        iceServers: [
            {
                urls:
                    "stun:stun.l.google.com:19302"
            },
            {
                urls:
                    "stun:stun1.l.google.com:19302"
            }
        ]
    };


    let websocket = null;

    let localStream = null;

    let myPeerId = null;

    let lastChatId = "";

    let chatTimer = null;

    let viewerTimer = null;

    let stopped = false;


    const peers = new Map();

    const pendingCandidates = new Map();


    /* =====================================================
       HELPERS
    ===================================================== */

    function showToast(text) {

        toast.textContent =
            text;

        toast.classList.add(
            "show"
        );

        setTimeout(
            () => {
                toast.classList.remove(
                    "show"
                );
            },
            2500
        );
    }


    function escapeHtml(text) {

        return String(text)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    function setStatus(
        text,
        online
    ) {

        statusText.textContent =
            text;

        statusDot.style.background =
            online
                ? "#22c55e"
                : "#ef4444";

        status.style.background =
            online
                ? "#132b1d"
                : "#3f0a0a";
    }


    function sendSignal(data) {

        if (
            !websocket ||
            websocket.readyState !==
            WebSocket.OPEN
        ) {
            return false;
        }

        websocket.send(
            JSON.stringify(data)
        );

        return true;
    }


    /* =====================================================
       PEER
    ===================================================== */

    function createPeer(
        peerId
    ) {

        if (
            peers.has(peerId)
        ) {
            return peers.get(peerId);
        }


        const pc =
            new RTCPeerConnection(
                RTC_CONFIGURATION
            );


        if (localStream) {

            localStream
                .getTracks()
                .forEach(
                    track => {

                        pc.addTrack(
                            track,
                            localStream
                        );
                    }
                );
        }


        pc.onicecandidate =
            event => {

                if (
                    !event.candidate
                ) {
                    return;
                }


                sendSignal({

                    type:
                        "ice-candidate",

                    target_peer_id:
                        peerId,

                    candidate:
                        event.candidate
                });
            };


        pc.onconnectionstatechange =
            () => {

                const state =
                    pc.connectionState;


                connectionInfo.textContent =
                    "WebRTC: " +
                    state;


                if (
                    state ===
                    "connected"
                ) {

                    setStatus(
                        "در حال پخش",
                        true
                    );

                } else if (
                    state ===
                    "failed"
                ) {

                    showToast(
                        "اتصال یکی از بیننده‌ها ناموفق شد."
                    );
                }
            };


        pc.oniceconnectionstatechange =
            () => {

                connectionInfo.textContent =
                    "ICE: " +
                    pc.iceConnectionState;
            };


        peers.set(
            peerId,
            pc
        );


        return pc;
    }


    function removePeer(
        peerId
    ) {

        const pc =
            peers.get(peerId);


        if (pc) {

            try {
                pc.close();
            } catch (error) {
            }

        }


        peers.delete(
            peerId
        );

        pendingCandidates.delete(
            peerId
        );
    }


    async function applyPendingCandidates(
        peerId
    ) {

        const pc =
            peers.get(
                peerId
            );

        if (!pc) {
            return;
        }


        const list =
            pendingCandidates.get(
                peerId
            ) || [];


        while (
            list.length
        ) {

            const candidate =
                list.shift();


            try {

                await pc.addIceCandidate(
                    candidate
                );

            } catch (error) {

                console.error(
                    "Pending ICE:",
                    error
                );
            }
        }


        pendingCandidates.delete(
            peerId
        );
    }


    async function makeOffer(
        peerId
    ) {

        if (!localStream) {
            return;
        }


        const pc =
            createPeer(
                peerId
            );


        try {

            const offer =
                await pc.createOffer();


            await pc.setLocalDescription(
                offer
            );


            sendSignal({

                type:
                    "offer",

                target_peer_id:
                    peerId,

                offer:
                    pc.localDescription
            });


        } catch (error) {

            console.error(
                "Make offer:",
                error
            );

            showToast(
                "ساخت اتصال WebRTC ناموفق بود."
            );
        }
    }


    async function addTrackToExistingPeers() {

        if (!localStream) {
            return;
        }


        for (
            const [
                peerId,
                pc
            ]
            of peers
        ) {

            const senders =
                pc.getSenders();


            localStream
                .getTracks()
                .forEach(
                    track => {

                        const exists =
                            senders.some(
                                sender =>
                                    sender.track &&
                                    sender.track.kind ===
                                    track.kind
                            );


                        if (!exists) {

                            pc.addTrack(
                                track,
                                localStream
                            );
                        }
                    }
                );


            await makeOffer(
                peerId
            );
        }
    }


    /* =====================================================
       SIGNALING
    ===================================================== */

    async function handleSignal(
        message
    ) {

        const type =
            message.type;


        if (
            type === "joined"
        ) {

            myPeerId =
                message.peer_id ||
                null;


            chatState.textContent =
                "سیگنالینگ متصل";


            connectionInfo.textContent =
                "WebSocket: متصل";


            setStatus(
                "در حال پخش",
                true
            );


            return;
        }


        if (
            type === "peer_joined"
        ) {

            if (
                message.role !==
                "viewer"
            ) {
                return;
            }


            const viewerPeerId =
                message.peer_id;


            if (!viewerPeerId) {
                return;
            }


            await makeOffer(
                viewerPeerId
            );


            return;
        }


        if (
            type === "answer"
        ) {

            const viewerPeerId =
                message.peer_id;


            if (!viewerPeerId) {
                return;
            }


            const pc =
                peers.get(
                    viewerPeerId
                );


            if (!pc) {
                return;
            }


            try {

                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        message.answer
                    )
                );


                await applyPendingCandidates(
                    viewerPeerId
                );


            } catch (error) {

                console.error(
                    "Answer:",
                    error
                );
            }


            return;
        }


        if (
            type === "ice-candidate"
        ) {

            const viewerPeerId =
                message.peer_id;


            if (!viewerPeerId) {
                return;
            }


            const candidate =
                new RTCIceCandidate(
                    message.candidate
                );


            const pc =
                peers.get(
                    viewerPeerId
                );


            if (
                pc &&
                pc.remoteDescription
            ) {

                try {

                    await pc.addIceCandidate(
                        candidate
                    );

                } catch (error) {

                    console.error(
                        "ICE:",
                        error
                    );
                }

            } else {

                if (
                    !pendingCandidates.has(
                        viewerPeerId
                    )
                ) {

                    pendingCandidates.set(
                        viewerPeerId,
                        []
                    );
                }


                pendingCandidates
                    .get(
                        viewerPeerId
                    )
                    .push(
                        candidate
                    );
            }


            return;
        }


        if (
            type === "peer_left"
        ) {

            const peerId =
                message.peer_id;


            if (peerId) {

                removePeer(
                    peerId
                );
            }


            return;
        }


        if (
            type === "error"
        ) {

            showToast(
                message.message ||
                "خطای سیگنالینگ."
            );
        }
    }


    function connectSignaling() {

        connectionInfo.textContent =
            SIGNALING_URL;


        try {

            websocket =
                new WebSocket(
                    SIGNALING_URL
                );

        } catch (error) {

            setStatus(
                "خطا",
                false
            );

            showToast(
                "اتصال سیگنالینگ برقرار نشد."
            );

            return;
        }


        websocket.onopen =
            () => {

                sendSignal({

                    type:
                        "join",

                    room_id:
                        currentStream.id,

                    username:
                        currentUsername,

                    role:
                        "owner"

                });
            };


        websocket.onmessage =
            async event => {

                try {

                    const message =
                        JSON.parse(
                            event.data
                        );


                    await handleSignal(
                        message
                    );

                } catch (error) {

                    console.error(
                        "Signal:",
                        error
                    );
                }
            };


        websocket.onerror =
            error => {

                console.error(
                    "WebSocket:",
                    error
                );


                setStatus(
                    "خطای سیگنالینگ",
                    false
                );
            };


        websocket.onclose =
            () => {

                if (stopped) {
                    return;
                }


                setStatus(
                    "سیگنالینگ قطع شد",
                    false
                );


                chatState.textContent =
                    "قطع";
            };
    }


    /* =====================================================
       CAMERA
    ===================================================== */

    async function startCamera() {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            showToast(
                "مرورگر اجازه دسترسی به دوربین را نمی‌دهد."
            );

            return;
        }


        try {

            localStream =
                await navigator.mediaDevices.getUserMedia({

                    video: {
                        width: {
                            ideal: 1280
                        },
                        height: {
                            ideal: 720
                        },
                        frameRate: {
                            ideal: 30,
                            max: 30
                        }
                    },

                    audio: {
                        echoCancellation:
                            true,

                        noiseSuppression:
                            true,

                        autoGainControl:
                            true
                    }

                });


            localVideo.srcObject =
                localStream;


            await localVideo.play()
                .catch(
                    () => {}
                );


            setStatus(
                "در حال پخش",
                true
            );


            connectionInfo.textContent =
                "دوربین: آماده";


            await addTrackToExistingPeers();


        } catch (error) {

            console.error(
                "Camera:",
                error
            );


            setStatus(
                "دسترسی به دوربین ناموفق",
                false
            );


            showToast(
                "دسترسی به دوربین یا میکروفون انجام نشد."
            );
        }
    }


    /* =====================================================
       CHAT
    ===================================================== */

    async function loadChat() {

        if (
            !currentStream ||
            stopped
        ) {
            return;
        }


        try {

            const params =
                new URLSearchParams();


            params.set(
                "stream_id",
                currentStream.id
            );


            if (lastChatId) {

                params.set(
                    "after_id",
                    lastChatId
                );
            }


            const response =
                await fetch(
                    "/api/chat/messages?" +
                    params.toString(),
                    {
                        cache:
                            "no-store"
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {
                return;
            }


            const messages =
                data.messages || [];


            if (!messages.length) {
                return;
            }


            const empty =
                chatMessages.querySelector(
                    ".chat-empty"
                );


            if (empty) {
                empty.remove();
            }


            messages.forEach(
                message => {

                    const element =
                        document.createElement(
                            "div"
                        );


                    element.className =
                        "chat-message";


                    const owner =
                        message.username ===
                        currentStream.username;


                    element.innerHTML = `
                        <div class="${
                            owner
                                ? "chat-user chat-owner"
                                : "chat-user"
                        }">
                            ${escapeHtml(
                                message.username
                            )}
                            ${owner ? " 👑" : ""}
                        </div>

                        <div class="chat-text">
                            ${escapeHtml(
                                message.text
                            )}
                        </div>
                    `;


                    chatMessages.appendChild(
                        element
                    );


                    lastChatId =
                        message.id;
                }
            );


            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        } catch (error) {

            console.error(
                "Chat:",
                error
            );
        }
    }


    chatForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const text =
                chatInput.value.trim();


            if (
                !text ||
                !currentStream
            ) {
                return;
            }


            chatSend.disabled =
                true;


            try {

                const response =
                    await fetch(
                        "/api/chat/send",
                        {
                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    stream_id:
                                        currentStream.id,

                                    username:
                                        currentUsername,

                                    text:
                                        text

                                })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    showToast(
                        data.message ||
                        "ارسال پیام ناموفق بود."
                    );

                    return;
                }


                chatInput.value =
                    "";


                await loadChat();

            } catch (error) {

                showToast(
                    "خطا در ارسال پیام."
                );

            } finally {

                chatSend.disabled =
                    false;

                chatInput.focus();
            }
        }
    );


    /* =====================================================
       VIEWERS
    ===================================================== */

    async function updateViewerCount() {

        if (
            !currentStream ||
            stopped
        ) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/streams",
                    {
                        cache:
                            "no-store"
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {
                return;
            }


            const stream =
                (data.streams || [])
                    .find(
                        item =>
                            String(
                                item.id
                            ) ===
                            String(
                                currentStream.id
                            )
                    );


            if (!stream) {
                return;
            }


            viewerBadge.textContent =
                "👁 بیننده: " +
                (
                    stream.viewer_count ??
                    0
                );
                
        } catch (error) {

            console.error(
                "Viewer count:",
                error
            );
        }
    }


    /* =====================================================
       STOP
    ===================================================== */

    async function stopLive() {

        if (stopped) {
            return;
        }


        stopped = true;


        stopButton.disabled =
            true;


        setStatus(
            "در حال پایان...",
            false
        );


        try {

            await fetch(
                "/api/streams/stop",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            stream_id:
                                currentStream.id,

                            username:
                                currentUsername

                        })
                }
            );

        } catch (error) {

            console.error(
                "Stop live:",
                error
            );
        }


        if (chatTimer) {

            clearInterval(
                chatTimer
            );
        }


        if (viewerTimer) {

            clearInterval(
                viewerTimer
            );
        }


        peers.forEach(
            pc => {

                try {
                    pc.close();
                } catch (error) {
                }

            }
        );


        peers.clear();


        if (localStream) {

            localStream
                .getTracks()
                .forEach(
                    track => {
                        track.stop();
                    }
                );

            localStream = null;
        }


        if (websocket) {

            try {
                websocket.close();
            } catch (error) {
            }

        }


        sessionStorage.removeItem(
            "lainolive_current_stream"
        );


        window.location.href =
            "/index.html";
    }


    /* =====================================================
       BACK
    ===================================================== */

    document
        .getElementById(
            "backButton"
        )
        .addEventListener(
            "click",
            () => {

                showToast(
                    "برای خروج ابتدا لایو را پایان بده."
                );
            }
        );


    stopButton.addEventListener(
        "click",
        async () => {

            const accepted =
                window.confirm(
                    "آیا مطمئنی می‌خواهی لایو را پایان بدهی؟"
                );


            if (!accepted) {
                return;
            }


            await stopLive();
        }
    );


    /* =====================================================
       CLEANUP
    ===================================================== */

    window.addEventListener(
        "beforeunload",
        () => {

            if (
                !stopped &&
                currentStream
            ) {

                try {

                    navigator.sendBeacon(
                        "/api/streams/stop",
                        new Blob(
                            [
                                JSON.stringify({

                                    stream_id:
                                        currentStream.id,

                                    username:
                                        currentUsername

                                })
                            ],
                            {
                                type:
                                    "application/json"
                            }
                        )
                    );

                } catch (error) {
                }
            }


            if (localStream) {

                localStream
                    .getTracks()
                    .forEach(
                        track => {
                            track.stop();
                        }
                    );
            }


            peers.forEach(
                pc => {

                    try {
                        pc.close();
                    } catch (error) {
                    }
                }
            );


            if (websocket) {

                try {
                    websocket.close();
                } catch (error) {
                }
            }
        }
    );


    /* =====================================================
       START
    ===================================================== */

    connectSignaling();

    startCamera();

    loadChat();

    updateViewerCount();


    chatTimer =
        setInterval(
            loadChat,
            2000
        );


    viewerTimer =
        setInterval(
            updateViewerCount,
            3000
        );

</script>

</body>

</html>
