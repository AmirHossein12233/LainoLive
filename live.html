<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#090b12"
    >

    <title>LainoLive - پخش زنده</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            width: 100%;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(90, 58, 180, 0.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(0, 150, 255, 0.07),
                    transparent 35%
                ),
                #090b12;

            color: #ffffff;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            min-height: 100vh;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                calc(12px + env(safe-area-inset-top))
                14px
                12px;

            background:
                rgba(9, 11, 18, 0.95);

            border-bottom:
                1px solid
                #202536;

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 12px;

            background: #171b29;
            color: #ffffff;

            font-size: 20px;
        }

        .top-title {
            font-size: 16px;
            font-weight: 900;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 7px;

            padding:
                8px
                12px;

            border-radius: 999px;

            background:
                rgba(255, 45, 85, 0.14);

            color: #ff5578;

            font-size: 12px;
            font-weight: 900;
        }

        .live-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #ff365f;

            box-shadow:
                0 0 12px
                rgba(255, 54, 95, 0.8);
        }

        .main {
            width: min(1250px, 100%);
            margin: 0 auto;
            padding: 16px;
        }

        .layout {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                360px;

            gap: 16px;

            align-items: start;
        }

        .video-card,
        .panel,
        .info-card {
            background: #10131c;

            border:
                1px solid
                #23283a;

            border-radius: 18px;
        }

        .video-card {
            overflow: hidden;
        }

        .video-wrap {
            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            background: #000000;

            overflow: hidden;
        }

        #localVideo {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: #000000;
        }

        .overlay {
            position: absolute;
            inset: 0;

            pointer-events: none;
        }

        .status-pill,
        .viewer-pill {
            position: absolute;

            top: 12px;

            padding:
                8px
                11px;

            border-radius: 10px;

            background:
                rgba(0, 0, 0, 0.64);

            border:
                1px solid
                rgba(255,255,255,0.1);

            font-size: 11px;
        }

        .status-pill {
            right: 12px;
        }

        .viewer-pill {
            left: 12px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;

            padding: 12px;

            background: #0e1119;
        }

        .control-btn {
            min-height: 44px;

            padding:
                0
                13px;

            border: none;
            border-radius: 12px;

            background: #191e2d;
            color: #ffffff;

            font-size: 12px;
            font-weight: 800;
        }

        .control-btn.active {
            background: #5c43dd;
        }

        .control-btn.red {
            background: #d72f50;
        }

        .info-card {
            margin-top: 14px;
            padding: 16px;
        }

        .stream-title {
            margin: 0;

            font-size: 20px;

            line-height: 1.6;
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;

            gap: 8px;

            margin-top: 11px;
        }

        .meta {
            padding:
                7px
                10px;

            border-radius: 10px;

            background: #181c29;

            color: #bbc1d2;

            font-size: 11px;
        }

        .panel {
            overflow: hidden;
        }

        .panel + .panel {
            margin-top: 14px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                13px
                15px;

            border-bottom:
                1px solid
                #23283a;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 900;
        }

        .panel-sub {
            color: #8f97aa;
            font-size: 11px;
        }

        .audio-box {
            padding: 14px;
        }

        .audio-row {
            margin-bottom: 16px;
        }

        .audio-row:last-child {
            margin-bottom: 0;
        }

        .audio-head {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 8px;

            color: #d2d5df;

            font-size: 12px;
        }

        .audio-state {
            color: #8d95a8;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #6a4cff;
        }

        .notice {
            display: none;

            margin-top: 14px;

            padding:
                12px
                14px;

            border-radius: 13px;

            background:
                rgba(255, 45, 85, 0.1);

            border:
                1px solid
                rgba(255, 45, 85, 0.2);

            color: #ff9eb0;

            font-size: 12px;

            line-height: 1.8;
        }

        .notice.show {
            display: block;
        }

        .chat-panel {
            display: flex;
            flex-direction: column;

            height: 470px;
        }

        #messages {
            flex: 1;

            overflow-y: auto;

            padding: 12px;
        }

        .empty-chat {
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #70798d;

            font-size: 12px;

            text-align: center;
        }

        .message {
            margin-bottom: 9px;

            padding:
                9px
                11px;

            border-radius: 12px;

            background: #171b28;
        }

        .message-user {
            margin-bottom: 4px;

            color: #967fff;

            font-size: 11px;
            font-weight: 900;
        }

        .message-text {
            color: #e6e8ef;

            font-size: 12px;

            line-height: 1.8;

            word-break: break-word;
        }

        .chat-form {
            display: flex;

            gap: 8px;

            padding: 10px;

            border-top:
                1px solid
                #23283a;
        }

        .chat-input {
            flex: 1;

            min-width: 0;

            height: 44px;

            padding:
                0
                12px;

            border:
                1px solid
                #2a3043;

            border-radius: 12px;

            outline: none;

            background: #0d1018;

            color: #ffffff;
        }

        .send-btn {
            width: 48px;
            height: 44px;

            border-radius: 12px;

            background: #6a4cff;

            color: #ffffff;

            font-size: 18px;
        }

        @media (max-width: 980px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .main {
                padding: 8px;
            }

            .topbar {
                padding:
                    calc(
                        9px +
                        env(safe-area-inset-top)
                    )
                    10px
                    9px;
            }

            .top-title {
                font-size: 14px;
            }

            .live-badge {
                padding:
                    7px
                    9px;
            }

            .video-card,
            .panel,
            .info-card {
                border-radius: 15px;
            }

            .control-btn {
                flex:
                    1 1
                    calc(50% - 9px);
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="topbar">

        <div class="top-left">

            <button
                id="backBtn"
                class="back-btn"
                type="button"
            >
                ←
            </button>

            <div class="top-title">
                پخش زنده
            </div>

        </div>

        <div class="live-badge">
            <span class="live-dot"></span>
            LIVE
        </div>

    </header>


    <main class="main">

        <div class="layout">

            <section>

                <div class="video-card">

                    <div class="video-wrap">

                        <video
                            id="localVideo"
                            autoplay
                            playsinline
                            muted
                        ></video>

                        <div class="overlay">

                            <div
                                id="status"
                                class="status-pill"
                            >
                                آماده‌سازی...
                            </div>

                            <div class="viewer-pill">
                                👁
                                <span id="viewerCount">
                                    0
                                </span>
                            </div>

                        </div>

                    </div>


                    <div class="controls">

                        <button
                            id="cameraBtn"
                            class="control-btn active"
                            type="button"
                        >
                            📷 دوربین
                        </button>

                        <button
                            id="screenBtn"
                            class="control-btn"
                            type="button"
                        >
                            🖥️ صفحه + صدای سیستم
                        </button>

                        <button
                            id="micBtn"
                            class="control-btn active"
                            type="button"
                        >
                            🎤 میکروفن
                        </button>

                        <button
                            id="stopBtn"
                            class="control-btn"
                            type="button"
                        >
                            ⏹ توقف منبع
                        </button>

                        <button
                            id="endBtn"
                            class="control-btn red"
                            type="button"
                        >
                            🔴 پایان لایو
                        </button>

                    </div>

                </div>


                <div
                    id="notice"
                    class="notice"
                ></div>


                <div class="info-card">

                    <h1
                        id="streamTitle"
                        class="stream-title"
                    >
                        پخش زنده LainoLive
                    </h1>

                    <div class="meta-row">

                        <div
                            id="streamCategory"
                            class="meta"
                        >
                            عمومی
                        </div>

                        <div
                            id="streamId"
                            class="meta"
                        >
                            Stream: -
                        </div>

                    </div>

                </div>

            </section>


            <aside>

                <section class="panel">

                    <div class="panel-header">

                        <div class="panel-title">
                            🎚️ کنترل صدای پخش
                        </div>

                        <div class="panel-sub">
                            جداگانه
                        </div>

                    </div>


                    <div class="audio-box">

                        <div class="audio-row">

                            <div class="audio-head">

                                <span>
                                    🔊 صدای سیستم / آهنگ
                                </span>

                                <span
                                    id="systemValue"
                                    class="audio-state"
                                >
                                    روشن
                                </span>

                            </div>

                            <input
                                id="systemVolume"
                                type="range"
                                min="0"
                                max="100"
                                value="100"
                            >

                        </div>


                        <div class="audio-row">

                            <div class="audio-head">

                                <span>
                                    🎤 میکروفن / صحبت
                                </span>

                                <span
                                    id="micValue"
                                    class="audio-state"
                                >
                                    روشن
                                </span>

                            </div>

                            <input
                                id="micVolume"
                                type="range"
                                min="0"
                                max="100"
                                value="100"
                            >

                        </div>

                    </div>

                </section>


                <section class="panel chat-panel">

                    <div class="panel-header">

                        <div class="panel-title">
                            💬 چت زنده
                        </div>

                        <div class="panel-sub">
                            آنلاین
                        </div>

                    </div>


                    <div id="messages">

                        <div
                            id="emptyChat"
                            class="empty-chat"
                        >
                            هنوز پیامی ارسال نشده است.
                        </div>

                    </div>


                    <form
                        id="chatForm"
                        class="chat-form"
                    >

                        <input
                            id="chatInput"
                            class="chat-input"
                            type="text"
                            maxlength="500"
                            autocomplete="off"
                            placeholder="پیام بنویسید..."
                        >

                        <button
                            class="send-btn"
                            type="submit"
                        >
                            ➤
                        </button>

                    </form>

                </section>

            </aside>

        </div>

    </main>

</div>


<script>
"use strict";


/* =====================================================
   CONFIG
===================================================== */

const SIGNALING_URL =
    "wss://lainolive-signaling.onrender.com";

const RTC_CONFIG = {
    iceServers: [
        {
            urls: [
                "stun:stun.l.google.com:19302",
                "stun:stun1.l.google.com:19302"
            ]
        }
    ]
};


const STREAM_KEYS = [
    "lainolive_current_stream",
    "LainoLive_current_stream",
    "current_stream"
];

const USERNAME_KEYS = [
    "lainolive_username",
    "username"
];


/* =====================================================
   STATE
===================================================== */

let streamData = null;
let streamId = "";
let username = "";

let socket = null;

let currentMode = "camera";

let currentVideoTrack = null;
let systemAudioTrack = null;
let microphoneTrack = null;

let microphoneEnabled = true;
let systemAudioEnabled = true;

let peers = new Map();

let ending = false;


/* =====================================================
   ELEMENTS
===================================================== */

const localVideo =
    document.getElementById(
        "localVideo"
    );

const statusElement =
    document.getElementById(
        "status"
    );

const viewerCount =
    document.getElementById(
        "viewerCount"
    );

const streamTitle =
    document.getElementById(
        "streamTitle"
    );

const streamCategory =
    document.getElementById(
        "streamCategory"
    );

const streamIdElement =
    document.getElementById(
        "streamId"
    );

const notice =
    document.getElementById(
        "notice"
    );

const cameraBtn =
    document.getElementById(
        "cameraBtn"
    );

const screenBtn =
    document.getElementById(
        "screenBtn"
    );

const micBtn =
    document.getElementById(
        "micBtn"
    );

const stopBtn =
    document.getElementById(
        "stopBtn"
    );

const endBtn =
    document.getElementById(
        "endBtn"
    );

const systemVolume =
    document.getElementById(
        "systemVolume"
    );

const micVolume =
    document.getElementById(
        "micVolume"
    );

const systemValue =
    document.getElementById(
        "systemValue"
    );

const micValue =
    document.getElementById(
        "micValue"
    );

const messages =
    document.getElementById(
        "messages"
    );

const emptyChat =
    document.getElementById(
        "emptyChat"
    );

const chatForm =
    document.getElementById(
        "chatForm"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );


/* =====================================================
   UI
===================================================== */

function setStatus(text) {
    statusElement.textContent =
        text;
}

function showNotice(text) {
    notice.textContent =
        text;

    notice.classList.add(
        "show"
    );
}

function hideNotice() {
    notice.classList.remove(
        "show"
    );
}


/* =====================================================
   STORAGE
===================================================== */

function readStorage(keys) {

    for (const key of keys) {

        try {

            const value =
                sessionStorage.getItem(
                    key
                );

            if (value) {
                return value;
            }

        } catch {}

        try {

            const value =
                localStorage.getItem(
                    key
                );

            if (value) {
                return value;
            }

        } catch {}
    }

    return null;
}


function readStreamData() {

    const raw =
        readStorage(
            STREAM_KEYS
        );

    if (!raw) {
        return {};
    }

    try {
        return JSON.parse(raw);
    } catch {
        return {};
    }
}


function getQueryStreamId() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("id") ||
        params.get("stream_id") ||
        params.get("room_id") ||
        ""
    );
}


function getStreamId(data) {

    return String(
        data.stream_id ??
        data.streamId ??
        data.id ??
        data.room_id ??
        getQueryStreamId() ??
        ""
    );
}


function getUsername(data) {

    return String(
        data.username ??
        data.owner ??
        readStorage(
            USERNAME_KEYS
        ) ??
        ""
    );
}


/* =====================================================
   MEDIA TRACK CLEANUP
===================================================== */

function stopTrack(track) {

    if (!track) {
        return;
    }

    try {
        track.stop();
    } catch {}
}


function stopAllSources() {

    stopTrack(
        currentVideoTrack
    );

    stopTrack(
        systemAudioTrack
    );

    stopTrack(
        microphoneTrack
    );

    currentVideoTrack = null;
    systemAudioTrack = null;
    microphoneTrack = null;

    localVideo.srcObject =
        null;
}


/* =====================================================
   DISPLAY LOCAL
===================================================== */

function updateLocalPreview() {

    const preview =
        new MediaStream();


    if (currentVideoTrack) {
        preview.addTrack(
            currentVideoTrack
        );
    }


    if (systemAudioTrack) {
        preview.addTrack(
            systemAudioTrack
        );
    }


    if (microphoneTrack) {
        preview.addTrack(
            microphoneTrack
        );
    }


    localVideo.srcObject =
        preview;

    localVideo.muted =
        true;


    localVideo.play().catch(
        () => {}
    );
}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera() {

    hideNotice();

    setStatus(
        "در حال فعال‌سازی دوربین..."
    );


    closeAllPeers();

    stopAllSources();


    try {

        const stream =
            await navigator.mediaDevices.getUserMedia(
                {
                    video: {
                        width: {
                            ideal: 1280
                        },
                        height: {
                            ideal: 720
                        },

                        facingMode:
                            "user"
                    },

                    audio: true
                }
            );


        currentMode =
            "camera";


        currentVideoTrack =
            stream.getVideoTracks()[0]
            || null;


        microphoneTrack =
            stream.getAudioTracks()[0]
            || null;


        systemAudioTrack =
            null;


        microphoneEnabled =
            true;


        systemAudioEnabled =
            false;


        if (microphoneTrack) {
            microphoneTrack.enabled =
                true;
        }


        updateLocalPreview();


        cameraBtn.classList.add(
            "active"
        );

        screenBtn.classList.remove(
            "active"
        );

        micBtn.classList.add(
            "active"
        );


        systemValue.textContent =
            "خاموش";

        micValue.textContent =
            "روشن";


        setStatus(
            "دوربین و میکروفن فعال"
        );


        await sendOffersToAllViewers();

    } catch (error) {

        console.error(
            "camera error:",
            error
        );

        showNotice(
            "دسترسی به دوربین یا میکروفن انجام نشد."
        );

        setStatus(
            "خطا در دوربین"
        );
    }
}


/* =====================================================
   SCREEN
===================================================== */

async function startScreen() {

    hideNotice();

    setStatus(
        "در حال آماده‌سازی اشتراک صفحه..."
    );


    closeAllPeers();

    stopAllSources();


    try {

        const displayStream =
            await navigator.mediaDevices.getDisplayMedia(
                {
                    video: true,
                    audio: true
                }
            );


        currentMode =
            "screen";


        currentVideoTrack =
            displayStream.getVideoTracks()[0]
            || null;


        systemAudioTrack =
            displayStream.getAudioTracks()[0]
            || null;


        const microphoneStream =
            await navigator.mediaDevices.getUserMedia(
                {
                    audio: true
                }
            );


        microphoneTrack =
            microphoneStream.getAudioTracks()[0]
            || null;


        microphoneEnabled =
            true;


        systemAudioEnabled =
            !!systemAudioTrack;


        if (microphoneTrack) {
            microphoneTrack.enabled =
                true;
        }


        if (systemAudioTrack) {
            systemAudioTrack.enabled =
                true;
        }


        updateLocalPreview();


        cameraBtn.classList.remove(
            "active"
        );

        screenBtn.classList.add(
            "active"
        );

        micBtn.classList.add(
            "active"
        );


        systemValue.textContent =
            systemAudioTrack
                ? "روشن"
                : "در دسترس نیست";


        micValue.textContent =
            "روشن";


        if (systemAudioTrack) {

            setStatus(
                "صفحه + صدای سیستم + میکروفن فعال"
            );

        } else {

            setStatus(
                "صفحه + میکروفن فعال؛ صدای سیستم در دسترس نیست"
            );

            showNotice(
                "صفحه گرفته شد، اما مرورگر ترک صدای سیستم ارائه نکرد."
            );
        }


        if (currentVideoTrack) {

            currentVideoTrack.addEventListener(
                "ended",
                () => {

                    if (!ending) {
                        startCamera();
                    }
                }
            );
        }


        await sendOffersToAllViewers();

    } catch (error) {

        console.error(
            "screen error:",
            error
        );


        stopAllSources();


        if (
            error?.name ===
            "NotAllowedError"
        ) {

            showNotice(
                "اشتراک‌گذاری صفحه لغو شد."
            );

        } else {

            showNotice(
                "گرفتن صفحه انجام نشد: " +
                (
                    error?.message ||
                    "خطای نامشخص"
                )
            );
        }


        setStatus(
            "اشتراک صفحه فعال نشد"
        );
    }
}


/* =====================================================
   MICROPHONE
===================================================== */

function toggleMicrophone() {

    if (!microphoneTrack) {

        showNotice(
            "میکروفن فعال نیست."
        );

        return;
    }


    microphoneEnabled =
        !microphoneEnabled;


    microphoneTrack.enabled =
        microphoneEnabled;


    micBtn.classList.toggle(
        "active",
        microphoneEnabled
    );


    micValue.textContent =
        microphoneEnabled
            ? "روشن"
            : "خاموش";
}


/* =====================================================
   SYSTEM AUDIO
===================================================== */

function toggleSystemAudio() {

    if (!systemAudioTrack) {

        showNotice(
            "صدای سیستم در این اشتراک‌گذاری در دسترس نیست."
        );

        return;
    }


    systemAudioEnabled =
        !systemAudioEnabled;


    systemAudioTrack.enabled =
        systemAudioEnabled;


    systemValue.textContent =
        systemAudioEnabled
            ? "روشن"
            : "خاموش";
}


/* =====================================================
   PEER
===================================================== */

function closePeer(viewerId) {

    const peer =
        peers.get(
            viewerId
        );

    if (!peer) {
        return;
    }

    try {
        peer.close();
    } catch {}

    peers.delete(
        viewerId
    );
}


function closeAllPeers() {

    for (
        const [
            viewerId,
            peer
        ]
        of peers.entries()
    ) {

        try {
            peer.close();
        } catch {}

        peers.delete(
            viewerId
        );
    }
}


function createPeer(viewerId) {

    closePeer(
        viewerId
    );


    const peer =
        new RTCPeerConnection(
            RTC_CONFIG
        );


    peers.set(
        viewerId,
        peer
    );


    /*
       ترتیب ترک‌ها مهم است:

       m=video
       m=audio  -> سیستم
       m=audio  -> میکروفن
    */


    if (currentVideoTrack) {

        peer.addTrack(
            currentVideoTrack,

            new MediaStream(
                [
                    currentVideoTrack
                ]
            )
        );
    }


    if (systemAudioTrack) {

        peer.addTrack(
            systemAudioTrack,

            new MediaStream(
                [
                    systemAudioTrack
                ]
            )
        );
    }


    if (microphoneTrack) {

        peer.addTrack(
            microphoneTrack,

            new MediaStream(
                [
                    microphoneTrack
                ]
            )
        );
    }


    peer.onicecandidate =
        event => {

            if (!event.candidate) {
                return;
            }


            sendSignal(
                {
                    type:
                        "ice-candidate",

                    viewer_id:
                        viewerId,

                    candidate:
                        event.candidate
                }
            );
        };


    peer.onconnectionstatechange =
        () => {

            if (
                peer.connectionState ===
                    "failed" ||
                peer.connectionState ===
                    "closed"
            ) {

                closePeer(
                    viewerId
                );
            }
        };


    return peer;
}


async function createOfferForViewer(
    viewerId
) {

    if (!viewerId) {
        return;
    }


    const peer =
        createPeer(
            viewerId
        );


    try {

        const offer =
            await peer.createOffer();


        await peer.setLocalDescription(
            offer
        );


        sendSignal(
            {
                type:
                    "offer",

                viewer_id:
                    viewerId,

                offer:
                    peer.localDescription
            }
        );

    } catch (error) {

        console.error(
            "offer error:",
            error
        );

        closePeer(
            viewerId
        );
    }
}


async function sendOffersToAllViewers() {

    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {
        return;
    }


    for (
        const viewerId
        of peers.keys()
    ) {

        closePeer(
            viewerId
        );
    }
}


/* =====================================================
   SIGNAL
===================================================== */

function sendSignal(message) {

    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {
        return false;
    }


    try {

        socket.send(
            JSON.stringify(
                message
            )
        );

        return true;

    } catch (error) {

        console.error(
            "signal error:",
            error
        );

        return false;
    }
}


function connectSignaling() {

    if (!streamId) {

        setStatus(
            "شناسه لایو پیدا نشد"
        );

        showNotice(
            "ابتدا یک لایو از صفحه اصلی بسازید."
        );

        return;
    }


    setStatus(
        "در حال اتصال به سرور..."
    );


    try {

        socket =
            new WebSocket(
                SIGNALING_URL
            );

    } catch (error) {

        console.error(error);

        setStatus(
            "اتصال ناموفق"
        );

        return;
    }


    socket.onopen =
        () => {

            setStatus(
                "اتصال برقرار شد"
            );


            sendSignal(
                {
                    type:
                        "join",

                    role:
                        "host",

                    room_id:
                        streamId,

                    username:
                        username
                }
            );
        };


    socket.onmessage =
        async event => {

            let message;


            try {

                message =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;
            }


            await handleSignal(
                message
            );
        };


    socket.onerror =
        error => {

            console.error(
                "websocket error:",
                error
            );

            setStatus(
                "خطا در اتصال"
            );
        };


    socket.onclose =
        () => {

            if (!ending) {

                setStatus(
                    "ارتباط با سرور قطع شد"
                );
            }
        };
}


async function handleSignal(
    message
) {

    switch (
        message.type
    ) {

        case "joined":

            if (
                typeof message.viewer_count ===
                "number"
            ) {

                viewerCount.textContent =
                    String(
                        message.viewer_count
                    );
            }

            setStatus(
                "لایو آماده است"
            );

            break;


        case "room-info":

            if (
                typeof message.viewer_count ===
                "number"
            ) {

                viewerCount.textContent =
                    String(
                        message.viewer_count
                    );
            }

            break;


        case "viewer-joined":

            await createOfferForViewer(
                message.viewer_id
            );

            break;


        case "answer": {

            const viewerId =
                message.viewer_id;

            const peer =
                peers.get(
                    viewerId
                );

            if (
                !peer ||
                !message.answer
            ) {
                break;
            }


            try {

                await peer.setRemoteDescription(
                    new RTCSessionDescription(
                        message.answer
                    )
                );

            } catch (error) {

                console.error(
                    "answer error:",
                    error
                );
            }

            break;
        }


        case "ice-candidate": {

            const viewerId =
                message.viewer_id;

            const peer =
                peers.get(
                    viewerId
                );

            if (
                !peer ||
                !message.candidate
            ) {
                break;
            }


            try {

                await peer.addIceCandidate(
                    new RTCIceCandidate(
                        message.candidate
                    )
                );

            } catch (error) {

                console.warn(
                    "ICE error:",
                    error
                );
            }

            break;
        }


        case "viewer-left":

            closePeer(
                message.viewer_id
            );

            break;


        case "chat-message":

            addChatMessage(
                message.username ||
                    message.user ||
                    "کاربر",

                message.message ||
                    ""
            );

            break;


        case "error":

            showNotice(
                message.message ||
                    "خطای سرور"
            );

            break;
    }
}


/* =====================================================
   CHAT
===================================================== */

function addChatMessage(
    user,
    text
) {

    if (emptyChat) {
        emptyChat.style.display =
            "none";
    }


    const box =
        document.createElement(
            "div"
        );

    box.className =
        "message";


    const userElement =
        document.createElement(
            "div"
        );

    userElement.className =
        "message-user";

    userElement.textContent =
        user || "کاربر";


    const textElement =
        document.createElement(
            "div"
        );

    textElement.className =
        "message-text";

    textElement.textContent =
        text || "";


    box.appendChild(
        userElement
    );

    box.appendChild(
        textElement
    );


    messages.appendChild(
        box
    );


    messages.scrollTop =
        messages.scrollHeight;
}


async function sendChat(text) {

    if (!text) {
        return;
    }


    if (
        sendSignal(
            {
                type:
                    "chat-message",

                username:
                    username,

                message:
                    text
            }
        )
    ) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/chat/send",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            {
                                stream_id:
                                    streamId,

                                username:
                                    username,

                                message:
                                    text
                            }
                        )
                }
            );


        if (!response.ok) {
            throw new Error(
                "chat failed"
            );
        }

    } catch (error) {

        console.error(
            error
        );

        showNotice(
            "ارسال پیام انجام نشد."
        );
    }
}


/* =====================================================
   STOP / END
===================================================== */

function stopCurrentSource() {

    stopAllSources();

    closeAllPeers();

    currentMode =
        "none";

    cameraBtn.classList.remove(
        "active"
    );

    screenBtn.classList.remove(
        "active"
    );

    micBtn.classList.remove(
        "active"
    );

    setStatus(
        "منبع متوقف شد"
    );
}


async function stopOnServer() {

    if (!streamId) {
        return;
    }


    try {

        await fetch(
            "/api/streams/stop",
            {
                method:
                    "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(
                        {
                            stream_id:
                                streamId,

                            username:
                                username
                        }
                    )
            }
        );

    } catch (error) {

        console.warn(
            error
        );
    }
}


async function endLive() {

    if (ending) {
        return;
    }


    if (
        !window.confirm(
            "آیا می‌خواهید لایو را پایان دهید؟"
        )
    ) {
        return;
    }


    ending =
        true;


    setStatus(
        "در حال پایان لایو..."
    );


    closeAllPeers();

    stopAllSources();


    if (socket) {

        try {

            sendSignal(
                {
                    type:
                        "leave"
                }
            );

        } catch {}

        try {
            socket.close();
        } catch {}
    }


    await stopOnServer();


    try {

        sessionStorage.removeItem(
            "lainolive_current_stream"
        );

        sessionStorage.removeItem(
            "LainoLive_current_stream"
        );

    } catch {}


    try {

        localStorage.removeItem(
            "lainolive_current_stream"
        );

        localStorage.removeItem(
            "LainoLive_current_stream"
        );

    } catch {}


    window.location.href =
        "/index.html";
}


/* =====================================================
   EVENTS
===================================================== */

function setupEvents() {

    document
        .getElementById(
            "backBtn"
        )
        .addEventListener(
            "click",
            () => {
                window.location.href =
                    "/index.html";
            }
        );


    cameraBtn.addEventListener(
        "click",
        startCamera
    );


    screenBtn.addEventListener(
        "click",
        startScreen
    );


    micBtn.addEventListener(
        "click",
        toggleMicrophone
    );


    stopBtn.addEventListener(
        "click",
        stopCurrentSource
    );


    endBtn.addEventListener(
        "click",
        endLive
    );


    systemVolume.addEventListener(
        "input",
        () => {

            const value =
                Number(
                    systemVolume.value
                );


            if (
                systemAudioTrack
            ) {

                systemAudioTrack.enabled =
                    value > 0;

                systemAudioEnabled =
                    value > 0;
            }


            systemValue.textContent =
                value +
                "%";
        }
    );


    micVolume.addEventListener(
        "input",
        () => {

            const value =
                Number(
                    micVolume.value
                );


            if (
                microphoneTrack
            ) {

                microphoneTrack.enabled =
                    value > 0;

                microphoneEnabled =
                    value > 0;
            }


            micValue.textContent =
                value +
                "%";
        }
    );


    chatForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const text =
                chatInput.value.trim();


            if (!text) {
                return;
            }


            chatInput.value =
                "";


            await sendChat(
                text
            );
        }
    );
}


/* =====================================================
   INIT
===================================================== */

async function initialize() {

    streamData =
        readStreamData();


    streamId =
        getStreamId(
            streamData
        );


    username =
        getUsername(
            streamData
        );


    streamTitle.textContent =
        streamData.title ||
        "پخش زنده LainoLive";


    streamCategory.textContent =
        streamData.category ||
        "عمومی";


    streamIdElement.textContent =
        "Stream: " +
        (
            streamId ||
            "-"
        );


    setupEvents();


    if (!streamId) {

        setStatus(
            "شناسه لایو پیدا نشد"
        );

        showNotice(
            "لایو را از صفحه اصلی ایجاد کنید."
        );

        return;
    }


    connectSignaling();


    await startCamera();
}


window.addEventListener(
    "beforeunload",
    () => {

        if (ending) {
            return;
        }

        closeAllPeers();

        stopAllSources();

        try {
            socket?.close();
        } catch {}
    }
);


initialize();
</script>
