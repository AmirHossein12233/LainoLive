<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>پخش زنده | لاینو</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #08090d;
            color: #ffffff;
            font-family:
                Tahoma,
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .live-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================================
           HEADER
           ========================================= */

        .live-header {
            height: 64px;
            flex: 0 0 64px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 14px;

            background: #11131a;
            border-bottom: 1px solid #252733;
        }

        .live-brand {
            font-size: 21px;
            font-weight: 900;
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 7px;

            font-size: 12px;
            color: #b2b5c0;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #777b87;
        }

        .status-dot.live {
            background: #ff304f;
            box-shadow:
                0 0 0 5px rgba(255, 48, 79, 0.10);
        }

        /* =========================================
           VIDEO AREA
           ========================================= */

        .video-area {
            position: relative;

            width: 100%;
            flex: 1;

            background:
                radial-gradient(
                    circle at center,
                    #282b38 0%,
                    #151720 45%,
                    #07080c 100%
                );

            overflow: hidden;
        }

        #localVideo,
        #remoteVideo {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            background: #05060a;
        }

        #localVideo {
            transform: scaleX(-1);
        }

        .video-placeholder {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 12px;

            text-align: center;

            pointer-events: none;
        }

        .video-placeholder-icon {
            width: 72px;
            height: 72px;

            border-radius: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255,255,255,0.08);

            font-size: 31px;
        }

        .video-placeholder-title {
            font-size: 17px;
            font-weight: 900;
        }

        .video-placeholder-text {
            max-width: 300px;

            color: #9ca0ad;

            font-size: 12px;
            line-height: 1.8;
        }

        /* =========================================
           TOP OVERLAY
           ========================================= */

        .live-badge {
            position: absolute;

            top: 14px;
            right: 14px;

            z-index: 4;

            padding: 7px 10px;

            border-radius: 11px;

            background: #ff304f;

            font-size: 12px;
            font-weight: 900;
        }

        .viewer-count {
            position: absolute;

            top: 14px;
            left: 14px;

            z-index: 4;

            padding: 7px 10px;

            border-radius: 11px;

            background: rgba(0,0,0,0.46);

            font-size: 12px;
            font-weight: 800;
        }

        /* =========================================
           CONTROL PANEL
           ========================================= */

        .control-panel {
            width: 100%;

            padding: 13px;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 9px;

            background: #11131a;

            border-top: 1px solid #252733;
        }

        .control-button {
            min-height: 48px;

            border: 1px solid #292c37;
            border-radius: 14px;

            background: #1a1c25;
            color: #ffffff;

            font-size: 12px;
            font-weight: 800;

            cursor: pointer;
        }

        .control-button:active {
            transform: scale(0.97);
        }

        .control-button.active {
            background: #282b35;
        }

        .control-button.danger {
            background: #ff304f;
            border-color: #ff304f;
        }

        /* =========================================
           TITLE PANEL
           ========================================= */

        .title-panel {
            padding: 12px 13px;

            background: #0d0f15;
            border-top: 1px solid #1e2029;
        }

        .title-input {
            width: 100%;
            height: 46px;

            padding: 0 13px;

            border: 1px solid #2b2e39;
            border-radius: 13px;

            outline: none;

            background: #171922;
            color: #ffffff;

            font-size: 13px;

            direction: rtl;
        }

        .title-input:focus {
            border-color: #ff304f;
        }

        /* =========================================
           INFO
           ========================================= */

        .info-panel {
            padding: 13px;

            background: #11131a;
        }

        .info-title {
            font-size: 15px;
            font-weight: 900;

            margin-bottom: 6px;
        }

        .info-subtitle {
            color: #969aa6;
            font-size: 12px;
        }

        /* =========================================
           MODAL
           ========================================= */

        .message-overlay {
            position: fixed;
            inset: 0;

            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(6px);

            opacity: 0;
            visibility: hidden;

            transition: 0.2s ease;
        }

        .message-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .message-box {
            width: 100%;
            max-width: 390px;

            padding: 22px;

            border-radius: 22px;

            background: #171922;
            border: 1px solid #2a2d39;
        }

        .message-box h2 {
            margin: 0 0 10px;

            font-size: 18px;
        }

        .message-box p {
            margin: 0;

            color: #a5a8b3;

            font-size: 13px;
            line-height: 1.9;
        }

        .message-close {
            width: 100%;
            height: 46px;

            margin-top: 16px;

            border: none;
            border-radius: 13px;

            background: #ff304f;
            color: #ffffff;

            font-size: 13px;
            font-weight: 900;

            cursor: pointer;
        }

        /* =========================================
           DESKTOP
           ========================================= */

        @media (min-width: 700px) {

            .live-page {
                max-width: 1000px;
                margin: 0 auto;

                border-left: 1px solid #1c1e26;
                border-right: 1px solid #1c1e26;
            }

            .video-area {
                min-height: 560px;
                max-height: calc(100vh - 230px);
            }

        }

    </style>

</head>

<body>

<div class="live-page">

    <header class="live-header">

        <div class="live-brand">
            لاینو
        </div>

        <div class="live-status">

            <span
                class="status-dot"
                id="statusDot"
            ></span>

            <span id="statusText">
                آماده
            </span>

        </div>

    </header>


    <main class="video-area">

        <video
            id="localVideo"
            autoplay
            muted
            playsinline
            style="display: none;"
        ></video>

        <video
            id="remoteVideo"
            autoplay
            playsinline
            style="display: none;"
        ></video>


        <div
            class="video-placeholder"
            id="videoPlaceholder"
        >

            <div class="video-placeholder-icon">
                📺
            </div>

            <div class="video-placeholder-title">
                پخش زنده
            </div>

            <div class="video-placeholder-text">
                برای شروع پخش، اجازه دسترسی
                به دوربین و میکروفون را بدهید.
            </div>

        </div>


        <div
            class="live-badge"
            id="liveBadge"
            style="display: none;"
        >
            🔴 زنده
        </div>


        <div
            class="viewer-count"
            id="viewerCount"
            style="display: none;"
        >
            👥 1
        </div>

    </main>


    <section class="title-panel">

        <input
            class="title-input"
            id="liveTitle"
            type="text"
            maxlength="80"
            placeholder="عنوان پخش زنده"
        >

    </section>


    <section class="info-panel">

        <div
            class="info-title"
            id="infoTitle"
        >
            هنوز پخش را شروع نکرده‌اید
        </div>

        <div
            class="info-subtitle"
            id="infoSubtitle"
        >
            دوربین و میکروفون را روشن کنید.
        </div>

    </section>


    <section class="control-panel">

        <button
            class="control-button"
            id="cameraButton"
            type="button"
        >
            📷 دوربین
        </button>

        <button
            class="control-button"
            id="micButton"
            type="button"
        >
            🎙️ میکروفون
        </button>

        <button
            class="control-button"
            id="startButton"
            type="button"
        >
            🔴 شروع پخش
        </button>

        <button
            class="control-button danger"
            id="backButton"
            type="button"
        >
            خروج
        </button>

    </section>

</div>


<div
    class="message-overlay"
    id="messageOverlay"
>

    <div class="message-box">

        <h2 id="messageTitle">
            لاینو
        </h2>

        <p id="messageText"></p>

        <button
            class="message-close"
            id="messageClose"
            type="button"
        >
            متوجه شدم
        </button>

    </div>

</div>


<script>

    // =========================================
    // عناصر
    // =========================================

    const localVideo =
        document.getElementById("localVideo");

    const remoteVideo =
        document.getElementById("remoteVideo");

    const videoPlaceholder =
        document.getElementById("videoPlaceholder");

    const liveBadge =
        document.getElementById("liveBadge");

    const viewerCount =
        document.getElementById("viewerCount");

    const liveTitle =
        document.getElementById("liveTitle");

    const infoTitle =
        document.getElementById("infoTitle");

    const infoSubtitle =
        document.getElementById("infoSubtitle");

    const statusDot =
        document.getElementById("statusDot");

    const statusText =
        document.getElementById("statusText");

    const cameraButton =
        document.getElementById("cameraButton");

    const micButton =
        document.getElementById("micButton");

    const startButton =
        document.getElementById("startButton");

    const backButton =
        document.getElementById("backButton");

    const messageOverlay =
        document.getElementById("messageOverlay");

    const messageTitle =
        document.getElementById("messageTitle");

    const messageText =
        document.getElementById("messageText");

    const messageClose =
        document.getElementById("messageClose");


    // =========================================
    // وضعیت
    // =========================================

    let mediaStream = null;

    let cameraEnabled = false;

    let micEnabled = false;

    let liveStarted = false;


    // =========================================
    // پیام
    // =========================================

    function showMessage(title, text) {

        messageTitle.textContent = title;

        messageText.textContent = text;

        messageOverlay.classList.add("show");
    }


    function hideMessage() {

        messageOverlay.classList.remove("show");
    }


    messageClose.addEventListener(
        "click",
        hideMessage
    );


    // =========================================
    // بررسی ورود
    // =========================================

    const loggedIn =
        localStorage.getItem(
            "laino_logged_in"
        );

    if (loggedIn !== "true") {

        window.location.href =
            "login.html";
    }


    // =========================================
    // دوربین و میکروفون
    // =========================================

    async function startMedia() {

        if (!navigator.mediaDevices) {

            showMessage(
                "دوربین در دسترس نیست",
                "مرورگر شما دسترسی مورد نیاز "
                + "برای دوربین و میکروفون را ندارد."
            );

            return false;
        }


        try {

            mediaStream =
                await navigator.mediaDevices.getUserMedia(
                    {
                        video: {
                            width: {
                                ideal: 1280
                            },

                            height: {
                                ideal: 720
                            },

                            facingMode: "user"
                        },

                        audio: true
                    }
                );


            localVideo.srcObject =
                mediaStream;

            localVideo.style.display =
                "block";

            remoteVideo.style.display =
                "none";

            videoPlaceholder.style.display =
                "none";


            const videoTracks =
                mediaStream.getVideoTracks();

            const audioTracks =
                mediaStream.getAudioTracks();


            cameraEnabled =
                videoTracks.length > 0;

            micEnabled =
                audioTracks.length > 0;


            updateControls();

            updateStatus(
                "آماده پخش",
                false
            );


            return true;

        } catch (error) {

            console.error(error);

            showMessage(
                "دسترسی رد شد",
                "برای پخش زنده باید اجازه استفاده "
                + "از دوربین و میکروفون را به مرورگر بدهید."
            );

            return false;
        }
    }


    // =========================================
    // وضعیت
    // =========================================

    function updateStatus(text, isLive) {

        statusText.textContent =
            text;

        if (isLive) {

            statusDot.classList.add(
                "live"
            );

        } else {

            statusDot.classList.remove(
                "live"
            );
        }
    }


    function updateControls() {

        cameraButton.textContent =
            cameraEnabled
                ? "📷 دوربین روشن"
                : "📷 دوربین خاموش";

        micButton.textContent =
            micEnabled
                ? "🎙️ میکروفون روشن"
                : "🎙️ میکروفون خاموش";


        cameraButton.classList.toggle(
            "active",
            cameraEnabled
        );

        micButton.classList.toggle(
            "active",
            micEnabled
        );
    }


    // =========================================
    // دوربین
    // =========================================

    cameraButton.addEventListener(
        "click",
        async () => {

            if (!mediaStream) {

                const started =
                    await startMedia();

                if (!started) {
                    return;
                }

                return;
            }

            const videoTracks =
                mediaStream.getVideoTracks();

            if (videoTracks.length === 0) {

                showMessage(
                    "دوربین وجود ندارد",
                    "هیچ دوربینی در دستگاه پیدا نشد."
                );

                return;
            }

            cameraEnabled =
                !cameraEnabled;

            videoTracks.forEach(
                track => {
                    track.enabled =
                        cameraEnabled;
                }
            );

            updateControls();
        }
    );


    // =========================================
    // میکروفون
    // =========================================

    micButton.addEventListener(
        "click",
        async () => {

            if (!mediaStream) {

                const started =
                    await startMedia();

                if (!started) {
                    return;
                }

                return;
            }

            const audioTracks =
                mediaStream.getAudioTracks();

            if (audioTracks.length === 0) {

                showMessage(
                    "میکروفون وجود ندارد",
                    "هیچ میکروفونی در دستگاه پیدا نشد."
                );

                return;
            }

            micEnabled =
                !micEnabled;

            audioTracks.forEach(
                track => {
                    track.enabled =
                        micEnabled;
                }
            );

            updateControls();
        }
    );


    // =========================================
    // شروع پخش
    // =========================================

    startButton.addEventListener(
        "click",
        async () => {

            if (liveStarted) {

                stopLive();

                return;
            }


            if (!mediaStream) {

                const started =
                    await startMedia();

                if (!started) {
                    return;
                }
            }


            const title =
                liveTitle.value.trim();


            if (!title) {

                showMessage(
                    "عنوان پخش",
                    "لطفاً ابتدا یک عنوان برای "
                    + "پخش زنده وارد کنید."
                );

                liveTitle.focus();

                return;
            }


            liveStarted = true;


            startButton.textContent =
                "⏹ پایان پخش";

            startButton.classList.add(
                "danger"
            );


            liveBadge.style.display =
                "block";

            viewerCount.style.display =
                "block";


            infoTitle.textContent =
                title;

            infoSubtitle.textContent =
                "پخش زنده در حال اجرا است.";


            updateStatus(
                "در حال پخش",
                true
            );


            localStorage.setItem(
                "laino_last_live_title",
                title
            );


            /*
             * در این مرحله هنوز اتصال واقعی
             * به بیننده‌ها وجود ندارد.
             *
             * مرحله بعد WebRTC signaling
             * را به سرور اضافه می‌کنیم.
             */

        }
    );


    // =========================================
    // توقف پخش
    // =========================================

    function stopLive() {

        liveStarted = false;


        startButton.textContent =
            "🔴 شروع پخش";


        liveBadge.style.display =
            "none";

        viewerCount.style.display =
            "none";


        infoTitle.textContent =
            "پخش متوقف شد";

        infoSubtitle.textContent =
            "برای شروع دوباره، دکمه شروع پخش را بزنید.";


        updateStatus(
            "متوقف",
            false
        );
    }


    // =========================================
    // خروج
    // =========================================

    backButton.addEventListener(
        "click",
        () => {

            if (mediaStream) {

                mediaStream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                mediaStream = null;
            }

            window.location.href =
                "index.html";
        }
    );


    // =========================================
    // عنوان قبلی
    // =========================================

    const previousTitle =
        localStorage.getItem(
            "laino_last_live_title"
        );

    if (previousTitle) {

        liveTitle.value =
            previousTitle;
    }


    // =========================================
    // مقدار اولیه
    // =========================================

    updateControls();

</script>

</body>
</html>
