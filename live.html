<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#08080f"
    >

    <title>LainoLive - پخش زنده</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;

            background:
                radial-gradient(
                    circle at top,
                    #1d1730 0%,
                    #09090f 48%,
                    #040406 100%
                );

            color: #fff;

            font-family:
                Tahoma,
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 50;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 14px 16px;

            background:
                rgba(7, 7, 12, .92);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-bottom:
                1px solid
                rgba(255,255,255,.07);
        }

        .header-title {
            font-size: 18px;
            font-weight: 900;
        }

        .status {
            margin-top: 4px;
            color: #aaaab7;
            font-size: 10px;
        }

        .close-btn {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 13px;

            background:
                rgba(255,255,255,.07);

            color: white;
            font-size: 18px;
        }

        .content {
            width: 100%;
            max-width: 1100px;

            margin: 0 auto;
            padding: 16px;
        }

        .video-box {
            position: relative;

            width: 100%;
            aspect-ratio: 16 / 9;

            overflow: hidden;

            border-radius: 22px;

            background: #000;

            border:
                1px solid
                rgba(255,255,255,.08);

            box-shadow:
                0 18px 60px
                rgba(0,0,0,.35);
        }

        #localVideo {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: #000;
        }

        .live-badge {
            position: absolute;

            top: 12px;
            right: 12px;

            padding: 6px 10px;

            border-radius: 999px;

            background: #ff174d;

            font-size: 10px;
            font-weight: 900;

            z-index: 5;
        }

        .source-badge {
            position: absolute;

            right: 12px;
            bottom: 12px;

            padding:
                7px 11px;

            border-radius: 999px;

            background:
                rgba(0,0,0,.75);

            font-size: 10px;
            font-weight: 800;

            z-index: 5;
        }

        .viewer-badge {
            position: absolute;

            left: 12px;
            top: 12px;

            padding:
                7px 10px;

            border-radius: 999px;

            background:
                rgba(0,0,0,.72);

            font-size: 11px;

            z-index: 5;
        }

        .info-card {
            margin-top: 14px;

            padding: 16px;

            border-radius: 20px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid
                rgba(255,255,255,.07);
        }

        .stream-title {
            font-size: 20px;
            font-weight: 900;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;

            gap: 8px;

            margin-top: 10px;
        }

        .tag {
            padding:
                6px 10px;

            border-radius: 999px;

            background:
                rgba(139,53,255,.12);

            color: #d3bcff;

            font-size: 10px;
        }

        .source-buttons {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            margin-top: 14px;
        }

        .source-button {
            min-height: 54px;

            border: none;
            border-radius: 15px;

            background:
                rgba(255,255,255,.06);

            color: white;

            font-size: 12px;
            font-weight: 900;
        }

        .source-button.active {
            background:
                linear-gradient(
                    135deg,
                    rgba(255,23,77,.28),
                    rgba(139,53,255,.28)
                );

            border:
                1px solid
                rgba(255,255,255,.12);
        }

        .controls {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-top: 10px;
        }

        .control-btn {
            min-height: 48px;

            border: none;
            border-radius: 15px;

            background:
                rgba(255,255,255,.06);

            color: white;

            font-size: 12px;
            font-weight: 800;
        }

        .control-btn.active {
            background:
                rgba(255,255,255,.11);
        }

        .stop-btn {
            margin-top: 10px;

            width: 100%;
            min-height: 52px;

            border: none;
            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #ff174d,
                    #d50035
                );

            color: white;

            font-size: 14px;
            font-weight: 900;
        }

        .chat-card {
            margin-top: 14px;

            padding: 14px;

            border-radius: 20px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid
                rgba(255,255,255,.07);
        }

        .chat-title {
            font-size: 15px;
            font-weight: 900;
        }

        #chatMessages {
            height: 220px;

            margin-top: 10px;

            overflow-y: auto;

            padding: 8px;

            border-radius: 14px;

            background:
                rgba(0,0,0,.18);
        }

        .message {
            margin-bottom: 9px;

            padding: 8px 10px;

            border-radius: 12px;

            background:
                rgba(255,255,255,.045);
        }

        .message-user {
            color: #ffb0c1;

            font-size: 10px;
            font-weight: 900;
        }

        .message-text {
            margin-top: 4px;

            font-size: 12px;
            line-height: 1.7;

            word-break: break-word;
        }

        .chat-form {
            display: flex;
            gap: 8px;

            margin-top: 10px;
        }

        #chatInput {
            flex: 1;
            min-width: 0;

            height: 46px;

            padding: 0 13px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 14px;

            outline: none;

            background:
                rgba(0,0,0,.25);

            color: white;
        }

        #chatSend {
            width: 78px;

            border: none;
            border-radius: 14px;

            background:
                #8b35ff;

            color: white;

            font-weight: 900;
        }

        .log {
            margin-top: 12px;

            color: #8f8f9e;

            font-size: 10px;
            line-height: 1.7;
        }

        @media (max-width: 650px) {

            .source-buttons {
                grid-template-columns:
                    1fr;
            }

            .controls {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .stream-title {
                font-size: 17px;
            }
        }

    </style>
</head>

<body>

<div class="page">

    <header class="header">

        <div>

            <div class="header-title">
                🔴 پخش زنده
            </div>

            <div
                id="status"
                class="status"
            >
                در حال آماده‌سازی...
            </div>

        </div>

        <button
            id="closeButton"
            class="close-btn"
            type="button"
        >
            ✕
        </button>

    </header>


    <main class="content">

        <section class="video-box">

            <video
                id="localVideo"
                autoplay
                muted
                playsinline
            ></video>

            <div class="live-badge">
                ● LIVE
            </div>

            <div
                id="viewerBadge"
                class="viewer-badge"
            >
                👁 0 بیننده
            </div>

            <div
                id="sourceBadge"
                class="source-badge"
            >
                🎥 دوربین
            </div>

        </section>


        <section class="info-card">

            <div
                id="streamTitle"
                class="stream-title"
            >
                لایو
            </div>


            <div class="meta">

                <div
                    id="usernameTag"
                    class="tag"
                >
                    👤 کاربر
                </div>

                <div
                    id="categoryTag"
                    class="tag"
                >
                    📂 عمومی
                </div>

            </div>


            <div class="source-buttons">

                <button
                    id="cameraSourceButton"
                    class="source-button active"
                    type="button"
                >
                    🎥 پخش دوربین
                </button>

                <button
                    id="screenSourceButton"
                    class="source-button"
                    type="button"
                >
                    🖥️ پخش صفحه + صدا
                </button>

            </div>


            <div class="controls">

                <button
                    id="cameraButton"
                    class="control-btn active"
                    type="button"
                >
                    📷 تصویر روشن
                </button>

                <button
                    id="micButton"
                    class="control-btn active"
                    type="button"
                >
                    🎙️ میکروفون روشن
                </button>

                <button
                    id="shareButton"
                    class="control-btn"
                    type="button"
                >
                    🔗 اشتراک
                </button>

            </div>


            <button
                id="stopButton"
                class="stop-btn"
                type="button"
            >
                ⛔ پایان لایو
            </button>

        </section>


        <section class="chat-card">

            <div class="chat-title">
                💬 چت لایو
            </div>

            <div id="chatMessages"></div>

            <form
                id="chatForm"
                class="chat-form"
            >

                <input
                    id="chatInput"
                    type="text"
                    maxlength="500"
                    autocomplete="off"
                    placeholder="پیام خود را بنویسید..."
                >

                <button
                    id="chatSend"
                    type="submit"
                >
                    ارسال
                </button>

            </form>

            <div
                id="log"
                class="log"
            ></div>

        </section>

    </main>

</div>


<script>

"use strict";


/* ============================================================
   STORAGE
   ============================================================ */

const LOGIN_KEY =
    "lainolive_logged_in";

const USERNAME_KEY =
    "lainolive_username";

const CURRENT_STREAM_KEY =
    "lainolive_current_stream";


if (
    localStorage.getItem(
        LOGIN_KEY
    ) !== "true"
) {

    window.location.href =
        "/login.html";
}


/* ============================================================
   ELEMENTS
   ============================================================ */

const localVideo =
    document.getElementById(
        "localVideo"
    );

const statusEl =
    document.getElementById(
        "status"
    );

const viewerBadge =
    document.getElementById(
        "viewerBadge"
    );

const sourceBadge =
    document.getElementById(
        "sourceBadge"
    );

const streamTitle =
    document.getElementById(
        "streamTitle"
    );

const usernameTag =
    document.getElementById(
        "usernameTag"
    );

const categoryTag =
    document.getElementById(
        "categoryTag"
    );

const cameraSourceButton =
    document.getElementById(
        "cameraSourceButton"
    );

const screenSourceButton =
    document.getElementById(
        "screenSourceButton"
    );

const cameraButton =
    document.getElementById(
        "cameraButton"
    );

const micButton =
    document.getElementById(
        "micButton"
    );

const shareButton =
    document.getElementById(
        "shareButton"
    );

const stopButton =
    document.getElementById(
        "stopButton"
    );

const closeButton =
    document.getElementById(
        "closeButton"
    );

const chatMessages =
    document.getElementById(
        "chatMessages"
    );

const chatForm =
    document.getElementById(
        "chatForm"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );

const logEl =
    document.getElementById(
        "log"
    );


/* ============================================================
   STREAM DATA
   ============================================================ */

let stream = null;

try {

    stream =
        JSON.parse(
            sessionStorage.getItem(
                CURRENT_STREAM_KEY
            ) || "null"
        );

} catch (error) {

    console.error(
        "stream storage error:",
        error
    );

    stream = null;
}


if (!stream) {

    statusEl.textContent =
        "اطلاعات لایو پیدا نشد.";
}


const streamId =
    stream?.id ??
    stream?.stream_id ??
    null;

const title =
    stream?.title ||
    "لایو بدون عنوان";

const username =
    stream?.username ||
    stream?.user ||
    localStorage.getItem(
        USERNAME_KEY
    ) ||
    "کاربر";

const category =
    stream?.category ||
    "عمومی";


streamTitle.textContent =
    title;

usernameTag.textContent =
    "👤 " + username;

categoryTag.textContent =
    "📂 " + category;


/* ============================================================
   WEBRTC
   ============================================================ */

const rtcConfig = {

    iceServers: [

        {
            urls: [
                "stun:stun.l.google.com:19302",
                "stun:stun1.l.google.com:19302"
            ]
        }

    ]

};


const SIGNALING_URL =
    "wss://lainolive-signaling.onrender.com";


let socket = null;

let localStream = null;

let currentSource =
    "camera";

let reconnectTimer = null;

let heartbeatTimer = null;

let stopped = false;


/* ============================================================
   AUDIO MIXING
   ============================================================ */

let audioContext = null;

let audioDestination = null;

let microphoneStream = null;

let screenStream = null;


/* ============================================================
   PEER CONNECTIONS
   ============================================================ */

const peerConnections =
    new Map();


/* ============================================================
   HELPERS
   ============================================================ */

function setStatus(
    text
) {

    statusEl.textContent =
        text;
}


function log(
    text
) {

    logEl.textContent =
        text;
}


function updateViewerCount(
    count
) {

    const value =
        Math.max(
            0,
            Number(count) || 0
        );

    viewerBadge.textContent =
        "👁 " +
        value +
        " بیننده";
}


function updateSourceLabel() {

    if (
        currentSource ===
        "screen"
    ) {

        sourceBadge.textContent =
            "🖥️ صفحه + 🔊 صدا";

    } else {

        sourceBadge.textContent =
            "🎥 دوربین";
    }
}


function send(
    data
) {

    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {

        return false;
    }


    try {

        socket.send(
            JSON.stringify(
                data
            )
        );

        return true;

    } catch (error) {

        console.error(
            "socket send error:",
            error
        );

        return false;
    }
}


/* ============================================================
   PEER CONNECTION
   ============================================================ */

async function createPeerConnection(
    viewerId
) {

    if (
        peerConnections.has(
            viewerId
        )
    ) {

        return peerConnections.get(
            viewerId
        );
    }


    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    peerConnections.set(
        viewerId,
        pc
    );


    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track => {

                    pc.addTrack(
                        track,
                        localStream
                    );
                }
            );
    }


    pc.onicecandidate =
        event => {

            if (
                !event.candidate
            ) {

                return;
            }


            send(
                {
                    type:
                        "ice-candidate",

                    viewer_id:
                        viewerId,

                    candidate:
                        event.candidate
                }
            );
        };


    pc.onconnectionstatechange =
        () => {

            const state =
                pc.connectionState;


            if (
                state === "failed" ||
                state === "closed"
            ) {

                try {
                    pc.close();
                } catch {}


                peerConnections.delete(
                    viewerId
                );
            }
        };


    return pc;
}


/* ============================================================
   OFFER
   ============================================================ */

async function createOfferForViewer(
    viewerId
) {

    try {

        const pc =
            await createPeerConnection(
                viewerId
            );


        const offer =
            await pc.createOffer(
                {
                    offerToReceiveAudio:
                        false,

                    offerToReceiveVideo:
                        false
                }
            );


        await pc.setLocalDescription(
            offer
        );


        send(
            {
                type:
                    "offer",

                viewer_id:
                    viewerId,

                sdp:
                    pc.localDescription
            }
        );

    } catch (error) {

        console.error(
            "create offer error:",
            error
        );
    }
}


/* ============================================================
   SOCKET
   ============================================================ */

function connectSocket() {

    if (stopped) {
        return;
    }


    try {

        socket =
            new WebSocket(
                SIGNALING_URL
            );

    } catch (error) {

        console.error(
            "websocket creation error:",
            error
        );

        scheduleReconnect();

        return;
    }


    socket.onopen =
        () => {

            setStatus(
                "متصل به سرور سیگنالینگ"
            );


            send(
                {
                    type:
                        "join",

                    role:
                        "host",

                    room_id:
                        String(
                            streamId
                        ),

                    username:
                        username
                }
            );


            startHeartbeat();
        };


    socket.onmessage =
        async event => {

            let message;

            try {

                message =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;
            }


            const type =
                message?.type;


            if (
                type === "joined"
            ) {

                setStatus(
                    "لایو فعال است"
                );

                return;
            }


            if (
                type === "viewer-joined"
            ) {

                const viewerId =
                    message?.viewer_id;


                if (
                    viewerId
                ) {

                    await createOfferForViewer(
                        viewerId
                    );
                }

                return;
            }


            if (
                type === "answer"
            ) {

                const viewerId =
                    message?.viewer_id;


                const pc =
                    peerConnections.get(
                        viewerId
                    );


                if (
                    pc &&
                    message?.sdp
                ) {

                    try {

                        await pc.setRemoteDescription(
                            new RTCSessionDescription(
                                message.sdp
                            )
                        );

                    } catch (error) {

                        console.error(
                            "set answer error:",
                            error
                        );
                    }
                }

                return;
            }


            if (
                type === "ice-candidate"
            ) {

                const viewerId =
                    message?.viewer_id;


                const pc =
                    peerConnections.get(
                        viewerId
                    );


                if (
                    pc &&
                    message?.candidate
                ) {

                    try {

                        await pc.addIceCandidate(
                            new RTCIceCandidate(
                                message.candidate
                            )
                        );

                    } catch (error) {

                        console.error(
                            "add ice error:",
                            error
                        );
                    }
                }

                return;
            }


            if (
                type === "viewer-left"
            ) {

                const viewerId =
                    message?.viewer_id;


                const pc =
                    peerConnections.get(
                        viewerId
                    );


                if (pc) {

                    try {
                        pc.close();
                    } catch {}
                }


                peerConnections.delete(
                    viewerId
                );

                return;
            }


            if (
                type === "room-info"
            ) {

                updateViewerCount(
                    message?.viewer_count
                );

                return;
            }


            if (
                type === "chat-message"
            ) {

                appendChatMessage(
                    message?.username ||
                        "کاربر",

                    message?.message ||
                        ""
                );
            }
        };


    socket.onclose =
        () => {

            stopHeartbeat();


            if (!stopped) {

                setStatus(
                    "ارتباط قطع شد؛ تلاش مجدد..."
                );


                scheduleReconnect();
            }
        };


    socket.onerror =
        error => {

            console.error(
                "websocket error:",
                error
            );
        };
}


/* ============================================================
   RECONNECT
   ============================================================ */

function scheduleReconnect() {

    if (
        reconnectTimer ||
        stopped
    ) {

        return;
    }


    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;

                connectSocket();

            },
            2000
        );
}


/* ============================================================
   HEARTBEAT
   ============================================================ */

function startHeartbeat() {

    stopHeartbeat();


    heartbeatTimer =
        setInterval(
            () => {

                send(
                    {
                        type:
                            "ping"
                    }
                );

            },
            15000
        );
}


function stopHeartbeat() {

    if (
        heartbeatTimer
    ) {

        clearInterval(
            heartbeatTimer
        );

        heartbeatTimer =
            null;
    }
}


/* ============================================================
   AUDIO CONTEXT
   ============================================================ */

async function ensureAudioContext() {

    if (
        !audioContext ||
        audioContext.state ===
            "closed"
    ) {

        audioContext =
            new AudioContext();
    }


    if (
        audioContext.state ===
            "suspended"
    ) {

        await audioContext.resume();
    }
}


/* ============================================================
   RELEASE AUDIO RESOURCES
   ============================================================ */

async function releaseMixedAudio() {

    if (microphoneStream) {

        microphoneStream
            .getTracks()
            .forEach(
                track => {

                    try {
                        track.stop();
                    } catch {}
                }
            );

        microphoneStream =
            null;
    }


    if (screenStream) {

        screenStream
            .getTracks()
            .forEach(
                track => {

                    try {
                        track.stop();
                    } catch {}
                }
            );

        screenStream =
            null;
    }


    if (audioContext) {

        try {

            await audioContext.close();

        } catch {}

        audioContext =
            null;

        audioDestination =
            null;
    }
}


/* ============================================================
   REPLACE TRACKS FOR ALL VIEWERS
   ============================================================ */

async function replaceTracksForAllPeers(
    videoTrack,
    audioTrack
) {

    const operations = [];


    peerConnections.forEach(
        pc => {

            pc.getSenders()
                .forEach(
                    sender => {

                        if (
                            sender.track &&
                            sender.track.kind ===
                                "video"
                        ) {

                            operations.push(
                                sender.replaceTrack(
                                    videoTrack
                                )
                            );
                        }


                        if (
                            sender.track &&
                            sender.track.kind ===
                                "audio"
                        ) {

                            operations.push(
                                sender.replaceTrack(
                                    audioTrack
                                )
                            );
                        }
                    }
                );
        }
    );


    if (operations.length) {

        await Promise.allSettled(
            operations
        );
    }
}


/* ============================================================
   CAMERA STREAM
   ============================================================ */

async function startCameraStream() {

    try {

        await releaseMixedAudio();


        const cameraStream =
            await navigator.mediaDevices.getUserMedia(
                {
                    video: {
                        width: {
                            ideal:
                                1280
                        },

                        height: {
                            ideal:
                                720
                        },

                        frameRate: {
                            ideal:
                                30,

                            max:
                                30
                        }
                    },

                    audio: {
                        echoCancellation:
                            true,

                        noiseSuppression:
                            true,

                        autoGainControl:
                            true
                    }
                }
            );


        const oldStream =
            localStream;


        localStream =
            cameraStream;


        currentSource =
            "camera";


        localVideo.srcObject =
            localStream;


        await replaceTracksForAllPeers(
            localStream.getVideoTracks()[0] || null,
            localStream.getAudioTracks()[0] || null
        );


        updateSourceLabel();


        cameraSourceButton.classList.add(
            "active"
        );

        screenSourceButton.classList.remove(
            "active"
        );


        cameraButton.classList.add(
            "active"
        );

        micButton.classList.add(
            "active"
        );


        cameraButton.textContent =
            "📷 تصویر روشن";

        micButton.textContent =
            "🎙️ میکروفون روشن";


        setStatus(
            "در حال پخش دوربین و میکروفون"
        );


        if (
            oldStream &&
            oldStream !== cameraStream
        ) {

            oldStream
                .getTracks()
                .forEach(
                    track => {

                        try {
                            track.stop();
                        } catch {}
                    }
                );
        }


        return true;

    } catch (error) {

        console.error(
            "camera error:",
            error
        );


        setStatus(
            "دسترسی دوربین یا میکروفون ممکن نیست."
        );


        alert(
            "دسترسی دوربین و میکروفون داده نشد."
        );


        return false;
    }
}


/* ============================================================
   SCREEN + SYSTEM AUDIO + MICROPHONE
   ============================================================ */

async function startScreenStream() {

    if (
        !navigator.mediaDevices ||
        typeof navigator.mediaDevices.getDisplayMedia !==
            "function"
    ) {

        alert(
            "مرورگر شما از اشتراک صفحه پشتیبانی نمی‌کند."
        );

        return false;
    }


    try {

        await releaseMixedAudio();


        const displayStream =
            await navigator.mediaDevices.getDisplayMedia(
                {
                    video: {
                        cursor:
                            "always",

                        frameRate: {
                            ideal:
                                30,

                            max:
                                30
                        }
                    },

                    audio: true
                }
            );


        screenStream =
            displayStream;


        const screenVideoTrack =
            displayStream.getVideoTracks()[0] ||
            null;


        if (!screenVideoTrack) {

            throw new Error(
                "screen video track not found"
            );
        }


        /*
         * میکروفون جداگانه
         */
        try {

            microphoneStream =
                await navigator.mediaDevices.getUserMedia(
                    {
                        video: false,

                        audio: {
                            echoCancellation:
                                true,

                            noiseSuppression:
                                true,

                            autoGainControl:
                                true
                        }
                    }
                );

        } catch (error) {

            console.warn(
                "microphone unavailable:",
                error
            );

            microphoneStream =
                null;
        }


        /*
         * AudioContext
         */
        await ensureAudioContext();


        audioDestination =
            audioContext.createMediaStreamDestination();


        /*
         * صدای سیستم/تب
         */
        const systemAudioTracks =
            displayStream.getAudioTracks();


        if (
            systemAudioTracks.length > 0
        ) {

            const systemAudioStream =
                new MediaStream(
                    systemAudioTracks
                );


            const systemSource =
                audioContext.createMediaStreamSource(
                    systemAudioStream
                );


            systemSource.connect(
                audioDestination
            );
        }


        /*
         * صدای میکروفون
         */
        if (
            microphoneStream
        ) {

            const micTracks =
                microphoneStream.getAudioTracks();


            if (
                micTracks.length > 0
            ) {

                const micAudioStream =
                    new MediaStream(
                        micTracks
                    );


                const microphoneSource =
                    audioContext.createMediaStreamSource(
                        micAudioStream
                    );


                microphoneSource.connect(
                    audioDestination
                );
            }
        }


        /*
         * ساخت Stream نهایی
         */
        const mixedStream =
            new MediaStream();


        mixedStream.addTrack(
            screenVideoTrack
        );


        const mixedAudioTrack =
            audioDestination
                .stream
                .getAudioTracks()[0];


        if (
            mixedAudioTrack
        ) {

            mixedStream.addTrack(
                mixedAudioTrack
            );

        } else {

            /*
             * اگر مرورگر هیچ System Audio
             * نداد، حداقل میکروفون را می‌فرستیم.
             */
            const micTrack =
                microphoneStream
                    ?.getAudioTracks()
                    ?.[0] ||
                null;


            if (micTrack) {

                mixedStream.addTrack(
                    micTrack
                );
            }
        }


        const oldStream =
            localStream;


        localStream =
            mixedStream;


        currentSource =
            "screen";


        localVideo.srcObject =
            localStream;


        await replaceTracksForAllPeers(
            localStream.getVideoTracks()[0] || null,
            localStream.getAudioTracks()[0] || null
        );


        cameraSourceButton.classList.remove(
            "active"
        );

        screenSourceButton.classList.add(
            "active"
        );


        cameraButton.classList.add(
            "active"
        );

        micButton.classList.add(
            "active"
        );


        cameraButton.textContent =
            "🖥️ تصویر صفحه روشن";

        micButton.textContent =
            "🔊 صدای میکس روشن";


        sourceBadge.textContent =
            "🖥️ صفحه + 🔊 صدا";


        setStatus(
            "در حال پخش صفحه + صدای سیستم + میکروفون"
        );


        /*
         * کاربر از پنجره مرورگر
         * اشتراک صفحه را متوقف کرده.
         */
        screenVideoTrack.addEventListener(
            "ended",
            async () => {

                if (stopped) {
                    return;
                }


                await releaseMixedAudio();

                await startCameraStream();
            }
        );


        if (
            oldStream &&
            oldStream !== mixedStream
        ) {

            oldStream
                .getTracks()
                .forEach(
                    track => {

                        try {
                            track.stop();
                        } catch {}
                    }
                );
        }


        return true;

    } catch (error) {

        console.error(
            "screen share error:",
            error
        );


        await releaseMixedAudio();


        if (
            error?.name ===
                "NotAllowedError"
        ) {

            setStatus(
                "اشتراک صفحه لغو شد."
            );

        } else {

            setStatus(
                "اشتراک صفحه انجام نشد."
            );
        }


        return false;
    }
}


/* ============================================================
   SOURCE BUTTONS
   ============================================================ */

cameraSourceButton.addEventListener(

        if (

            "camera"
        ) {

/* ============================================================
   VIDEO TOGGLE
   ============================================================ */

cameraButton.addEventListener(
    "click",
    () => {

        if (!localStream) {
            return;
        }


        const videoTracks =
            localStream.getVideoTracks();


        if (
            !videoTracks.length
        ) {

            return;
        }


        const enabled =
            !videoTracks[0].enabled;


        videoTracks.forEach(
            track => {

                track.enabled =
                    enabled;
            }
        );


        cameraButton.classList.toggle(
            "active",
            enabled
        );


        cameraButton.textContent =
            enabled
                ? (
                    currentSource ===
                    "screen"
                        ? "🖥️ تصویر صفحه روشن"
                        : "📷 تصویر روشن"
                  )
                : "🚫 تصویر خاموش";
    }
);


/* ============================================================
   AUDIO TOGGLE
   ============================================================ */

micButton.addEventListener(
    "click",
    () => {

        if (!localStream) {
            return;
        }


        const audioTracks =
            localStream.getAudioTracks();


        if (
            !audioTracks.length
        ) {

            return;
        }


        const enabled =

        audioTracks.forEach(

                track.enabled =
                    enabled;
            }
        );


        micButton.classList.toggle(

        );

                ? (
                    currentSource ===
                    "screen"
                        ? "🔊 صدای میکس روشن"

                  )

    }
);


/* ============================================================
   SHARE
   ============================================================ */

shareButton.addEventListener(
    "click",
    async () => {

        const shareUrl =
            window.location.origin +
            "/viewer.html?id=" +
            encodeURIComponent(
                String(
                    streamId
                )
            );


        try {

            if (
                navigator.share
            ) {

                await navigator.share(
                    {
                        title:
                            title,

                        text:
                            "مشاهده لایو در LainoLive",

                        url:
                            shareUrl
                    }
                );

                return;
            }


            await navigator.clipboard.writeText(
                shareUrl
            );


            alert(
                "لینک لایو کپی شد."
            );

        } catch (error) {

            console.error(
                "share error:",
                error
            );
        }
    }
);


/* ============================================================
   CHAT
   ============================================================ */

function appendChatMessage(
    chatUser,
    message
) {

    if (!message) {
        return;
    }


    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message";


    const userEl =
        document.createElement(
            "div"
        );

    userEl.className =
        "message-user";

    userEl.textContent =
        "👤 " +
        chatUser;


    const textEl =
        document.createElement(
            "div"
        );

    textEl.className =
        "message-text";

    textEl.textContent =
        message;


    wrapper.appendChild(
        userEl
    );

    wrapper.appendChild(
        textEl
    );


    chatMessages.appendChild(
        wrapper
    );


    chatMessages.scrollTop =
        chatMessages.scrollHeight;
}


chatForm.addEventListener(
    "submit",
    event => {

        event.preventDefault();


        const message =
            chatInput.value.trim();


        if (!message) {
            return;
        }


        if (
            send(
                {
                    type:
                        "chat-message",

                    room_id:
                        String(
                            streamId
                        ),

                    username:
                        username,

                    message:
                        message
                }
            )
        ) {

            appendChatMessage(
                username,
                message
            );


            chatInput.value =
                "";
        }
    }
);


/* ============================================================
   STOP LIVE
   ============================================================ */

async function stopLive() {

    if (stopped) {
        return;
    }


    stopped =
        true;


    setStatus(
        "در حال پایان لایو..."
    );


    stopHeartbeat();


    peerConnections.forEach(
        pc => {

            try {
                pc.close();
            } catch {}
        }
    );


    peerConnections.clear();


    try {

        if (
            socket &&
            socket.readyState ===
                WebSocket.OPEN
        ) {

            send(
                {
                    type:
                        "leave",

                    room_id:
                        String(
                            streamId
                        )
                }
            );
        }

    } catch {}


    try {

        const response =
            await fetch(
                "/api/streams/stop",
                {
                    method:
                        "POST",

                    headers:
                        {
                            "Content-Type":
                                "application/json"
                        },

                    body:
                        JSON.stringify(
                            {
                                stream_id:
                                    String(
                                        streamId
                                    ),

                                username:
                                    username
                            }
                        )
                }
            );


        if (!response.ok) {

            throw new Error(
                "stop request failed"
            );
        }

    } catch (error) {

        console.error(
            "stop live error:",
            error
        );
    }


    await releaseMixedAudio();


    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track => {

                    try {
                        track.stop();
                    } catch {}
                }
            );


        localStream =
            null;
    }


    try {

        if (
            socket &&
            socket.readyState !==
                WebSocket.CLOSED
        ) {

            socket.close();
        }

    } catch {}


    sessionStorage.removeItem(
        CURRENT_STREAM_KEY
    );


    window.location.href =
        "/index.html";
}


/* ============================================================
   STOP BUTTON
   ============================================================ */

stopButton.addEventListener(
    "click",
    async () => {

        const confirmed =
            window.confirm(
                "آیا می‌خواهید لایو را پایان دهید؟"
            );


        if (!confirmed) {
            return;
        }


        await stopLive();
    }
);


/* ============================================================
   CLOSE BUTTON
   ============================================================ */

closeButton.addEventListener(
    "click",
    async () => {

        await stopLive();
    }
);


/* ============================================================
   BEFORE UNLOAD
   ============================================================ */

window.addEventListener(
    "beforeunload",
    () => {

        try {

            if (
                socket &&
                socket.readyState ===
                    WebSocket.OPEN
            ) {

                socket.send(
                    JSON.stringify(
                        {
                            type:
                                "leave",

                            room_id:
                                String(
                                    streamId
                                )
                        }
                    )
                );
            }

        } catch {}
    }
);


/* ============================================================
   START
   ============================================================ */

(async function init() {

    if (!streamId) {

        setStatus(
            "شناسه لایو نامعتبر است."
        );

        return;
    }


    const started =
        await startCameraStream();


    if (!started) {
        return;
    }


    connectSocket();

})();

</script>
