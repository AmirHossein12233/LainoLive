<script>

    /* =====================================================
       STREAM
    ===================================================== */

    const streamRaw =
        sessionStorage.getItem(
            "lainolive_current_stream"
        );


    let currentStream = null;


    try {

        currentStream =
            streamRaw
                ? JSON.parse(streamRaw)
                : null;

    } catch (error) {

        currentStream = null;

        console.error(
            "Stream parse:",
            error
        );
    }


    if (!currentStream) {

        window.location.replace(
            "/index.html"
        );
    }


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const liveTitle =
        document.getElementById(
            "liveTitle"
        );

    const liveUser =
        document.getElementById(
            "liveUser"
        );

    const status =
        document.getElementById(
            "status"
        );

    const statusDot =
        document.getElementById(
            "statusDot"
        );

    const statusText =
        document.getElementById(
            "statusText"
        );

    const localVideo =
        document.getElementById(
            "localVideo"
        );

    const viewerBadge =
        document.getElementById(
            "viewerBadge"
        );

    const stopButton =
        document.getElementById(
            "stopButton"
        );

    const chatState =
        document.getElementById(
            "chatState"
        );

    const chatMessages =
        document.getElementById(
            "chatMessages"
        );

    const chatForm =
        document.getElementById(
            "chatForm"
        );

    const chatInput =
        document.getElementById(
            "chatInput"
        );

    const chatSend =
        document.getElementById(
            "chatSend"
        );

    const connectionInfo =
        document.getElementById(
            "connectionInfo"
        );

    const toast =
        document.getElementById(
            "toast"
        );

    const backButton =
        document.getElementById(
            "backButton"
        );

    const cameraError =
        document.getElementById(
            "cameraError"
        );

    const cameraErrorText =
        document.getElementById(
            "cameraErrorText"
        );

    const cameraRetryButton =
        document.getElementById(
            "cameraRetryButton"
        );


    liveTitle.textContent =
        currentStream?.title ||
        "پخش زنده";


    liveUser.textContent =
        "صاحب لایو: " +
        (
            currentStream?.username ||
            currentUsername
        );


    /* =====================================================
       WEBRTC
    ===================================================== */

    const SIGNALING_URL =
        "wss://lainolive-signaling.onrender.com";


    const RTC_CONFIGURATION = {
        iceServers: [
            {
                urls:
                    "stun:stun.l.google.com:19302"
            },
            {
                urls:
                    "stun:stun1.l.google.com:19302"
            }
        ]
    };


    let websocket = null;

    let localStream = null;

    let myPeerId = null;

    let lastChatId = "";

    let chatTimer = null;

    let viewerTimer = null;

    let stopped = false;

    let signalingConnected = false;

    let cameraStarting = false;


    const waitingViewers =
        new Set();


    const peers =
        new Map();


    const pendingCandidates =
        new Map();


    /* =====================================================
       HELPERS
    ===================================================== */

    function showToast(text) {

        if (!toast) {
            return;
        }


        toast.textContent =
            String(text || "");


        toast.classList.add(
            "show"
        );


        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );
    }


    function escapeHtml(text) {

        return String(
            text ?? ""
        )
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );
    }


    function setStatus(
        text,
        online
    ) {

        if (statusText) {

            statusText.textContent =
                text;
        }


        if (statusDot) {

            statusDot.style.background =
                online
                    ? "#22c55e"
                    : "#ef4444";
        }


        if (status) {

            status.style.background =
                online
                    ? "#132b1d"
                    : "#3f0a0a";
        }
    }


    function sendSignal(
        data
    ) {

        if (
            !websocket ||
            websocket.readyState !==
            WebSocket.OPEN
        ) {

            return false;
        }


        try {

            websocket.send(
                JSON.stringify(
                    data
                )
            );


            return true;

        } catch (error) {

            console.error(
                "WebSocket send:",
                error
            );


            return false;
        }
    }


    /* =====================================================
       PEER
    ===================================================== */

    function createPeer(
        peerId
    ) {

        if (!peerId) {
            return null;
        }


        if (
            peers.has(
                peerId
            )
        ) {

            return peers.get(
                peerId
            );
        }


        const pc =
            new RTCPeerConnection(
                RTC_CONFIGURATION
            );


        if (localStream) {

            localStream
                .getTracks()
                .forEach(
                    track => {

                        try {

                            pc.addTrack(
                                track,
                                localStream
                            );

                        } catch (error) {

                            console.error(
                                "addTrack:",
                                error
                            );
                        }
                    }
                );
        }


        pc.onicecandidate =
            event => {

                if (
                    !event.candidate
                ) {
                    return;
                }


                sendSignal({

                    type:
                        "ice-candidate",

                    target_peer_id:
                        peerId,

                    candidate:
                        event.candidate

                });
            };


        pc.onconnectionstatechange =
            () => {

                const state =
                    pc.connectionState;


                if (
                    connectionInfo
                ) {

                    connectionInfo.textContent =
                        "WebRTC: " +
                        state;
                }


                if (
                    state ===
                    "connected"
                ) {

                    setStatus(
                        "در حال پخش",
                        true
                    );

                } else if (
                    state ===
                    "failed"
                ) {

                    showToast(
                        "اتصال یکی از بیننده‌ها ناموفق شد."
                    );
                }
            };


        pc.oniceconnectionstatechange =
            () => {

                if (
                    connectionInfo
                ) {

                    connectionInfo.textContent =
                        "ICE: " +
                        pc.iceConnectionState;
                }
            };


        peers.set(
            peerId,
            pc
        );


        return pc;
    }


    function removePeer(
        peerId
    ) {

        if (!peerId) {
            return;
        }


        const pc =
            peers.get(
                peerId
            );


        if (pc) {

            try {
                pc.close();
            } catch (error) {
            }
        }


        peers.delete(
            peerId
        );


        pendingCandidates.delete(
            peerId
        );


        waitingViewers.delete(
            peerId
        );
    }


    async function applyPendingCandidates(
        peerId
    ) {

        const pc =
            peers.get(
                peerId
            );


        if (!pc) {
            return;
        }


        const list =
            pendingCandidates.get(
                peerId
            ) || [];


        while (
            list.length
        ) {

            const candidate =
                list.shift();


            try {

                await pc.addIceCandidate(
                    candidate
                );

            } catch (error) {

                console.error(
                    "Pending ICE:",
                    error
                );
            }
        }


        pendingCandidates.delete(
            peerId
        );
    }


    async function makeOffer(
        peerId
    ) {

        if (
            !peerId ||
            stopped
        ) {
            return;
        }


        if (
            !localStream
        ) {

            waitingViewers.add(
                peerId
            );


            return;
        }


        waitingViewers.delete(
            peerId
        );


        const pc =
            createPeer(
                peerId
            );


        if (!pc) {
            return;
        }


        try {

            if (
                pc.signalingState !==
                "stable"
            ) {
                return;
            }


            const offer =
                await pc.createOffer();


            await pc.setLocalDescription(
                offer
            );


            sendSignal({

                type:
                    "offer",

                target_peer_id:
                    peerId,

                offer:
                    pc.localDescription

            });

        } catch (error) {

            console.error(
                "Make offer:",
                error
            );


            showToast(
                "ساخت اتصال WebRTC ناموفق بود."
            );
        }
    }


    async function processWaitingViewers() {

        if (
            !localStream ||
            !signalingConnected ||
            stopped
        ) {
            return;
        }


        const list =
            Array.from(
                waitingViewers
            );


        waitingViewers.clear();


        for (
            const peerId
            of list
        ) {

            await makeOffer(
                peerId
            );
        }
    }


    async function addTrackToExistingPeers() {

        if (!localStream) {
            return;
        }


        for (
            const [
                peerId,
                pc
            ]
            of peers
        ) {

            try {

                const senders =
                    pc.getSenders();


                localStream
                    .getTracks()
                    .forEach(
                        track => {

                            const exists =
                                senders.some(
                                    sender =>
                                        sender.track &&
                                        sender.track.kind ===
                                        track.kind
                                );


                            if (
                                !exists
                            ) {

                                pc.addTrack(
                                    track,
                                    localStream
                                );
                            }
                        }
                    );


                if (
                    pc.signalingState ===
                    "stable"
                ) {

                    await makeOffer(
                        peerId
                    );
                }

            } catch (error) {

                console.error(
                    "Existing peer:",
                    error
                );
            }
        }


        await processWaitingViewers();
    }


    /* =====================================================
       SIGNALING
    ===================================================== */

    async function handleSignal(
        message
    ) {

        if (
            !message ||
            stopped
        ) {
            return;
        }


        const type =
            message.type;


        if (
            type === "joined"
        ) {

            myPeerId =
                message.peer_id ||
                null;


            signalingConnected =
                true;


            if (
                chatState
            ) {

                chatState.textContent =
                    "سیگنالینگ متصل";
            }


            if (
                connectionInfo
            ) {

                connectionInfo.textContent =
                    "WebSocket: متصل";
            }


            setStatus(
                localStream
                    ? "در حال پخش"
                    : "در حال آماده‌سازی دوربین",
                true
            );


            await processWaitingViewers();


            return;
        }


        if (
            type === "peer_joined"
        ) {

            if (
                message.role !==
                "viewer"
            ) {
                return;
            }


            const viewerPeerId =
                message.peer_id;


            if (
                !viewerPeerId
            ) {
                return;
            }


            await makeOffer(
                viewerPeerId
            );


            return;
        }


        if (
            type === "answer"
        ) {

            const viewerPeerId =
                message.peer_id;


            if (
                !viewerPeerId
            ) {
                return;
            }


            const pc =
                peers.get(
                    viewerPeerId
                );


            if (!pc) {
                return;
            }


            try {

                if (
                    pc.signalingState !==
                    "have-local-offer"
                ) {
                    return;
                }


                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        message.answer
                    )
                );


                await applyPendingCandidates(
                    viewerPeerId
                );

            } catch (error) {

                console.error(
                    "Answer:",
                    error
                );
            }


            return;
        }


        if (
            type === "ice-candidate"
        ) {

            const viewerPeerId =
                message.peer_id;


            if (
                !viewerPeerId ||
                !message.candidate
            ) {
                return;
            }


            let candidate;


            try {

                candidate =
                    new RTCIceCandidate(
                        message.candidate
                    );

            } catch (error) {

                console.error(
                    "ICE create:",
                    error
                );


                return;
            }


            const pc =
                peers.get(
                    viewerPeerId
                );


            if (
                pc &&
                pc.remoteDescription
            ) {

                try {

                    await pc.addIceCandidate(
                        candidate
                    );

                } catch (error) {

                    console.error(
                        "ICE:",
                        error
                    );
                }

            } else {

                if (
                    !pendingCandidates.has(
                        viewerPeerId
                    )
                ) {

                    pendingCandidates.set(
                        viewerPeerId,
                        []
                    );
                }


                pendingCandidates
                    .get(
                        viewerPeerId
                    )
                    .push(
                        candidate
                    );
            }


            return;
        }


        if (
            type === "peer_left"
        ) {

            const peerId =
                message.peer_id;


            if (
                peerId
            ) {

                removePeer(
                    peerId
                );
            }


            return;
        }


        if (
            type === "error"
        ) {

            showToast(
                message.message ||
                "خطای سیگنالینگ."
            );
        }
    }


    function connectSignaling() {

        if (
            stopped ||
            !currentStream
        ) {
            return;
        }


        if (
            connectionInfo
        ) {

            connectionInfo.textContent =
                SIGNALING_URL;
        }


        try {

            websocket =
                new WebSocket(
                    SIGNALING_URL
                );

        } catch (error) {

            console.error(
                "WebSocket create:",
                error
            );


            signalingConnected =
                false;


            setStatus(
                "خطای سیگنالینگ",
                false
            );


            showToast(
                "اتصال سیگنالینگ برقرار نشد."
            );


            return;
        }


        websocket.onopen =
            () => {

                signalingConnected =
                    true;


                setStatus(
                    localStream
                        ? "در حال پخش"
                        : "در حال آماده‌سازی دوربین",
                    true
                );


                sendSignal({

                    type:
                        "join",

                    room_id:
                        currentStream.id,

                    username:
                        currentUsername,

                    role:
                        "owner"

                });


                processWaitingViewers();
            };


        websocket.onmessage =
            async event => {

                try {

                    const message =
                        JSON.parse(
                            event.data
                        );


                    await handleSignal(
                        message
                    );

                } catch (error) {

                    console.error(
                        "Signal:",
                        error
                    );
                }
            };


        websocket.onerror =
            error => {

                console.error(
                    "WebSocket:",
                    error
                );


                signalingConnected =
                    false;


                setStatus(
                    "خطای سیگنالینگ",
                    false
                );
            };


        websocket.onclose =
            () => {

                signalingConnected =
                    false;


                if (
                    stopped
                ) {
                    return;
                }


                setStatus(
                    "سیگنالینگ قطع شد",
                    false
                );


                if (
                    chatState
                ) {

                    chatState.textContent =
                        "قطع";
                }
            };
    }


    /* =====================================================
       CAMERA
    ===================================================== */

    function hideCameraError() {

        if (
            cameraError
        ) {

            cameraError.style.display =
                "none";
        }
    }


    function showCameraError(
        message
    ) {

        if (
            cameraErrorText
        ) {

            cameraErrorText.textContent =
                message;
        }


        if (
            cameraError
        ) {

            cameraError.style.display =
                "flex";
        }


        setStatus(
            "دوربین آماده نشد",
            false
        );
    }


    async function requestCamera(
        constraints
    ) {

        return navigator
            .mediaDevices
            .getUserMedia(
                constraints
            );
    }


    async function startCamera() {

        if (
            stopped ||
            cameraStarting
        ) {
            return;
        }


        cameraStarting =
            true;


        hideCameraError();


        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            showCameraError(
                "این مرورگر امکان دسترسی به دوربین را ارائه نمی‌دهد."
            );


            cameraStarting =
                false;


            return;
        }


        if (
            !window.isSecureContext &&
            location.hostname !==
                "localhost" &&
            location.hostname !==
                "127.0.0.1"
        ) {

            showCameraError(
                "برای استفاده از دوربین، سایت باید با HTTPS باز شود."
            );


            cameraStarting =
                false;


            return;
        }


        try {

            localStream =
                await requestCamera({

                    video: {
                        facingMode: {
                            ideal:
                                "user"
                        },
                        width: {
                            ideal:
                                1280
                        },
                        height: {
                            ideal:
                                720
                        },
                        frameRate: {
                            ideal:
                                30,
                            max:
                                30
                        }
                    },

                    audio: {
                        echoCancellation:
                            true,
                        noiseSuppression:
                            true,
                        autoGainControl:
                            true
                    }

                });

        } catch (firstError) {

            console.error(
                "Camera first attempt:",
                firstError
            );


            try {

                localStream =
                    await requestCamera({

                        video: {
                            facingMode:
                                "user",
                            width: {
                                ideal:
                                    640
                            },
                            height: {
                                ideal:
                                    480
                            }
                        },

                        audio: true

                    });

            } catch (secondError) {

                console.error(
                    "Camera fallback:",
                    secondError
                );


                let message =
                    "دسترسی به دوربین یا میکروفون انجام نشد.";


                if (
                    secondError &&
                    secondError.name ===
                        "NotAllowedError"
                ) {

                    message =
                        "اجازه دوربین و میکروفون داده نشده است. از تنظیمات مرورگر اجازه دسترسی را فعال کن.";

                } else if (
                    secondError &&
                    secondError.name ===
                        "NotFoundError"
                ) {

                    message =
                        "دوربین یا میکروفون روی این دستگاه پیدا نشد.";

                } else if (
                    secondError &&
                    secondError.name ===
                        "NotReadableError"
                ) {

                    message =
                        "دوربین توسط برنامه دیگری در حال استفاده است.";

                } else if (
                    secondError &&
                    secondError.name ===
                        "SecurityError"
                ) {

                    message =
                        "دسترسی دوربین به دلیل تنظیمات امنیتی مرورگر مسدود شده است.";
                }


                showCameraError(
                    message
                );


                cameraStarting =
                    false;


                return;
            }
        }


        try {

            localVideo.srcObject =
                localStream;


            localVideo.muted =
                true;


            await localVideo
                .play()
                .catch(
                    () => {}
                );

        } catch (error) {

            console.error(
                "Local video:",
                error
            );
        }


        hideCameraError();


        setStatus(
            "در حال پخش",
            true
        );


        if (
            chatState
        ) {

            chatState.textContent =
                "آنلاین";
        }


        if (
            connectionInfo
        ) {

            connectionInfo.textContent =
                "دوربین: آماده";
        }


        cameraStarting =
            false;


        await addTrackToExistingPeers();

        await processWaitingViewers();
    }


    /* =====================================================
       CHAT
    ===================================================== */

    async function loadChat() {

        if (
            !currentStream ||
            stopped
        ) {
            return;
        }


        try {

            const params =
                new URLSearchParams();


            params.set(
                "stream_id",
                currentStream.id
            );


            if (
                lastChatId
            ) {

                params.set(
                    "after_id",
                    lastChatId
                );
            }


            const response =
                await fetch(
                    "/api/chat/messages?" +
                    params.toString(),
                    {
                        cache:
                            "no-store"
                    }
                );


            if (
                !response.ok
            ) {
                return;
            }


            const data =
                await response.json();


            if (
                !data ||
                !data.success
            ) {
                return;
            }


            const messages =
                Array.isArray(
                    data.messages
                )
                    ? data.messages
                    : [];


            if (
                !messages.length
            ) {
                return;
            }


            const empty =
                chatMessages.querySelector(
                    ".chat-empty"
                );


            if (
                empty
            ) {

                empty.remove();
            }


            messages.forEach(
                message => {

                    const element =
                        document.createElement(
                            "div"
                        );


                    element.className =
                        "chat-message";


                    const owner =
                        String(
                            message.username
                        ) ===
                        String(
                            currentStream.username
                        );


                    element.innerHTML = `
                        <div class="${
                            owner
                                ? "chat-user chat-owner"
                                : "chat-user"
                        }">
                            ${escapeHtml(
                                message.username
                            )}
                            ${owner ? " 👑" : ""}
                        </div>

                        <div class="chat-text">
                            ${escapeHtml(
                                message.text
                            )}
                        </div>
                    `;


                    chatMessages.appendChild(
                        element
                    );


                    lastChatId =
                        message.id;
                }
            );


            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        } catch (error) {

            console.error(
                "Chat:",
                error
            );
        }
    }


    chatForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const text =
                chatInput.value.trim();


            if (
                !text ||
                !currentStream ||
                stopped
            ) {
                return;
            }


            chatSend.disabled =
                true;


            try {

                const response =
                    await fetch(
                        "/api/chat/send",
                        {
                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    stream_id:
                                        currentStream.id,

                                    username:
                                        currentUsername,

                                    text:
                                        text

                                })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    showToast(
                        data.message ||
                        "ارسال پیام ناموفق بود."
                    );


                    return;
                }


                chatInput.value =
                    "";


                await loadChat();

            } catch (error) {

                console.error(
                    "Chat send:",
                    error
                );


                showToast(
                    "خطا در ارسال پیام."
                );

            } finally {

                chatSend.disabled =
                    false;

                try {

                    chatInput.focus();

                } catch (error) {
                }
            }
        }
    );


    /* =====================================================
       VIEWERS
    ===================================================== */

    async function updateViewerCount() {

        if (
            !currentStream ||
            stopped
        ) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/streams",
                    {
                        cache:
                            "no-store"
                    }
                );


            if (
                !response.ok
            ) {
                return;
            }


            const data =
                await response.json();


            if (
                !data ||
                !data.success
            ) {
                return;
            }


            const streams =
                Array.isArray(
                    data.streams
                )
                    ? data.streams
                    : [];


            const stream =
                streams.find(
                    item =>
                        String(
                            item.id
                        ) ===
                        String(
                            currentStream.id
                        )
                );


            if (!stream) {
                return;
            }


            viewerBadge.textContent =
                "👁 بیننده: " +
                (
                    stream.viewer_count ??
                    stream.viewers ??
                    0
                );

        } catch (error) {

            console.error(
                "Viewer count:",
                error
            );
        }
    }


    /* =====================================================
       STOP
    ===================================================== */

    async function stopLive() {

        if (
            stopped
        ) {
            return;
        }


        stopped =
            true;


        stopButton.disabled =
            true;


        setStatus(
            "در حال پایان...",
            false
        );


        if (
            chatTimer
        ) {

            clearInterval(
                chatTimer
            );

            chatTimer =
                null;
        }


        if (
            viewerTimer
        ) {

            clearInterval(
                viewerTimer
            );

            viewerTimer =
                null;
        }


        try {

            await fetch(
                "/api/streams/stop",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            stream_id:
                                currentStream.id,

                            username:
                                currentUsername

                        })
                }
            );

        } catch (error) {

            console.error(
                "Stop live:",
                error
            );
        }


        peers.forEach(
            pc => {

                try {
                    pc.close();
                } catch (error) {
                }
            }
        );


        peers.clear();


        pendingCandidates.clear();


        waitingViewers.clear();


        if (
            localStream
        ) {

            localStream
                .getTracks()
                .forEach(
                    track => {

                        try {
                            track.stop();
                        } catch (error) {
                        }
                    }
                );


            localStream =
                null;
        }


        if (
            localVideo
        ) {

            localVideo.srcObject =
                null;
        }


        if (
            websocket
        ) {

            try {
                websocket.close();
            } catch (error) {
            }


            websocket =
                null;
        }


        sessionStorage.removeItem(
            "lainolive_current_stream"
        );


        window.location.href =
            "/index.html";
    }


    /* =====================================================
       BACK
    ===================================================== */

    backButton.addEventListener(
        "click",
        () => {

            showToast(
                "برای خروج ابتدا لایو را پایان بده."
            );
        }
    );


    stopButton.addEventListener(
        "click",
        async () => {

            let accepted =
                false;


            try {

                accepted =
                    window.confirm(
                        "آیا مطمئنی می‌خواهی لایو را پایان بدهی؟"
                    );

            } catch (error) {

                accepted =
                    true;
            }


            if (
                !accepted
            ) {
                return;
            }


            await stopLive();
        }
    );


    cameraRetryButton.addEventListener(
        "click",
        async () => {

            await startCamera();
        }
    );


    /* =====================================================
       CLEANUP
    ===================================================== */

    window.addEventListener(
        "beforeunload",
        () => {

            stopped =
                true;


            if (
                chatTimer
            ) {

                clearInterval(
                    chatTimer
                );
            }


            if (
                viewerTimer
            ) {

                clearInterval(
                    viewerTimer
                );
            }


            if (
                !localStream ||
                !currentStream
            ) {

                return;
            }


            try {

                navigator.sendBeacon(
                    "/api/streams/stop",
                    new Blob(
                        [
                            JSON.stringify({

                                stream_id:
                                    currentStream.id,

                                username:
                                    currentUsername

                            })
                        ],
                        {
                            type:
                                "application/json"
                        }
                    )
                );

            } catch (error) {
            }


            localStream
                .getTracks()
                .forEach(
                    track => {

                        try {
                            track.stop();
                        } catch (error) {
                        }
                    }
                );


            peers.forEach(
                pc => {

                    try {
                        pc.close();
                    } catch (error) {
                    }
                }
            );


            if (
                websocket
            ) {

                try {
                    websocket.close();
                } catch (error) {
                }
            }
        }
    );


    /* =====================================================
       START
    ===================================================== */

    async function startLivePage() {

        if (
            !currentStream
        ) {
            return;
        }


        /*
         * Signaling و دوربین را همزمان آغاز می‌کنیم.
         * اگر بیننده زودتر برسد، در waitingViewers
         * نگه داشته می‌شود.
         */

        connectSignaling();


        await startCamera();


        await loadChat();


        await updateViewerCount();


        chatTimer =
            setInterval(
                loadChat,
                2000
            );


        viewerTimer =
            setInterval(
                updateViewerCount,
                3000
            );
    }


    startLivePage();

</script>
