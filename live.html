<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#020617"
    >

    <title>پخش زنده | LainoLive</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #020617;
            color: #ffffff;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            overflow: hidden;
        }

        .live-page {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =================================================
           HEADER
        ================================================= */

        .live-header {
            min-height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 14px;
            background: #111827;
            border-bottom: 1px solid #273449;
            z-index: 20;
        }

        .live-header-left,
        .live-header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-button {
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 10px;
            background: #1e293b;
            color: #ffffff;
            cursor: pointer;
            font-size: 18px;
        }

        .live-title-area {
            min-width: 0;
        }

        .live-title {
            max-width: 320px;
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .live-user {
            margin-top: 3px;
            color: #94a3b8;
            font-size: 11px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 10px;
            border-radius: 9px;
            background: #3f0a0a;
            color: #fecaca;
            font-size: 11px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        /* =================================================
           MAIN
        ================================================= */

        .live-main {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
        }

        /* =================================================
           VIDEO
        ================================================= */

        .video-area {
            position: relative;
            min-width: 0;
            min-height: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #cameraPreview {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000000;
        }

        .video-placeholder {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        .video-placeholder-box {
            width: min(380px, 100%);
            padding: 25px;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #273449;
        }

        .video-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .video-placeholder h2 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .video-placeholder p {
            margin: 0;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.8;
        }

        .video-controls {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-button {
            border: 1px solid #334155;
            border-radius: 11px;
            padding: 12px 15px;
            background: #1e293b;
            color: #ffffff;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 12px;
        }

        .control-button:hover {
            background: #273449;
        }

        .control-button.start {
            background: #22c55e;
            border-color: #22c55e;
        }

        .control-button.start:hover {
            background: #16a34a;
        }

        .control-button.stop {
            background: #ef4444;
            border-color: #ef4444;
        }

        .control-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =================================================
           CHAT
        ================================================= */

        .chat-panel {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #111827;
            border-right: 1px solid #273449;
        }

        .chat-header {
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid #273449;
        }

        .chat-header-title {
            font-weight: bold;
            font-size: 14px;
        }

        .chat-state {
            color: #86efac;
            font-size: 11px;
        }

        .chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 12px;
        }

        .chat-empty {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            padding: 80px 10px;
        }

        .chat-message {
            margin-bottom: 13px;
        }

        .chat-user {
            color: #86efac;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 3px;
        }

        .chat-user.owner {
            color: #fbbf24;
        }

        .chat-text {
            color: #e2e8f0;
            font-size: 13px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .chat-form {
            display: flex;
            gap: 7px;
            padding: 9px;
            border-top: 1px solid #273449;
        }

        .chat-input {
            flex: 1;
            min-width: 0;
            border: 1px solid #334155;
            border-radius: 11px;
            padding: 12px;
            outline: none;
            background: #1e293b;
            color: #ffffff;
            font-family: inherit;
            font-size: 13px;
        }

        .chat-input:focus {
            border-color: #22c55e;
        }

        .chat-send {
            border: 0;
            border-radius: 11px;
            padding: 0 14px;
            background: #22c55e;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-send:disabled {
            opacity: 0.5;
        }

        /* =================================================
           INFO
        ================================================= */

        .connection-info {
            padding: 8px 10px;
            background: #0f172a;
            border-top: 1px solid #273449;
            color: #64748b;
            font-size: 10px;
            line-height: 1.6;
            direction: ltr;
            text-align: left;
            overflow-wrap: anywhere;
        }

        /* =================================================
           TOAST
        ================================================= */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translate(-50%, 20px);
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            max-width: calc(100% - 30px);
            padding: 11px 16px;
            border-radius: 12px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #ffffff;
            font-size: 13px;
            text-align: center;
            transition: opacity 0.2s ease,
                        transform 0.2s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 850px) {
            body {
                overflow: auto;
            }

            .live-page {
                min-height: 100vh;
                height: auto;
            }

            .live-main {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(300px, 52vh) minmax(350px, 48vh);
            }

            .chat-panel {
                border-right: 0;
                border-top: 1px solid #273449;
            }

            .live-title {
                max-width: 180px;
            }

            .status {
                padding: 6px 8px;
            }

            .control-button {
                padding: 10px 12px;
            }
        }
    </style>
</head>

<body>

<script>
    const loggedIn =
        localStorage.getItem(
            "lainolive_logged_in"
        );

    const currentUsername =
        localStorage.getItem(
            "lainolive_username"
        );

    if (
        loggedIn !== "true" ||
        !currentUsername
    ) {
        window.location.replace(
            "/login.html"
        );
    }
</script>


<div class="live-page">

                </div>

                <div
                    id="liveUser"

                >
                    در حال آماده‌سازی...
                </div>

            </div>

        </div>


        <div class="live-header-right">

            <div
                id="status"
                class="status"
            >
                <span
                    id="statusDot"

            <div

<div
    id="toast"
    class="toast"
></div>


<script>
    /* =====================================================
       STREAM DATA
    ===================================================== */

    const streamRaw =
        sessionStorage.getItem(
            "lainolive_current_stream"
        );

    let currentStream = null;

    if (streamRaw) {
        try {
            currentStream =
                JSON.parse(streamRaw);
        } catch (error) {
            currentStream = null;
        }
    }


    if (!currentStream) {

        window.location.replace(
            "/index.html"
        );
    }


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const liveTitle =
        document.getElementById(
            "liveTitle"
        );

    const liveUser =
        document.getElementById(
            "liveUser"
        );

    const statusText =
        document.getElementById(
            "statusText"
        );

    const statusDot =
        document.getElementById(
            "statusDot"
        );

    const cameraPreview =
        document.getElementById(
            "cameraPreview"
        );

    const cameraButton =
        document.getElementById(
            "cameraButton"
        );

    const stopButton =
        document.getElementById(
            "stopButton"
        );

    const videoPlaceholder =
        document.getElementById(
            "videoPlaceholder"
        );

    const placeholderText =
        document.getElementById(
            "placeholderText"
        );

    const chatMessages =
        document.getElementById(
            "chatMessages"
        );

    const chatForm =
        document.getElementById(
            "chatForm"
        );

    const chatInput =
        document.getElementById(
            "chatInput"
        );

    const chatSend =
        document.getElementById(
            "chatSend"
        );

    const chatState =
        document.getElementById(
            "chatState"
        );

    const connectionInfo =
        document.getElementById(
            "connectionInfo"
        );

    const toast =
        document.getElementById(
            "toast"
        );


    /* =====================================================
       PAGE DATA
    ===================================================== */

    if (currentStream) {

        liveTitle.textContent =
            currentStream.title ||
            "پخش زنده";

        liveUser.textContent =
            "صاحب لایو: " +
            (
                currentStream.username ||
                currentUsername
            );
    }


    /* =====================================================
       SIGNALING URL
    ===================================================== */

    const SIGNALING_URL =
        "wss://lainolive-signaling.onrender.com";


    /*
     * اگر سرویس Render تو آدرس دیگری دارد،
     * فقط مقدار بالا را عوض کن.
     */


    /* =====================================================
       ICE SERVERS
    ===================================================== */

    const RTC_CONFIGURATION = {
        iceServers: [
            {
                urls:
                    "stun:stun.l.google.com:19302"
            },
            {
                urls:
                    "stun:stun1.l.google.com:19302"
            }
        ]
    };


    /* =====================================================
       VARIABLES
    ===================================================== */

    let websocket = null;

    let mediaStream = null;

    let cameraStarted = false;

    let lastChatId = "";

    let chatTimer = null;

    let reconnectTimer = null;

    const peers = new Map();


    /* =====================================================
       HELPERS
    ===================================================== */

    function showToast(text) {

        toast.textContent =
            text;

        toast.classList.add(
            "show"
        );

        setTimeout(
            () => {
                toast.classList.remove(
                    "show"
                );
            },
            2500
        );
    }


    function escapeHtml(text) {

        return String(text)
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );
    }


    function setStatus(
        text,
        online
    ) {

        statusText.textContent =
            text;

        statusDot.style.background =
            online
                ? "#22c55e"
                : "#ef4444";

        document
            .getElementById("status")
            .style.background =
                online
                    ? "#132b1d"
                    : "#3f0a0a";
    }


    /* =====================================================
       SEND SIGNAL
    ===================================================== */

    function sendSignal(data) {

        if (
            !websocket ||
            websocket.readyState !== WebSocket.OPEN
        ) {
            return false;
        }

        websocket.send(
            JSON.stringify(data)
        );

        return true;
    }


    /* =====================================================
       CREATE PEER CONNECTION
    ===================================================== */

    function createPeer(peerId) {

        if (
            peers.has(peerId)
        ) {
            return peers.get(peerId);
        }


        const pc =
            new RTCPeerConnection(
                RTC_CONFIGURATION
            );


        if (mediaStream) {

            mediaStream
                .getTracks()
                .forEach(
                    track => {

                        pc.addTrack(
                            track,
                            mediaStream
                        );

                    }
                );
        }


        pc.onicecandidate =
            event => {

                if (
                    !event.candidate
                ) {
                    return;
                }


                sendSignal({

                    type:
                        "ice-candidate",

                    target:
                        peerId,

                    candidate:
                        event.candidate

                });
            };


        pc.onconnectionstatechange =
            () => {

                connectionInfo.textContent =
                    "WebRTC: " +
                    pc.connectionState;

                if (
                    pc.connectionState ===
                    "failed"
                ) {
                    try {
                        pc.restartIce();
                    } catch (error) {
                    }
                }
            };


        peers.set(
            peerId,
            pc
        );


        return pc;
    }


    /* =====================================================
       REMOVE PEER
    ===================================================== */

    function removePeer(peerId) {

        const pc =
            peers.get(
                peerId
            );

        if (!pc) {
            return;
        }

        try {
            pc.close();
        } catch (error) {
        }

        peers.delete(
            peerId
        );
    }


    /* =====================================================
       SIGNALING MESSAGE
    ===================================================== */

    async function handleSignal(message) {

        const type =
            message.type;


        if (
            type === "joined"
        ) {

            setStatus(
                "سیگنالینگ متصل",
                true
            );

            connectionInfo.textContent =
                "WebSocket: متصل";

            return;
        }


        if (
            type === "peer_joined"
        ) {

            /*
             * اگر بیننده وارد شد، صاحب لایو
             * برای او Offer می‌سازد.
             */

            if (
                message.role !== "viewer"
            ) {
                return;
            }


            const peerId =
                message.username ||
                (
                    "peer_" +
                    crypto.randomUUID()
                );


            const pc =
                createPeer(
                    peerId
                );


            if (
                mediaStream
            ) {

                const offer =
                    await pc.createOffer();


                await pc.setLocalDescription(
                    offer
                );


                sendSignal({

                    type:
                        "offer",

                    target:
                        peerId,

                    offer:
                        pc.localDescription

                });

            }


            return;
        }


        if (
            type === "answer"
        ) {

            const peerId =
                message.username;


            if (!peerId) {
                return;
            }


            const pc =
                peers.get(
                    peerId
                );


            if (!pc) {
                return;
            }


            try {

                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        message.answer
                    )
                );

            } catch (error) {

                console.error(
                    "Answer error:",
                    error
                );
            }


            return;
        }


        if (
            type === "ice-candidate"
        ) {

            const peerId =
                message.username;


            if (!peerId) {
                return;
            }


            const pc =
                peers.get(
                    peerId
                );


            if (!pc) {
                return;
            }


            try {

                await pc.addIceCandidate(
                    new RTCIceCandidate(
                        message.candidate
                    )
                );

            } catch (error) {

                console.error(
                    "ICE error:",
                    error
                );
            }


            return;
        }


        if (
            type === "peer_left"
        ) {

            if (
                message.username
            ) {

                removePeer(
                    message.username
                );
            }

            return;
        }


        if (
            type === "error"
        ) {

            showToast(
                message.message ||
                "خطای سیگنالینگ"
            );

        }

    }


    /* =====================================================
       CONNECT SIGNALING
    ===================================================== */

    function connectSignaling() {

        clearTimeout(
            reconnectTimer
        );


        connectionInfo.textContent =
            SIGNALING_URL;


        try {

            websocket =
                new WebSocket(
                    SIGNALING_URL
                );

        } catch (error) {

            setStatus(
                "خطا در اتصال",
                false
            );

            scheduleReconnect();

            return;
        }


        websocket.onopen =
            () => {

                setStatus(
                    "متصل",
                    true
                );

                chatState.textContent =
                    "متصل";


                sendSignal({

                    type:
                        "join",

                    room_id:
                        currentStream.id,

                    username:
                        currentUsername,

                    role:
                        "owner"

                });

            };


        websocket.onmessage =
            async event => {

                try {

                    const message =
                        JSON.parse(
                            event.data
                        );


                    await handleSignal(
                        message
                    );

                } catch (error) {

                    console.error(
                        "Signaling parse error:",
                        error
                    );
                }

            };


        websocket.onerror =
            error => {

                console.error(
                    "WebSocket error:",
                    error
                );

                setStatus(
                    "خطا",
                    false
                );

            };


        websocket.onclose =
            () => {

                setStatus(
                    "قطع شد",
                    false
                );

                chatState.textContent =
                    "سیگنالینگ قطع";


                scheduleReconnect();
            };
    }


    function scheduleReconnect() {

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer =
            setTimeout(
                connectSignaling,
                3000
            );
    }


    /* =====================================================
       CAMERA
    ===================================================== */

    async function startCamera() {

        if (cameraStarted) {
            return;
        }


        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            showToast(
                "مرورگر از دوربین پشتیبانی نمی‌کند."
            );

            return;
        }


        cameraButton.disabled =
            true;

        cameraButton.textContent =
            "در حال فعال‌سازی...";


        try {

            mediaStream =
                await navigator.mediaDevices.getUserMedia(
                    {
                        video: {
                            width: {
                                ideal: 1280
                            },
                            height: {
                                ideal: 720
                            },
                            frameRate: {
                                ideal: 30,
                                max: 30
                            }
                        },

                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true
                        }
                    }
                );


            cameraPreview.srcObject =
                mediaStream;


            cameraStarted =
                true;


            videoPlaceholder.style.display =
                "none";


            cameraButton.textContent =
                "✅ دوربین فعال";


            setStatus(
                "LIVE",
                true
            );


            /*
             * اگر Peer قبلی وجود داشت،
             * ترک‌های دوربین را به آن اضافه می‌کنیم.
             */

            for (
                const [
                    peerId,
                    pc
                ]
                of peers
            ) {

                const senders =
                    pc.getSenders();


                mediaStream
                    .getTracks()
                    .forEach(
                        track => {

                            const existing =
                                senders.find(
                                    sender =>
                                        sender.track &&
                                        sender.track.kind ===
                                        track.kind
                                );


                            if (!existing) {

                                pc.addTrack(
                                    track,
                                    mediaStream
                                );

                            }

                        }
                    );


                try {

                    const offer =
                        await pc.createOffer();


                    await pc.setLocalDescription(
                        offer
                    );


                    sendSignal({

                        type:
                            "offer",

                        target:
                            peerId,

                        offer:
                            pc.localDescription

                    });

                } catch (error) {

                    console.error(
                        error
                    );
                }

            }


            showToast(
                "دوربین و میکروفون فعال شدند."
            );


        } catch (error) {

            console.error(
                "getUserMedia:",
                error
            );


            cameraButton.disabled =
                false;

            cameraButton.textContent =
                "🎥 شروع دوربین";


            showToast(
                "اجازه دوربین و میکروفون داده نشد."
            );
        }
    }


    function stopCamera() {

        if (!mediaStream) {
            return;
        }


        mediaStream
            .getTracks()
            .forEach(
                track => {
                    track.stop();
                }
            );


        mediaStream = null;


        cameraPreview.srcObject =
            null;


        cameraStarted =
            false;


        videoPlaceholder.style.display =
            "flex";


        placeholderText.textContent =
            "دوربین متوقف شده است.";


        cameraButton.disabled =
            false;


        cameraButton.textContent =
            "🎥 شروع دوربین";


        setStatus(
            "متوقف",
            false
        );
    }


    cameraButton.addEventListener(
        "click",
        startCamera
    );


    /* =====================================================
       CHAT
    ===================================================== */

    async function loadChat() {

        if (!currentStream) {
            return;
        }


        try {

            const params =
                new URLSearchParams();


            params.set(
                "stream_id",
                currentStream.id
            );


            if (lastChatId) {

                params.set(
                    "after_id",
                    lastChatId
                );
            }


            const response =
                await fetch(
                    "/api/chat/messages?" +
                    params.toString(),
                    {
                        cache:
                            "no-store"
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {
                return;
            }


            const messages =
                data.messages || [];


            if (!messages.length) {
                return;
            }


            const empty =
                chatMessages.querySelector(
                    ".chat-empty"
                );


            if (empty) {
                empty.remove();
            }


            messages.forEach(
                message => {

                    const element =
                        document.createElement(
                            "div"
                        );


                    element.className =
                        "chat-message";


                    const isOwner =
                        message.username ===
                        currentStream.username;


                    element.innerHTML = `
                        <div class="${
                            isOwner
                                ? "chat-user owner"
                                : "chat-user"
                        }">
                            ${escapeHtml(
                                message.username
                            )}
                            ${isOwner ? " 👑" : ""}
                        </div>

                        <div class="chat-text">
                            ${escapeHtml(
                                message.text
                            )}
                        </div>
                    `;


                    chatMessages.appendChild(
                        element
                    );


                    lastChatId =
                        message.id;
                }
            );


            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        } catch (error) {

            console.error(
                "Chat:",
                error
            );
        }
    }


    chatForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const text =
                chatInput.value.trim();


            if (
                !text ||
                !currentStream
            ) {
                return;
            }


            chatSend.disabled =
                true;


            try {

                const response =
                    await fetch(
                        "/api/chat/send",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                stream_id:
                                    currentStream.id,

                                username:
                                    currentUsername,

                                text:
                                    text

                            })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    showToast(
                        data.message ||
                        "ارسال پیام ناموفق بود."
                    );

                    return;
                }


                chatInput.value =
                    "";

                await loadChat();

            } catch (error) {

                showToast(
                    "خطا در ارسال پیام."
                );

            } finally {

                chatSend.disabled =
                    false;

                chatInput.focus();
            }
        }
    );


    /* =====================================================
       STOP LIVE
    ===================================================== */

    stopButton.addEventListener(
        "click",
        async () => {

            if (!currentStream) {
                return;
            }


            stopButton.disabled =
                true;


            try {

                const response =
                    await fetch(
                        "/api/streams/stop",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                stream_id:
                                    currentStream.id,

                                username:
                                    currentUsername

                            })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    showToast(
                        data.message ||
                        "پایان لایو ناموفق بود."
                    );

                    stopButton.disabled =
                        false;

                    return;
                }


            } catch (error) {

                console.error(
                    error
                );

            } finally {

                stopCamera();


                for (
                    const [
                        peerId,
                        pc
                    ]
                    of peers
                ) {

                    try {
                        pc.close();
                    } catch (error) {
                    }

                }


                peers.clear();


                clearInterval(
                    chatTimer
                );


                if (websocket) {

                    try {
                        websocket.close();
                    } catch (error) {
                    }

                }


                sessionStorage.removeItem(
                    "lainolive_current_stream"
                );


                window.location.href =
                    "/index.html";
            }
        }
    );


    /* =====================================================
       BACK
    ===================================================== */

    document
        .getElementById(
            "backButton"
        )
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "/index.html";
            }
        );


    /* =====================================================
       CLEANUP
    ===================================================== */

    window.addEventListener(
        "beforeunload",
        () => {

            if (mediaStream) {

                mediaStream
                    .getTracks()
                    .forEach(
                        track => {
                            track.stop();
                        }
                    );
            }


            for (
                const [
                    peerId,
                    pc
                ]
                of peers
            ) {

                try {
                    pc.close();
                } catch (error) {
                }

            }


            peers.clear();


            if (websocket) {

                try {
                    websocket.close();
                } catch (error) {
                }

            }

        }
    );


    /* =====================================================
       START
    ===================================================== */

    connectSignaling();

    loadChat();

    chatTimer =
        setInterval(
            loadChat,
            2000
        );

</script>

</body>
</html>
