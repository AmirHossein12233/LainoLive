<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<meta name="theme-color"
content="#ff2757">

<title>
تنظیمات - LainoLive
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

font-family:
Tahoma,Arial;

background:
radial-gradient(
circle at top,
#24163a,
#050508
);

color:white;

padding:20px;

}



.card{

max-width:450px;

margin:auto;

background:
rgba(255,255,255,.07);

border:
1px solid
rgba(255,255,255,.1);

border-radius:25px;

padding:25px;

}



h1{

text-align:center;

font-size:24px;

}



.group{

margin-top:20px;

}



.title{

font-size:13px;

color:#aaa;

margin-bottom:10px;

}



select{

width:100%;

height:50px;

border:none;

outline:none;

border-radius:14px;

background:
rgba(255,255,255,.1);

color:white;

padding:0 15px;

}



option{

background:#15151f;

}



.row{

display:flex;

justify-content:space-between;

align-items:center;

background:
rgba(255,255,255,.06);

padding:15px;

border-radius:15px;

}



.switch{

width:50px;

height:28px;

}



button{

width:100%;

height:50px;

border:none;

border-radius:15px;

margin-top:15px;

font-weight:900;

}



.save{

background:
linear-gradient(
135deg,
#ff2757,
#8b35ff
);

color:white;

}



.logout{

background:
rgba(255,50,80,.15);

color:#ff9aaa;

}



.back{

background:
rgba(255,255,255,.08);

color:white;

}



.message{

text-align:center;

margin-top:15px;

font-size:12px;

color:#aaa;

}


</style>


</head>


<body>


<div class="card">


<h1>
⚙️ تنظیمات LainoLive
</h1>





<div class="group">


<div class="title">
کیفیت پخش ویدیو
</div>


<select id="videoQuality">


<option value="360p">
360p - اینترنت ضعیف
</option>


<option value="480p">
480p
</option>


<option value="720p">
720p HD
</option>


<option value="1080p">
1080p Full HD
</option>


</select>


</div>







<div class="group">


<div class="title">
کیفیت صدا
</div>


<select id="audioQuality">


<option value="64kbps">
64kbps
</option>


<option value="128kbps">
128kbps
</option>


<option value="192kbps">
192kbps
</option>


<option value="320kbps">
320kbps
</option>


</select>


</div>







<div class="group">


<div class="title">
حالت برنامه
</div>


<select id="appMode">


<option value="normal">
عادی
</option>


<option value="dataSaver">
صرفه‌جویی اینترنت
</option>


<option value="quality">
کیفیت بالا
</option>


</select>


</div>







<div class="group">


<div class="row">


<span>
پخش خودکار ویدیو
</span>


<input
type="checkbox"
id="autoplay"
class="switch"
>


</div>


</div>







<button
class="save"
id="saveBtn"
>

💾 ذخیره تنظیمات

</button>





<button
class="back"
id="backBtn"
>

بازگشت

</button>





<button
class="logout"
id="logoutBtn"
>

خروج از حساب

</button>





<div
class="message"
id="message"
>

</div>



</div>





<script>


const video =
document.getElementById(
"videoQuality"
);


const audio =
document.getElementById(
"audioQuality"
);


const mode =
document.getElementById(
"appMode"
);


const autoplay =
document.getElementById(
"autoplay"
);


const message =
document.getElementById(
"message"
);




function loadSettings(){


const data =

JSON.parse(

localStorage.getItem(
"lainolive_settings"
)

||
"{}"

);



video.value =
data.videoQuality
||
"720p";



audio.value =
data.audioQuality
||
"128kbps";



mode.value =
data.appMode
||
"normal";



autoplay.checked =
data.autoplay
??
true;



}







document
.getElementById(
"saveBtn"
)
.onclick = ()=>{


const settings = {


videoQuality:
video.value,


audioQuality:
audio.value,


appMode:
mode.value,


autoplay:
autoplay.checked


};



localStorage.setItem(

"lainolive_settings",

JSON.stringify(
settings
)

);



message.textContent =
"تنظیمات ذخیره شد ✅";



};









document
.getElementById(
"logoutBtn"
)
.onclick = ()=>{


localStorage.clear();


location.href =
"/login.html";


};









document
.getElementById(
"backBtn"
)
.onclick = ()=>{


location.href =
"/";


};






loadSettings();



</script>


</body>

</html>
