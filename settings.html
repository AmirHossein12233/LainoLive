<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
تنظیمات - LainoLive
</title>


<style>

body{

margin:0;

background:#050508;

color:white;

font-family:tahoma;

padding:20px;

}


.box{

max-width:500px;

margin:auto;

background:#15151f;

padding:20px;

border-radius:20px;

}



h2{

color:#ff2757;

text-align:center;

}



label{

display:block;

margin-top:20px;

color:#aaa;

}



select,
button{

width:100%;

height:48px;

margin-top:10px;

border:0;

border-radius:14px;

padding:0 15px;

}



select{

background:#222;

color:white;

}



button{

background:#ff2757;

color:white;

font-weight:bold;

}



.logout{

background:#333;

}



#status{

text-align:center;

margin-top:15px;

color:#aaa;

}


</style>


</head>


<body>


<div class="box">


<h2>
⚙️ تنظیمات LainoLive
</h2>



<p>

کاربر:

<span id="username">

-

</span>

</p>





<label>

کیفیت پخش

</label>


<select id="quality">


<option value="360">

360p

</option>


<option value="480">

480p

</option>


<option value="720">

720p HD

</option>


<option value="1080">

1080p

</option>


</select>







<label>

حالت برنامه

</label>


<select id="mode">


<option value="dark">

تاریک

</option>


<option value="simple">

ساده

</option>


</select>







<button onclick="saveSettings()">

ذخیره تنظیمات

</button>





<button class="logout"
onclick="logout()">

خروج از حساب

</button>





<div id="status">

</div>



</div>








<script>


const username =

localStorage.getItem(

"lainolive_username"

)

||

"مهمان";



document

.getElementById(
"username"
)

.textContent =

username;







function loadSettings(){



const settings =

JSON.parse(

localStorage.getItem(

"lainolive_settings"

)

||

"{}"

);





if(settings.quality){


document

.getElementById(
"quality"
)

.value =

settings.quality;


}





if(settings.mode){


document

.getElementById(
"mode"
)

.value =

settings.mode;


}



}








function saveSettings(){



const settings = {


quality:

document

.getElementById(
"quality"
)

.value,



mode:

document

.getElementById(
"mode"
)

.value



};






localStorage.setItem(

"lainolive_settings",

JSON.stringify(
settings

)

);





document

.getElementById(
"status"
)

.textContent =

"تنظیمات ذخیره شد ✅";



}








function logout(){



localStorage.removeItem(

"lainolive_username"

);



location.href =

"login.html";


}






loadSettings();



</script>


</body>

</html>
