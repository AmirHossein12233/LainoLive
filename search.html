<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#09090f"
    >

    <title>
        جستجوی لایو - LainoLive
    </title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #19192b 0%,
                    #0b0b12 48%,
                    #050508 100%
                );

            color: white;
        }

        body {
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            min-height: 100vh;

            padding-bottom:
                calc(
                    90px +
                    env(safe-area-inset-bottom)
                );
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;

            padding:
                calc(
                    14px +
                    env(safe-area-inset-top)
                )
                16px
                14px;

            background:
                rgba(
                    8,
                    8,
                    15,
                    .92
                );

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            border-bottom:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .07
                );
        }

        .header-row {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        .back-btn {
            width: 42px;
            height: 42px;

            flex: 0 0 auto;

            border: none;

            border-radius: 13px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .07
                );

            color: white;

            font-size: 18px;
        }

        .header-title {
            font-size: 20px;

            font-weight: 900;
        }

        .header-subtitle {
            margin-top: 4px;

            color: #92929f;

            font-size: 10px;
        }

        .search-main {
            margin: 16px;
        }

        .search-box {
            display: flex;

            align-items: center;

            gap: 8px;

            padding:
                13px;

            border-radius: 16px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .06
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .06
                );
        }

        .search-box input {
            width: 100%;

            border: none;

            outline: none;

            background: transparent;

            color: white;

            font-size: 13px;
        }

        .search-box input::placeholder {
            color: #777784;
        }

        .filters {
            display: flex;

            gap: 8px;

            margin-top: 12px;

            overflow-x: auto;

            padding-bottom: 3px;
        }

        .filter-btn {
            flex:
                0 0 auto;

            min-height: 36px;

            border: none;

            border-radius: 999px;

            padding:
                0
                13px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .06
                );

            color: #9d9daa;

            font-size: 10px;

            font-weight: 800;
        }

        .filter-btn.active {
            background:
                linear-gradient(
                    135deg,
                    #ff2757,
                    #8b35ff
                );

            color: white;
        }

        .results-info {
            margin-top: 12px;

            color: #858592;

            font-size: 10px;
        }

        .list {
            padding:
                0
                16px;

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 12px;
        }

        .card {
            overflow: hidden;

            border-radius: 18px;

            background:
                linear-gradient(
                    180deg,
                    rgba(
                        255,
                        255,
                        255,
                        .055
                    ),
                    rgba(
                        255,
                        255,
                        255,
                        .025
                    )
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .07
                );

            transition:
                transform .18s ease;
        }

        .card:active {
            transform:
                scale(.98);
        }

        .cover {
            position: relative;

            aspect-ratio:
                16 / 10;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #161622,
                    #29213d
                );
        }

        .cover img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }

        .cover-placeholder {
            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 34px;

            opacity: .48;
        }

        .live-badge {
            position: absolute;

            top: 8px;
            right: 8px;

            padding:
                5px
                8px;

            border-radius: 999px;

            background:
                #ff1d4d;

            font-size: 9px;

            font-weight: 900;
        }

        .viewer-count {
            position: absolute;

            left: 8px;
            bottom: 8px;

            padding:
                5px
                8px;

            border-radius: 999px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    .68
                );

            font-size: 10px;
        }

        .card-body {
            padding: 12px;
        }

        .card-title {
            font-size: 14px;

            font-weight: 900;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .card-user {
            margin-top: 7px;

            color: #a8a8b5;

            font-size: 11px;
        }

        .card-bottom {
            margin-top: 9px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 8px;
        }

        .category {
            max-width: 55%;

            padding:
                4px
                8px;

            border-radius: 999px;

            background:
                rgba(
                    139,
                    53,
                    255,
                    .12
                );

            color: #ceb5ff;

            font-size: 9px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .views {
            color: #ffb7c5;

            font-size: 9px;

            white-space: nowrap;
        }

        .empty {
            grid-column:
                1 / -1;

            padding:
                45px
                20px;

            text-align: center;

            border-radius: 18px;

            color: #9292a0;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .025
                );

            border:
                1px dashed
                rgba(
                    255,
                    255,
                    255,
                    .09
                );

            font-size: 13px;

            line-height: 1.9;
        }

        .bottom-nav {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 200;

            padding:
                10px
                10px
                calc(
                    10px +
                    env(safe-area-inset-bottom)
                );

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 8px;

            background:
                rgba(
                    7,
                    7,
                    12,
                    .93
                );

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .07
                );

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);
        }

        .nav-btn {
            min-height: 52px;

            border: none;

            border-radius: 15px;

            color: #8f8f9d;

            background: transparent;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 4px;

            font-size: 10px;

            font-weight: 700;
        }

        .nav-btn span:first-child {
            font-size: 20px;
        }

        .nav-btn.active {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    rgba(
                        255,
                        39,
                        87,
                        .14
                    ),
                    rgba(
                        139,
                        53,
                        255,
                        .16
                    )
                );
        }

        @media (min-width:700px) {

            .page {
                max-width: 1100px;
                margin: 0 auto;
            }

            .list {
                grid-template-columns:
                    repeat(
                        3,
                        minmax(
                            0,
                            1fr
                        )
                    );
            }

            .bottom-nav {
                left: 50%;
                right: auto;

                width:
                    min(
                        650px,
                        calc(100% - 30px)
                    );

                transform:
                    translateX(-50%);

                bottom: 14px;

                border:
                    1px solid
                    rgba(
                        255,
                        255,
                        255,
                        .07
                    );

                border-radius: 22px;

                padding: 8px;
            }
        }

        @media (max-width:390px) {

            .list {
                grid-template-columns:
                    1fr;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header class="header">

        <div class="header-row">

            <button
                id="backButton"
                class="back-btn"
                type="button"
            >
                ←
            </button>

            <div>

                <div class="header-title">
                    🔎 جستجوی لایو
                </div>

                <div class="header-subtitle">
                    عنوان، کاربر یا دسته‌بندی
                </div>

            </div>

        </div>

    </header>


    <main class="search-main">

        <div class="search-box">

            <span>
                🔎
            </span>

            <input
                id="searchInput"
                type="search"
                maxlength="100"
                placeholder="مثلاً موسیقی یا گیم..."
                autocomplete="off"
            >

        </div>


        <div
            id="filters"
            class="filters"
        >

            <button
                class="filter-btn active"
                data-category=""
                type="button"
            >
                همه
            </button>

            <button
                class="filter-btn"
                data-category="عمومی"
                type="button"
            >
                عمومی
            </button>

            <button
                class="filter-btn"
                data-category="گیم"
                type="button"
            >
                گیم
            </button>

            <button
                class="filter-btn"
                data-category="موسیقی"
                type="button"
            >
                موسیقی
            </button>

            <button
                class="filter-btn"
                data-category="گفتگو"
                type="button"
            >
                گفتگو
            </button>

            <button
                class="filter-btn"
                data-category="آموزشی"
                type="button"
            >
                آموزشی
            </button>

            <button
                class="filter-btn"
                data-category="سرگرمی"
                type="button"
            >
                سرگرمی
            </button>

        </div>


        <div
            id="resultsInfo"
            class="results-info"
        >
            در حال دریافت...
        </div>

    </main>


    <main
        id="searchList"
        class="list"
    >

        <div class="empty">
            در حال دریافت لایوها...
        </div>

    </main>

</div>


<nav class="bottom-nav">

    <button
        id="homeButton"
        class="nav-btn"
        type="button"
    >
        <span>🏠</span>
        <span>خانه</span>
    </button>

    <button
        id="popularButton"
        class="nav-btn"
        type="button"
    >
        <span>🔥</span>
        <span>محبوب</span>
    </button>

    <button
        id="profileButton"
        class="nav-btn"
        type="button"
    >
        <span>👤</span>
        <span>پروفایل</span>
    </button>

</nav>


<script
    src="/streams-cache.js"
></script>


<script>

const LOGIN_KEY =
    "lainolive_logged_in";

const USERNAME_KEY =
    "lainolive_username";

const VIEW_STREAM_KEY =
    "lainolive_view_stream";

const CURRENT_STREAM_KEY =
    "lainolive_current_stream";


if (
    localStorage.getItem(
        LOGIN_KEY
    ) !== "true"
) {

    window.location.href =
        "/login.html";
}


const searchInput =
    document.getElementById(
        "searchInput"
    );

const searchList =
    document.getElementById(
        "searchList"
    );

const resultsInfo =
    document.getElementById(
        "resultsInfo"
    );

const filters =
    document.getElementById(
        "filters"
    );

const currentUsername =
    localStorage.getItem(
        USERNAME_KEY
    )
    ||
    "";


let allStreams = [];

let selectedCategory = "";

let loading = false;


/* =========================
   HELPERS
   ========================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


function normalizeText(
    value
) {

    return String(
        value ?? ""
    )
        .trim()
        .toLowerCase();
}


function getId(stream) {

    return (
        stream?.id
        ??
        stream?.stream_id
    );
}


function getTitle(stream) {

    return (
        stream?.title
        ||
        "لایو بدون عنوان"
    );
}


function getUsername(stream) {

    return (
        stream?.username
        ||
        stream?.user
        ||
        "کاربر"
    );
}


function getCategory(stream) {

    return (
        stream?.category
        ||
        "عمومی"
    );
}


function getViewers(stream) {

    return Number(
        stream?.viewer_count
        ??
        stream?.viewers
        ??
        0
    );
}


function getCover(stream) {

    return (
        stream?.cover_url
        ||
        stream?.cover
        ||
        stream?.thumbnail
        ||
        ""
    );
}


/* =========================
   QUERY URL
   ========================= */

function loadInitialQuery() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const query =
        params.get(
            "q"
        );


    if (query) {

        searchInput.value =
            query;
    }
}


/* =========================
   FILTER
   ========================= */

function getFilteredStreams() {

    const query =
        normalizeText(
            searchInput.value
        );


    return allStreams.filter(
        stream => {

            const title =
                normalizeText(
                    getTitle(
                        stream
                    )
                );

            const username =
                normalizeText(
                    getUsername(
                        stream
                    )
                );

            const category =
                normalizeText(
                    getCategory(
                        stream
                    )
                );


            const matchesText =
                !query
                ||
                title.includes(
                    query
                )
                ||
                username.includes(
                    query
                )
                ||
                category.includes(
                    query
                );


            const matchesCategory =
                !selectedCategory
                ||
                normalizeText(
                    getCategory(
                        stream
                    )
                )
                ===
                normalizeText(
                    selectedCategory
                );


            return (
                matchesText
                &&
                matchesCategory
            );
        }
    );
}


/* =========================
   RENDER
   ========================= */

function renderSearchResults() {

    const streams =
        getFilteredStreams();


    resultsInfo.textContent =
        streams.length +
        " لایو پیدا شد";


    if (
        !streams.length
    ) {

        searchList.innerHTML =
            `
                <div class="empty">
                    هیچ لایوی مطابق جستجوی شما پیدا نشد.
                </div>
            `;

        return;
    }


    searchList.innerHTML =
        streams
            .map(
                stream => {

                    const id =
                        getId(
                            stream
                        );

                    const title =
                        escapeHtml(
                            getTitle(
                                stream
                            )
                        );

                    const username =
                        escapeHtml(
                            getUsername(
                                stream
                            )
                        );

                    const category =
                        escapeHtml(
                            getCategory(
                                stream
                            )
                        );

                    const viewers =
                        getViewers(
                            stream
                        );

                    const cover =
                        getCover(
                            stream
                        );


                    return `
                        <article
                            class="card"
                            data-id="${escapeHtml(id)}"
                        >

                            <div class="cover">

                                ${
                                    cover
                                        ? `
                                            <img
                                                src="${escapeHtml(
                                                    cover
                                                )}"
                                                alt="${title}"
                                                loading="lazy"
                                                onerror="
                                                    this.style.display='none';
                                                    this.parentElement
                                                        .querySelector(
                                                            '.cover-placeholder'
                                                        )
                                                        .style.display='flex';
                                                "
                                            >

                                            <div
                                                class="cover-placeholder"
                                                style="
                                                    display:none;
                                                    position:absolute;
                                                    inset:0;
                                                "
                                            >
                                                📺
                                            </div>
                                        `
                                        : `
                                            <div class="cover-placeholder">
                                                📺
                                            </div>
                                        `
                                }

                                <div class="live-badge">
                                    ● LIVE
                                </div>

                                <div class="viewer-count">
                                    👁 ${viewers}
                                </div>

                            </div>


                            <div class="card-body">

                                <div class="card-title">
                                    ${title}
                                </div>

                                <div class="card-user">
                                    👤 ${username}
                                </div>

                                <div class="card-bottom">

                                    <div class="category">
                                        ${category}
                                    </div>

                                    <div class="views">
                                        ${viewers}
                                        بیننده
                                    </div>

                                </div>

                            </div>

                        </article>
                    `;
                }
            )
            .join("");


    searchList
        .querySelectorAll(
            "[data-id]"
        )
        .forEach(
            card => {

                card.addEventListener(
                    "click",
                    () => {

                        const id =
                            card.dataset.id;


                        const stream =
                            allStreams.find(
                                item =>
                                    String(
                                        getId(
                                            item
                                        )
                                    )
                                    ===
                                    String(
                                        id
                                    )
                            );


                        if (
                            !stream
                        ) {

                            return;
                        }


                        sessionStorage.setItem(
                            VIEW_STREAM_KEY,
                            JSON.stringify(
                                stream
                            )
                        );


                        const owner =
                            getUsername(
                                stream
                            );


                        if (
                            String(owner)
                            ===
                            String(
                                currentUsername
                            )
                        ) {

                            sessionStorage.setItem(
                                CURRENT_STREAM_KEY,
                                JSON.stringify(
                                    stream
                                )
                            );

                            window.location.href =
                                "/live.html";

                            return;
                        }


                        window.location.href =
                            "/viewer.html?id=" +
                            encodeURIComponent(
                                id
                            );
                    }
                );
            }
        );
}


/* =========================
   LOAD STREAMS
   ========================= */

async function loadStreams(
    force = false
) {

    if (
        loading
    ) {
        return;
    }


    loading =
        true;


    try {

        const streams =
            await LainoLiveStreams.fetch({
                force:
                    force,

                ttl:
                    1000
            });


        allStreams =
            Array.isArray(
                streams
            )
                ? streams
                : [];


        renderSearchResults();

    } catch (error) {

        console.error(
            "search stream error:",
            error
        );


        if (
            !allStreams.length
        ) {

            searchList.innerHTML =
                `
                    <div class="empty">
                        دریافت لایوها انجام نشد.
                        <br>
                        اتصال سرور را بررسی کنید.
                    </div>
                `;
        }


    } finally {

        loading =
            false;
    }
}


/* =========================
   SEARCH INPUT
   ========================= */

searchInput.addEventListener(
    "input",
    () => {

        renderSearchResults();
    }
);


searchInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            const url =
                new URL(
                    window.location.href
                );


            url.searchParams.set(
                "q",
                searchInput.value
            );


            window.history.replaceState(
                {},
                "",
                url
            );
        }
    }
);


/* =========================
   CATEGORY FILTER
   ========================= */

filters
    .querySelectorAll(
        "[data-category]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    filters
                        .querySelectorAll(
                            ".filter-btn"
                        )
                        .forEach(
                            item =>
                                item.classList.remove(
                                    "active"
                                )
                        );


                    button.classList.add(
                        "active"
                    );


                    selectedCategory =
                        button.dataset.category
                        ||
                        "";


                    renderSearchResults();
                }
            );
        }
    );


/* =========================
   NAV
   ========================= */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "/index.html";
        }
    );


document
    .getElementById(
        "homeButton"
    )
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "/index.html";
        }
    );


document
    .getElementById(
        "popularButton"
    )
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "/popular.html";
        }
    );


document
    .getElementById(
        "profileButton"
    )
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "/profile.html";
        }
    );


/* =========================
   START
   ========================= */

loadInitialQuery();

loadStreams();


setInterval(
    () => {

        loadStreams(
            false
        );

    },
    2000
);

</script>

</body>
</html>
