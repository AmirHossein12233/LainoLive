<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#09090f">

<title>
LainoLive - جستجو
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

font-family:
Tahoma,
Arial;

background:
radial-gradient(
circle at top,
#19192b,
#050508
);

color:white;

}



.header{

display:flex;

align-items:center;

justify-content:space-between;

padding:15px;

background:
rgba(8,8,15,.9);

}



.logo{

font-size:22px;

font-weight:900;

}



.back{

width:42px;

height:42px;

border:none;

border-radius:14px;

background:
rgba(255,255,255,.08);

color:white;

font-size:18px;

}



.search{

margin:15px;

display:flex;

gap:8px;

}



.search input{

flex:1;

height:48px;

border:none;

outline:none;

border-radius:14px;

background:
rgba(255,255,255,.08);

color:white;

padding:0 15px;

}



.search button{

width:55px;

border:none;

border-radius:14px;

background:
linear-gradient(
135deg,
#ff2757,
#8b35ff
);

color:white;

font-weight:900;

}



.list{

padding:0 15px;

display:grid;

gap:12px;

}



.card{

padding:15px;

border-radius:18px;

background:
rgba(255,255,255,.06);

border:
1px solid
rgba(255,255,255,.08);

}



.title{

font-weight:900;

}



.info{

margin-top:8px;

font-size:12px;

color:#aaa;

}



.empty{

margin:20px;

padding:35px;

text-align:center;

background:
rgba(255,255,255,.05);

border-radius:18px;

color:#aaa;

}



</style>

</head>


<body>


<header class="header">


<div class="logo">

🔎 جستجو

</div>


<button
class="back"
onclick="history.back()"
>

←

</button>


</header>




<div class="search">


<input
id="searchInput"
placeholder="نام لایو یا کاربر..."
>


<button
id="searchButton"
>

🔍

</button>


</div>





<div
id="list"
class="list"
>


<div class="empty">

عبارت جستجو را وارد کنید

</div>


</div>





<script>


"use strict";


const input =
document.getElementById(
"searchInput"
);


const list =
document.getElementById(
"list"
);





function escapeHtml(
text
){

return String(text || "")

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}





async function search(){


const query =
input.value.trim();



if(
!query
){

list.innerHTML =

`
<div class="empty">

چیزی برای جستجو وارد کنید

</div>

`;

return;

}





try{


const response =
await fetch(
"/api/streams"
);



const data =
await response.json();



let streams =
Array.isArray(data)
?
data
:
(
data.streams || []
);





streams =
streams.filter(
stream => {


const text =

(
stream.title
||
""
)

+

" "

+

(
stream.username
||
""
)

+

" "

+

(
stream.category
||
""
);



return text
.toLowerCase()
.includes(
query.toLowerCase()
);



}

);






if(
streams.length===0
){


list.innerHTML =

`
<div class="empty">

نتیجه‌ای پیدا نشد

</div>

`;

return;

}





list.innerHTML =

streams.map(
stream =>
`

<div
class="card"
onclick="
openLive('${stream.id || stream.stream_id}')
"
>


<div class="title">

🔴
${escapeHtml(
stream.title ||
"لایو بدون عنوان"
)}

</div>



<div class="info">

👤
${escapeHtml(
stream.username ||
"کاربر"
)}

<br>

📁
${escapeHtml(
stream.category ||
"عمومی"
)}

<br>

👁
${stream.viewer_count || 0}
بیننده

</div>


</div>

`
)
.join("");



}
catch(error){


list.innerHTML =

`
<div class="empty">

خطا در جستجو

</div>

`;

}


}





function openLive(id){

window.location.href =

"/viewer.html?id="

+
encodeURIComponent(
id
);

}





document
.getElementById(
"searchButton"
)
.onclick =
search;




input.addEventListener(
"keydown",
e=>{

if(
e.key==="Enter"
){

search();

}

}
);



</script>


</body>

</html>
