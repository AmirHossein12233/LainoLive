<script>
    /* =====================================================
       AUTH
    ===================================================== */

    const loggedIn =
        localStorage.getItem(
            "lainolive_logged_in"
        );

    const currentUsername =
        localStorage.getItem(
            "lainolive_username"
        );


    if (
        loggedIn !== "true" ||
        !currentUsername
    ) {

        window.location.replace(
            "/login.html"
        );
    }
</script>

<script>

    /* =====================================================
       ELEMENTS
    ===================================================== */

    const username =
        document.getElementById(
            "username"
        );

    const liveCount =
        document.getElementById(
            "liveCount"
        );

    const viewerCount =
        document.getElementById(
            "viewerCount"
        );

    const statusNumber =
        document.getElementById(
            "statusNumber"
        );

    const activeLiveContainer =
        document.getElementById(
            "activeLiveContainer"
        );

    const loading =
        document.getElementById(
            "loading"
        );

    const errorBox =
        document.getElementById(
            "error"
        );

    const toast =
        document.getElementById(
            "toast"
        );


    username.textContent =
        currentUsername;


    /* =====================================================
       TOAST
    ===================================================== */

    function showToast(
        text
    ) {

        toast.textContent =
            text;

        toast.classList.add(
            "show"
        );


        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );
    }


    /* =====================================================
       ESCAPE
    ===================================================== */

    function escapeHtml(
        text
    ) {

        return String(
            text ?? ""
        )
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );
    }


    /* =====================================================
       RENDER NO LIVE
    ===================================================== */

    function renderNoLive() {

        activeLiveContainer.innerHTML = `
            <div class="no-live">

                <div class="no-live-icon">
                    📺
                </div>

                <div class="no-live-title">
                    لایو فعالی نداری
                </div>

                <div class="no-live-text">
                    برای شروع پخش زنده به صفحه خانه برو.
                </div>

            </div>
        `;

        viewerCount.textContent =
            "0";
    }


    /* =====================================================
       RENDER ACTIVE LIVE
    ===================================================== */

    function renderActiveLive(
        stream
    ) {

        const viewers =
            Number(
                stream.viewer_count ??
                stream.viewers ??
                0
            );


        liveCount.textContent =
            "1";


        viewerCount.textContent =
            String(
                viewers
            );


        activeLiveContainer.innerHTML = `

            <div class="active-live-card">

                <div class="active-live-top">

                    <div
                        class="active-live-title"
                        title="${escapeHtml(
                            stream.title ||
                            "پخش زنده"
                        )}"
                    >
                        ${escapeHtml(
                            stream.title ||
                            "پخش زنده"
                        )}
                    </div>

                    <div class="live-badge">
                        🔴 LIVE
                    </div>

                </div>


                <div class="active-live-info">
                    لایو شما در حال حاضر فعال است.
                </div>


                <div class="live-meta">

                    <div class="meta-item">
                        👁 ${viewers} بیننده
                    </div>

                    <div class="meta-item">
                        📂 ${escapeHtml(
                            stream.category ||
                            "عمومی"
                        )}
                    </div>

                    <div class="meta-item">
                        🆔 #${escapeHtml(
                            stream.id
                        )}
                    </div>

                </div>


                <button
                    id="continueLiveButton"
                    class="continue-live-button"
                    type="button"
                >
                    🎥 ادامه لایو
                </button>

            </div>
        `;


        document
            .getElementById(
                "continueLiveButton"
            )
            .addEventListener(
                "click",
                () => {

                    sessionStorage.setItem(
                        "lainolive_current_stream",
                        JSON.stringify(
                            stream
                        )
                    );


                    window.location.href =
                        "/live.html";
                }
            );
    }


    /* =====================================================
       LOAD PROFILE
    ===================================================== */

    async function loadProfile() {

        loading.style.display =
            "block";

        errorBox.style.display =
            "none";


        try {

            const response =
                await fetch(
                    "/api/streams",
                    {
                        cache:
                            "no-store"
                    }
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "HTTP " +
                    response.status
                );
            }


            const data =
                await response.json();


            if (
                !data ||
                !data.success
            ) {

                throw new Error(
                    data?.message ||
                    "دریافت اطلاعات ناموفق بود."
                );
            }


            const streams =
                Array.isArray(
                    data.streams
                )
                    ? data.streams
                    : [];


            const myStreams =
                streams.filter(
                    stream =>
                        String(
                            stream.username
                        ) ===
                        String(
                            currentUsername
                        )
                );


            liveCount.textContent =
                String(
                    myStreams.length
                );


            if (
                myStreams.length
            ) {

                const stream =
                    myStreams[0];


                renderActiveLive(
                    stream
                );


                statusNumber.textContent =
                    "فعال";

            } else {

                renderNoLive();


                statusNumber.textContent =
                    "آنلاین";
            }


        } catch (error) {

            console.error(
                "Profile:",
                error
            );


            liveCount.textContent =
                "0";

            viewerCount.textContent =
                "0";

            statusNumber.textContent =
                "نامشخص";


            activeLiveContainer.innerHTML = `
                <div class="no-live">

                    <div class="no-live-icon">
                        ⚠️
                    </div>

                    <div class="no-live-title">
                        دریافت اطلاعات ناموفق بود
                    </div>

                    <div class="no-live-text">
                        اتصال به سرور را بررسی کن و دوباره تلاش کن.
                    </div>

                </div>
            `;


            errorBox.textContent =
                "خطا در دریافت اطلاعات از سرور.";

            errorBox.style.display =
                "block";

        } finally {

            loading.style.display =
                "none";
        }
    }


    /* =====================================================
       NAVIGATION
    ===================================================== */

    document
        .getElementById(
            "backButton"
        )
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "/index.html";
            }
        );


    document
        .getElementById(
            "homeButton"
        )
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "/index.html";
            }
        );


    /* =====================================================
       LOGOUT
    ===================================================== */

    document
        .getElementById(
            "logoutButton"
        )
        .addEventListener(
            "click",
            () => {

                const accepted =
                    window.confirm(
                        "آیا مطمئنی می‌خواهی از حساب خارج شوی؟"
                    );


                if (
                    !accepted
                ) {
                    return;
                }


                localStorage.removeItem(
                    "lainolive_logged_in"
                );


                localStorage.removeItem(
                    "lainolive_username"
                );


                sessionStorage.removeItem(
                    "lainolive_current_stream"
                );


                sessionStorage.removeItem(
                    "lainolive_view_stream"
                );


                showToast(
                    "از حساب خارج شدی."
                );


                setTimeout(
                    () => {

                        window.location.replace(
                            "/login.html"
                        );

                    },
                    300
                );
            }
        );


    /* =====================================================
       START
    ===================================================== */

    loadProfile();

</script>

</body>

</html>
