<script>
    /* =====================================================
       AUTH
    ===================================================== */

    const loggedIn =
        localStorage.getItem(
            "lainolive_logged_in"
        );

    const currentUsername =
        localStorage.getItem(
            "lainolive_username"
        );


    if (
        loggedIn !== "true" ||
        !currentUsername
    ) {

        window.location.replace(
            "/login.html"
        );
    }
</script>

    <header class="profile-header">

        <div class="profile-header-left">

                id="backButton"
                class="back-button"
                type="button"

            <div class="avatar">

                id="username"
                class="username"
            >
                کاربر
            </div>


            <div class="username-label">
                حساب LainoLive
            </div>


            <div class="stats">

                <div class="stat-card">

                    <div
                        id="liveCount"
                        class="stat-number"
                    >
                        0
                    </div>

                    <div class="stat-label">
                        لایوهای فعال
                    </div>

                </div>


                <div class="stat-card">

                    <div
                        id="statusNumber"
                        class="stat-number"
                    >

                    </div>

                        وضعیت حساب
                    </div>

                </div>

                    id="logoutButton"
                    class="action-button logout-button"
                    type="button"
                >
                    🚪 خروج از حساب
                </button>

            </div>


            <div
                id="loading"
                class="loading"
            >
                در حال دریافت اطلاعات...
            </div>

            <div
                id="error"
                class="error"
                style="display:none;"
            ></div>

        </section>

    </main>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

    /* =====================================================
       ELEMENTS
    ===================================================== */

    const username =
        document.getElementById(
            "username"
        );

    const liveCount =
        document.getElementById(
            "liveCount"
        );

    const statusNumber =
        document.getElementById(
            "statusNumber"
        );

    const liveStatus =
        document.getElementById(
            "liveStatus"
        );

    const loading =
        document.getElementById(
            "loading"
        );

    const errorBox =
        document.getElementById(
            "error"
        );

    const toast =
        document.getElementById(
            "toast"
        );


    /* =====================================================
       USER
    ===================================================== */

    username.textContent =
        currentUsername;


    /* =====================================================
       TOAST
    ===================================================== */

    function showToast(
        text
    ) {

        toast.textContent =
            text;

        toast.classList.add(
            "show"
        );


        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );
    }


    /* =====================================================
       LOAD PROFILE DATA
    ===================================================== */

    async function loadProfile() {

        loading.style.display =
            "block";

        errorBox.style.display =
            "none";


        try {

            const response =
                await fetch(
                    "/api/streams",
                    {
                        cache:
                            "no-store"
                    }
                );


            if (
                !response.ok
            ) {
                throw new Error(
                    "HTTP " +
                    response.status
                );
            }


            const data =
                await response.json();


            if (
                !data ||
                !data.success
            ) {

                throw new Error(
                    data?.message ||
                    "دریافت اطلاعات ناموفق بود."
                );
            }


            const streams =
                Array.isArray(
                    data.streams
                )
                    ? data.streams
                    : [];


            const myStreams =
                streams.filter(
                    stream =>
                        String(
                            stream.username
                        ) ===
                        String(
                            currentUsername
                        )
                );


            liveCount.textContent =
                String(
                    myStreams.length
                );


            statusNumber.textContent =
                "فعال";


            if (
                myStreams.length
            ) {

                liveStatus.classList.add(
                    "active"
                );


                liveStatus.textContent =
                    "شما در حال حاضر " +
                    myStreams.length +
                    " لایو فعال دارید.";

            } else {

                liveStatus.classList.remove(
                    "active"
                );


                liveStatus.textContent =
                    "در حال حاضر لایو فعالی از طرف شما وجود ندارد.";
            }


        } catch (error) {

            console.error(
                "Profile:",
                error
            );


            statusNumber.textContent =
                "نامشخص";


            liveStatus.classList.remove(
                "active"
            );


            liveStatus.textContent =
                "دریافت تعداد لایوها در حال حاضر ممکن نیست.";


            errorBox.textContent =
                "خطا در دریافت اطلاعات از سرور.";


            errorBox.style.display =
                "block";

        } finally {

            loading.style.display =
                "none";
        }
    }


    /* =====================================================
       NAVIGATION
    ===================================================== */

    document
        .getElementById(
            "backButton"
        )
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "/index.html";
            }
        );


    document
        .getElementById(
            "homeButton"
        )
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "/index.html";
            }
        );


    /* =====================================================
       LOGOUT
    ===================================================== */

    document
        .getElementById(
            "logoutButton"
        )
        .addEventListener(
            "click",
            () => {

                const accepted =
                    window.confirm(
                        "آیا مطمئنی می‌خواهی از حساب خارج شوی؟"
                    );


                if (
                    !accepted
                ) {
                    return;
                }


                localStorage.removeItem(
                    "lainolive_logged_in"
                );


                localStorage.removeItem(
                    "lainolive_username"
                );


                sessionStorage.removeItem(
                    "lainolive_current_stream"
                );


                sessionStorage.removeItem(
                    "lainolive_view_stream"
                );


                showToast(
                    "از حساب خارج شدی."
                );


                setTimeout(
                    () => {

                        window.location.replace(
                            "/login.html"
                        );

                    },
                    300
                );
            }
        );


    /* =====================================================
       START
    ===================================================== */

    loadProfile();

</script>

</body>

</html>
