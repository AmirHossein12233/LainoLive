<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
پروفایل - LainoLive
</title>


<style>

body{

margin:0;

background:#050508;

color:white;

font-family:tahoma;

padding:20px;

}



.box{

max-width:500px;

margin:auto;

background:#15151f;

padding:25px;

border-radius:25px;

}



.avatar{

width:90px;

height:90px;

border-radius:50%;

background:#ff2757;

display:flex;

align-items:center;

justify-content:center;

font-size:40px;

margin:auto;

}



h2{

text-align:center;

}



.info{

background:#222;

padding:15px;

border-radius:15px;

margin-top:15px;

line-height:2;

}



input,
button{

width:100%;

height:48px;

margin-top:12px;

border:0;

border-radius:14px;

padding:0 15px;

}



input{

background:#222;

color:white;

}



button{

background:#ff2757;

color:white;

font-weight:bold;

}



.logout{

background:#333;

}



</style>

</head>


<body>



<div class="box">



<div class="avatar">

👤

</div>



<h2>

<span id="username">

-

</span>

</h2>




<div class="info">


نام کاربری:

<span id="name">

-

</span>


<br>


تعداد لایو:

<span id="liveCount">

0

</span>



</div>




<input

id="newName"

placeholder="نام جدید">





<button onclick="changeName()">

ذخیره تغییرات

</button>




<button class="logout"
onclick="logout()">

خروج از حساب

</button>



</div>







<script>


let username =

localStorage.getItem(

"lainolive_username"

)

||

"مهمان";





document.getElementById(
"username"
)
.textContent =

username;



document.getElementById(
"name"
)
.textContent =

username;









function changeName(){


const name =

document.getElementById(
"newName"
)
.value.trim();



if(!name)
return;




localStorage.setItem(

"lainolive_username",

name

);





document.getElementById(
"username"
)
.textContent =

name;



document.getElementById(
"name"
)
.textContent =

name;


}








function logout(){


localStorage.removeItem(

"lainolive_username"

);



location.href =

"login.html";


}



</script>


</body>

</html>
