<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<title>
پروفایل - LainoLive
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

font-family:
Tahoma,Arial;

background:
radial-gradient(
circle at top,
#24163a,
#050508
);

color:white;

padding:20px;

}



.card{

max-width:450px;

margin:auto;

background:
rgba(255,255,255,.07);

border:
1px solid
rgba(255,255,255,.1);

border-radius:25px;

padding:25px;

}



.logo{

text-align:center;

font-size:25px;

font-weight:900;

}



.avatar{

width:100px;

height:100px;

margin:25px auto;

border-radius:50%;

background:
linear-gradient(
135deg,
#ff2757,
#8b35ff
);

display:flex;

align-items:center;

justify-content:center;

font-size:45px;

overflow:hidden;

}



.avatar img{

width:100%;

height:100%;

object-fit:cover;

}



label{

display:block;

font-size:12px;

color:#aaa;

margin-bottom:7px;

}



input{

width:100%;

height:48px;

border:none;

outline:none;

border-radius:14px;

background:
rgba(255,255,255,.1);

color:white;

padding:0 15px;

margin-bottom:15px;

}



button{

width:100%;

height:48px;

border:none;

border-radius:14px;

font-weight:900;

margin-top:10px;

}



.save{

background:
linear-gradient(
135deg,
#ff2757,
#8b35ff
);

color:white;

}



.logout{

background:
rgba(255,50,80,.15);

color:#ff9aaa;

}



.back{

background:
rgba(255,255,255,.08);

color:white;

}



.info{

text-align:center;

color:#aaa;

font-size:12px;

margin-top:15px;

}


</style>


</head>



<body>


<div class="card">


<div class="logo">

👤 پروفایل LainoLive

</div>


<div
id="avatar"
class="avatar"
>

👤

</div>



<input
id="avatarInput"
type="file"
accept="image/*"
>



<label>
نام نمایشی
</label>


<input
id="displayName"
placeholder="نام شما"
>



<label>
نام کاربری
</label>


<input
id="username"
readonly
>



<button
class="save"
id="saveBtn"
>

ذخیره تغییرات

</button>



<button
class="back"
id="backBtn"
>

بازگشت

</button>



<button
class="logout"
id="logoutBtn"
>

خروج از حساب

</button>



<div
class="info"
id="message"
>

</div>



</div>
<script>


const usernameInput =
document.getElementById(
"username"
);


const nameInput =
document.getElementById(
"displayName"
);


const avatar =
document.getElementById(
"avatar"
);


const message =
document.getElementById(
"message"
);



function getUser(){


return {

username:
localStorage.getItem(
"lainolive_username"
)
||"",

name:
localStorage.getItem(
"lainolive_name"
)
||"",

avatar:
localStorage.getItem(
"lainolive_avatar"
)
||""

};


}





function loadProfile(){


const user =
getUser();



usernameInput.value =
user.username;



nameInput.value =
user.name ||
user.username;



if(user.avatar){


avatar.innerHTML =
`
<img src="${user.avatar}">
`;



}



}





document
.getElementById(
"saveBtn"
)
.onclick = ()=>{


const name =
nameInput.value.trim();



localStorage.setItem(
"lainolive_name",
name
);



message.textContent =
"ذخیره شد ✅";



};









document
.getElementById(
"avatarInput"
)
.onchange = e =>{


const file =
e.target.files[0];



if(!file)
return;



const reader =
new FileReader();



reader.onload = ()=>{


localStorage.setItem(
"lainolive_avatar",
reader.result
);



avatar.innerHTML =
`
<img src="${reader.result}">
`;



};



reader.readAsDataURL(
file
);



};









document
.getElementById(
"logoutBtn"
)
.onclick = ()=>{


localStorage.removeItem(
"lainolive_logged_in"
);



localStorage.removeItem(
"lainolive_username"
);



location.href =
"/login.html";



};









document
.getElementById(
"backBtn"
)
.onclick = ()=>{


location.href =
"/";



};







loadProfile();



</script>


</body>

</html>
