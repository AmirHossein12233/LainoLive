<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>پروفایل | LainoLive</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="page">

    <header class="topbar">

        <div>
            <h1>LainoLive</h1>
            <div class="subtitle">
                پروفایل کاربری
            </div>
        </div>

        <div class="top-actions">

            <button
                class="secondary-btn"
                onclick="goHome()"
            >
                صفحه اصلی
            </button>

            <button
                class="danger-btn"
                onclick="logout()"
            >
                خروج
            </button>

        </div>

    </header>


    <main class="profile-container">

        <!-- PROFILE -->
        <section class="profile-card">

            <div class="profile-avatar">
                👤
            </div>

            <div class="profile-info">

                <h2 id="username">
                    کاربر
                </h2>

                <div class="profile-status">
                    حساب کاربری فعال
                </div>

            </div>

        </section>


        <!-- STATS -->
        <section class="stats-grid">

            <div class="stat-card">

                <div class="stat-icon">
                    🔴
                </div>

                <div class="stat-value" id="activeLives">
                    0
                </div>

                <div class="stat-label">
                    لایو فعال
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    👁️
                </div>

                <div class="stat-value" id="totalViewers">
                    0
                </div>

                <div class="stat-label">
                    بیننده فعلی
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    📚
                </div>

                <div class="stat-value" id="historyCount">
                    0
                </div>

                <div class="stat-label">
                    لایوهای قبلی
                </div>

            </div>

        </section>


        <!-- ACTIVE LIVE -->
        <section class="profile-section">

            <div class="section-header">

                <h2>
                    لایو فعال من
                </h2>

            </div>

            <div id="activeLiveArea">

                <div class="empty-card">
                    در حال بررسی لایو فعال...
                </div>

            </div>

        </section>


        <!-- HISTORY -->
        <section class="profile-section">

            <div class="section-header">

                <h2>
                    لایوهای قبلی
                </h2>

            </div>

            <div id="historyArea">

                <div class="empty-card">
                    در حال دریافت تاریخچه...
                </div>

            </div>

        </section>

    </main>

</div>


<script>

const API_BASE = "";

let currentUsername = "";


// ======================================================
// AUTH
// ======================================================

function checkLogin() {

    const loggedIn =
        localStorage.getItem(
            "lainolive_logged_in"
        );

    const username =
        localStorage.getItem(
            "lainolive_username"
        );

    if (
        loggedIn !== "true"
        || !username
    ) {

        window.location.href =
            "/login.html";

        return false;
    }

    currentUsername = username;

    return true;
}


// ======================================================
// HOME
// ======================================================

function goHome() {

    window.location.href =
        "/index.html";
}


// ======================================================
// LOGOUT
// ======================================================

function logout() {

    localStorage.removeItem(
        "lainolive_logged_in"
    );

    localStorage.removeItem(
        "lainolive_username"
    );

    sessionStorage.removeItem(
        "lainolive_current_stream"
    );

    sessionStorage.removeItem(
        "lainolive_view_stream"
    );

    window.location.href =
        "/login.html";
}


// ======================================================
// FORMAT NUMBER
// ======================================================

function formatNumber(value) {

    const number =
        Number(value || 0);

    return number.toLocaleString(
        "fa-IR"
    );
}


// ======================================================
// FORMAT DATE
// ======================================================

function formatDate(timestamp) {

    if (!timestamp) {
        return "نامشخص";
    }

    const date =
        new Date(
            Number(timestamp) * 1000
        );

    return date.toLocaleString(
        "fa-IR",
        {
            dateStyle: "medium",
            timeStyle: "short"
        }
    );
}


// ======================================================
// FORMAT DURATION
// ======================================================

function formatDuration(seconds) {

    seconds =
        Math.max(
            0,
            Number(seconds || 0)
        );

    const hours =
        Math.floor(
            seconds / 3600
        );

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        seconds % 60;

    if (hours > 0) {

        return (
            hours.toLocaleString("fa-IR")
            + " ساعت "
            + minutes.toLocaleString("fa-IR")
            + " دقیقه"
        );
    }

    if (minutes > 0) {

        return (
            minutes.toLocaleString("fa-IR")
            + " دقیقه "
            + secs.toLocaleString("fa-IR")
            + " ثانیه"
        );
    }

    return (
        secs.toLocaleString("fa-IR")
        + " ثانیه"
    );
}


// ======================================================
// LOAD ACTIVE STREAM
// ======================================================

async function loadActiveLive() {

    const area =
        document.getElementById(
            "activeLiveArea"
        );

    try {

        const response =
            await fetch(
                API_BASE + "/api/streams",
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "streams request failed"
            );
        }

        const data =
            await response.json();

        const streams =
            Array.isArray(
                data.streams
            )
                ? data.streams
                : [];

        const mine =
            streams.filter(
                stream =>
                    stream.username ===
                    currentUsername
            );

        document.getElementById(
            "activeLives"
        ).textContent =
            formatNumber(
                mine.length
            );

        let viewers = 0;

        mine.forEach(
            stream => {

                viewers +=
                    Number(
                        stream.viewer_count || 0
                    );

            }
        );

        document.getElementById(
            "totalViewers"
        ).textContent =
            formatNumber(
                viewers
            );


        if (mine.length === 0) {

            area.innerHTML = `
                <div class="empty-card">
                    در حال حاضر لایو فعالی ندارید.
                </div>
            `;

            return;
        }


        const stream =
            mine[0];

        sessionStorage.setItem(
            "lainolive_current_stream",
            JSON.stringify(
                stream
            )
        );


        area.innerHTML = `

            <div class="live-card">

                <div class="live-card-top">

                    <div class="live-badge">
                        🔴 در حال پخش
                    </div>

                    <div class="viewer-badge">
                        👁️
                        ${formatNumber(
                            stream.viewer_count
                        )}
                    </div>

                </div>


                <h3>
                    ${escapeHtml(
                        stream.title
                    )}
                </h3>


                <div class="live-card-info">

                    <div>
                        👤
                        ${escapeHtml(
                            stream.username
                        )}
                    </div>

                    <div>
                        🕒
                        شروع:
                        ${formatDate(
                            stream.created_at
                        )}
                    </div>

                </div>


                <button
                    class="primary-btn"
                    onclick="continueLive(
                        '${escapeAttribute(
                            stream.id
                        )}'
                    )"
                >
                    ادامه لایو
                </button>

            </div>
        `;

    } catch (error) {

        console.error(
            error
        );

        area.innerHTML = `
            <div class="empty-card error-card">
                دریافت لایو فعال ناموفق بود.
            </div>
        `;
    }
}


// ======================================================
// LOAD HISTORY
// ======================================================

async function loadHistory() {

    const area =
        document.getElementById(
            "historyArea"
        );

    try {

        const url =
            API_BASE
            + "/api/streams/history?username="
            + encodeURIComponent(
                currentUsername
            )
            + "&limit=100";

        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "history request failed"
            );
        }

        const data =
            await response.json();

        const history =
            Array.isArray(
                data.history
            )
                ? data.history
                : [];

        document.getElementById(
            "historyCount"
        ).textContent =
            formatNumber(
                history.length
            );


        if (history.length === 0) {

            area.innerHTML = `
                <div class="empty-card">

                    <div class="empty-icon">
                        📺
                    </div>

                    هنوز لایوی به پایان نرسیده است.

                </div>
            `;

            return;
        }


        area.innerHTML =
            history.map(
                stream => {

                    return `

                        <div class="history-card">

                            <div class="history-card-header">

                                <div>

                                    <h3>
                                        ${escapeHtml(
                                            stream.title
                                        )}
                                    </h3>

                                    <div class="history-date">
                                        پایان:
                                        ${formatDate(
                                            stream.ended_at
                                        )}
                                    </div>

                                </div>

                                <div class="history-icon">
                                    📺
                                </div>

                            </div>


                            <div class="history-grid">

                                <div class="history-item">

                                    <span>
                                        مدت لایو
                                    </span>

                                    <strong>
                                        ${formatDuration(
                                            stream.duration_seconds
                                        )}
                                    </strong>

                                </div>


                                <div class="history-item">

                                    <span>
                                        بیشترین بیننده
                                    </span>

                                    <strong>
                                        👁️
                                        ${formatNumber(
                                            stream.viewer_peak
                                        )}
                                    </strong>

                                </div>


                                <div class="history-item">

                                    <span>
                                        شروع
                                    </span>

                                    <strong>
                                        ${formatDate(
                                            stream.started_at
                                        )}
                                    </strong>

                                </div>


                                <div class="history-item">

                                    <span>
                                        پایان
                                    </span>

                                    <strong>
                                        ${formatDate(
                                            stream.ended_at
                                        )}
                                    </strong>

                                </div>

                            </div>

                        </div>

                    `;
                }
            ).join("");

    } catch (error) {

        console.error(
            error
        );

        area.innerHTML = `
            <div class="empty-card error-card">
                دریافت تاریخچه ناموفق بود.
            </div>
        `;
    }
}


// ======================================================
// CONTINUE LIVE
// ======================================================

function continueLive(streamId) {

    sessionStorage.setItem(
        "lainolive_current_stream",
        JSON.stringify({
            id: String(streamId),
            username:
                currentUsername
        })
    );

    window.location.href =
        "/live.html";
}


// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


// ======================================================
// ESCAPE ATTRIBUTE
// ======================================================

function escapeAttribute(value) {

    return String(
        value ?? ""
    )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );
}


// ======================================================
// START
// ======================================================

async function initProfile() {

    if (!checkLogin()) {
        return;
    }

    document.getElementById(
        "username"
    ).textContent =
        currentUsername;

    await Promise.all([
        loadActiveLive(),
        loadHistory()
    ]);
}


initProfile();

</script>

</body>
</html>
