<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <title>پروفایل | لاینو</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <style>
        .profile-page {
            width: min(700px, calc(100% - 20px));
            margin: 0 auto;
            padding-top: 25px;
        }

        .profile-card {
            background: #172033;
            border: 1px solid #273449;
            border-radius: 22px;
            padding: 24px;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .avatar {
            width: 105px;
            height: 105px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: #1e293b;
            border: 3px solid #22c55e;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 48px;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-header h1 {
            margin: 0 0 7px;
            font-size: 24px;
        }

        .profile-header p {
            margin: 0;
            color: #94a3b8;
            font-size: 13px;
        }

        .profile-form {
            margin-top: 20px;
        }

        .profile-form label {
            display: block;
            margin: 15px 0 8px;
            color: #cbd5e1;
            font-size: 13px;
        }

        .profile-form input {
            width: 100%;
            padding: 14px;
            border: 1px solid #334155;
            border-radius: 13px;
            outline: none;
            background: #1e293b;
            color: #ffffff;
            font-size: 15px;
        }

        .profile-form input:focus {
            border-color: #22c55e;
        }

        .upload-button {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            border: 1px solid #334155;
            border-radius: 13px;
            background: #1e293b;
            color: #ffffff;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
        }

        .upload-button:hover {
            background: #273449;
        }

        .save-button {
            width: 100%;
            margin-top: 20px;
        }

        .logout-button {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            border: 1px solid #7f1d1d;
            border-radius: 13px;
            background: #450a0a;
            color: #fecaca;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .logout-button:hover {
            background: #7f1d1d;
        }

        .back-button {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            border: 1px solid #334155;
            border-radius: 13px;
            background: #1e293b;
            color: #ffffff;
            cursor: pointer;
            font-size: 14px;
        }

        .back-button:hover {
            background: #273449;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.7;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #132b1d;
            border: 1px solid #166534;
            color: #bbf7d0;
        }

        .message.error {
            background: #3f0a0a;
            border: 1px solid #7f1d1d;
            color: #fecaca;
        }

        .username-box {
            padding: 12px;
            margin-top: 18px;
            border-radius: 12px;
            background: #0f172a;
            color: #94a3b8;
            text-align: center;
            font-size: 13px;
        }

        .username-box strong {
            color: #86efac;
        }

        .hidden-input {
            display: none;
        }
    </style>
</head>

<body>

<script>
    const loggedIn =
        localStorage.getItem(
            "lainolive_logged_in"
        );

    const username =
        localStorage.getItem(
            "lainolive_username"
        );

    if (
        loggedIn !== "true" ||
        !username
    ) {
        window.location.replace(
            "/login.html"
        );
    }
</script>


<header class="topbar">

    <div class="topbar-left">

        <div class="logo">
            لاینو
        </div>

    </div>

    <div class="topbar-right">

        <button
            id="homeButton"
            class="icon-button"
            type="button"
        >
            🏠
        </button>

    </div>

</header>


<main class="profile-page">

    <section class="profile-card">

        <div class="profile-header">

            <div
                id="avatar"
                class="avatar"
            >
                👤
            </div>

            <h1 id="displayName">
                کاربر
            </h1>

            <p>
                پروفایل LainoLive
            </p>

        </div>


        <div class="username-box">
            نام کاربری:
            <strong id="usernameText">
                کاربر
            </strong>
        </div>


        <div class="profile-form">

            <label for="nameInput">
                نام نمایشی
            </label>

            <input
                id="nameInput"
                type="text"
                maxlength="40"
                placeholder="نام نمایشی"
            >


            <label>
                عکس پروفایل
            </label>

            <label
                for="avatarInput"
                class="upload-button"
            >
                انتخاب عکس
            </label>

            <input
                id="avatarInput"
                class="hidden-input"
                type="file"
                accept="image/*"
            >


            <button
                id="saveButton"
                class="primary-button save-button"
                type="button"
            >
                ذخیره تغییرات
            </button>


            <button
                id="backButton"
                class="back-button"
                type="button"
            >
                برگشت به صفحه اصلی
            </button>


            <button
                id="logoutButton"
                class="logout-button"
                type="button"
            >
                خروج از حساب
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>

    </section>

</main>


<script>

    const currentUsername =
        localStorage.getItem(
            "lainolive_username"
        ) || "کاربر";


    const displayNameElement =
        document.getElementById(
            "displayName"
        );


    const usernameText =
        document.getElementById(
            "usernameText"
        );


    const nameInput =
        document.getElementById(
            "nameInput"
        );


    const avatar =
        document.getElementById(
            "avatar"
        );


    const avatarInput =
        document.getElementById(
            "avatarInput"
        );


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    const backButton =
        document.getElementById(
            "backButton"
        );


    const logoutButton =
        document.getElementById(
            "logoutButton"
        );


    const homeButton =
        document.getElementById(
            "homeButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    /*
     * =====================================================
     * USER DATA
     * =====================================================
     */

    const storageKey =
        "lainolive_profile_" +
        currentUsername;


    let profileData =
        JSON.parse(
            localStorage.getItem(
                storageKey
            ) || "null"
        );


    if (!profileData) {

        profileData = {
            displayName:
                currentUsername,

            avatar:
                ""
        };

    }


    /*
     * =====================================================
     * RENDER
     * =====================================================
     */

    function renderProfile() {

        const name =
            profileData.displayName ||
            currentUsername;


        displayNameElement.textContent =
            name;


        usernameText.textContent =
            currentUsername;


        nameInput.value =
            name;


        if (
            profileData.avatar
        ) {

            avatar.innerHTML =
                `
                <img
                    src="${profileData.avatar}"
                    alt="پروفایل"
                >
                `;

        } else {

            avatar.textContent =
                "👤";
        }
    }


    /*
     * =====================================================
     * MESSAGE
     * =====================================================
     */

    function showMessage(
        text,
        type = "success"
    ) {

        message.className =
            "message show " +
            type;

        message.textContent =
            text;

        setTimeout(
            () => {
                message.className =
                    "message";
            },
            2500
        );
    }


    /*
     * =====================================================
     * AVATAR
     * =====================================================
     */

    avatarInput.addEventListener(
        "change",
        function() {

            const file =
                avatarInput.files[0];

            if (!file) {
                return;
            }


            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                showMessage(
                    "فقط فایل تصویری انتخاب کن.",
                    "error"
                );

                avatarInput.value =
                    "";

                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    profileData.avatar =
                        event.target.result;

                    renderProfile();

                    showMessage(
                        "عکس آماده ذخیره است."
                    );
                };


            reader.readAsDataURL(
                file
            );
        }
    );


    /*
     * =====================================================
     * SAVE
     * =====================================================
     */

    saveButton.addEventListener(
        "click",
        function() {

            const name =
                nameInput.value.trim();


            if (!name) {

                showMessage(
                    "نام نمایشی را وارد کن.",
                    "error"
                );

                return;
            }


            profileData.displayName =
                name;


            localStorage.setItem(
                storageKey,
                JSON.stringify(
                    profileData
                )
            );


            localStorage.setItem(
                "lainolive_display_name",
                name
            );


            showMessage(
                "پروفایل ذخیره شد."
            );


            renderProfile();
        }
    );


    /*
     * =====================================================
     * LOGOUT
     * =====================================================
     */

    logoutButton.addEventListener(
        "click",
        function() {

            localStorage.removeItem(
                "lainolive_logged_in"
            );

            localStorage.removeItem(
                "lainolive_username"
            );

            window.location.replace(
                "/login.html"
            );
        }
    );


    /*
     * =====================================================
     * HOME
     * =====================================================
     */

    homeButton.addEventListener(
        "click",
        function() {

            window.location.href =
                "/index.html";

        }
    );


    backButton.addEventListener(
        "click",
        function() {

            window.location.href =
                "/index.html";

        }
    );


    /*
     * =====================================================
     * START
     * =====================================================
     */

    renderProfile();

</script>

</body>

</html>
