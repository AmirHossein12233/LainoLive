<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#020617"
    >

    <title>ورود | لاینو</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #111827,
                #1e293b
            );
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 28px 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .remember-box {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 16px;
            color: #cbd5e1;
            font-size: 12px;
        }

        .remember-box input {
            width: auto;
            margin: 0;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: rgba(255,255,255,0.06);
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 22px;
        }

        .tab {
            border: 0;
            padding: 11px;
            border-radius: 10px;
            background: transparent;
            color: #cbd5e1;
            font-weight: bold;
            cursor: pointer;
        }

        .tab.active {
            background: #22c55e;
            color: white;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            border: none;
            outline: none;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 16px;
            background: #f8fafc;
            color: #111827;
        }

        .ltr {
            direction: ltr;
            text-align: left;
        }

        .password-help {
            color: #94a3b8;
            font-size: 12px;
            margin-top: -7px;
            margin-bottom: 14px;
        }

        .main-button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #22c55e;
            color: white;
        }

        .main-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 13px;
            border-radius: 14px;
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 13px;
        }

        .message.show {
            display: block;
        }

        .error {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fecaca;
        }

        .success {
            background: rgba(34,197,94,0.15);
            border: 1px solid rgba(34,197,94,0.3);
            color: #bbf7d0;
        }

        .server-status {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 18px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            لاینو
        </div>

        <div class="subtitle">
            LainoLive
        </div>

        <div class="tabs">

            <button
                id="loginTab"
                class="tab active"
                type="button"
            >
                ورود
            </button>

            <button
                id="registerTab"
                class="tab"
                type="button"
            >
                ثبت‌نام
            </button>

        </div>


        <!-- LOGIN -->

        <div id="loginForm">

            <label for="loginUsername">
                نام کاربری
            </label>

            <input
                id="loginUsername"
                class="ltr"
                type="text"
                autocomplete="username"
                placeholder="نام کاربری"
            >

            <label for="loginPassword">
                رمز عبور
            </label>

            <input
                id="loginPassword"
                class="ltr"
                type="password"
                autocomplete="current-password"
                placeholder="رمز عبور"
            >

            <label class="remember-box">
                <input
                    id="rememberMe"
                    type="checkbox"
                    checked
                >
                ماندن در حساب روی این دستگاه
            </label>

            <button
                id="loginButton"
                class="main-button"
                type="button"
            >
                ورود
            </button>

        </div>


        <!-- REGISTER -->

        <div
            id="registerForm"
            class="hidden"
        >

            <label for="registerUsername">
                نام کاربری
            </label>

            <input
                id="registerUsername"
                class="ltr"
                type="text"
                autocomplete="username"
                placeholder="مثلاً amir123"
            >

            <label for="registerPassword">
                رمز عبور
            </label>

            <input
                id="registerPassword"
                class="ltr"
                type="password"
                autocomplete="new-password"
                placeholder="حداقل 6 کاراکتر"
            >

            <div class="password-help">
                رمز عبور باید حداقل 6 کاراکتر باشد.
            </div>

            <label for="registerConfirm">
                تکرار رمز عبور
            </label>

            <input
                id="registerConfirm"
                class="ltr"
                type="password"
                autocomplete="new-password"
                placeholder="تکرار رمز عبور"
            >

            <button
                id="registerButton"
                class="main-button"
                type="button"
            >
                ساخت حساب
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>

        <div
            id="serverStatus"
            class="server-status"
        >
            در حال بررسی سرور...
        </div>

    </div>

</div>


<script>

    /* =====================================================
       ELEMENTS
    ===================================================== */

    const loginTab =
        document.getElementById(
            "loginTab"
        );

    const registerTab =
        document.getElementById(
            "registerTab"
        );

    const loginForm =
        document.getElementById(
            "loginForm"
        );

    const registerForm =
        document.getElementById(
            "registerForm"
        );

    const loginUsername =
        document.getElementById(
            "loginUsername"
        );

    const loginPassword =
        document.getElementById(
            "loginPassword"
        );

    const rememberMe =
        document.getElementById(
            "rememberMe"
        );

    const registerUsername =
        document.getElementById(
            "registerUsername"
        );

    const registerPassword =
        document.getElementById(
            "registerPassword"
        );

    const registerConfirm =
        document.getElementById(
            "registerConfirm"
        );

    const loginButton =
        document.getElementById(
            "loginButton"
        );

    const registerButton =
        document.getElementById(
            "registerButton"
        );

    const messageBox =
        document.getElementById(
            "message"
        );

    const serverStatus =
        document.getElementById(
            "serverStatus"
        );


    /* =====================================================
       STORAGE
    ===================================================== */

    function saveLogin(
        username
    ) {

        localStorage.setItem(
            "lainolive_logged_in",
            "true"
        );

        localStorage.setItem(
            "lainolive_username",
            username
        );
    }


    function clearLogin() {

        localStorage.removeItem(
            "lainolive_logged_in"
        );

        localStorage.removeItem(
            "lainolive_username"
        );
    }


    function getSavedUsername() {

        return localStorage.getItem(
            "lainolive_username"
        );
    }


    function isLoggedIn() {

        return (
            localStorage.getItem(
                "lainolive_logged_in"
            ) === "true"
            &&
            !!getSavedUsername()
        );
    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    function showMessage(
        text,
        type = "error"
    ) {

        messageBox.className =
            "message show " +
            type;

        messageBox.textContent =
            text;
    }


    function clearMessage() {

        messageBox.className =
            "message";

        messageBox.textContent =
            "";
    }


    /* =====================================================
       TABS
    ===================================================== */

    function showLogin() {

        loginTab.classList.add(
            "active"
        );

        registerTab.classList.remove(
            "active"
        );

        loginForm.classList.remove(
            "hidden"
        );

        registerForm.classList.add(
            "hidden"
        );

        clearMessage();
    }


    function showRegister() {

        registerTab.classList.add(
            "active"
        );

        loginTab.classList.remove(
            "active"
        );

        registerForm.classList.remove(
            "hidden"
        );

        loginForm.classList.add(
            "hidden"
        );

        clearMessage();
    }


    loginTab.addEventListener(
        "click",
        showLogin
    );


    registerTab.addEventListener(
        "click",
        showRegister
    );


    /* =====================================================
       SERVER
    ===================================================== */

    async function checkServer() {

        try {

            const response =
                await fetch(
                    "/health",
                    {
                        cache:
                            "no-store"
                    }
                );


            const data =
                await response.json();


            if (
                response.ok &&
                data.status === "ok"
            ) {

                serverStatus.textContent =
                    "سرور آنلاین است";

            } else {

                serverStatus.textContent =
                    "خطا در سرور";
            }

        } catch (error) {

            serverStatus.textContent =
                "اتصال به سرور برقرار نشد";
        }
    }


    /* =====================================================
       LOGIN
    ===================================================== */

    async function login() {

        clearMessage();


        const username =
            loginUsername.value.trim();

        const password =
            loginPassword.value;


        if (
            !username
        ) {

            showMessage(
                "نام کاربری را وارد کنید."
            );

            return;
        }


        if (
            !password
        ) {

            showMessage(
                "رمز عبور را وارد کنید."
            );

            return;
        }


        loginButton.disabled =
            true;

        loginButton.textContent =
            "در حال ورود...";


        try {

            const response =
                await fetch(
                    "/api/login",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                username:
                                    username,

                                password:
                                    password

                            })
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                showMessage(
                    data.message ||
                    "نام کاربری یا رمز عبور اشتباه است."
                );

                return;
            }


            const savedUsername =
                data.username ||
                username;


            /*
             * حساب روی دستگاه باقی می‌ماند.
             * خروج از صفحه یا خروج از لایو
             * این اطلاعات را پاک نمی‌کند.
             */

            saveLogin(
                savedUsername
            );


            showMessage(
                "ورود با موفقیت انجام شد.",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        "/index.html";

                },
                300
            );

        } catch (error) {

            console.error(
                "Login:",
                error
            );


            showMessage(
                "خطا در ارتباط با سرور."
            );

        } finally {

            loginButton.disabled =
                false;

            loginButton.textContent =
                "ورود";
        }
    }


    /* =====================================================
       REGISTER
    ===================================================== */

    async function register() {

        clearMessage();


        const username =
            registerUsername.value.trim();

        const password =
            registerPassword.value;

        const confirmPassword =
            registerConfirm.value;


        if (
            !username
        ) {

            showMessage(
                "نام کاربری را وارد کنید."
            );

            return;
        }


        if (
            !password
        ) {

            showMessage(
                "رمز عبور را وارد کنید."
            );

            return;
        }


        if (
            password.length <
            6
        ) {

            showMessage(
                "رمز عبور باید حداقل 6 کاراکتر باشد."
            );

            return;
        }


        if (
            password !==
            confirmPassword
        ) {

            showMessage(
                "تکرار رمز عبور یکسان نیست."
            );

            return;
        }


        registerButton.disabled =
            true;

        registerButton.textContent =
            "در حال ساخت حساب...";


        try {

            const response =
                await fetch(
                    "/api/register",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                username:
                                    username,

                                password:
                                    password,

                                confirm_password:
                                    confirmPassword

                            })
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                showMessage(
                    data.message ||
                    "ثبت‌نام ناموفق بود."
                );

                return;
            }


            /*
             * بعد از ثبت‌نام حساب هنوز وارد نشده،
             * بنابراین اول صفحه ورود را نشان می‌دهیم.
             */

            showMessage(
                "ثبت‌نام با موفقیت انجام شد. اکنون وارد شوید.",
                "success"
            );


            loginUsername.value =
                username;

            loginPassword.value =
                "";


            registerUsername.value =
                "";

            registerPassword.value =
                "";

            registerConfirm.value =
                "";


            setTimeout(
                () => {

                    showLogin();

                    loginUsername.focus();

                },
                600
            );

        } catch (error) {

            console.error(
                "Register:",
                error
            );


            showMessage(
                "خطا در ارتباط با سرور."
            );

        } finally {

            registerButton.disabled =
                false;

            registerButton.textContent =
                "ساخت حساب";
        }
    }


    /* =====================================================
       EVENTS
    ===================================================== */

    loginButton.addEventListener(
        "click",
        login
    );


    registerButton.addEventListener(
        "click",
        register
    );


    loginPassword.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                login();
            }
        }
    );


    registerConfirm.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                register();
            }
        }
    );


    /* =====================================================
       AUTO LOGIN
    ===================================================== */

    const savedUsername =
        getSavedUsername();


    if (
        isLoggedIn()
    ) {

        loginUsername.value =
            savedUsername;


        serverStatus.textContent =
            "حساب شما روی این دستگاه ذخیره است";


        /*
         * اگر قبلاً وارد شده‌ای،
         * مستقیم صفحه اصلی باز می‌شود.
         */

        setTimeout(
            () => {

                window.location.href =
                    "/index.html";

            },
            150
        );

    } else {

        checkServer();
    }

</script>

</body>
</html>
