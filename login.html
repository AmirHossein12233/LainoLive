<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ورود | لاینو</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                Tahoma,
                Arial,
                sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1e293b
                );
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid
                rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 28px 22px;
            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            font-size: 15px;
            margin-bottom: 28px;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 20px;
            color: #cbd5e1;
            font-size: 13px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #f59e0b;
        }

        .dot.online {
            background: #22c55e;
        }

        .dot.offline {
            background: #ef4444;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-size: 14px;
        }

        input {
            width: 100%;
            border: none;
            outline: none;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 14px;
            font-size: 17px;
            background: #f8fafc;
            color: #111827;
            direction: ltr;
            text-align: left;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #22c55e;
            color: #ffffff;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .secondary {
            background: #334155;
        }

        .otp-section {
            display: none;
            margin-top: 18px;
        }

        .otp-section.show {
            display: block;
        }

        .timer {
            text-align: center;
            color: #cbd5e1;
            font-size: 13px;
            margin: 12px 0;
        }

        .message {
            white-space: pre-wrap;
            word-break: break-word;
            border-radius: 14px;
            padding: 13px;
            margin-top: 16px;
            display: none;
            line-height: 1.8;
            font-size: 13px;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.14);
            border: 1px solid
                rgba(239, 68, 68, 0.3);
            color: #fecaca;
        }

        .message.success {
            background: rgba(34, 197, 94, 0.14);
            border: 1px solid
                rgba(34, 197, 94, 0.3);
            color: #bbf7d0;
        }

        .details {
            direction: ltr;
            text-align: left;
            font-family: monospace;
            font-size: 12px;
            margin-top: 10px;
            overflow-wrap: anywhere;
        }

        .small {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 20px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            لاینو
        </div>

        <div class="subtitle">
            ورود به LainoLive
        </div>

        <div class="status">
            <span
                id="statusDot"
                class="dot"
            ></span>

            <span id="serverStatus">
                در حال بررسی سرور...
            </span>
        </div>

        <div id="phoneSection">

            <label for="phone">
                شماره موبایل
            </label>

            <input
                id="phone"
                type="tel"
                inputmode="numeric"
                autocomplete="tel"
                placeholder="09123456789"
            >

            <button
                id="sendCodeButton"
                type="button"
            >
                ارسال کد ورود
            </button>

        </div>

        <div
            id="otpSection"
            class="otp-section"
        >

            <label for="code">
                کد تأیید
            </label>

            <input
                id="code"
                type="tel"
                inputmode="numeric"
                maxlength="6"
                autocomplete="one-time-code"
                placeholder="123456"
            >

            <button
                id="verifyButton"
                type="button"
            >
                ورود
            </button>

            <div
                id="timer"
                class="timer"
            ></div>

            <button
                id="backButton"
                class="secondary"
                type="button"
            >
                تغییر شماره
            </button>

        </div>

        <div
            id="message"
            class="message"
        ></div>

        <div class="small">
            ورود با پیامک انجام می‌شود.
        </div>

    </div>

</div>


<script>
    const API_BASE = "";

    const phoneInput =
        document.getElementById("phone");

    const codeInput =
        document.getElementById("code");

    const sendCodeButton =
        document.getElementById("sendCodeButton");

    const verifyButton =
        document.getElementById("verifyButton");

    const backButton =
        document.getElementById("backButton");

    const phoneSection =
        document.getElementById("phoneSection");

    const otpSection =
        document.getElementById("otpSection");

    const messageBox =
        document.getElementById("message");

    const timerElement =
        document.getElementById("timer");

    const statusDot =
        document.getElementById("statusDot");

    const serverStatus =
        document.getElementById("serverStatus");


    let countdownInterval = null;


    function normalizeDigits(value) {
        const persian =
            "۰۱۲۳۴۵۶۷۸۹";

        const arabic =
            "٠١٢٣٤٥٦٧٨٩";

        const english =
            "0123456789";

        value = String(value || "");

        for (let i = 0; i < 10; i++) {
            value = value.replaceAll(
                persian[i],
                english[i]
            );

            value = value.replaceAll(
                arabic[i],
                english[i]
            );
        }

        return value;
    }


    function normalizePhone(value) {

        value = normalizeDigits(value)
            .replace(/\s/g, "")
            .replace(/-/g, "")
            .replace(/\(/g, "")
            .replace(/\)/g, "");

        if (value.startsWith("+98")) {
            value = "0" + value.slice(3);
        }

        if (
            value.startsWith("98")
            && value.length === 12
        ) {
            value = "0" + value.slice(2);
        }

        return value;
    }


    function showMessage(
        text,
        type = "error",
        details = null
    ) {

        messageBox.className =
            "message show " + type;

        messageBox.textContent =
            text;

        if (details) {

            const detailsElement =
                document.createElement("div");

            detailsElement.className =
                "details";

            detailsElement.textContent =
                details;

            messageBox.appendChild(
                detailsElement
            );
        }
    }


    function clearMessage() {

        messageBox.className =
            "message";

        messageBox.textContent = "";
    }


    async function parseResponse(response) {

        const raw =
            await response.text();

        let data;

        try {

            data = JSON.parse(raw);

        } catch {

            data = {
                success: false,
                message:
                    "پاسخ نامعتبر از سرور دریافت شد.",
                raw: raw
            };

        }

        return data;
    }


    function formatAmootError(data) {

        if (!data) {
            return "";
        }

        if (data.amoot_error) {

            return JSON.stringify(
                data.amoot_error,
                null,
                2
            );
        }

        if (data.details) {

            return JSON.stringify(
                data.details,
                null,
                2
            );
        }

        return "";
    }


    async function checkServer() {

        try {

            const response =
                await fetch(
                    API_BASE + "/health",
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );

            const data =
                await parseResponse(response);

            if (
                response.ok
                && data.status === "ok"
            ) {

                statusDot.className =
                    "dot online";

                serverStatus.textContent =
                    data.sms_configured
                        ? "سرور و پیامک فعال است"
                        : "سرور فعال است ولی پیامک تنظیم نشده";

                return true;
            }

            throw new Error(
                "پاسخ سرور معتبر نیست."
            );

        } catch (error) {

            statusDot.className =
                "dot offline";

            serverStatus.textContent =
                "اتصال به سرور برقرار نشد.";

            return false;
        }
    }


    function startTimer(seconds) {

        clearInterval(
            countdownInterval
        );

        let remaining =
            Number(seconds) || 120;

        function update() {

            if (remaining <= 0) {

                timerElement.textContent =
                    "کد منقضی شده است.";

                clearInterval(
                    countdownInterval
                );

                return;
            }

            timerElement.textContent =
                "اعتبار کد: "
                + remaining
                + " ثانیه";

            remaining--;
        }

        update();

        countdownInterval =
            setInterval(
                update,
                1000
            );
    }


    sendCodeButton.addEventListener(
        "click",
        async function () {

            clearMessage();

            const phone =
                normalizePhone(
                    phoneInput.value
                );

            if (
                phone.length !== 11
                || !phone.startsWith("09")
            ) {

                showMessage(
                    "شماره موبایل را به صورت 09123456789 وارد کنید."
                );

                return;
            }

            sendCodeButton.disabled = true;

            sendCodeButton.textContent =
                "در حال ارسال...";

            try {

                const response =
                    await fetch(
                        API_BASE
                        + "/api/request-code",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                phone: phone
                            })
                        }
                    );

                const data =
                    await parseResponse(
                        response
                    );

                if (
                    !response.ok
                    || !data.success
                ) {

                    const amootDetails =
                        formatAmootError(
                            data
                        );

                    showMessage(
                        data.message
                        || "ارسال کد ناموفق بود.",
                        "error",
                        amootDetails
                            ? "پاسخ آمو‌ت:\n"
                              + amootDetails
                            : null
                    );

                    return;
                }

                phoneSection.classList.add(
                    "hidden"
                );

                otpSection.classList.add(
                    "show"
                );

                codeInput.focus();

                showMessage(
                    "کد تأیید ارسال شد.",
                    "success"
                );

                startTimer(
                    data.expires_in || 120
                );

            } catch (error) {

                showMessage(
                    "خطا در ارتباط با سرور.",
                    "error",
                    String(error)
                );

            } finally {

                sendCodeButton.disabled =
                    false;

                sendCodeButton.textContent =
                    "ارسال کد ورود";
            }
        }
    );


    verifyButton.addEventListener(
        "click",
        async function () {

            clearMessage();

            const phone =
                normalizePhone(
                    phoneInput.value
                );

            const code =
                normalizeDigits(
                    codeInput.value
                ).replace(
                    /\D/g,
                    ""
                );

            if (
                phone.length !== 11
                || !phone.startsWith("09")
            ) {

                showMessage(
                    "شماره موبایل نامعتبر است."
                );

                return;
            }

            if (
                code.length !== 6
            ) {

                showMessage(
                    "کد تأیید باید 6 رقمی باشد."
                );

                return;
            }

            verifyButton.disabled =
                true;

            verifyButton.textContent =
                "در حال بررسی...";

            try {

                const response =
                    await fetch(
                        API_BASE
                        + "/api/verify-code",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                phone: phone,
                                code: code
                            })
                        }
                    );

                const data =
                    await parseResponse(
                        response
                    );

                if (
                    !response.ok
                    || !data.success
                ) {

                    showMessage(
                        data.message
                        || "کد صحیح نیست."
                    );

                    return;
                }

                clearInterval(
                    countdownInterval
                );

                localStorage.setItem(
                    "lainolive_logged_in",
                    "true"
                );

                localStorage.setItem(
                    "lainolive_phone",
                    phone
                );

                showMessage(
                    "ورود با موفقیت انجام شد. در حال انتقال...",
                    "success"
                );

                setTimeout(
                    function () {

                        window.location.href =
                            "/index.html";

                    },
                    700
                );

            } catch (error) {

                showMessage(
                    "خطا در ارتباط با سرور.",
                    "error",
                    String(error)
                );

            } finally {

                verifyButton.disabled =
                    false;

                verifyButton.textContent =
                    "ورود";
            }
        }
    );


    backButton.addEventListener(
        "click",
        function () {

            clearInterval(
                countdownInterval
            );

            clearMessage();

            otpSection.classList.remove(
                "show"
            );

            phoneSection.classList.remove(
                "hidden"
            );

            codeInput.value = "";

        }
    );


    codeInput.addEventListener(
        "input",
        function () {

            codeInput.value =
                normalizeDigits(
                    codeInput.value
                ).replace(
                    /\D/g,
                    ""
                ).slice(0, 6);
        }
    );


    phoneInput.addEventListener(
        "input",
        function () {

            phoneInput.value =
                normalizeDigits(
                    phoneInput.value
                ).replace(
                    /\D/g,
                    ""
                ).slice(0, 11);
        }
    );


    checkServer();
</script>

</body>
</html>
