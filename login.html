<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | لاینو</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1e293b);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 28px 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            font-size: 15px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-size: 14px;
        }

        input {
            width: 100%;
            border: none;
            outline: none;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 16px;
            background: #f8fafc;
            color: #111827;
        }

        .username {
            direction: ltr;
            text-align: left;
        }

        .password {
            direction: ltr;
            text-align: left;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #22c55e;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 13px;
            border-radius: 14px;
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 13px;
        }

        .message.show {
            display: block;
        }

        .error {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fecaca;
        }

        .success {
            background: rgba(34,197,94,0.15);
            border: 1px solid rgba(34,197,94,0.3);
            color: #bbf7d0;
        }

        .server-status {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 18px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <div class="logo">لاینو</div>

        <div class="subtitle">
            ورود به LainoLive
        </div>

        <label for="username">
            نام کاربری
        </label>

        <input
            id="username"
            class="username"
            type="text"
            autocomplete="username"
            placeholder="admin"
        >

        <label for="password">
            رمز عبور
        </label>

        <input
            id="password"
            class="password"
            type="password"
            autocomplete="current-password"
            placeholder="رمز عبور"
        >

        <button
            id="loginButton"
            type="button"
        >
            ورود
        </button>

        <div
            id="message"
            class="message"
        ></div>

        <div
            id="serverStatus"
            class="server-status"
        >
            در حال بررسی سرور...
        </div>

    </div>
</div>

<script>
    const usernameInput =
        document.getElementById("username");

    const passwordInput =
        document.getElementById("password");

    const loginButton =
        document.getElementById("loginButton");

    const messageBox =
        document.getElementById("message");

    const serverStatus =
        document.getElementById("serverStatus");


    function showMessage(text, type) {
        messageBox.className =
            "message show " + type;

        messageBox.textContent = text;
    }


    async function checkServer() {
        try {
            const response = await fetch(
                "/health",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

            const data = await response.json();

            if (
                response.ok &&
                data.status === "ok"
            ) {
                serverStatus.textContent =
                    "سرور آنلاین است";
            } else {
                serverStatus.textContent =
                    "خطا در سرور";
            }

        } catch (error) {
            serverStatus.textContent =
                "اتصال به سرور برقرار نشد";
        }
    }


    async function login() {
        messageBox.className = "message";
        messageBox.textContent = "";

        const username =
            usernameInput.value.trim();

        const password =
            passwordInput.value;

        if (!username) {
            showMessage(
                "نام کاربری را وارد کنید.",
                "error"
            );
            return;
        }

        if (!password) {
            showMessage(
                "رمز عبور را وارد کنید.",
                "error"
            );
            return;
        }

        loginButton.disabled = true;
        loginButton.textContent =
            "در حال ورود...";

        try {
            const response = await fetch(
                "/api/login",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );

            const data =
                await response.json();

            if (
                !response.ok ||
                !data.success
            ) {
                showMessage(
                    data.message ||
                    "نام کاربری یا رمز عبور اشتباه است.",
                    "error"
                );
                return;
            }

            localStorage.setItem(
                "lainolive_logged_in",
                "true"
            );

            localStorage.setItem(
                "lainolive_username",
                data.username
            );

            showMessage(
                "ورود با موفقیت انجام شد.",
                "success"
            );

            setTimeout(() => {
                window.location.href =
                    "/index.html";
            }, 500);

        } catch (error) {
            showMessage(
                "خطا در ارتباط با سرور.",
                "error"
            );

        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "ورود";
        }
    }


    loginButton.addEventListener(
        "click",
        login
    );


    passwordInput.addEventListener(
        "keydown",
        function(event) {
            if (event.key === "Enter") {
                login();
            }
        }
    );


    checkServer();
</script>

</body>
</html>
