<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<meta name="theme-color"
content="#ff2757">


<title>
ورود - LainoLive
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

font-family:
Tahoma,Arial;

background:
radial-gradient(
circle at top,
#24163a,
#050508
);

color:white;

}



.box{

width:
calc(100% - 32px);

max-width:420px;

background:
rgba(255,255,255,.07);

border:
1px solid
rgba(255,255,255,.1);

border-radius:25px;

padding:25px;

}



.logo{

text-align:center;

font-size:28px;

font-weight:900;

margin-bottom:8px;

}


.sub{

text-align:center;

color:#aaa;

font-size:12px;

margin-bottom:25px;

}



label{

display:block;

font-size:12px;

color:#bbb;

margin-bottom:7px;

}



input{

width:100%;

height:48px;

border:none;

outline:none;

border-radius:14px;

background:
rgba(255,255,255,.1);

color:white;

padding:0 15px;

margin-bottom:15px;

}



button{

width:100%;

height:50px;

border:none;

border-radius:15px;

font-weight:900;

font-size:14px;

cursor:pointer;

}



.primary{

background:
linear-gradient(
135deg,
#ff2757,
#8b35ff
);

color:white;

}



.secondary{

margin-top:10px;

background:
rgba(255,255,255,.08);

color:white;

}



.message{

text-align:center;

margin-top:15px;

font-size:12px;

color:#ffb7c5;

}



</style>

</head>


<body>


<div class="box">


<div class="logo">
🎥 LainoLive
</div>


<div class="sub">
پخش زنده و تماشای لایو
</div>



<label>
نام کاربری
</label>


<input
id="username"
placeholder="نام کاربری"
maxlength="30"
>




<label>
رمز عبور
</label>


<input
id="password"
type="password"
placeholder="رمز عبور"
maxlength="50"
>




<button
class="primary"
id="loginBtn"
>

ورود

</button>



<button
class="secondary"
id="registerBtn"
>

ساخت حساب جدید

</button>



<div
class="message"
id="message"
>

</div>



</div>





<script>

const username =
document.getElementById(
"username"
);


const password =
document.getElementById(
"password"
);


const message =
document.getElementById(
"message"
);



function show(text){

message.textContent =
text;

}




function saveUser(name){


localStorage.setItem(
"lainolive_logged_in",
"true"
);


localStorage.setItem(
"lainolive_username",
name
);


}





async function login(){


const name =
username.value.trim();



if(!name){

show(
"نام کاربری را وارد کنید"
);

return;

}



saveUser(name);



show(
"ورود موفق بود..."
);



setTimeout(()=>{

location.href="/";

},800);



}



document
.getElementById(
"loginBtn"
)
.onclick =
login;


document
.getElementById(
"registerBtn"
)
.onclick = async () => {


    const name =
        username.value.trim();


    const pass =
        password.value.trim();



    if(!name || !pass){

        show(
            "نام کاربری و رمز را وارد کنید"
        );

        return;

    }



    try{


        const response =
            await fetch(
                "/api/register",
                {

                    method:
                        "POST",


                    headers:
                    {

                        "Content-Type":
                        "application/json"

                    },


                    body:
                    JSON.stringify({

                        username:
                            name,

                        password:
                            pass

                    })

                }
            );




        if(response.ok){


            saveUser(
                name
            );


            show(
                "حساب ساخته شد ✅"
            );


            setTimeout(()=>{

                location.href="/";

            },800);



        }

        else{


            show(
                "ساخت حساب انجام نشد"
            );


        }



    }

    catch(error){


        // حالت آفلاین یا تستی

        saveUser(
            name
        );


        show(
            "حساب ساخته شد ✅"
        );



        setTimeout(()=>{

            location.href="/";

        },800);



    }



};





// اگر قبلاً وارد شده باشد

if(
    localStorage.getItem(
        "lainolive_logged_in"
    )
    ===
    "true"
){

    location.href="/";

}



</script>


</body>

</html>
