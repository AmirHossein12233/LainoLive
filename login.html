<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
ورود - LainoLive
</title>


<style>

body{

margin:0;

background:#050508;

color:white;

font-family:tahoma;

padding:20px;

}


.box{

max-width:400px;

margin:50px auto;

background:#15151f;

padding:25px;

border-radius:20px;

}



h2{

text-align:center;

color:#ff2757;

}



input,button{

width:100%;

height:50px;

margin-top:15px;

border:0;

border-radius:14px;

padding:0 15px;

}



input{

background:#222;

color:white;

}



button{

background:#ff2757;

color:white;

font-weight:bold;

}



.secondary{

background:#333;

}



#status{

text-align:center;

margin-top:15px;

color:#aaa;

}


</style>

</head>


<body>



<div class="box">


<h2>
🔴 LainoLive
</h2>



<input

id="username"

placeholder="نام کاربری">



<input

id="password"

type="password"

placeholder="رمز عبور">





<button onclick="login()">

ورود

</button>




<button class="secondary"
onclick="register()">

ساخت حساب

</button>



<div id="status">

</div>


</div>





<script>


const statusBox =

document.getElementById(
"status"
);







function login(){



const username =

document.getElementById(
"username"
).value.trim();



const password =

document.getElementById(
"password"
).value.trim();





if(!username || !password){


statusBox.textContent =

"اطلاعات را کامل کنید";


return;


}






localStorage.setItem(

"lainolive_username",

username

);



statusBox.textContent =

"ورود موفق ✅";





setTimeout(()=>{


location.href =
"index.html";


},1000);



}









function register(){



const username =

document.getElementById(
"username"
).value.trim();



if(!username){


statusBox.textContent =

"نام کاربری وارد کنید";


return;


}




localStorage.setItem(

"lainolive_username",

username

);





statusBox.textContent =

"حساب ساخته شد ✅";





setTimeout(()=>{


location.href =
"index.html";


},1000);



}



</script>


</body>

</html>
